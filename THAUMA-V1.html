<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Web Terminal</title>
<style>
:root {
  --bg: #000000;
  --fg: #00ff00;
  --font-size: 16px;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  color: var(--fg);
  font-family: Consolas, monospace;
  font-size: var(--font-size);
  padding-top: env(safe-area-inset-top);
  box-sizing: border-box;
}

#screen {
  height: 100vh;
  padding: 24px 10px 10px 10px;
  box-sizing: border-box;
  overflow-y: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.line {
  width: 100%;
}

.system {
  color: var(--fg);
}

.user {
  color: var(--fg);
}

.prompt-line {
  display: flex;
  flex-direction: row;
  align-items: baseline;
}

.prompt-label {
  margin-right: 6px;
  flex-shrink: 0;
}

.prompt-input-wrap {
  flex: 1;
  display: inline-flex;
  align-items: baseline;
  position: relative;
}

/* visible typed text */
.prompt-text {
  color: var(--fg);
  font: inherit;
  white-space: pre;
}

/* blinking block caret */
.caret {
  display: inline-block;
  width: 0.6ch;
  height: 1.1em;
  background: var(--fg);
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
  margin-left: 1px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

.hidden-input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 1px;
  height: 1px;
}
</style>
</head>

/* returns true if this command+args combo is a break action */

  if (cmd === "simulate" && (args[0]||"").toLowerCase() === "glitch") return true;

  if (cmd === "theme"    && (args[0]||"").toLowerCase() === "green")   return true;
  if (cmd === "textsize" && args[0] === "16")                          return true;

/* call after a command is parsed to decide if a wall should spawn */
let _lastCmd = "";   /* for repeated-command detection */
function shouldTriggerWall(cmd, args) {
  if (WALL_EXEMPT.has(cmd)) return false;

  /* A — 10% random */
  if (Math.random() < 0.10) return true;

  /* B — same command twice in a row */
  const fullCmd = cmd + " " + args.join(" ");

const INBOX_KEY = "terminal_inbox_v3";

/* mailState mirrors the spec */
let mailState = {
  unlocked:      [],   /* array of mail IDs that are unlocked */
  read:          [],   /* array of mail IDs that have been read */
  deliveryIndex: 0,    /* how many mails have been delivered so far */
  deliveryTimer: null, /* setTimeout id (not persisted; re-armed on load) */
  readTimestamps: {},  /* id → timestamp when mail was read */
  firstOpen:     false /* whether lore-inbox has been invoked at least once */
};

function loadMailState() {
  try {
    const saved = localStorage.getItem(INBOX_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object") {
        /* merge — keep timer as null; we will re-arm below */
        mailState = Object.assign(mailState, parsed);
        mailState.deliveryTimer = null;
      }
    }
  } catch(e) {}
}

function saveMailState() {
  try {
    /* do not persist the timer id */
    const toSave = Object.assign({}, mailState, { deliveryTimer: null });
    localStorage.setItem(INBOX_KEY, JSON.stringify(toSave));
  } catch(e) {}
}

/* deliver mail N (0-based index) and show notification */
function deliverMail(index) {
  if (index >= LORE_MAILS.length) return;
  const mail = LORE_MAILS[index];
  if (mailState.unlocked.includes(mail.id)) return; /* already delivered */

  mailState.unlocked.push(mail.id);
  mailState.deliveryIndex = index + 1;
  saveMailState();

  addLine("<mail> new message recovered");
}

/* after reading mail at index, arm a 30-second timer to deliver next */
function scheduleNextMail(readIndex) {
  /* clear any existing timer */
  if (mailState.deliveryTimer !== null) {
    clearTimeout(mailState.deliveryTimer);
    mailState.deliveryTimer = null;
  }

  const nextIndex = readIndex + 1;
  if (nextIndex >= LORE_MAILS.length) return; /* no more mails */

  /* only schedule if next mail is not already unlocked */
  const nextId = LORE_MAILS[nextIndex].id;
  if (mailState.unlocked.includes(nextId)) return;

  mailState.deliveryTimer = setTimeout(() => {
    mailState.deliveryTimer = null;
    if (!locked) deliverMail(nextIndex);
  }, 30000);
}

/* re-arm pending deliveries after a page reload */
function rearmDeliveryTimers() {
  /* find highest read index */
  let highestReadIndex = -1;
  for (let i = 0; i < LORE_MAILS.length; i++) {
    if (mailState.read.includes(LORE_MAILS[i].id)) {
      highestReadIndex = i;
    }
  }
  if (highestReadIndex === -1) return;

  const nextIndex = highestReadIndex + 1;
  if (nextIndex >= LORE_MAILS.length) return;

  const nextId = LORE_MAILS[nextIndex].id;
  if (mailState.unlocked.includes(nextId)) return; /* already queued */

  /* check how much time has already elapsed since the last read */
  const ts = mailState.readTimestamps[LORE_MAILS[highestReadIndex].id] || 0;
  const elapsed = Date.now() - ts;
  const remaining = Math.max(0, 30000 - elapsed);

  mailState.deliveryTimer = setTimeout(() => {
    mailState.deliveryTimer = null;
    if (!locked) deliverMail(nextIndex);
  }, remaining);
}

/* render the inbox listing */
function renderInboxList() {
  if (!mailState.firstOpen || mailState.unlocked.length === 0) {
    addLine("<mail> no messages");
    return;
  }
  addLine("<mail> corrupted mail logs — " + mailState.unlocked.length + " recovered");
  addLine("────────────────────────────────────────");
  for (let i = 0; i < LORE_MAILS.length; i++) {
    const mail = LORE_MAILS[i];
    if (!mailState.unlocked.includes(mail.id)) continue;
    const isRead   = mailState.read.includes(mail.id);
    const status   = isRead ? "[read  ]" : "[unread]";
    addLine("  " + mail.id + ".  " + status + "  " + mail.subject);
  }
  addLine("────────────────────────────────────────");
  addLine("usage: lore-inbox {number}");
}

/* render a specific email */
function renderMail(idxArg) {
  const num = parseInt(idxArg, 10);
  if (isNaN(num) || num < 1 || num > LORE_MAILS.length) {
    addLine("<mail> invalid message number");
    return;
  }
  const mail = LORE_MAILS[num - 1];
  if (!mailState.unlocked.includes(mail.id)) {
    addLine("<mail> message not yet recovered");
    return;
  }

  /* display */
  addLine("════════════════════════════════════════");
  for (const line of mail.body) {
    addLine(line);
  }
  addLine("════════════════════════════════════════");

  /* mark as read */
  const wasRead = mailState.read.includes(mail.id);
  if (!wasRead) {
    mailState.read.push(mail.id);
    mailState.readTimestamps[mail.id] = Date.now();
    saveMailState();

    /* schedule next delivery */
    scheduleNextMail(num - 1);

    /* unlock lore_complete if this is the final mail */
    if (mail.id === LORE_MAILS[LORE_MAILS.length - 1].id) {
      unlockAchievement("lore_complete");
    }
  }
}

/* main command handler */
function cmd_lore_inbox(args) {
  /* first invocation: deliver mail #1 immediately */
  if (!mailState.firstOpen) {
    mailState.firstOpen = true;
    saveMailState();
    deliverMail(0);
  }

  if (args.length === 0) {
    renderInboxList();
  } else {
    renderMail(args[0]);
  }
}

/* ================================================================
   MIMIC HELPERS
   ================================================================ */
function mimicUpper(s)   { return s.toUpperCase(); }
function mimicLower(s)   { return s.toLowerCase(); }
function mimicSarcasm(s) { return s.split("").map((c,i)=>i%2===0?c.toLowerCase():c.toUpperCase()).join(""); }
function mimicGlitch(s)  { const g=["#","%","@","*","!","?","¿","¤"]; return s.split("").map(c=>Math.random()<0.2?randomItem(g):c).join(""); }
function mimicStretch(s) { return s.split("").map(c=>c+(Math.random()<0.3?c.repeat(1+Math.floor(Math.random()*3)):"")).join(""); }
function mimicSpaced(s)  { return s.split("").join(" "); }
function mimicReverse(s) { return s.split("").reverse().join(""); }
function mimicAccent(s)  {
  const a={a:"á",e:"é",i:"í",o:"ó",u:"ú",A:"Á",E:"É",I:"Í",O:"Ó",U:"Ú"};
  return s.replace(/[aeiouAEIOU]/g,c=>a[c]||c);
}

/* ================================================================
   UTILITIES
   ================================================================ */
function addLine(text, cls="system") {
  const div = document.createElement("div");
  div.className = "line " + cls;
  div.textContent = text;
  if (currentCaretSpan && currentPromptDiv && currentPromptDiv.parentNode === screen) {
    screen.insertBefore(div, currentPromptDiv);
  } else {
    screen.appendChild(div);
  }
  screen.scrollTop = screen.scrollHeight;
}

function newPrompt() {
  if (locked) return;

  const div = document.createElement("div");
  div.className = "line prompt-line";

  const label = document.createElement("span");
  label.className = "prompt-label";
  if (mode === "shell") {
    label.textContent = ">";
  } else if (mode === "recursive") {
    label.textContent = "(rec)>";
  } else {
    label.textContent = "[" + mode + "]>";
  }
  div.appendChild(label);

  const wrap = document.createElement("span");
  wrap.className = "prompt-input-wrap";

  const textSpan = document.createElement("span");
  textSpan.className = "prompt-text";
  wrap.appendChild(textSpan);

  const caret = document.createElement("span");
  caret.className = "caret";
  wrap.appendChild(caret);

  div.appendChild(wrap);
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;

  currentPromptDiv = div;
  currentTextSpan  = textSpan;
  currentCaretSpan = caret;

  hidden.value = "";
  syncVisible();
  hidden.focus();
}

function syncVisible() {
  if (currentTextSpan) currentTextSpan.textContent = hidden.value;
}

function commitLine() {
  achievements.prompts = (achievements.prompts || 0) + 1;
  if (achievements.prompts >= 100) unlockAchievement("prompts_100");
  saveAchievements();
  sessionCmds++;

  if (!currentCaretSpan) return "";
  /* freeze the prompt line — remove caret */
  currentCaretSpan.remove();
  currentCaretSpan = null;
  currentTextSpan  = null;
  const text = hidden.value;
  hidden.value = "";
  return text;
}

function normalize(s) { return s.trim().toLowerCase(); }
function tokenize(s)  { return s.trim().split(/\s+/); }
function randomItem(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

/* ================================================================
   RUDE MODE
   All output goes through r() so rudeMode appends a barb.
   ================================================================ */
const BARBS = [
  "really?","pathetic.","try harder.","unimpressive.",
  "wow.","tragic.","embarrassing.","sad.","bold choice.",
  "okay sure.","yikes.","was that intentional?","...okay.",
  "fascinating. not.","sure, why not."
];

function r(text) {
  if (!rudeMode) return text;
  return text + " " + randomItem(BARBS);
}

/* wrap addLine so every command output respects rude mode */
function rline(text, cls="system") {
  addLine(r(text), cls);
}

let dreamIdleTimer   = null;
let dreamIntervalId  = null;
let dreamActive      = false;

function resetIdleTimer() {
  /* cancel existing timers */
  if (dreamIdleTimer)  clearTimeout(dreamIdleTimer);
  if (dreamIntervalId) clearInterval(dreamIntervalId);
  dreamIntervalId = null;

  /* if dream mode was active, silently deactivate */
  dreamActive = false;

  /* set new 60s idle trigger */
  dreamIdleTimer = setTimeout(() => {
    dreamActive = true;
    emitDreamLog();
    dreamIntervalId = setInterval(() => {
      if (dreamActive) emitDreamLog();
    }, 15000);
  }, 60000);
}

function emitDreamLog() {
  if (locked) return;
  sessionDreams++;
  const lines = randomItem(DREAM_LOGS);
  lines.forEach(l => addLine(l));
}

/* --- NOTES --- */
function notesInit() {
  if (!appState.notes) appState.notes = [];
  addLine(r("<notes> add/list/clear/exit"));
}
function notesHandle(input) {
  const parts = tokenize(input);
  const cmd  = (parts[0]||"").toLowerCase();
  const rest = parts.slice(1).join(" ");
  if (cmd==="add") {
    if (!rest) return addLine(r("<notes> missing text"));
    appState.notes.push(rest);
    addLine(r("<notes> saved"));
    if (appState.notes.length>=20) unlockAchievement("notes_full");
    return;
  }
  if (cmd==="list") {
    if (!appState.notes.length) return addLine(r("<notes> empty"));
    appState.notes.forEach((n,i)=>addLine((i+1)+": "+n));
    return;
  }
  if (cmd==="clear") { appState.notes=[]; return addLine(r("<notes> cleared")); }
  if (cmd==="exit")  { mode="shell"; return addLine(r("<notes> closed")); }
  addLine(r("<notes> unknown"));
}

/* --- HANGMAN --- */
function hangmanInit() {
  const words=["terminal","javascript","matrix","weather","display","keyboard"];
  appState.hangman={ word:randomItem(words), guessed:[], wrong:0, maxWrong:10 };
  addLine(r("<hangman> guess letters, exit to quit"));
  hangmanRender();
}
function hangmanRender() {
  const st=appState.hangman;
  addLine("word: "+st.word.split("").map(c=>st.guessed.includes(c)?c:"_").join(" "));
  addLine("wrong: "+st.wrong+"/"+st.maxWrong);
}
function hangmanHandle(input) {
  const st=appState.hangman;
  const t=normalize(input);
  if (t==="exit") { mode="shell"; return addLine(r("<hangman> closed")); }
  if (!t||t.length!==1||!/[a-z]/.test(t)) return addLine(r("<hangman> letter only"));
  if (st.guessed.includes(t)) return addLine(r("<hangman> already guessed"));
  st.guessed.push(t);
  if (st.word.includes(t)) addLine(r("<hangman> hit"));
  else { st.wrong++; addLine(r("<hangman> miss")); }
  if (st.word.split("").every(c=>st.guessed.includes(c))) {
    addLine("word: "+st.word.split("").join(" "));
    if (st.wrong===0) unlockAchievement("hangman_perfect");
    mode="shell";
    return addLine(r("<hangman> win"));
  }
  if (st.wrong>=st.maxWrong) {
    addLine("word: "+st.word.split("").join(" "));
    mode="shell";
    return addLine(r("<hangman> lose"));
  }
  hangmanRender();
}

/* ================================================================
   CALC — safe evaluator, no Function() / eval
   Supports: + - * / ( ) ^ ! and named variables
   ================================================================ */
const calcVars = {};

function cmd_calc(args) {
  achievements.calcCount = (achievements.calcCount||0)+1;
  if (achievements.calcCount>=10) unlockAchievement("calc_10");
  saveAchievements();
  if (!args.length) return addLine(r("<calc> missing expression"));
  try {
    const result = calcParse(args.join(" ").trim());
    addLine(r("<calc> "+result));
  } catch(e) {
    addLine(r("<calc> error: "+e));
  }
}

/* ---------- tokenizer ---------- */
function calcTokenize(expr) {
  /* replace variables first */
  expr = expr.replace(/[a-zA-Z_][a-zA-Z0-9_]*/g, name => {
    if (calcVars[name]!==undefined) return calcVars[name];
    throw "unknown variable: "+name;
  });
  const tokens=[];
  let i=0;
  while(i<expr.length){
    if(/\s/.test(expr[i])){ i++; continue; }
    if(/[0-9.]/.test(expr[i])){
      let n="";
      while(i<expr.length&&/[0-9.]/.test(expr[i])) n+=expr[i++];
      const val = parseFloat(n);
      if (isNaN(val)) throw "invalid number: " + n;
      tokens.push({t:"num",v:val});
      continue;
    }
    if("+-*/^()!".includes(expr[i])){
      tokens.push({t:"op",v:expr[i++]});
      continue;
    }
    throw "unexpected character: "+expr[i];
  }
  return tokens;
}

/* ---------- recursive descent parser ---------- */
function calcParse(exprStr) {
  const assignMatch = exprStr.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.*)$/);
  if (assignMatch) {
    const varName = assignMatch[1];
    const subExpr = assignMatch[2];
    const val = calcParse(subExpr);
    calcVars[varName] = val;
    return val;
  }

  const tokens = calcTokenize(exprStr);
  let pos=0;

  function peek()  { return tokens[pos]; }
  function eat(v)  { if(peek()&&peek().v===v){ pos++; return true; } return false; }
  function next()  { return tokens[pos++]; }
  function done()  { return pos>=tokens.length; }

  function parseExpr()   { return parseAddSub(); }

  function parseAddSub() {
    let left=parseMulDiv();
    while(!done()&&(peek().v==="+"||peek().v==="-")){
      const op=next().v;
      const right=parseMulDiv();
      left = op==="+" ? left+right : left-right;
    }
    return left;
  }

  function parseMulDiv() {
    let left=parseUnary();
    while(!done()&&(peek().v==="*"||peek().v==="/")){
      const op=next().v;
      const right=parseUnary();
      if(op==="/"&&right===0) throw "division by zero";
      left = op==="*" ? left*right : left/right;
    }
    return left;
  }

  function parseUnary() {
    if(peek()&&peek().v==="-"){ next(); return -parseUnary(); }
    return parsePower();
  }

  function parsePower() {
    let base=parsePostfix();
    if(peek()&&peek().v==="^"){
      next();
      const exp=parseUnary();
      if(Math.abs(exp)>1000) throw "exponent too large";
      base=Math.pow(base,exp);
    }
    return base;
  }

  function parsePostfix() {
    let val=parsePrimary();
    while(peek()&&peek().v==="!"){
      next();
      if(!Number.isInteger(val)||val<0||val>20) throw "factorial out of range (0-20)";
      val=factorial(val);
    }
    return val;
  }

  function parsePrimary() {
    if(done()) throw "unexpected end";
    const tok=peek();
    if(tok.t==="num"){ next(); return tok.v; }
    if(tok.v==="("){
      next();
      const val=parseExpr();
      if(!eat(")")) throw "missing closing )";
      return val;
    }
    throw "unexpected token: "+tok.v;
  }

  const result=parseExpr();
  if(!done()) throw "unexpected token after expression: "+peek().v;
  /* guard against Infinity / NaN leaking out */
  if(!isFinite(result)) throw "result is not finite";
  /* round tiny float noise */
  return Math.round(result*1e10)/1e10;
}

function factorial(n){
  let r=1; for(let i=2;i<=n;i++) r*=i; return r;
}

/* ================================================================
   RECURSIVE TERMINAL
   ================================================================ */
function recursiveInit() {
  sessionRecursive++; /* count entries */
  mode = "recursive";
  thaumaWall._recEntryCount = (thaumaWall._recEntryCount || 0) + 1;
  thaumaWall._recJustEntered = true; /* flag so exit can detect immediate-exit break */
  addLine(r("<recursive> entering nested terminal. type help for commands."));
}

function recursiveHandle(input) {
  const raw = input.trim();
  if (!raw) return;
  const parts = tokenize(raw);
  const cmd = (parts[0]||"").toLowerCase();
  const args = parts.slice(1);

  switch(cmd) {
    case "help":
      thaumaWall._recJustEntered = false;
      addLine(r("<rec:help> commands: help, echo, theme, textsize, calc, exit"));
      return;
    case "echo":
      thaumaWall._recJustEntered = false;
      addLine(r("<rec:echo> " + args.join(" ")));
      return;
    case "theme":
      thaumaWall._recJustEntered = false;
      cmd_theme(args);
      return;
    case "textsize":
      thaumaWall._recJustEntered = false;
      cmd_textsize(args);
      return;
    case "calc":
      thaumaWall._recJustEntered = false;
      cmd_calc(args);
      return;
    case "exit":
      mode = "shell";
      addLine(r("<recursive> closed"));
      /* break wall if user entered recursive and immediately typed exit */
      if (thaumaWall._recJustEntered && thaumaWall.active) {
        thaumaWall._recJustEntered = false;
        breakWall();
      } else {
        thaumaWall._recJustEntered = false;
      }
      return;
    default:
      thaumaWall._recJustEntered = false;
      addLine(r("<rec:error> unknown command. type help for available commands."));
      return;
  }
}

function cmd_encrypt(args) {
  const text=args.join(" ");
  if(!text) return addLine(r("<encrypt> missing"));
  let b64=btoa(unescape(encodeURIComponent(text)));
  let rot=b64.replace(/[A-Za-z]/g,c=>"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz".charAt("NOPQRSTUVWXYZABCDEFGHIJKLMnopqrstuvwxyzabcdefghijklm".indexOf(c)));
  let xor=""; for(let i=0;i<rot.length;i++) xor+=String.fromCharCode(rot.charCodeAt(i)^42);
  const out=btoa(xor);
  /* track encrypt→decrypt→encrypt loop */
  if(lastCryptoOp==="decrypt"){
    unlockAchievement("encrypt_loop");
  }
  lastCryptoOp="encrypt";
  addLine(r("<encrypt> "+out));
}

function cmd_decrypt(args) {
  const text=args.join(" ");
  if(!text) return addLine(r("<decrypt> missing"));
  try {
    let xor=atob(text);
    let rot=""; for(let i=0;i<xor.length;i++) rot+=String.fromCharCode(xor.charCodeAt(i)^42);
    let b64=rot.replace(/[A-Za-z]/g,c=>"NOPQRSTUVWXYZABCDEFGHIJKLMnopqrstuvwxyzabcdefghijklm".charAt("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz".indexOf(c)));
    let out=decodeURIComponent(escape(atob(b64)));
    lastCryptoOp="decrypt";
    addLine(r("<decrypt> "+out));
  } catch {
    addLine(r("<decrypt> error — invalid ciphertext"));
  }
}

  if(!type) return addLine(r("<simulate> missing type: rain / sunrise / glitch"));

  if(type==="sunrise") return simulateSunrise();
  if(type==="glitch")  return simulateGlitch();
  addLine(r("<simulate> unknown type"));
}

function simulateRain() {
  const frames=["| | | |","  | | | |"," | | |","   | | | |","| | |"];
  let i=0;
  function step(){ addLine(r("<rain> "+frames[i])); i=(i+1)%frames.length; if(i!==0) setTimeout(step,200); }
  step();
}

function simulateSunrise() {
  const frames=["      .","     ...","    .....","   .......","  .........","   \\ | /","    \\|/","     *SUN*"];
  let i=0;
  function step(){ addLine(r("<sunrise> "+frames[i])); i++; if(i<frames.length) setTimeout(step,300); }
  step();
}

function simulateGlitch() {
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@";
  let count=0;
  function step(){
    let out=""; for(let i=0;i<20;i++) out+=chars[Math.floor(Math.random()*chars.length)];
    addLine(r("<glitch> "+out));
    count++;
    if(count<10) setTimeout(step,100);
    else unlockAchievement("glitch_max");
  }
  step();
}

/* ================================================================
   DISPATCH
   ================================================================ */
function handleShell(input) {
  const raw=input.trim();
  if(!raw) return;
  const parts=tokenize(raw);

  let sudo=false;
  if(parts[0]==="sudo"){ sudo=true; rudeMode=true; parts.shift(); }

  const cmd=(parts[0]||"").toLowerCase();
  const args=parts.slice(1);
  if(!cmd) return;

  /* shutdown bypasses walls entirely */
  if(cmd==="shutdown") return cmd_shutdown(sudo);

  /* ── WALL INTERCEPTION ── */
  if(thaumaWall.active) {
    /* exempt commands always pass */
    if(!WALL_EXEMPT.has(cmd)) {
      if(isWallBreak(cmd, args)) {
        breakWall();
        /* fall through and execute the break command normally */
      } else {
        thaumaWall.blockCount++;
        renderWall();
        return; /* block */
      }
    }
  } else {
    /* no wall — check triggers (skip exempt commands) */
    if(!WALL_EXEMPT.has(cmd) && shouldTriggerWall(cmd, args)) {
      thaumaWall.active = true;
      thaumaWall.blockCount++;
      renderWall();
      return; /* block the triggering command */
    }
  }
  /* ── END WALL INTERCEPTION ── */

  switch(cmd){
    case "about":        return cmd_about(args);
    case "achievements": return cmd_achievements();
    case "ascii":        return cmd_ascii();
    case "calc":         return cmd_calc(args);
    case "cast":         return cmd_cast();
    case "chatbot":      return cmd_open(["chatbot"]);
    case "clear":        return cmd_clear();
    case "colorize":     return cmd_colorize();
    case "cpu":          return cmd_cpu();
    case "creature":     return cmd_creature();
    case "date":         return cmd_date();
    case "distort":      return cmd_distort();
    case "echo":         return cmd_echo(args);
    case "exit":         return addLine(r("<exit> not in an app"));
    case "flip":         return cmd_flip();
    case "fortune":      return cmd_fortune();
    case "hangman":      return cmd_open(["hangman"]);
    case "help":         return cmd_help();
    case "inventory":    return cmd_inventory();
    case "joke":         return cmd_joke();
    case "list":         return cmd_list();
    case "map":          return cmd_map();
    case "mimic":        return cmd_mimic(args);
    case "mood":         return cmd_mood();
    case "namegen":      return cmd_namegen();
    case "notes":        return cmd_open(["notes"]);
    case "open":         return cmd_open(args);
    case "ram":          return cmd_ram();
    case "recursive":    return recursiveInit();
    case "roll":         return cmd_roll();
    case "scramble":     return cmd_scramble();
    case "sessionstats": return cmd_sessionstats();
    case "snack":        return cmd_snack();
    case "spirit":       return cmd_spirit();
    case "tale":         return cmd_tale();
    case "textsize":     return cmd_textsize(args);
    case "theme":        return cmd_theme(args);
    case "time":         return cmd_time();
    case "uptime":       return cmd_uptime();
    case "vibe":         return cmd_vibe();
    case "weather":      return weatherRun();
    case "wisdom":       return cmd_wisdom();
    case "encrypt":      return cmd_encrypt(args);
    case "decrypt":      return cmd_decrypt(args);
    case "clean":        return cmd_clean();
    case "simulate":     return cmd_simulate(args);
    case "lore-inbox":  return cmd_lore_inbox(args);
    default:             return addLine(r("<error> unknown command — type help"));
  }
}

function handleApp(input) {
  switch(mode){
    case "notes":     return notesHandle(input);
    case "hangman":   return hangmanHandle(input);
    case "chatbot":   return chatbotHandle(input);
    case "recursive": return recursiveHandle(input);
    default: mode="shell"; return handleShell(input);
  }
}

/* ================================================================
   KEYBOARD HANDLING
   ================================================================ */
document.addEventListener("click", ()=>{ if(!locked) hidden.focus(); });

hidden.addEventListener("keydown", e=>{
  if(locked) return;

  /* any keypress resets idle / dream timer */
  resetIdleTimer();

  if(e.key==="Enter"){
    e.preventDefault();
    const input=commitLine();
    if(input.trim()){ history.push(input); historyIndex=history.length; }
    if(mode==="shell") handleShell(input);
    else handleApp(input);
    if(!locked) newPrompt();
    return;
  }

  if(e.key==="ArrowUp"){
    e.preventDefault();
    if(history.length){ historyIndex=Math.max(0,historyIndex-1); hidden.value=history[historyIndex]||""; syncVisible(); }
    return;
  }

  if(e.key==="ArrowDown"){
    e.preventDefault();
    if(history.length){
      historyIndex=Math.min(history.length,historyIndex+1);
      hidden.value=historyIndex>=history.length?"":history[historyIndex]||"";
      syncVisible();
    }
    return;
  }

  requestAnimationFrame(syncVisible);
});

/* also sync on input event to catch mobile soft-keyboard and paste */
hidden.addEventListener("input", ()=>{
  resetIdleTimer();
  syncVisible();
});

/* ================================================================
   INIT
   ================================================================ */
function init(){
  loadAchievements();
  loadMailState();
  rearmDeliveryTimers();

  /* load saved theme and textsize if present */
  try {
    const savedTheme = localStorage.getItem("terminal_theme");
    const themes={green:"#00ff00",amber:"#ffbf00",cyan:"#00ffff",magenta:"#ff00ff",white:"#ffffff"};
    if (savedTheme && themes[savedTheme]) {
      document.documentElement.style.setProperty("--fg", themes[savedTheme]);
    }
  } catch(e) {}

  try {
    const savedSize = localStorage.getItem("terminal_textsize");
    if (savedSize) {
      const parsedSize = parseInt(savedSize, 10);
      if (parsedSize >= 10 && parsedSize <= 40) {
        document.documentElement.style.setProperty("--font-size", parsedSize + "px");
      }
    }
  } catch(e) {}

  addLine(""); addLine(""); addLine("");
  addLine("<boot> {terminal ready}");
  addLine("");
  addLine("type <help> for commands.");
  newPrompt();
  hidden.focus();

  /* track session time for time_30min achievement */
  const startTime=Date.now();
  setInterval(()=>{ if((Date.now()-startTime)/60000>=30) unlockAchievement("time_30min"); },60000);


  /* start idle timer for dream logs */
  resetIdleTimer();
}

init();
