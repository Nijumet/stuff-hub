    "   ▓ ⌐ ▓ ⌐ ▓ ⌐",
    "  (falling, does not melt)",
  ],
  "mirror rain": [
    "      .--.",
    "   .-(    ).",
    "  (___.__)__)",
    "    | | | | |",
    "    | | | | |   (reflection inverted)",
  ],
};

let weatherState = null;
let weatherTickTimer = null;

function weatherIsRare(cond) { return RARE_WEATHER.includes(cond); }
function weatherFormatTemp(t) { return t + "°C"; }

function weatherFreshState() {
  const condition = randomItem(NORMAL_WEATHER);
  const place     = randomItem(PLACES);
  const temp      = Math.floor(Math.random()*38) - 8;
  return {
    day:       0,
    condition,
    place,
    temp,
    lastTick:  Date.now(),
    forecast:  [],
    journal:   [{ day: 0, ts: Date.now(), condition, place, temp, rare: false, note: null }],
    witnessed: [],
  };
}

function loadWeatherState() {
  try {
    const s = localStorage.getItem(WEATHER_STATE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (p && typeof p.condition === "string") {
        weatherState = p;
        /* backfill: older saved states (pre-fix) may have an empty journal
           even though a current reading exists — seed it so journal works */
        if (!weatherState.journal || !weatherState.journal.length) {
          weatherState.journal = [{
            day: weatherState.day || 0, ts: Date.now(),
            condition: weatherState.condition, place: weatherState.place,
            temp: weatherState.temp, rare: weatherIsRare(weatherState.condition), note: null,
          }];
          saveWeatherState();
        }
        return;
      }
    }
  } catch(e) {}
  weatherState = weatherFreshState();
}

function saveWeatherState() {
  if (!weatherState) return;
  try { localStorage.setItem(WEATHER_STATE_KEY, JSON.stringify(weatherState)); } catch(e) {}
}

function weatherRollCondition() {
  if (Math.random() < 0.12) return randomItem(RARE_WEATHER);
  return randomItem(NORMAL_WEATHER);
}

function weatherNextCondition(prev) {
  /* rare conditions are transient — never persist two days in a row */
  if (weatherIsRare(prev)) return weatherRollCondition();
  if (Math.random() < 0.12) return randomItem(RARE_WEATHER);
  if (Math.random() < 0.35) return prev;   /* weather patterns hold for a bit */
  return randomItem(NORMAL_WEATHER);
}

function weatherNextPlace(prev) {
  if (Math.random() < 0.55) return prev;
  return randomItem(PLACES);
}

function weatherNextTemp(prev) {
  const delta = Math.floor(Math.random()*9) - 4;
  return Math.max(-15, Math.min(42, prev + delta));
}

/* keep the forecast queue topped up FORECAST_LOOKAHEAD days ahead of `day` */
function weatherRefillForecast() {
  const st = weatherState;
  while (st.forecast.length < FORECAST_LOOKAHEAD) {
    const last = st.forecast.length
      ? st.forecast[st.forecast.length - 1]
      : { day: st.day, condition: st.condition, place: st.place, temp: st.temp };
    st.forecast.push({
      day:       last.day + 1,
      condition: weatherNextCondition(last.condition),
      place:     weatherNextPlace(last.place),
      temp:      weatherNextTemp(last.temp),
    });
  }
}

/* advance the simulation by exactly one in-fiction day */
function weatherStepForward() {
  const st = weatherState;
  st.day++;

  const planned = (st.forecast.length && st.forecast[0].day === st.day) ? st.forecast.shift() : null;

  let condition, place, temp, mismatch = false;

  if (planned) {
    /* the forecast lies about 15% of the time — the terminal warned you */
    if (Math.random() < 0.15) {
      condition = weatherNextCondition(st.condition);
      place     = weatherNextPlace(st.place);
      temp      = weatherNextTemp(st.temp);
      mismatch  = (condition !== planned.condition);
    } else {
      condition = planned.condition;
      place     = planned.place;
      temp      = planned.temp;
    }
  } else {
    condition = weatherNextCondition(st.condition);
    place     = weatherNextPlace(st.place);
    temp      = weatherNextTemp(st.temp);
  }

  const rare = weatherIsRare(condition);
  if (rare) unlockAchievement("weather_odd");

  st.journal.push({
    day: st.day,
    ts:  Date.now(),
    condition, place, temp, rare,
    note: mismatch ? ("forecast predicted " + planned.condition + " — it did not hold.") : null,
  });
  if (st.journal.length > WEATHER_JOURNAL_CAP) st.journal.shift();

  st.condition = condition;
  st.place     = place;
  st.temp      = temp;

  weatherRefillForecast();
}

/* catch the simulation up on any real time that passed since the last tick */
function weatherCatchUp() {
  if (!weatherState) return;
  const st = weatherState;
  const now = Date.now();
  let elapsedDays = Math.floor((now - st.lastTick) / WEATHER_DAY_MS);
  if (elapsedDays <= 0) { weatherRefillForecast(); return; }
  elapsedDays = Math.min(elapsedDays, 60); /* safety cap */
  for (let i = 0; i < elapsedDays; i++) weatherStepForward();
  st.lastTick += elapsedDays * WEATHER_DAY_MS;
  saveWeatherState();
}

function weatherWitness(condition) {
  if (!weatherState.witnessed.includes(condition)) {
    weatherState.witnessed.push(condition);
    saveWeatherState();
  }
}

function weatherStartTimer() {
  weatherStopTimer();
  weatherTickTimer = setInterval(() => {
    if (mode === "weather" && !locked) weatherCatchUp();
  }, 5000);
}
function weatherStopTimer() {
  if (weatherTickTimer) { clearInterval(weatherTickTimer); weatherTickTimer = null; }
}

function weatherPrintCurrent() {
  const st = weatherState;
  addLine("  location : " + st.place);
  addLine("  condition: " + st.condition + (weatherIsRare(st.condition) ? "   ⚠ rare" : ""));
  addLine("  temp     : " + weatherFormatTemp(st.temp));
  addLine("  day      : " + st.day);
}

function weatherCheck() {
  weatherCatchUp();
  achievements.weatherCount = (achievements.weatherCount || 0) + 1;
  if (achievements.weatherCount >= 10) unlockAchievement("weather_10");
  saveAchievements();

  weatherWitness(weatherState.condition);
  if (weatherIsRare(weatherState.condition)) unlockAchievement("weather_odd");

  addLine("<weather> reading current conditions...");
  weatherPrintCurrent();
  addLine("<weather> done");
}

function weatherForecast() {
  weatherCatchUp();
  const st = weatherState;
  addLine("<forecast> upcoming days — " + st.place + " region");
  addLine("────────────────────────────────────────");
  for (const f of st.forecast) {
    const tag = weatherIsRare(f.condition) ? " ⚠" : "";
    addLine("  day " + f.day + "   " + f.place.padEnd(14) + f.condition.padEnd(16) + weatherFormatTemp(f.temp) + tag);
  }
  addLine("────────────────────────────────────────");
  addLine("  forecasts are not guarantees. the terminal has been known to lie.");
}

function weatherJournal() {
  const st = weatherState;
  if (!st.journal.length) { addLine("<journal> no readings logged yet. try check."); return; }
  addLine("<journal> weather history — last " + st.journal.length + " entries");
  addLine("────────────────────────────────────────");
  for (const e of st.journal) {
    const tag = e.rare ? " ⚠ rare" : "";
    addLine("  day " + e.day + "   " + e.place.padEnd(14) + e.condition.padEnd(16) + weatherFormatTemp(e.temp) + tag);
    if (e.note) addLine("       └─ " + e.note);
  }
  addLine("────────────────────────────────────────");
}

function weatherRadar() {
  weatherCatchUp();
  const st = weatherState;
  const art = WEATHER_RADAR[st.condition] || WEATHER_RADAR["overcast"];
  addLine("<radar> " + st.condition + " over " + st.place);
  for (const line of art) addLine(line);
  weatherWitness(st.condition);
  if (weatherIsRare(st.condition)) unlockAchievement("weather_odd");
}

/* entry point — called from shell / open */
function weatherInit() {
  loadWeatherState();
  weatherCatchUp();
  mode = "weather";
  addLine("<weather> opening regional monitor...");
  addLine("────────────────────────────────────────");
  weatherPrintCurrent();
  addLine("────────────────────────────────────────");
  addLine("commands: check, forecast, journal, radar, exit");
  weatherStartTimer();
}

/* input handler — called from handleApp when mode === "weather" */
function weatherHandle(input) {
  const cmd = input.trim().toLowerCase();
  switch (cmd) {
    case "":
      addLine("<weather> the sky does not take orders. try check, forecast, journal, radar, help, or exit.");
      return;
    case "check":    return weatherCheck();
    case "forecast": return weatherForecast();
    case "journal":
    case "log":      return weatherJournal();
    case "radar":    return weatherRadar();
    case "exit":
      weatherStopTimer();
      saveWeatherState();
      mode = "shell";
      addLine("<weather> monitor closed.");
      return;
    default:
      addLine("<weather> unknown command. try: check, forecast, journal, radar, help, exit");
  }
}

/* ================================================================
   CLICKER — glitch fragment incrementer
   Bare Enter increments fragments by (clickPower * multiplier), with
   a chance to crit. "buy {upgrade}" purchases power, multiplier, an
   auto-clicker, or crit chance; each purchase raises that upgrade's
   price for next time. "shop" lists everything available.
   ================================================================ */
const CLICKER_STATE_KEY = "terminal_clicker_state_v1";

const CLICKER_POWER_BASE_COST = 10;
const CLICKER_POWER_GROWTH    = 1.15;
const CLICKER_MULT_BASE_COST  = 50;
const CLICKER_MULT_GROWTH     = 1.25;
const CLICKER_AUTO_BASE_COST  = 100;
const CLICKER_AUTO_GROWTH     = 1.3;
const CLICKER_CRIT_BASE_COST  = 150;
const CLICKER_CRIT_GROWTH     = 1.35;
const CLICKER_CRIT_PCT_PER_LEVEL = 5;    /* +5% crit chance per level */
const CLICKER_CRIT_PCT_CAP       = 75;   /* crit chance never exceeds this */
const CLICKER_CRIT_MULTIPLIER    = 3;    /* crits deal 3x normal click value */
const CLICKER_AUTO_TICK_MS       = 3000; /* auto-clicker fires every 3s while app is open */
const CLICKER_CONVERT_RATE       = 1000; /* fragments per token — 10000 frags : 10 tokens */

let clickerState = null;
let clickerTickTimer = null;

function clickerFreshState() {
  return {
    fragments:   0,
    clickPower:  1,
    multiplier:  1,
    powerBought: 0,
    multBought:  0,
    autoLevel:   0,
    autoBought:  0,
    critLevel:   0,
    critBought:  0,
    milestoneIndex: -1,   /* highest fragment-count milestone already announced */
  };
}

function loadClickerState() {
  try {
    const s = localStorage.getItem(CLICKER_STATE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (p && typeof p.fragments === "number") {
        /* backfill: older saves may predate the auto/crit upgrades */
        if (typeof p.autoLevel  !== "number") { p.autoLevel  = 0; p.autoBought = 0; }
        if (typeof p.critLevel  !== "number") { p.critLevel  = 0; p.critBought = 0; }
        if (typeof p.milestoneIndex !== "number") { p.milestoneIndex = -1; }
        clickerState = p;
        return;
      }
    }
  } catch(e) {}
  clickerState = clickerFreshState();
}

function saveClickerState() {
  if (!clickerState) return;
  try { localStorage.setItem(CLICKER_STATE_KEY, JSON.stringify(clickerState)); } catch(e) {}
}

/* fragment-count milestones — every power of ten from 1 up to 100 trillion */
const CLICKER_MILESTONES = [
  { value: 1,               text: "the first fragment. every extractor starts somewhere." },
  { value: 10,               text: "double digits. the counter finally has something to say." },
  { value: 100,              text: "a hundred fragments. the extractor is warming up." },
  { value: 1000,             text: "one thousand fragments. this is no longer a curiosity." },
  { value: 10000,            text: "ten thousand. someone would have noticed this draw by now." },
  { value: 100000,           text: "one hundred thousand fragments. the counter needed a comma." },
  { value: 1000000,          text: "one million fragments. round numbers used to mean something." },
  { value: 10000000,         text: "ten million. this stopped being a hobby a while ago." },
  { value: 100000000,        text: "one hundred million fragments. the kind of number nobody signs off on." },
  { value: 1000000000,       text: "one billion fragments. the counter still reads clean. that's the unsettling part." },
  { value: 10000000000,      text: "ten billion. nothing this size should be this quiet." },
  { value: 100000000000,     text: "one hundred billion fragments. the terminal has stopped commenting on the number." },
  { value: 1000000000000,    text: "one trillion fragments. some numbers are only theoretical until they aren't." },
  { value: 10000000000000,   text: "ten trillion. whatever is generating these did not stop when asked." },
  { value: 100000000000000,  text: "one hundred trillion fragments. there is nothing left to compare this to." },
];

function clickerCheckMilestone() {
  if (!clickerState) return;
  let hit = -1;
  for (let i = 0; i < CLICKER_MILESTONES.length; i++) {
    if (clickerState.fragments >= CLICKER_MILESTONES[i].value && i > clickerState.milestoneIndex) {
      hit = i;
    }
  }
  if (hit === -1) return;
  clickerState.milestoneIndex = hit;
  saveClickerState();
  addLine("");
  addLine("<clicker> [milestone] " + CLICKER_MILESTONES[hit].text);
}

function clickerPowerCost() {
  return Math.floor(CLICKER_POWER_BASE_COST * Math.pow(CLICKER_POWER_GROWTH, clickerState.powerBought));
}

function clickerMultCost() {
  return Math.floor(CLICKER_MULT_BASE_COST * Math.pow(CLICKER_MULT_GROWTH, clickerState.multBought));
}

function clickerAutoCost() {
  return Math.floor(CLICKER_AUTO_BASE_COST * Math.pow(CLICKER_AUTO_GROWTH, clickerState.autoBought));
}

function clickerCritCost() {
  return Math.floor(CLICKER_CRIT_BASE_COST * Math.pow(CLICKER_CRIT_GROWTH, clickerState.critBought));
}

function clickerCritChance() {
  return Math.min(CLICKER_CRIT_PCT_CAP, clickerState.critLevel * CLICKER_CRIT_PCT_PER_LEVEL);
}

function clickerPrintStatus() {
  const st = clickerState;
  addLine("<clicker> glitch fragments: " + st.fragments);
  addLine("<clicker> click power: " + st.clickPower + "   multiplier: x" + st.multiplier +
          "   auto: " + st.autoLevel + "/tick   crit: " + clickerCritChance() + "%");
}

function clickerPrintShop() {
  const st = clickerState;
  addLine("<clicker> shop — buy {upgrade} to purchase:");
  addLine("  " + "─".repeat(56));
  addLine("  power       — " + clickerPowerCost() + " frags   (power " + st.clickPower + " → " + (st.clickPower+1) + ")");
  addLine("  multiplier  — " + clickerMultCost() + " frags   (mult x" + st.multiplier + " → x" + (st.multiplier+1) + ")");
  addLine("  auto        — " + clickerAutoCost() + " frags   (auto " + st.autoLevel + " → " + (st.autoLevel+1) + " frag/tick, every " + (CLICKER_AUTO_TICK_MS/1000) + "s)");
  const nextCrit = Math.min(CLICKER_CRIT_PCT_CAP, (st.critLevel+1) * CLICKER_CRIT_PCT_PER_LEVEL);
  if (clickerCritChance() >= CLICKER_CRIT_PCT_CAP) {
    addLine("  crit        — MAXED (" + CLICKER_CRIT_PCT_CAP + "% chance for a x" + CLICKER_CRIT_MULTIPLIER + " click)");
  } else {
    addLine("  crit        — " + clickerCritCost() + " frags   (crit " + clickerCritChance() + "% → " + nextCrit + "%, x" + CLICKER_CRIT_MULTIPLIER + " on hit)");
  }
  addLine("  " + "─".repeat(56));
  addLine("  convert {n} — turn n glitch fragments into job tokens (" + CLICKER_CONVERT_RATE + " frags = 1 token)");
  addLine("  " + "─".repeat(56));
}

function clickerTick() {
  if (!clickerState || mode !== "clicker") return;
  if (clickerState.autoLevel > 0) {
    const gained = clickerState.autoLevel * clickerState.multiplier;
    clickerState.fragments += gained;
    saveClickerState();
    if (clickerState.fragments >= 10000) unlockAchievement("clicker_10000");
    addLine("<clicker> [auto] +" + gained + " glitch fragments  (total: " + clickerState.fragments + ")");
    clickerCheckMilestone();
  }
}

function clickerStartTimer() {
  clickerStopTimer();
  clickerTickTimer = setInterval(clickerTick, CLICKER_AUTO_TICK_MS);
}

function clickerStopTimer() {
  if (clickerTickTimer) { clearInterval(clickerTickTimer); clickerTickTimer = null; }
}

function clickerInit() {
  loadClickerState();
  if (clickerState.fragments >= 10000) unlockAchievement("clicker_10000");
  mode = "clicker";
  addLine("<clicker> opening fragment extractor...");
  addLine("────────────────────────────────────────");
  clickerPrintStatus();
  addLine("────────────────────────────────────────");
  addLine("commands: press enter to click, shop, buy {power|multiplier|auto|crit}, convert {number}, status, exit");
  clickerStartTimer();
}

function clickerHandle(input) {
  const raw = input.trim();
  const cmd = raw.toLowerCase();

  /* bare enter — the click itself */
  if (cmd === "") {
    let gained = clickerState.clickPower * clickerState.multiplier;
    const isCrit = Math.random() * 100 < clickerCritChance();
    if (isCrit) gained *= CLICKER_CRIT_MULTIPLIER;
    clickerState.fragments += gained;
    saveClickerState();
    if (clickerState.fragments >= 10000) unlockAchievement("clicker_10000");
    if (isCrit) {
      addLine("<clicker> CRITICAL HIT! +" + gained + " glitch fragments  (total: " + clickerState.fragments + ")");
    } else {
      addLine("<clicker> +" + gained + " glitch fragments  (total: " + clickerState.fragments + ")");
    }
    clickerCheckMilestone();
    return;
  }

  if (cmd === "status" || cmd === "check") {
    clickerPrintStatus();
    return;
  }

  if (cmd === "shop") {
    clickerPrintShop();
    return;
  }

  if (cmd === "buy power" || cmd === "buy click power") {
    const cost = clickerPowerCost();
    if (clickerState.fragments < cost) {
      addLine("<clicker> not enough fragments — need " + cost + ", have " + clickerState.fragments);
      return;
    }
    clickerState.fragments -= cost;
    clickerState.clickPower += 1;
    clickerState.powerBought += 1;
    saveClickerState();
    addLine("<clicker> click power upgraded to " + clickerState.clickPower + " (-" + cost + " fragments)");
    return;
  }

  if (cmd === "buy multiplier" || cmd === "buy mult" || cmd === "buy click power multiplier") {
    const cost = clickerMultCost();
    if (clickerState.fragments < cost) {
      addLine("<clicker> not enough fragments — need " + cost + ", have " + clickerState.fragments);
      return;
    }
    clickerState.fragments -= cost;
    clickerState.multiplier += 1;
    clickerState.multBought += 1;
    saveClickerState();
    addLine("<clicker> multiplier upgraded to x" + clickerState.multiplier + " (-" + cost + " fragments)");
    return;
  }

  if (cmd === "buy auto" || cmd === "buy autoclicker" || cmd === "buy auto-clicker" || cmd === "buy auto clicker") {
    const cost = clickerAutoCost();
    if (clickerState.fragments < cost) {
      addLine("<clicker> not enough fragments — need " + cost + ", have " + clickerState.fragments);
      return;
    }
    clickerState.fragments -= cost;
    clickerState.autoLevel += 1;
    clickerState.autoBought += 1;
    saveClickerState();
    addLine("<clicker> auto-clicker upgraded to " + clickerState.autoLevel + " frag/tick (-" + cost + " fragments)");
    return;
  }

  if (cmd === "buy crit" || cmd === "buy critical" || cmd === "buy crit chance") {
    if (clickerCritChance() >= CLICKER_CRIT_PCT_CAP) {
      addLine("<clicker> crit chance is already maxed at " + CLICKER_CRIT_PCT_CAP + "%.");
      return;
    }
    const cost = clickerCritCost();
    if (clickerState.fragments < cost) {
      addLine("<clicker> not enough fragments — need " + cost + ", have " + clickerState.fragments);
      return;
    }
    clickerState.fragments -= cost;
    clickerState.critLevel += 1;
    clickerState.critBought += 1;
    saveClickerState();
    addLine("<clicker> crit chance upgraded to " + clickerCritChance() + "% (-" + cost + " fragments)");
    return;
  }

  if (cmd === "convert" || cmd.startsWith("convert ")) {
    const parts    = raw.split(/\s+/);
    const raw2     = (parts[1] || "").trim();
    const requested = parseInt(raw2, 10);
    if (!raw2 || isNaN(requested) || requested <= 0) {
      addLine("<clicker> usage: convert {number} — converts glitch fragments to job tokens (" +
              CLICKER_CONVERT_RATE + " fragments = 1 token)");
      return;
    }
    if (requested > clickerState.fragments) {
      addLine("<clicker> not enough fragments — you have " + clickerState.fragments + ", requested " + requested + ".");
      return;
    }
    const tokensEarned = Math.floor(requested / CLICKER_CONVERT_RATE);
    if (tokensEarned < 1) {
      addLine("<clicker> that's not enough to convert — " + CLICKER_CONVERT_RATE + " fragments are needed per token.");
      return;
    }
    const fragmentsUsed = tokensEarned * CLICKER_CONVERT_RATE;
    clickerState.fragments -= fragmentsUsed;
    saveClickerState();
    loadJobState();   /* pick up jobTokens even if the job app hasn't been opened this session */
    const bonus = pleaseBonus(tokensEarned);
    jobTokens += tokensEarned + bonus;
    saveJobTokens();
    addLine("<clicker> converted " + fragmentsUsed + " glitch fragments → " + tokensEarned +
            " token" + (tokensEarned !== 1 ? "s" : "") + ".");
    pleaseNote(bonus);
    addLine("  fragments remaining: " + clickerState.fragments + "   job tokens: " + jobTokens);
    return;
  }

  if (cmd === "exit") {
    clickerStopTimer();
    saveClickerState();
    mode = "shell";
    addLine("<clicker> extractor closed.");
    return;
  }

  addLine("<clicker> unknown command. press enter to click, or try: shop, buy power, buy multiplier, buy auto, buy crit, convert {number}, status, help, exit");
}

/* ================================================================
   TUTORIAL — a short, guided walkthrough for new operators.
   Teaches: (1) running a bare command, (2) running a command with a
   value after it, (3) using a prefix (dry/whisper/please) before a
   command. Only a safe, non-mode-changing set of commands can be
   practiced with, so nothing destructive can be triggered by accident
   while learning — including under whisper/please, which really do
   execute for real.
   ================================================================ */
const SAFE_TUTORIAL_CMDS = [
  "date", "time", "roll", "flip", "echo", "mood", "ram", "cpu",
  "achievements", "help", "inventory", "cast", "wisdom", "vibe",
  "fortune", "mimic", "calc", "namegen", "joke", "list", "keys", "poke",
  "history", "uptime", "driftclock", "sessionstats",
];
let tutorialStep = 1;

function tutorialPrompt() {
  addLine("");
  if (tutorialStep === 1) {
    addLine("<tutorial> STEP 1/4 — running a command");
    addLine("  a command is just a word you type and press enter on.");
    addLine("  try one now, with nothing else after it — for example: date");
  } else if (tutorialStep === 2) {
    addLine("<tutorial> STEP 2/4 — running a command with a value");
    addLine("  some commands take a value after them, separated by a space.");
    addLine("  try one now — for example: roll 20");
  } else if (tutorialStep === 3) {
    addLine("<tutorial> STEP 3/4 — using a prefix");
    addLine("  a prefix goes BEFORE a command and changes how it runs.");
    addLine("    dry     — previews a command without changing anything");
    addLine("    whisper — runs a command with no glitch corruption");
    addLine("    please  — softens rude mode for one command");
    addLine("  try one now — for example: dry roll 20");
  } else if (tutorialStep === 4) {
    addLine("<tutorial> STEP 4/4 — chaining commands with &&");
    addLine("  && lets you run several commands in one line, back to back.");
    addLine("  each one still finishes properly before the next starts —");
    addLine("  it just happens immediately instead of one at a time.");
    addLine("  try one now — for example: date && roll 20");
  }
}

function tutorialInit() {
  mode = "tutorial";
  tutorialStep = 1;
  addLine("<tutorial> welcome — this takes about a minute.");
  addLine("  type exit to leave anytime, or skip to jump to the end.");
  tutorialPrompt();
}

function tutorialComplete() {
  mode = "shell";
  unlockAchievement("tutorial_complete");
  addLine("");
  addLine("<tutorial> that's the whole thing:");
  addLine("  1. commands  — type a word, press enter");
  addLine("  2. values    — add extra words after a command, separated by spaces");
  addLine("  3. prefixes  — dry / whisper / please go BEFORE a command");
  addLine("  4. chaining  — join commands with && to run them in sequence");
  addLine("<tutorial> type help anytime to see the full command list.");
}

function tutorialHandle(input) {
  const raw   = input.trim();
  const lower = raw.toLowerCase();

  if (lower === "exit") {
    mode = "shell";
    addLine("<tutorial> leaving early. type tutorial anytime to pick it back up.");
    return;
  }
  if (lower === "skip") { return tutorialComplete(); }
  if (!raw) {
    addLine("<tutorial> type a command to try it, or skip to jump ahead.");
    return;
  }

  /* step 4 — chaining two or more commands with && */
  if (tutorialStep === 4) {
    if (!raw.includes("&&")) {
      addLine("<tutorial> that's missing && — chain two commands together,");
      addLine("  e.g. \"date && roll 20\".");
      return;
    }
    const segments = raw.split("&&").map(s => s.trim()).filter(Boolean);
    if (segments.length < 2) {
      addLine("<tutorial> chain at least two commands together with &&, e.g. \"date && roll 20\".");
      return;
    }
    for (const seg of segments) {
      const segParts = tokenize(seg);
      let segCmd = (segParts[0] || "").toLowerCase();
      if (["dry", "whisper", "please"].includes(segCmd)) segCmd = (segParts[1] || "").toLowerCase();
      if (!SAFE_TUTORIAL_CMDS.includes(segCmd)) {
        addLine("<tutorial> keep every command in the chain from this list for now: " +
                SAFE_TUTORIAL_CMDS.slice(0, 6).join(", ") + " — e.g. \"date && roll 20\".");
        return;
      }
    }
    addLine("<tutorial> good — running the whole chain for real:");
    mode = "shell";
    Promise.resolve(processInput(raw)).then(() => {
      mode = "tutorial";
      tutorialComplete();
    });
    return;
  }

  /* step 3 — prefix + command */
  if (tutorialStep === 3) {
    const m = raw.match(/^(dry|whisper|please)\s+(.+)/i);
    if (!m) {
      addLine("<tutorial> that's missing a prefix — start with dry, whisper, or");
      addLine("  please, e.g. \"dry roll 20\".");
      return;
    }
    const restCmd = (tokenize(m[2])[0] || "").toLowerCase();
    if (!SAFE_TUTORIAL_CMDS.includes(restCmd)) {
      addLine("<tutorial> let's keep it to a command from this list for now: " +
              SAFE_TUTORIAL_CMDS.slice(0, 6).join(", ") + " — e.g. \"whisper date\".");
      return;
    }
    addLine("<tutorial> good — running it for real:");
    mode = "shell";
    processInput(raw);
    mode = "tutorial";
    addLine("");
    addLine("<tutorial> step 3 done — you used a prefix.");
    tutorialStep = 4;
    tutorialPrompt();
    return;
  }

  /* steps 1 and 2 — bare command, or command + value */
  const parts = tokenize(raw);
  const cmd   = (parts[0] || "").toLowerCase();
  const args  = parts.slice(1);

  if (!SAFE_TUTORIAL_CMDS.includes(cmd)) {
    addLine("<tutorial> try one of these instead: " + SAFE_TUTORIAL_CMDS.slice(0, 8).join(", ") + " ...");
    return;
  }
  if (tutorialStep === 1 && args.length > 0) {
    addLine("<tutorial> that's actually step 2 material — nice, but try one");
    addLine("  with nothing after it first.");
    return;
  }
  if (tutorialStep === 2 && args.length === 0) {
    addLine("<tutorial> that ran, but without a value after it. add something —");
    addLine("  e.g. \"roll 20\" instead of just \"roll\".");
    return;
  }

  addLine("<tutorial> running it for real:");
  mode = "shell";
  processInput(raw);
  mode = "tutorial";

  if (tutorialStep === 1) {
    addLine("");
    addLine("<tutorial> step 1 done — you ran a command.");
    tutorialStep = 2;
    tutorialPrompt();
  } else if (tutorialStep === 2) {
    addLine("");
    addLine("<tutorial> step 2 done — you ran a command with a value after it.");
    tutorialStep = 3;
    tutorialPrompt();
  }
}

/* ================================================================
   CALC — safe evaluator, no Function() / eval
   Supports: + - * / % ( ) ^ ! round(), the constants pi/e, the
   running ans variable, and named variables — all held in calcVars,
   which persists for the session (not localStorage) so it survives
   across separate calc calls but resets on reload.
   ================================================================ */
const calcVars = { pi: Math.PI, e: Math.E };
const CALC_RESERVED_NAMES = ["pi", "e", "ans"];
const CALC_FUNCTIONS = {
  round: (a, d) => {
    if (d === undefined) return Math.round(a);
    const p = Math.pow(10, d);
    return Math.round(a * p) / p;
  },
};
/* a few more numbers the calculator has feelings about. at most one line per
   calculation: a matching expression first, then 37, then these results. */
const CALC_EGG_LINES = {
  42:   "<calc> the answer. to what, the terminal declines to say.",
  404:  "<calc> found. the result, at least. the meaning is another matter.",
  666:  "<calc> the terminal has no comment on this number.",
  1337: "<calc> leet. the terminal approves, quietly.",
  9001: "<calc> it's over 9000. it was always going to be.",
};
const CALC_EXPR_EGGS = {
  "0.1+0.2": "<calc> yes. other calculators get this one wrong. this one rounds away the evidence.",
  ".1+.2":   "<calc> yes. other calculators get this one wrong. this one rounds away the evidence.",
};
const CALC_PI_ROUNDED = Math.round(Math.PI * 1e10) / 1e10;
const CALC_37_LINES = [
  "<calc> 37. of course it's 37.",
  "<calc> that number again. it finds its way into everything eventually.",
  "<calc> 37 is not a number you arrive at by accident. ask around.",
  "<calc> the terminal has opinions about this result. it will not share them.",
];

function cmd_calc(args) {
  achievements.calcCount = (achievements.calcCount||0)+1;
  if (achievements.calcCount>=10) unlockAchievement("calc_10");
  saveAchievements();
  if (!args.length) return addLine(r("<calc> missing expression"));

  if (args.length === 1 && args[0].toLowerCase() === "vars") {
    addLine(r("<calc> built-in: pi = " + calcVars.pi + ", e = " + calcVars.e));
    addLine(r("<calc> ans = " + (calcVars.ans !== undefined ? calcVars.ans : "(not set yet)")));
    const userVars = Object.keys(calcVars).filter(k => !CALC_RESERVED_NAMES.includes(k));
    if (userVars.length) {
      addLine(r("<calc> your variables:"));
      for (const k of userVars) addLine("  " + k + " = " + calcVars[k]);
    } else {
      addLine(r("<calc> no variables set yet. try: calc x = 5"));
    }
    return;
  }

  try {
    const result = calcParse(args.join(" ").trim());
    addLine(r("<calc> "+result));
    calcVars.ans = result;
    const exprKey = args.join(" ").replace(/\s+/g, "");
    if (Object.prototype.hasOwnProperty.call(CALC_EXPR_EGGS, exprKey)) addLine(r(CALC_EXPR_EGGS[exprKey]));
    else if (result === 37) addLine(r(randomItem(CALC_37_LINES)));
    else if (Object.prototype.hasOwnProperty.call(CALC_EGG_LINES, result)) addLine(r(CALC_EGG_LINES[result]));
    else if (result === CALC_PI_ROUNDED) addLine(r("<calc> pi goes on forever. this answer does not."));
  } catch(e) {
    addLine(r("<calc> error: "+e));
  }
}

/* ---------- tokenizer ----------
   Identifiers are kept as their own token type (not substituted here)
   so the parser can tell a bare variable ("pi") apart from a function
   call ("round(...)") — both start the same way syntactically. */
function calcTokenize(expr) {
  const tokens=[];
  let i=0;
  while(i<expr.length){
    if(/\s/.test(expr[i])){ i++; continue; }
    if(/[0-9.]/.test(expr[i])){
      let n="";
      while(i<expr.length&&/[0-9.]/.test(expr[i])) n+=expr[i++];
      const val = parseFloat(n);
      if (isNaN(val)) throw "invalid number: " + n;
      tokens.push({t:"num",v:val});
      continue;
    }
    if(/[a-zA-Z_]/.test(expr[i])){
      let name="";
      while(i<expr.length&&/[a-zA-Z0-9_]/.test(expr[i])) name+=expr[i++];
      tokens.push({t:"id",v:name});
      continue;
    }
    if("+-*/%^(),!".includes(expr[i])){
      tokens.push({t:"op",v:expr[i++]});
      continue;
    }
    throw "unexpected character: "+expr[i];
  }
  return tokens;
}

/* ---------- recursive descent parser ---------- */
function calcParse(exprStr) {
  const assignMatch = exprStr.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.*)$/);
  if (assignMatch) {
    const varName = assignMatch[1];
    if (CALC_RESERVED_NAMES.includes(varName)) {
      throw "\"" + varName + "\" is reserved and can't be reassigned";
    }
    const subExpr = assignMatch[2];
    const val = calcParse(subExpr);
    calcVars[varName] = val;
    return val;
  }

  const tokens = calcTokenize(exprStr);
  let pos=0;

  function peek()  { return tokens[pos]; }
  function eat(v)  { if(peek()&&peek().v===v){ pos++; return true; } return false; }
  function next()  { return tokens[pos++]; }
  function done()  { return pos>=tokens.length; }

  function parseExpr()   { return parseAddSub(); }

  function parseAddSub() {
    let left=parseMulDiv();
    while(!done()&&(peek().v==="+"||peek().v==="-")){
      const op=next().v;
      const right=parseMulDiv();
      left = op==="+" ? left+right : left-right;
    }
    return left;
  }

  function parseMulDiv() {
    let left=parseUnary();
    while(!done()&&(peek().v==="*"||peek().v==="/"||peek().v==="%")){
      const op=next().v;
      const right=parseUnary();
      if((op==="/"||op==="%")&&right===0) throw "division by zero";
      if (op==="*") left = left*right;
      else if (op==="/") left = left/right;
      else left = left % right;
    }
    return left;
  }

  function parseUnary() {
    if(peek()&&peek().v==="-"){ next(); return -parseUnary(); }
    return parsePower();
  }

  function parsePower() {
    let base=parsePostfix();
    if(peek()&&peek().v==="^"){
      next();
      const exp=parseUnary();
      if(Math.abs(exp)>1000) throw "exponent too large";
      base=Math.pow(base,exp);
    }
    return base;
  }

  function parsePostfix() {
    let val=parsePrimary();
    while(peek()&&peek().v==="!"){
      next();
      if(!Number.isInteger(val)||val<0||val>20) throw "factorial out of range (0-20)";
      val=factorial(val);
    }
    return val;
  }

  function parsePrimary() {
    if(done()) throw "unexpected end";
    const tok=peek();
    if(tok.t==="num"){ next(); return tok.v; }
    if(tok.t==="id"){
      next();
      const name = tok.v;
      if (peek() && peek().v === "(") {
        next();
        const argList = [];
        if (!(peek() && peek().v === ")")) {
          argList.push(parseExpr());
          while (eat(",")) argList.push(parseExpr());
        }
        if (!eat(")")) throw "missing closing ) in " + name + "(...)";
        const fn = CALC_FUNCTIONS[name];
        if (!fn) throw "unknown function: " + name;
        return fn(...argList);
      }
      if (hasOwn(calcVars, name) && calcVars[name] !== undefined) return calcVars[name];
      throw "unknown variable: " + name;
    }
    if(tok.v==="("){
      next();
      const val=parseExpr();
      if(!eat(")")) throw "missing closing )";
      return val;
    }
    throw "unexpected token: "+tok.v;
  }

  const result=parseExpr();
  if(!done()) throw "unexpected token after expression: "+peek().v;
  /* guard against Infinity / NaN leaking out */
  if(!isFinite(result)) throw "result is not finite";
  /* round tiny float noise */
  return Math.round(result*1e10)/1e10;
}

function factorial(n){
  let r=1; for(let i=2;i<=n;i++) r*=i; return r;
}

function cmd_sessionstats() {
  const elapsed = Date.now() - sessionStart;
  const totalSec = Math.floor(elapsed / 1000);
  const mins = Math.floor(totalSec / 60);
  const secs = totalSec % 60;
  const elapsedMins = Math.max(elapsed / 60000, 0.01);
  addLine(r("<sessionstats>"));
  addLine(r("  commands entered   : " + sessionCmds));
  addLine(r("  session time       : " + mins + "m " + secs + "s"));
  addLine(r("  cmds per minute    : " + (sessionCmds / elapsedMins).toFixed(1)));
  addLine(r("  apps opened        : " + sessionApps));
  addLine(r("  simulations run    : " + sessionSims));
  addLine(r("  dream logs seen    : " + sessionDreams));
  addLine(r("  recursive sessions : " + sessionRecursive));

  /* command scoring table */
  const entries = Object.entries(cmdUsage).filter(([,v]) => v > 0);
  if (entries.length) {
    entries.sort((a, b) => b[1] - a[1]);
    const most   = entries[0];
    const least  = entries[entries.length - 1];
    const total  = entries.reduce((s, [,v]) => s + v, 0);
    addLine(r(""));
    addLine(r("  command usage (all-time):"));
    addLine(r("  ────────────────────────────────────"));
    addLine(r("  " + "command".padEnd(20) + "uses"));
    addLine(r("  " + "─".repeat(28)));
    /* show top 10 */
    for (const [cmd, count] of entries.slice(0, 10)) {
      addLine(r("  " + cmd.padEnd(20) + count));
    }
    if (entries.length > 10) addLine(r("  ... and " + (entries.length - 10) + " more"));
    addLine(r("  " + "─".repeat(28)));
    addLine(r("  total tracked      : " + total));
    addLine(r("  most used          : " + most[0]   + " (" + most[1]   + "x)"));
    addLine(r("  least used         : " + least[0]  + " (" + least[1]  + "x)"));
  }
  if (Math.random() < 0.1) {
    addLine("");
    addLine("  note: usage patterns for this session partially match a");
    addLine("  three-day-old meeting log on file. cross-reference: debrief_0917.mp3");
  }
}

/* ================================================================
   RECURSIVE TERMINAL
   ================================================================ */
function recursiveInit() {
  sessionRecursive++;
  recursiveEventsTotal++;
  saveRecursiveEvents();
  mode = "recursive";
  addLine(r("<recursive> entering nested terminal. type help for commands."));
}

function recursiveHandle(input) {
  const raw = input.trim();
  if (!raw) { addLine(r(randomItem(NO_COMMAND_MESSAGES))); return; }
  const parts = tokenize(raw);
  const cmd = (parts[0]||"").toLowerCase();
  const args = parts.slice(1);

  switch(cmd) {
    case "help":
      addLine(r("<rec:help> commands: help, echo, theme, textsize, calc, recursive, exit"));
      return;
    case "echo":
      addLine(r("<rec:echo> " + args.join(" ")));
      return;
    case "theme":
      cmd_theme(args);
      return;
    case "textsize":
      cmd_textsize(args);
      return;
    case "calc":
      cmd_calc(args);
      return;
    case "recursive":
      recursionDepth++;
      sessionRecursive++;
      recursiveEventsTotal++;
      saveRecursiveEvents();
      const corruptionPct = Math.round(recursionDepth * 15);
      addLine(r("<recursive> entering nested terminal (level " + recursionDepth + ", " + corruptionPct + "% corruption). type help for commands."));
      return;
    case "exit":
      if (recursionDepth > 0) {
        recursionDepth--;
        const remainingCorruption = Math.round(recursionDepth * 15);
        addLine(r("<recursive> exiting to level " + recursionDepth + " (" + (remainingCorruption > 0 ? remainingCorruption : "0") + "% corruption)"));
      } else {
        mode = "shell";
        recursionDepth = 0;
        addLine(r("<recursive> closed"));
      }
      return;
    default:
      addLine(r("<rec:error> unknown command. type help for available commands."));
      return;
  }
}

function castRollTier() {
  const keys = ["common", "uncommon", "rare", "epic", "legendary", "mythic"];
  const w = pleaseWeights([38, 24, 17, 11, 7, 3]);      /* please: mythic likelier, common less so */

const COLORIZE_SCATTER_POOL = [].concat(
  RAINBOW_COLORS.slice(0, 4),
  ["#ff2a00","#00bfff","#ff6b9d","#c06cff","#ffd000","#2ecc40","#00ced1"]

function colorizeHTML(text, style) {
  if (style === "rainbow") return rainbowify(text);
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const chars = Array.from(text);
  const total = chars.filter(c => c !== " ").length;
  const def = COLORIZE_STYLES[style];
  let out = "", idx = 0;
  for (const ch of chars) {
    if (ch === " ") { out += " "; continue; }
    let color;
    if (style === "fade") {
      const level = Math.round(255 - (total > 1 ? idx / (total - 1) : 0) * 175);
      color = "rgb(" + level + "," + level + "," + level + ")";
    } else if (style === "scatter") {
      color = randomItem(COLORIZE_SCATTER_POOL);
    } else {
      color = def.colors[idx % def.colors.length];
    }
    out += '<span style="color:' + color + '">' + esc(ch) + '</span>';
    idx++;
  }
  return out;
}

function cmd_colorize(args) {
  if (!args.length) {
    addLine(r("<colorize> prints your text in color — colorize {style} {text}"));
    for (const [name, st] of Object.entries(COLORIZE_STYLES)) {
      addLineHTML("  " + colorizeHTML(name, name) + " ".repeat(Math.max(1, 9 - name.length)) + "— " + st.desc);
    }
    addLine("  " + "random".padEnd(9) + "— pick a style for you");
    addLine("  no style given = rainbow");
    return;
  }

  const first = args[0].toLowerCase();
  const isStyle = Object.prototype.hasOwnProperty.call(COLORIZE_STYLES, first);

  if (isStyle || first === "random") {
    const rest = args.slice(1).join(" ");
    if (!rest) { addLine(r("<colorize> " + first + " needs some text — colorize " + first + " {text}")); return; }
    const style = isStyle ? first : randomItem(Object.keys(COLORIZE_STYLES));
    addLineHTML("&lt;colorize&gt; " + colorizeHTML(r(rest), style));
    return;
  }

  addLineHTML("&lt;colorize&gt; " + rainbowify(r(args.join(" "))));
}

function echoNormalize(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9_ ]+/g, " ").replace(/\s+/g, " ").trim();
}

function cmd_echo(args) {
  const text = args.join(" ");

  if (!t) return;
  for (const [re, lines] of ECHO_EGGS) {
    if (re.test(t)) {
      lines.forEach(l => addLine(l));
      return;
    }
  }
}
/* flip — "flip" is one fair coin. "flip {n}" flips n times (1-10000) and
   tallies them. "flip weighted {w}" biases the coin: w runs 0-2, where 0 is
   always tails, 1 is a fair 50/50 and 2 is always heads (so heads chance is
   w/2); decimals are fine. The two combine in either order:
   "flip 20 weighted 1.5" or "flip weighted 1.5 20". */
const FLIP_MAX = 10000;
const FLIP_SEQUENCE_MAX = 40;   /* show the H/T sequence only up to this many flips */

function cmd_flip(args = []) {
  const usage = () => addLine(r("<flip> usage: flip  |  flip {count}  |  flip weighted {0-2}  |  flip {count} weighted {0-2}"));
  const isWhole = t => /^\d+$/.test(t);
  const isNumber = t => /^(\d+\.?\d*|\.\d+)$/.test(t);

  let count = null;
  let weight = null;
  const toks = args.map(a => a.toLowerCase());

  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t === "weighted") {
      if (weight !== null) return usage();
      const next = toks[i + 1];
      if (next === undefined || !isNumber(next)) {
        addLine(r("<flip> weighted needs a number from 0 to 2 — 0 is all tails, 1 is fair, 2 is all heads"));
        return;
      }
      weight = parseFloat(next);
      i++;
    } else if (isWhole(t)) {
      if (count !== null) return usage();
      count = parseInt(t, 10);
    } else if (isNumber(t)) {
      addLine(r("<flip> the number of flips must be a whole number"));
      return;
    } else {
      return usage();
    }
  }

  if (weight !== null && (weight < 0 || weight > 2)) {
    addLine(r("<flip> weight must be between 0 and 2 — 0 is all tails, 1 is fair, 2 is all heads"));
    return;
  }
  if (count !== null && (count < 1 || count > FLIP_MAX)) {
    addLine(r("<flip> flips must be between 1 and " + FLIP_MAX));
    return;
  }

  const pHeads = weight === null ? 0.5 : weight / 2;
  const n = count === null ? 1 : count;
  let heads = 0;
  const seq = [];
  for (let i = 0; i < n; i++) {
    const isHeads = Math.random() < pHeads;   /* p=0 never true, p=1 always true */
    if (isHeads) heads++;
    if (n <= FLIP_SEQUENCE_MAX) seq.push(isHeads ? "H" : "T");
  }
  const tails = n - heads;
  const plural = (k, word) => k + " " + word + (k === 1 ? "" : "s");
  const tally = plural(n, "flip") + ": " + plural(heads, "head") + ", " + plural(tails, "tail");

  if (count === null) {
    addLine(r("<flip> " + (heads ? "heads" : "tails")));
  } else if (n <= FLIP_SEQUENCE_MAX) {
    addLine(r("<flip> " + seq.join(" ")));
    addLine("  " + tally);
  } else {
    addLine(r("<flip> " + tally));
  }
  if (weight !== null) {
    addLine("  weighted: " + weight + " → " + +(pHeads * 100).toFixed(2) + "% heads");
  }
}

function passgenRandIndex(n) {
  try {
    if (typeof crypto !== "undefined" && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / n) * n;   /* avoid modulo bias */
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }
  } catch(e) {}
  return Math.floor(Math.random() * n);
}

/* choose — picks one option at random. Weights are optional, per option:
   "choose pizza==3 tacos==1" makes pizza three times as likely; options
   without a ==number count as 1. An option only counts as weighted if what
   follows its last "==" is a plain non-negative number, so "choose a b c"
   behaves exactly as before, and times like 10:30 are just ordinary text.
   Weight 0 means never picked. */
function cmd_choose(args) {
  if (!args.length) {
    addLine(r("<choose> usage: choose {a} {b} {c} ...   (optional weights: choose a==3 b==1)"));
    return;
  }
  const options = args.map(a => {
    const m = a.match(/^(.+)==(\d+(?:\.\d+)?)$/);
    return m ? { name: m[1], weight: parseFloat(m[2]) } : { name: a, weight: 1 };
  });
  const total = options.reduce((sum, o) => sum + o.weight, 0);
  if (total <= 0) {
    addLine(r("<choose> every option has weight 0 — nothing to pick from"));
    return;
  }
  let roll = Math.random() * total;
  for (const o of options) {
    roll -= o.weight;
    if (roll < 0 && o.weight > 0) { addLine(r("<choose> " + o.name)); return; }
  }
  /* floating-point edge: fall back to the last option that has any weight */
  const last = options.slice().reverse().find(o => o.weight > 0);
  addLine(r("<choose> " + last.name));
}

const creatureKey = n => n.toLowerCase().replace(/[^a-z0-9]/g, "");

function creatureWeather() {
  try { return (typeof weatherState !== "undefined" && weatherState && weatherState.condition) || null; } catch (e) { return null; }
}

/* roll a tier, then a species within it. rare weather doubles epic and better; a species that
   favours the current weather is four times as likely to be the one picked */
function creatureRoll() {
  const cond = creatureWeather();
  const boostRare = cond && weatherIsRare(cond);
  const tiers = CREATURE_TIERS.map(t => ({ key: t.key,
    w: t.w * ((boostRare && ["epic","legendary","mythic"].includes(t.key)) ? 2 : 1) }));
  const pw = pleaseWeights(tiers.map(t => t.w));       /* please: mythic likelier, common less so */
  tiers.forEach((t, i) => { t.w = pw[i]; });
  let roll = Math.random() * tiers.reduce((a, t) => a + t.w, 0), tier = tiers[0].key;
  for (const t of tiers) { if (roll < t.w) { tier = t.key; break; } roll -= t.w; }
  const pool = CREATURE_SPECIES.filter(sp => sp.tier === tier);
  const wts  = pool.map(sp => (cond && sp.weather && sp.weather.includes(cond)) ? 4 : 1);
  let pick = Math.random() * wts.reduce((a, b) => a + b, 0), idx = 0;
  for (let i = 0; i < pool.length; i++) { if (pick < wts[i]) { idx = i; break; } pick -= wts[i]; }
  const sp = pool[idx];
  return { sp: sp, boosted: !!(cond && sp.weather && sp.weather.includes(cond)), cond: cond };
}

/* some random pickers occasionally surface a recording: a cue, then the file name */
function loreSurface(chance, cues, file) {
  if (Math.random() >= pleaseLift(chance)) return false;
  for (const c of cues) addLine("  " + c);
  addLine("  " + file);
  return true;
}

function creatureBestiary() {
  const seen = Object.keys(bestiary).length;
  addLine(r("<bestiary> " + seen + "/" + CREATURE_SPECIES.length + " catalogued"));
  addLine("────────────────────────────────────────");
  for (const t of CREATURE_TIERS) {
    const sp = CREATURE_SPECIES.filter(x => x.tier === t.key);
    const got = sp.filter(x => bestiary[x.name]).length;
    addLine(t.key.toUpperCase() + "  " + got + "/" + sp.length);
    for (const x of sp) {
      const rec = bestiary[x.name];
      addLine("  " + (rec ? "✦ " + x.name.padEnd(14) + "×" + rec.n : "· ???"));
    }
  }
  addLine("────────────────────────────────────────");
  addLine("  creature {name} shows an entry you have found.");
}

function creatureLookup(query) {
  const key = creatureKey(query);
  if (["bestiary", "list", "dex", "all"].includes(key)) return creatureBestiary();
  const sp = CREATURE_SPECIES.find(x => creatureKey(x.name) === key);
  const rec = sp && bestiary[sp.name];
  if (!sp || !rec) {
    addLine(r("<creature> no record of \"" + query + "\". creature bestiary lists what you have found."));
    return;
  }
  addLine(r("<creature> " + sp.name + "  [" + sp.tier.toUpperCase() + "]"));
  addLine("────────────────────────────────────────");
  addLine("habitat: " + sp.habitat);
  addLine("danger: " + sp.danger);
  addLine("seen: ×" + rec.n + "   first: " + rec.first);
  addLine("appearance: " + sp.art);
  if (sp.weather) addLine("favours: " + sp.weather.join(", "));
  for (const l of sp.lore) addLine("  " + l);
}

function cmd_creature(args) {
  args = args || [];
  if (args.length) return creatureLookup(args.join(" "));

  achievements.creatureCount = (achievements.creatureCount || 0) + 1;
  if (achievements.creatureCount >= 20) unlockAchievement("creature_20");
  saveAchievements();

  const { sp, boosted, cond } = creatureRoll();
  const rec = bestiary[sp.name];
  const isNew = !rec;
  bestiary[sp.name] = rec ? { n: rec.n + 1, first: rec.first } : { n: 1, first: new Date().toISOString().slice(0, 10) };
  bestiarySave();

  if (["rare", "epic", "legendary", "mythic"].includes(sp.tier)) unlockAchievement("creature_rare");
  if (Object.keys(bestiary).length >= CREATURE_SPECIES.length) unlockAchievement("bestiary_complete");

  addLine(r("<creature>" + (sp.tier === "common" ? "" : "  [" + sp.tier.toUpperCase() + "]")));
  addLine(r("name: " + sp.name + (isNew ? "   ✦ NEW" : "")));
  addLine(r("temperament: " + (sp.temper || randomItem(CREATURE_TEMPER))));
  addLine(r("habitat: " + sp.habitat));
  addLine(r("danger: " + sp.danger));
  addLine(r("appearance: " + sp.art));
  if (boosted) addLine(r("conditions: " + cond + " — it likes this."));
  if (isNew) for (const l of sp.lore) addLine("  " + l);

  /* an epic-or-better sighting sometimes comes with a recording */
  if (["epic", "legendary", "mythic"].includes(sp.tier))
    loreSurface(0.5, ["the survey logged this one on tape."], "field_survey_09.mp3");
}

function cmd_encrypt(args) {
  const text=args.join(" ");
  if(!text) return addLine(r("<encrypt> missing"));
  let b64=btoa(encodeURIComponent(text).replace(/%([0-9A-F]{2})/g,(_,p)=>String.fromCharCode(parseInt(p,16))));
  let rot=b64.replace(/[A-Za-z]/g,c=>"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz".charAt("NOPQRSTUVWXYZABCDEFGHIJKLMnopqrstuvwxyzabcdefghijklm".indexOf(c)));
  let xor=""; for(let i=0;i<rot.length;i++) xor+=String.fromCharCode(rot.charCodeAt(i)^42);
  const out=btoa(xor);
  lastCryptoOp="encrypt";
  addLine(r("<encrypt> "+out));
}

function cmd_decrypt(args) {
  const text=args.join(" ");
  if(!text) return addLine(r("<decrypt> missing"));
  try {
    let xor=atob(text);
    let rot=""; for(let i=0;i<xor.length;i++) rot+=String.fromCharCode(xor.charCodeAt(i)^42);
    let b64=rot.replace(/[A-Za-z]/g,c=>"NOPQRSTUVWXYZABCDEFGHIJKLMnopqrstuvwxyzabcdefghijklm".charAt("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz".indexOf(c)));
    let out=decodeURIComponent(Array.from(atob(b64)).map(c=>"%"+c.charCodeAt(0).toString(16).padStart(2,"0")).join(""));
    /* award achievement if previous op was encrypt (2-step chain complete) */
    if(lastCryptoOp==="encrypt"){
      unlockAchievement("encrypt_loop");
    }
    lastCryptoOp="decrypt";
    addLine(r("<decrypt> "+out));
  } catch {
    addLine(r("<decrypt> error — invalid ciphertext"));
  }
}

/* resets textsize, theme, btheme, cursor, crt and vignette to their defaults */
function cleanResetDefaults() {
  const root = document.documentElement;
  /* textsize */
  root.style.setProperty("--font-size", "16px");
  try { localStorage.removeItem("terminal_textsize"); } catch(e) {}
  /* btheme (background) — set before the foreground so the invisibility guard never matters */
  bthemeClearPattern();
  root.style.setProperty("--bg", BUILTIN_BTHEMES.black);
  activeBtheme = "black";
  saveBtheme();
  /* theme (foreground) — also exits any colorize / job theme */
  colorThemeName = null;
  try { localStorage.removeItem(RAINBOW_THEME_KEY); } catch(e) {}
  jobActiveTheme = null;
  saveJobActive();
  root.style.setProperty("--fg", "#00ff00");
  try { localStorage.setItem("terminal_theme", "green"); } catch(e) {}
  try { localStorage.setItem("terminal_active_color", "#00ff00"); } catch(e) {}
  /* cursor */
  activeCursorSkin = "block";
  saveCursorSkin();
  applyCursorSkin("block");
  /* crt */
  crtEnabled = false;
  saveCrtState();
  applyCrtEffect();
  /* vignette */
  vignetteEnabled = false;
  saveVignetteState();
  applyVignetteEffect();
}

function cmd_simulate(args) {
  achievements.simCount=(achievements.simCount||0)+1;
  sessionSims++;
  if(achievements.simCount>=20) unlockAchievement("simulate_20");
  saveAchievements();
  const type=(args[0]||"").toLowerCase();
  if(!type) return addLine(r("<simulate> missing type: rain / sunrise / glitch / snow / storm / fire / compile / orbit"));
  if(type==="rain")    return simulateRain();
  if(type==="sunrise") return simulateSunrise();
  if(type==="glitch")  return simulateGlitch();
  if(type==="snow")    return simulateSnow();
  if(type==="storm")   return simulateStorm();
  if(type==="fire")    return simulateFire();
  if(type==="compile") return simulateCompile();
  if(type==="orbit")   return simulateOrbit();
  addLine(r("<simulate> unknown type. try: rain / sunrise / glitch / snow / storm / fire / compile / orbit"));
}

  function step(){ addLine(r("<rain> "+frames[i])); i=(i+1)%frames.length; if(i!==0) setTimeout(step,200); }

}

function simulateGlitch() {
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@";
  let count=0;
  function step(){
    let out=""; for(let i=0;i<20;i++) out+=chars[Math.floor(Math.random()*chars.length)];

    count++;
    /* quiet process surfaces once, mid-burst, rarely */
    if(count===5 && Math.random()<0.3){

}

function simulateStorm() {

/* mimic — bare "mimic" lists the styles; "mimic {style} {text}" applies
   one on purpose; "mimic {text}" (first word isn't a style) still picks a
   random style, as before. "mimic random {text}" forces random, which is
   also the way to mimic text that happens to start with a style name. */
const MIMIC_STYLES = {
  upper:   { fn: mimicUpper,   desc: "ALL CAPS" },
  lower:   { fn: mimicLower,   desc: "all lowercase" },
  sarcasm: { fn: mimicSarcasm, desc: "aLtErNaTiNg CaSe" },
  glitch:  { fn: mimicGlitch,  desc: "random symbols corrupt some letters" },
  stretch: { fn: mimicStretch, desc: "some letters stretch out: heeello" },
  spaced:  { fn: mimicSpaced,  desc: "s p a c e d   o u t" },
  reverse: { fn: mimicReverse, desc: "backwards" },
  accent:  { fn: mimicAccent,  desc: "accented vowels: hélló" },
};

function cmd_mimic(args) {
  if (!args.length) {
    addLine(r("<mimic> repeats your text in a style — mimic {style} {text}"));
    for (const [name, st] of Object.entries(MIMIC_STYLES)) {
      addLine("  " + name.padEnd(9) + "— " + st.desc);
    }
    addLine("  " + "random".padEnd(9) + "— pick one for you (also what mimic {text} does)");
    return;
  }

  const first = args[0].toLowerCase();
  const isStyle = Object.prototype.hasOwnProperty.call(MIMIC_STYLES, first);

  if (isStyle || first === "random") {
    const text = args.slice(1).join(" ");
    if (!text) return addLine(r("<mimic> " + first + " needs some text — mimic " + first + " {text}"));
    const fn = isStyle ? MIMIC_STYLES[first].fn : randomItem(Object.values(MIMIC_STYLES)).fn;
    addLine(r("<mimic> " + fn(text)));
    return;
  }

  const text = args.join(" ");
  addLine(r("<mimic> " + randomItem(Object.values(MIMIC_STYLES)).fn(text)));
}

/* roll — a bare number is one die (roll 20 = d20, default d6); dice
   notation is NdM with an optional +X / -X (roll 2d6, d20, 4d6+2). The
   streak counts consecutive successful rolls, reset by any other command
   in the shell dispatch — three in a row unlocks dnd_player. */
let rollStreak = 0;

/* lucky-roll lines — at most one extra line after a roll, by priority:
   a total of 37 > a second (or later) max roll in a row > a max roll > a
   minimum roll. "max" means every die on its top face, and only counts for
   a single die of d10 or bigger, or several dice of d4 or bigger, so common
   rolls (a d6, a coin-sized d2) don't talk constantly. rollMaxRun counts
   consecutive max rolls and is reset by any other command (see dispatch). */
let rollMaxRun = 0;
const ROLL_LINES = {
  thirtySeven: [
    "  37. the dice did not choose that. something chose it for them.",
    "  that's 37. it keeps landing in places that count.",
  ],
  maxAgain: [
    "  the maximum, twice in a row. the dice are paying attention to you.",
    "  twice in a row at the top. that isn't how luck is supposed to feel.",
  ],
  maxThird: [
    "  three in a row at the maximum. something is cheating, and it isn't you.",
    "  at this point it is a pattern, not a roll.",
  ],
  nat20:   ["  natural 20. the table goes quiet.", "  natural 20. somewhere a dungeon master sighs."],
  maxDie:  ["  the highest face there is. the terminal is impressed, briefly.", "  a perfect roll. don't get used to it."],
  allMax:  ["  every die at its maximum. that shouldn't happen on purpose.", "  all of them on top. the odds noticed."],
  nat1:    ["  natural 1. the dice had other plans.", "  a 1. somewhere a dungeon master is smiling."],
  minDie:  ["  the lowest face there is. the terminal pretends not to notice.", "  a 1. the dice are saving the good ones for later."],
  allOnes: ["  every die on 1. the odds are not on your side today.", "  all ones. that takes talent."],
};

function rollLuckyLine(rolls, sides, total) {
  const count = rolls.length;
  const meaningful = count > 1 ? sides >= 4 : sides >= 10;
  const isMax = meaningful && rolls.every(v => v === sides);
  const isMin = meaningful && rolls.every(v => v === 1);
  rollMaxRun = isMax ? rollMaxRun + 1 : 0;

  let pool = null;
  if (total === 37) pool = ROLL_LINES.thirtySeven;
  else if (isMax && rollMaxRun >= 3) pool = ROLL_LINES.maxThird;
  else if (isMax && rollMaxRun === 2) pool = ROLL_LINES.maxAgain;
  else if (isMax) pool = count > 1 ? ROLL_LINES.allMax : (sides === 20 ? ROLL_LINES.nat20 : ROLL_LINES.maxDie);
  else if (isMin) pool = count > 1 ? ROLL_LINES.allOnes : (sides === 20 ? ROLL_LINES.nat1 : ROLL_LINES.minDie);
  if (pool) addLine(r(randomItem(pool)));
}

function cmd_roll(args) {
  const first = (args[0] || "").toLowerCase();
  let expr = first;
  /* allow spaces around a modifier: roll 2d6 + 3 */
  if (first.includes("d") && args.length > 1 &&
      args.slice(1).every(a => /^[+\-]?\d*$/.test(a))) {
    expr = args.join("").toLowerCase();
  }

  const m = expr.match(/^(\d*)d(\d+)([+-]\d+)?$/);
  if (m) {
    const count = m[1] === "" ? 1 : parseInt(m[1], 10);
    const sides = parseInt(m[2], 10);
    const mod   = m[3] ? parseInt(m[3], 10) : 0;
    if (count < 1 || count > 20 || sides < 2 || sides > 1000 || Math.abs(mod) > 1000) {
      addLine(r("<roll> limits: 1-20 dice, 2-1000 sides, modifier up to ±1000"));
      return;
    }
    const rolls = [];
    for (let i = 0; i < count; i++) rolls.push(1 + Math.floor(Math.random() * sides));
    const total = rolls.reduce((a, b) => a + b, 0) + mod;
    const label = (count === 1 ? "" : count) + "d" + sides + (mod ? (mod > 0 ? "+" : "") + mod : "");
    if (count === 1 && !mod) {
      addLine(r("<roll> " + label + " → " + total));
    } else {
      const modText = mod ? " " + (mod > 0 ? "+ " : "- ") + Math.abs(mod) : "";
      addLine(r("<roll> " + label + " → [" + rolls.join(", ") + "]" + modText + " = " + total));
    }
    rollLuckyLine(rolls, sides, total);
  } else if (first.includes("d")) {
    addLine(r("<roll> usage: roll {sides}  or dice notation like 2d6, d20, 4d6+2"));
    return;
  } else {
    const sides = parseInt(args[0], 10);
    const d = (sides >= 2) ? sides : 6;
    const result = 1 + Math.floor(Math.random() * d);
    addLine(r("<roll> d" + d + " → " + result));
    rollLuckyLine([result], d, result);
  }

  rollStreak++;
  if (rollStreak >= 3) unlockAchievement("dnd_player");
}

const WT_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

/* lowercase, no accents, letters only: "São Paulo" -> "saopaulo" */
function wtNorm(s) {
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
}

/* wall-clock parts of an instant in a zone (tz null = this device's zone) */
function wtParts(date, tz) {
  if (!tz) {
    return { y: date.getFullYear(), mo: date.getMonth() + 1, d: date.getDate(), h: date.getHours(),
             mi: date.getMinutes(), s: date.getSeconds(), wd: date.toDateString().slice(0, 3) };
  }
  const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", weekday: "short",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const o = {};
  f.formatToParts(date).forEach(p => { o[p.type] = p.value; });
  return { y: +o.year, mo: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second, wd: o.weekday };
}

/* minutes east of UTC for a zone at an instant */
function wtOffsetMin(date, tz) {
  if (!tz) return -date.getTimezoneOffset();
  const p = wtParts(date, tz);
  const asUtc = Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s);
  return Math.round((asUtc - Math.floor(date.getTime() / 1000) * 1000) / 60000);
}
function wtOffsetText(min, prefix) {            /* "UTC+09:00" or, with prefix "", "+09:00" */
  const sign = min < 0 ? "-" : "+", a = Math.abs(min);
  return prefix + sign + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
}

/* "today" / "tomorrow" / "yesterday" relative to this device's date */
function wtDayNote(date, tz) {
  const z = wtParts(date, tz), l = wtParts(date, null);
  const diff = Math.round((Date.UTC(z.y, z.mo - 1, z.d) - Date.UTC(l.y, l.mo - 1, l.d)) / 86400000);
  return diff === 0 ? "" : diff > 0 ? " (tomorrow)" : " (yesterday)";
}

function wtPad(n) { return String(n).padStart(2, "0"); }
function wtDateText(p) { return p.wd + " " + WT_MONTHS[p.mo - 1] + " " + wtPad(p.d) + " " + p.y; }   /* same shape as toDateString */
function wtIsoDate(p) { return p.y + "-" + wtPad(p.mo) + "-" + wtPad(p.d); }

/* what the player asked for: iso flag + a place. returns { iso, zone } or { error } */
function wtParse(args) {
  let iso = false;
  const rest = [];
  args.forEach(a => { const t = String(a).toLowerCase(); if (t === "iso") iso = true; else rest.push(t); });
  const query = rest.join(" ").trim();
  if (!query || query === "local") return { iso: iso, zone: { tz: null, label: "" } };
  const q = wtNorm(query);
  /* names only: wtNorm drops digits and signs, so "utc+3" must not be mistaken for "utc" */
  if (!/[0-9+]/.test(query)) {
    if (["utc", "gmt", "z", "zulu"].includes(q)) return { iso: iso, zone: { tz: "UTC", label: "UTC", utc: true } };
    if (["cities", "world", "list", "all"].includes(q)) return { cities: true };
    const city = WORLD_CITIES.find(c => wtNorm(c.n) === q || (c.alias || []).includes(q));
    if (city) return { iso: iso, zone: { tz: city.tz, label: city.n } };
  }
  if (/\//.test(query)) {                         /* a zone name: America/Chicago */
    try {
      const f = new Intl.DateTimeFormat("en-US", { timeZone: query });
      return { iso: iso, zone: { tz: f.resolvedOptions().timeZone, label: f.resolvedOptions().timeZone } };
    } catch (e) { /* fall through */ }
  }
  const stem = q.slice(0, q.length >= 3 ? 3 : 2);
  const near = stem ? WORLD_CITIES.filter(c => wtNorm(c.n).indexOf(stem) === 0).map(c => c.n).slice(0, 4) : [];
  return { error: query, near: near };
}

function wtCityTable(cmd) {
  const now = new Date();
  addLine(r("<" + cmd + "> cities   (type " + cmd + " {city}, or " + cmd + " iso {city})"));
  addLine("  " + "city".padEnd(15) + "offset".padEnd(11) + (cmd === "time" ? "now" : "date"));
  addLine("  " + "─".repeat(46));
  WORLD_CITIES
    .map(c => ({ c: c, off: wtOffsetMin(now, c.tz) }))
    .sort((a, b) => a.off - b.off || a.c.n.localeCompare(b.c.n))
    .forEach(x => {
      const shown = cmd === "time"
        ? now.toLocaleTimeString(undefined, { timeZone: x.c.tz }) + wtDayNote(now, x.c.tz)
        : wtDateText(wtParts(now, x.c.tz));
      addLine("  " + x.c.n.padEnd(15) + wtOffsetText(x.off, "UTC").padEnd(11) + shown);
    });
}

function wtRun(cmd, args) {
  const p = wtParse(args);
  if (p.cities) return wtCityTable(cmd);
  if (p.error !== undefined) {
    addLine(r("<" + cmd + "> unknown place \"" + p.error + "\"" + (p.near.length ? ". did you mean: " + p.near.join(", ") + "?" : ".")));
    addLine("  try: " + cmd + " iso | " + cmd + " utc | " + cmd + " tokyo | " + cmd + " cities");
    return;
  }
  const now = new Date(), tz = p.zone.tz, label = p.zone.label;
  const parts = wtParts(now, tz);
  const note = tz ? wtDayNote(now, tz) : "";
  const where = label ? " — " + label + (p.zone.utc ? "" : " (" + wtOffsetText(wtOffsetMin(now, tz), "UTC") + ")") : "";
  let text;
  if (cmd === "date") {
    text = p.iso ? wtIsoDate(parts) : wtDateText(parts);
  } else if (p.iso) {
    const off = p.zone.utc ? "Z" : wtOffsetText(wtOffsetMin(now, tz), "");
    text = wtIsoDate(parts) + "T" + wtPad(parts.h) + ":" + wtPad(parts.mi) + ":" + wtPad(parts.s) + off;
  } else {
    text = now.toLocaleTimeString(undefined, tz ? { timeZone: tz } : undefined);
  }
  /* ISO already carries the offset and date, so it gets only the city name */
  const tail = (cmd === "time" && p.iso) ? (label && !p.zone.utc ? " — " + label : "") : where + note;
  addLine(r("<" + cmd + "> " + text + tail));
}

function cmd_time(args) {
  if (!args || !args.length) { addLine(r("<time> "+new Date().toLocaleTimeString())); return; }   /* bare time: unchanged */
  wtRun("time", args);
}

/* day-of-month of the nth (1-based) given weekday (0=Sun) in a month (1-12) */
function holNthWeekday(y, month, weekday, n) {
  const first = new Date(y, month - 1, 1).getDay();
  return 1 + ((weekday - first + 7) % 7) + (n - 1) * 7;
}
function holLastWeekday(y, month, weekday) {
  const last = new Date(y, month, 0).getDate();
  const lastWd = new Date(y, month - 1, last).getDay();
  return last - ((lastWd - weekday + 7) % 7);
}
function holEaster(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return [month, day];
}
function holAddDays(date, delta) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + delta, 12);
}

let _holCals = null;
function holCalendars() {
  if (_holCals) return _holCals;
  const mk = (loc, opts, calPrefix) => {
    try {
      const f = new Intl.DateTimeFormat(loc, opts);
      return f.resolvedOptions().calendar.indexOf(calPrefix) === 0 ? f : null;
    } catch (e) { return null; }
  };
  _holCals = {
    hebrew:  mk("en-u-ca-hebrew", { month: "long", day: "numeric" }, "hebrew"),
    islamic: mk("en-u-ca-islamic-umalqura", { month: "long", day: "numeric" }, "islamic"),
    chinese: mk("en-US-u-ca-chinese", { month: "numeric", day: "numeric" }, "chinese"),
  };
  return _holCals;
}
function holCalParts(fmt, date) {
  if (!fmt) return null;
  try {
    const p = fmt.formatToParts(date);
    const mo = p.find(x => x.type === "month"), da = p.find(x => x.type === "day");
    if (!mo || !da) return null;
    return { month: String(mo.value), day: parseInt(da.value, 10) };
  } catch (e) { return null; }
}

/* Lunar New Year [month, day] for a year. The browser's Chinese calendar is a
   day off in the years listed here (the new moon lands within minutes of
   midnight in China), so those are set by hand. Everything else comes from it. */
const HOL_LNY_FIX = { 2027: [2, 6], 2030: [2, 3] };
const _holLny = {};
function holLunarNewYear(y) {
  if (Object.prototype.hasOwnProperty.call(HOL_LNY_FIX, y)) return HOL_LNY_FIX[y];
  if (Object.prototype.hasOwnProperty.call(_holLny, y)) return _holLny[y];
  let found = null;
  const fmt = holCalendars().chinese;
  if (fmt) {
    for (let t = new Date(y, 0, 15, 12); t.getMonth() < 2 && !found; t = holAddDays(t, 1)) {
      const p = holCalParts(fmt, t);
      if (p && p.month === "1" && p.day === 1) found = [t.getMonth() + 1, t.getDate()];
    }
  }
  _holLny[y] = found;
  return found;
}

/* every holiday on a date (a Date at local noon) -> [{ id, note }] */
function holidayCheck(date) {
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate(), wd = date.getDay();
  const out = [];
  const add = (id, note) => out.push({ id: id, note: note || "" });

  /* fixed dates, and fixed runs of days (Kwanzaa, Day of the Dead) */
  for (const [fm, fd, id, len] of HOLIDAY_FIXED) {
    const span = len || 1;
    for (let k = 0; k < span; k++) {
      const c = holAddDays(date, -k);
      if (c.getMonth() + 1 === fm && c.getDate() === fd) {
        add(id, span > 1 ? "day " + (k + 1) + " of " + span : "");
        break;
      }
    }
  }

  /* weekday rules */
  if (m === 1  && wd === 1 && d === holNthWeekday(y, 1, 1, 3))  add("mlk");
  if (m === 2  && wd === 1 && d === holNthWeekday(y, 2, 1, 3))  add("presidents");
  if (m === 4  && wd === 5 && d === holLastWeekday(y, 4, 5))    add("arborday");
  if (m === 5  && wd === 0 && d === holNthWeekday(y, 5, 0, 2))  add("mothers");
  if (m === 5  && wd === 1 && d === holLastWeekday(y, 5, 1))    add("memorial");
  if (m === 6  && wd === 0 && d === holNthWeekday(y, 6, 0, 3))  add("fathers");
  if (m === 7  && wd === 5 && d === holLastWeekday(y, 7, 5))    add("sysadmin");
  if (m === 9  && wd === 1 && d === holNthWeekday(y, 9, 1, 1))  add("labor");
  if (m === 10 && wd === 1 && d === holNthWeekday(y, 10, 1, 2)) add("indigenous");
  if (m === 10 && wd === 2 && d === holNthWeekday(y, 10, 2, 2)) add("ada");
  if (m === 11 && wd === 4 && d === holNthWeekday(y, 11, 4, 4)) add("thanksgiving");
  if (wd === 5 && d === 13) add("friday13");
  if (m === 1  && wd === 1 && d === holLastWeekday(y, 1, 1))    add("bubblewrap");
  if (m === 3  && wd === 1 && d === holNthWeekday(y, 3, 0, 2) + 1) add("napping");  /* Monday after the 2nd Sunday */
  if (m === 5  && wd === 4 && d === holNthWeekday(y, 5, 4, 1))  add("password");
  if (m === 6  && wd === 5 && d === holNthWeekday(y, 6, 5, 1))  add("donut");
  if (m === 7  && wd === 0 && d === holNthWeekday(y, 7, 0, 3))  add("icecream");

  /* day 256 of the year */
  const doy = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 0)) / 86400000);
  if (doy === 256) add("programmer");

  /* Easter and the days counted from it */
  const [em, ed] = holEaster(y);
  const fromEaster = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y, em - 1, ed)) / 86400000);
  if (fromEaster === -47) add("mardigras");
  if (fromEaster === -2)  add("goodfriday");
  if (fromEaster === 0)   add("easter");

  /* calendars the browser provides */
  const cal = holCalendars();
  const lny = holLunarNewYear(y);
  if (lny) {
    if (m === lny[0] && d === lny[1]) add("lunarny");
    const lf = new Date(y, lny[0] - 1, lny[1] + 14, 12);   /* Lantern Festival: 15th day */
    if (m === lf.getMonth() + 1 && d === lf.getDate()) add("lanternfest");
  }
  const ch = holCalParts(cal.chinese, date);
  if (ch && ch.month === "8" && ch.day === 15) add("midautumn");

  const he = holCalParts(cal.hebrew, date);
  if (he) {
    const hm = he.month.toLowerCase();
    if (/^tishr/.test(hm) && he.day <= 2)  add("roshhashanah", "day " + he.day + " of 2");
    if (/^tishr/.test(hm) && he.day === 10) add("yomkippur");
    if (/^nisan/.test(hm) && he.day >= 15 && he.day <= 22) add("passover", "day " + (he.day - 14) + " of 8");
    if (/^adar( ii)?$/.test(hm) && he.day === 14) add("purim");
    if (/^(kislev|tevet)/.test(hm)) {
      for (let k = 0; k < 8; k++) {
        const hk = holCalParts(cal.hebrew, holAddDays(date, -k));
        if (hk && /^kislev/i.test(hk.month) && hk.day === 25) { add("hanukkah", "night " + (k + 1) + " of 8"); break; }
      }
    }
  }

  const is = holCalParts(cal.islamic, date);
  if (is) {
    const im = is.month.toLowerCase();
    if (/^muharram/.test(im) && is.day === 1) add("islamicny");
    if (/^ramadan/.test(im)) add("ramadan", "day " + is.day);
    if (/^shaww?al/.test(im) && is.day === 1) add("eidfitr");
    if (/hijjah/.test(im) && is.day === 10) add("eidadha");
  }
  return out;
}

function holDateLabel(date) {
  return date.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

function holPrintOne(entry) {
  const h = HOLIDAYS[entry.id];
  addLine("");
  addLine(r("  " + h.n.toUpperCase() + (entry.note ? "   (" + entry.note + ")" : "")));
  addLine("");
  HOLIDAY_ART[h.art].forEach(l => addLine("    " + l));
  addLine("");
  h.d.forEach(l => addLine("  " + l));
}

function cmd_holiday(args) {
  const arg = args.join(" ").trim();
  const now = new Date();
  let date = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
  let custom = false;

  if (arg) {
    const m = arg.match(/^(?:(\d{4})[-\/.])?(\d{1,2})[-\/.](\d{1,2})$/);
    if (!m) {
      addLine(r("<holiday> usage: holiday          — is today a holiday?"));
      addLine("                    holiday MM-DD    — check another day this year");
      addLine("                    holiday YYYY-MM-DD");
      return;
    }
    const yy = m[1] ? parseInt(m[1], 10) : now.getFullYear();
    const mm = parseInt(m[2], 10), dd = parseInt(m[3], 10);
    const test = new Date(yy, mm - 1, dd, 12);
    if (test.getFullYear() !== yy || test.getMonth() !== mm - 1 || test.getDate() !== dd) {
      addLine(r("<holiday> that isn't a real date."));
      return;
    }
    date = test;
    custom = true;
  }

  const list = holidayCheck(date);
  addLine(r("<holiday> " + holDateLabel(date)));

  if (list.length) {
    const shown = list.slice(0, 3);
    shown.forEach(holPrintOne);
    if (list.length > shown.length) {
      addLine("");
      addLine("  also " + (custom ? "that day: " : "today: ") +
              list.slice(3).map(e => HOLIDAYS[e.id].n).join(", "));
    }
    return;
  }

  addLine("  " + (custom ? "no holiday that day." : "no holiday today."));
  for (let i = 1; i <= 400; i++) {
    const nd = holAddDays(date, i);
    const nl = holidayCheck(nd);
    if (nl.length) {
      const when = i === 1 ? "tomorrow" : "in " + i + " days";
      addLine("  next up: " + HOLIDAYS[nl[0].id].n + " — " + when);
      addLine("           (" + holDateLabel(nd) + ")");
      return;
    }
  }
}

  /* real seconds since this page loaded (sessionStart is set once, never reset) */
  const s = Math.floor((Date.now() - sessionStart) / 1000);
  addLine(r("<uptime> " + s + "s"));

  if (Math.random() < 0.1) {
    addLine(r("  earliest uptime log on file predates this session by"));
    addLine(r("  weeks. see: predawn_notes.txt"));

  const realElapsedMs = Date.now() - sessionStart;
  if (realElapsedMs >= LONG_SESSION_MS && !longSessionClaimed && !longSessionTracked) {
    longSessionTracked = true;

    addLine(r("  something else. driftclock would know before uptime does."));

}

function cmd_ascii(args = []) {
  const name = (args[0] || "").toLowerCase();

  if (!name) {
    addLine(r("<ascii> usage: ascii {image}"));
    addLine(r("  displays an ascii image."));
    addLine(r("  available images:"));
    const names = Object.keys(ASCII_IMAGES);
    const mid = Math.ceil(names.length / 2);
    const col1 = names.slice(0, mid), col2 = names.slice(mid);
    for (let i = 0; i < col1.length; i++) {
      const left = "    " + col1[i].padEnd(14);
      const right = col2[i] ? col2[i] : "";
      addLine(left + right);
    }
    return;
  }

  const art = hasOwn(ASCII_IMAGES, name) ? ASCII_IMAGES[name] : null;
  if (!art) {
    addLine(r("<ascii> unknown image: " + name));
    addLine(r("  available images: " + Object.keys(ASCII_IMAGES).join(", ")));
    addLine(r("  type 'ascii' with no arguments to see them in a list."));
    return;
  }

  addLine(r("<ascii> " + name));
  for (const line of art) addLine(line);
}

function cmd_lock(args) {
  const pass = args.join(" ").trim();
  if (!pass) { addLine(r("<lock> usage: lock {password}")); return; }
  termLocked   = true;
  termLockPass = pass;

  /* stop dream timer while locked */
  if (dreamIdleTimer)  clearTimeout(dreamIdleTimer);
  if (dreamIntervalId) clearInterval(dreamIntervalId);
  dreamIdleTimer   = null;
  dreamIntervalId  = null;
  dreamActive      = false;

  /* wrap ALL existing screen children (including the frozen lock line) in a hidden veil */
  const veil = document.createElement("div");
  veil.id = "lock-veil";
  veil.style.display = "none";
  while (screen.firstChild) veil.appendChild(screen.firstChild);
  screen.appendChild(veil);

  addLine(r("<lock> terminal locked. type: unlock {password}"));
}

function cmd_unlock(args) {
  const pass = args.join(" ").trim();
  if (pass === termLockPass) {
    termLocked   = false;
    termLockPass = "";

    /* restore hidden history */
    const veil = document.getElementById("lock-veil");
    if (veil) {
      while (veil.firstChild) screen.insertBefore(veil.firstChild, veil);
      veil.remove();
    }

    addLine(r("<unlock> terminal unlocked."));
    resetIdleTimer();
  } else {
    addLine(r("<unlock> incorrect password."));
  }
}
