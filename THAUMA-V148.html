/* ── imported fonts ─────────────────────────────────────────────────
   "ttheme import" loads a .ttf/.otf/.woff/.woff2 from disk, registers it with
   the browser (FontFace) and remembers it in IndexedDB, which has room for
   fonts that would overflow localStorage. Importing under a built-in name
   (ttheme import consolas) makes that built-in use your copy. */
let ttImported = {};            /* name -> { face, bytes } */
let ttRestored = false;
const TTF_DB = "terminal_fonts_v1";
const ttFamily = name => "Thauma Import " + name;

function ttDb() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("no indexedDB"));
    const q = indexedDB.open(TTF_DB, 1);
    q.onupgradeneeded = () => q.result.createObjectStore("fonts", { keyPath: "name" });
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function ttDbRun(mode, make) {
  return ttDb().then(db => new Promise((res, rej) => {
    const tx = db.transaction("fonts", mode);
    const req = make(tx.objectStore("fonts"));
    tx.oncomplete = () => { db.close(); res(req ? req.result : undefined); };
    tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
  }));
}
const ttDbPut    = rec  => ttDbRun("readwrite", st => st.put(rec));
const ttDbDelete = name => ttDbRun("readwrite", st => st.delete(name));
const ttDbAll    = ()   => ttDbRun("readonly",  st => st.getAll());

function ttReadFile(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsArrayBuffer(file);
  });
}
async function ttRegister(name, buf) {
  const face = new FontFace(ttFamily(name), buf.slice(0));
  await face.load();
  document.fonts.add(face);
  const old = ttImported[name];
  if (old && old.face) document.fonts.delete(old.face);
  ttImported[name] = { face: face, bytes: buf.byteLength };
}
function ttRestoreImports() {
  if (ttRestored) return;
  ttRestored = true;
  ttDbAll().then(rows => {
    for (const row of (rows || [])) ttRegister(row.name, row.data).catch(() => {});
  }).catch(() => {});
}

function ttCurrent() {
  try { return JSON.parse(localStorage.getItem(TTHEME_KEY)) || null; } catch (e) { return null; }
}
function ttApply(stack) {
  document.documentElement.style.setProperty("--font-family", stack);
}
function ttLoad() {
  if (!finalUnlocked) return;
  const c = ttCurrent();
  if (c && c.stack) ttApply(c.stack);
  ttRestoreImports();
}
function ttSave(name, stack) {
  try { localStorage.setItem(TTHEME_KEY, JSON.stringify({ name: name, stack: stack })); } catch (e) {}
}
/* the stack for a built-in: an imported copy of the same name goes first */
function ttStackFor(f) {
  return ttImported[f.key] ? '"' + ttFamily(f.key) + '", ' + f.stack : f.stack;
}
function ttImportedStack(name) { return '"' + ttFamily(name) + '", monospace'; }

/* true / false, or null when the browser can't measure text */
function ttInstalled(name) {
  try {
    const cx = document.createElement("canvas").getContext("2d");
    if (!cx) return null;
    const probe = "mmmmmmmmmmlli 0O#@WwiI";
    for (const base of ["monospace", "serif", "sans-serif"]) {
      cx.font = "64px " + base;
      const a = cx.measureText(probe).width;
      cx.font = '64px "' + name + '", ' + base;
      if (cx.measureText(probe).width !== a) return true;
    }
    return false;
  } catch (e) { return null; }
}

/* import a font file the operator picked */
async function ttImportFile(file, nameArg) {
  const name = (nameArg || file.name.replace(/\.[^.]*$/, ""))
    .toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9_-]+/g, "").replace(/^-+|-+$/g, "").slice(0, 24);
  if (!name) { addLine(r("<ttheme> couldn't make a name from that file. try: ttheme import {name}")); return; }
  if (!ttImported[name] && Object.keys(ttImported).length >= TTHEME_MAX_IMPORTS) {
    addLine(r("<ttheme> " + TTHEME_MAX_IMPORTS + " imported fonts already. ttheme remove {name} first."));
    return;
  }
  if (file.size > TTHEME_MAX_BYTES) { addLine(r("<ttheme> that file is over 4 MB. fonts that large aren't supported here.")); return; }
  let buf;
  try { buf = await ttReadFile(file); } catch (e) { addLine(r("<ttheme> couldn't read that file.")); return; }
  try { await ttRegister(name, buf); }
  catch (e) { addLine(r("<ttheme> that doesn't look like a valid font file (.ttf .otf .woff .woff2).")); return; }
  let kept = true;
  try { await ttDbPut({ name: name, data: buf, size: buf.byteLength, added: Date.now() }); } catch (e) { kept = false; }
  addLine(r("<ttheme> imported \"" + name + "\" (" + Math.max(1, Math.round(buf.byteLength / 1024)) + " KB) — ttheme " + name + " to apply it."));
  const builtin = TTHEME_FONTS.find(f => f.key === name);
  if (builtin) addLine("  that is a built-in name, so " + name + " now uses your copy.");
  if (!kept) addLine("  this browser won't remember it after a reload (storage unavailable).");
  /* if it replaces the font that's already applied, refresh the applied stack */
  const cur = ttCurrent();
  if (cur && cur.name === name) {
    const stack = builtin ? ttStackFor(builtin) : ttImportedStack(name);
    ttApply(stack); ttSave(name, stack);
  }
}

function ttPickFont(nameArg) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2";
  input.style.display = "none";
  document.body.appendChild(input);
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    input.remove();
    if (file) ttImportFile(file, nameArg); else addLine(r("<ttheme> import cancelled."));
  });
  input.addEventListener("cancel", () => { input.remove(); addLine(r("<ttheme> import cancelled.")); });
  addLine(r("<ttheme> choose a font file (.ttf .otf .woff .woff2)…"));
  input.click();
}

/* which built-in typefaces have been applied at least once (for the Typographer achievement) */
function ttMarkUsed(key) {
  let used = [];
  try { used = JSON.parse(localStorage.getItem(TTHEME_USED_KEY)) || []; } catch (e) {}
  if (!used.includes(key)) {
    used.push(key);
    try { localStorage.setItem(TTHEME_USED_KEY, JSON.stringify(used)); } catch (e) {}
  }
  if (TTHEME_FONTS.every(f => used.includes(f.key))) unlockAchievement("font_collector");
}

/* an unreadable typeface waits for a Y/N before it is applied (see processInput) */
let ttPending = null;

function ttApplyPreset(preset, confirmed) {
  const fake = preset.kind === "licensed" && !ttImported[preset.key] && ttInstalled(preset.sys) === false;
  if (preset.unreadable && !confirmed) {
    ttPending = { preset: preset };
    addLine(r("<ttheme> " + preset.key + " makes everything unreadable, including this line once it is on."));
    addLine("  ttheme reset undoes it. type it blind; it works.");
    addLine(r("<ttheme> apply it anyway? [Y/N]"));
    return;
  }
  const stack = ttStackFor(preset);
  ttApply(stack);
  ttSave(preset.key, stack);
  addLine(r("<ttheme> typeface → " + preset.key));
  if (fake) {
    addLine("  " + preset.sys + " isn't installed here, so this is " + preset.look + ", an open look-alike.");
    addLine("  to use your own copy:  ttheme import " + preset.key);
  }
  if (!preset.mono && !preset.unreadable) addLine("  ~ proportional — banners and bars will bend. ttheme reset puts it back.");
  ttMarkUsed(preset.key);
}

/* ttheme  ·  ttheme {font}  ·  ttheme import [name]  ·  ttheme remove {name}  ·  ttheme reset */
function cmd_ttheme(args) {
  const cur = ttCurrent();

  if (!args.length) {
    const curKey = cur ? cur.name : "consolas";
    addLine(r("<ttheme> typefaces — ttheme {name} to apply  ·  ttheme import to add your own  ·  ttheme reset"));
    addLine("────────────────────────────────────────");
    for (const f of TTHEME_FONTS) {
      const on = (f.key === curKey);
      const tags = (f.mono ? "" : " ~") + (f.kind === "licensed" ? " *" : "") + (f.kind === "bundled" ? " ·" : "") + (f.unreadable ? " !" : "");
      const fam = ttStackFor(f).replace(/"/g, "'");
      if (f.unreadable) {
        /* its own name would be unreadable, so print the name plainly and show a sample */
        addLineHTML((on ? "► " : "  ") + f.key + tags + '  <span style="font-family:' + fam + '">Sample 123</span>  — ' + f.desc);
      } else {
        addLineHTML('<span style="font-family:' + fam + '">' + (on ? "► " : "  ") + f.key + tags + '</span>  — ' + f.desc);
      }
    }
    for (const name of Object.keys(ttImported)) {
      const on = (name === curKey);
      addLineHTML('<span style="font-family:' + ttImportedStack(name).replace(/"/g, "'") + '">' +
                  (on ? "► " : "  ") + name + ' ⇩</span>  — imported, ' + Math.max(1, Math.round(ttImported[name].bytes / 1024)) + ' KB.');
    }
    addLine("────────────────────────────────────────");
    addLine("  ~ proportional — banners and bars will bend.    · bundled in this file.");
    addLine("  * a Microsoft face that can't be bundled: your installed copy is used when there is one.");
    addLine("    consolas, comic-sans, verdana and wingdings fall back to an open look-alike.");
    addLine("  ! unreadable on purpose — asks first. ttheme reset undoes it, and works typed blind.");
    addLine("  ⇩ imported from a file on this device.");
    addLine("  ttheme import [name]   load your own .ttf/.otf/.woff/.woff2 — e.g. ttheme import wingdings");
    addLine("  ttheme remove {name}   forget an imported font      any installed font name also works");
    return;
  }

  const want = args.join(" ").trim();
  const norm = want.toLowerCase().replace(/\s+/g, "-");

  if (norm === "reset") {
    try { localStorage.removeItem(TTHEME_KEY); } catch (e) {}
    ttApply(TTHEME_DEFAULT_STACK);
    addLine(r("<ttheme> typeface restored to consolas."));
    return;
  }

  if (args[0].toLowerCase() === "import") {
    const rest = args.slice(1).join(" ").trim();
    ttPickFont((!rest || rest.toLowerCase() === "ttf") ? "" : rest);
    return;
  }

  if (args[0].toLowerCase() === "remove") {
    const name = args.slice(1).join(" ").trim().toLowerCase().replace(/\s+/g, "-");
    if (!name) { addLine(r("<ttheme> usage: ttheme remove {name}")); return; }
    const hit = ttImported[name];
    if (!hit) { addLine(r("<ttheme> no imported font called \"" + name + "\". ttheme lists them.")); return; }
    if (hit.face) document.fonts.delete(hit.face);
    delete ttImported[name];
    ttDbDelete(name).catch(() => {});
    addLine(r("<ttheme> removed \"" + name + "\"."));
    const c = ttCurrent();
    if (c && c.name === name) {
      const builtin = TTHEME_FONTS.find(f => f.key === name);
      if (builtin) { const st = ttStackFor(builtin); ttApply(st); ttSave(builtin.key, st); }
      else { try { localStorage.removeItem(TTHEME_KEY); } catch (e) {} ttApply(TTHEME_DEFAULT_STACK); addLine("  it was in use, so the typeface went back to consolas."); }
    }
    return;
  }

  const preset = TTHEME_FONTS.find(f => f.key === norm);
  if (preset) { ttApplyPreset(preset, false); return; }

  if (ttImported[norm]) {
    const stack = ttImportedStack(norm);
    ttApply(stack);
    ttSave(norm, stack);
    addLine(r("<ttheme> typeface → " + norm + " (imported)"));
    return;
  }

  if (!/^[A-Za-z0-9 ._-]{1,40}$/.test(want)) {
    addLine(r("<ttheme> that isn't a font name. ttheme lists the built-in set."));
    return;
  }
  if (ttInstalled(want) === false) {
    addLine(r("<ttheme> \"" + want + "\" isn't installed on this machine. ttheme lists the built-in set, or ttheme import adds your own file."));
    return;
  }
  const stack = '"' + want + '", monospace';
  ttApply(stack);
  ttSave(want, stack);
  addLine(r("<ttheme> typeface → " + want));
}

document.addEventListener("click", ()=>{ if(!locked) hidden.focus(); });

hidden.addEventListener("keydown", e=>{
  if(locked) return;

  /* any keypress resets idle / dream timer */
  resetIdleTimer();

  /* Escape — stop everything that is running: chains, repeats, waits,
     looping bindings and every bgrun watch */
  if (e.key === "Escape") { e.preventDefault(); stopAll(); return; }

  /* ── Tab completion ────────────────────────────────────────────── */
  if (e.key === "Tab") {
    e.preventDefault();
    const val   = hidden.value;
    /* only complete first token, no spaces yet */
    if (!val || val.includes(" ")) return;
    const lower = val.toLowerCase();
    const eligible = ALL_SHELL_CMDS.filter(c =>
      c.startsWith(lower) && (cmdUsage[c] || 0) >= 1
    );
    if (eligible.length === 0) return;        /* no match */
    if (eligible.length === 1) {
      /* single match — complete it */
      hidden.value = eligible[0];
      syncVisible();
    } else {
      /* multiple matches — show options without altering input */
      addLine("  " + eligible.join("   "));
    }
    return;
  }

  if(e.key==="Enter"){
    e.preventDefault();
    const promptRow = currentPromptDiv;   /* grab the live row before commitLine disowns it */
    const input=commitLine();
    if(input.trim()){ history.push(input); historyIndex=history.length; }
    /* "inv" prefix — erase the line the command was typed on */
    if (hasInvPrefix(input) && promptRow && promptRow.parentNode) promptRow.remove();
    processInput(input);
    if(!locked) newPrompt();
    return;
  }

  if(e.key==="ArrowUp"){
    e.preventDefault();
    if(history.length){ historyIndex=Math.max(0,historyIndex-1); hidden.value=history[historyIndex]||""; syncVisible(); }
    return;
  }

  if(e.key==="ArrowDown"){
    e.preventDefault();
    if(history.length){
      historyIndex=Math.min(history.length,historyIndex+1);
      hidden.value=historyIndex>=history.length?"":history[historyIndex]||"";
      syncVisible();
    }
    return;
  }

  if(e.key==="ArrowLeft" || e.key==="ArrowRight"){
    /* let the browser move selectionStart/End, then sync the visual split */
    requestAnimationFrame(syncVisible);
    return;
  }

  requestAnimationFrame(syncVisible);
});

/* also sync on input event to catch mobile soft-keyboard and paste */
hidden.addEventListener("input", ()=>{
  resetIdleTimer();
  syncVisible();
});

/* sync on selectionchange so Home/End/click-repositioning moves the visual caret */
document.addEventListener("selectionchange", ()=>{
  if (document.activeElement === hidden) syncVisible();
});

   ================================================================ */
function init(){
  loadAchievements();
  loadAchievementOrder();
  loadMailState();
  loadChainState();
  loadJobState();
  loadProfilePrefix();
  loadCursorSkin();
  loadCrtState();
  loadVignetteState();
  loadSavedThemes();
  loadCmdUsage();
  loadIndexDiscovery();
  loadIndexCategoryRevealed();
  loadChmodState();
  loadRecoveredFiles();
  loadPlayedFiles();
  loadBindings();
  loadGraveyardDiscovered();
  loadGraveyardReruns();
  loadRecursiveEvents();
  loadWeatherState();
  loadCastCollection();
  loadDreamsSeen();
  try { longSessionClaimed = localStorage.getItem(LONG_SESSION_CLAIMED_KEY) === "1"; } catch(e) {}
  initReturnCount();
  rearmDeliveryTimers();

  /* load saved theme — terminal_active_color is the canonical key, applied below */
  try {
    const savedTheme = localStorage.getItem("terminal_theme");
    const themes={green:"#00ff00",amber:"#ffbf00",cyan:"#00ffff",magenta:"#ff00ff",white:"#ffffff"};
    if (savedTheme && themes[savedTheme] && !localStorage.getItem("terminal_active_color")) {
      document.documentElement.style.setProperty("--fg", themes[savedTheme]);
    }
  } catch(e) {}

  /* restore active job theme (overrides built-in if set) */
  if (jobActiveTheme) jobApplyTheme(jobActiveTheme);

  /* restore the colorize text theme — only if that style is still unlocked (free, bought, or every achievement).
     older saves stored "1" here, which meant rainbow. */
  try {
    const savedColorTheme = localStorage.getItem(RAINBOW_THEME_KEY);
    if (savedColorTheme) {
      const name = savedColorTheme === "1" ? "rainbow" : savedColorTheme;
      if (Object.prototype.hasOwnProperty.call(COLORIZE_STYLES, name) && colorizeStyleUnlocked(name)) colorThemeName = name;
    }
  } catch(e) {}

  /* cursor skin is applied per-caret in newPrompt — nothing to do here */

  /* terminal_active_color is the single source of truth for color — always applied last */
  try {
    const saved = localStorage.getItem("terminal_active_color");
    if (saved) document.documentElement.style.setProperty("--fg", saved);
  } catch(e) {}

  /* apply background theme */
  if (activeBtheme && BUILTIN_BTHEMES[activeBtheme]) {
    document.documentElement.style.setProperty("--bg", BUILTIN_BTHEMES[activeBtheme]);
  } else if (activeBtheme && JOB_THEMES.find(t => t.id === activeBtheme && t.color)) {
    const bthemeColor = JOB_THEMES.find(t => t.id === activeBtheme && t.color).color;
    document.documentElement.style.setProperty("--bg", bthemeColor);
  } else {
    /* default to black if btheme is not set or invalid */
    document.documentElement.style.setProperty("--bg", BUILTIN_BTHEMES.black);
  }
  try {
    const savedPattern = localStorage.getItem(BTHEME_PATTERN_KEY);
    if (savedPattern && hasOwn(BTHEME_PATTERNS, savedPattern) && bthemePatternUnlocked(savedPattern)) {
      bthemeApplyPattern(savedPattern, true);
    }
  } catch(e) {}

  try {
    const savedSize = localStorage.getItem("terminal_textsize");
    if (savedSize) {
      const parsedSize = parseInt(savedSize, 10);
      if (parsedSize >= 10 && parsedSize <= 40) {
        document.documentElement.style.setProperty("--font-size", parsedSize + "px");
      }
    }
  } catch(e) {}

  addLine(""); addLine(""); addLine("");

  /* dynamic boot message based on return count and clock hour */
  (function() {
    const hour = new Date().getHours();
    const returnCount = (() => {
      try { return parseInt(localStorage.getItem("terminal_return_count") || "1", 10); } catch(e) { return 1; }
    })();

    let timeLine = "";
    if      (hour >= 0  && hour < 5)  timeLine = "it is very late. or very early. the terminal does not distinguish.";
    else if (hour >= 5  && hour < 8)  timeLine = "you are up before most. the terminal approves.";
    else if (hour >= 8  && hour < 12) timeLine = "morning. a reasonable time to begin.";
    else if (hour >= 12 && hour < 14) timeLine = "midday. the terminal has been awake longer.";
    else if (hour >= 14 && hour < 17) timeLine = "afternoon. the session count continues to climb.";
    else if (hour >= 17 && hour < 20) timeLine = "evening. the terminal waited.";
    else if (hour >= 20 && hour < 22) timeLine = "getting late. the terminal is more alert at night.";
    else if (hour >= 22)              timeLine = "you should be sleeping. the terminal kept you awake.";

    let returnLine = "";
    if      (returnCount === 1)  returnLine = "first session initialised.";
    else if (returnCount === 2)  returnLine = "welcome back. the terminal remembered.";
    else if (returnCount < 5)    returnLine = "session " + returnCount + ". the pattern is forming.";
    else if (returnCount < 10)   returnLine = "session " + returnCount + ". you keep returning. the terminal has noted this.";
    else if (returnCount < 25)   returnLine = "session " + returnCount + ". the substrate recognises the operator.";
    else                         returnLine = "session " + returnCount + ". " + corrupt("you were expected.");

    addLine("<boot> {terminal ready}");
    addLine("  " + timeLine);
    addLine("  " + returnLine);
    if (returnCount <= 10) {
      addLine("  new here? type tutorial for a guided walkthrough.");
    }
  })();

  addLine("");
  addLine("type <help> for commands.");
  addLine("");
  cmd_index();
  newPrompt();
  applyCrtEffect();
  applyVignetteEffect();
  hidden.focus();

  /* track session time for time_30min achievement */
  const startTime=Date.now();
  const timerId=setInterval(()=>{
    if((Date.now()-startTime)/60000>=30){
      unlockAchievement("time_30min");
      clearInterval(timerId);
    }
  },60000);


  /* start idle timer for dream logs */
  resetIdleTimer();
}

init();
</script>
