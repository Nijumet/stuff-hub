  try { localStorage.setItem(INDEX_DISCOVERY_KEY, JSON.stringify(indexDiscovered)); } catch(e) {}
}

/* Call on every committed command to record first-ever discovery */
/* only real commands (shell list + hidden chain directives) count toward the index */
function indexIsTrackable(cmd) {
  if (cmd === "ttheme" && !finalUnlocked) return false;
  return ALL_SHELL_CMDS.includes(cmd) || THAUMA_CHAIN.includes(cmd);
}

function indexTrackDiscovery(cmd) {
  if (!cmd || !indexIsTrackable(cmd)) return;
  if (!indexDiscovered[cmd]) {
    indexDiscovered[cmd] = true;
    saveIndexDiscovery();
  }
}

/* never let a category report more than 100% */
for (const k of Object.keys(INDEX_DATA)) {
  const origGet = INDEX_DATA[k].get;
  INDEX_DATA[k].get = function() {
    const d = origGet.call(this);
    if (typeof d.total === "number" && d.found > d.total) d.found = d.total;
    return d;
  };
}

/* ── Render helpers ─────────────────────────────────────────── */

function indexBar(found, total) {
  if (total === null || total === 0) return "";
  const filled = Math.min(10, Math.max(0, Math.round((found / total) * 10)));
  return "[" + "█".repeat(filled) + "░".repeat(10 - filled) + "]";
}

function indexPct(found, total) {
  if (total === null || total === 0) return "";
  return Math.round((found / total) * 100) + "%";
}

/* Rare corruption: 8% chance a line is scrambled */
function indexMaybeCorrupt(str) {
  if (Math.random() < 0.08) {
    return str.split("").map(c => Math.random() < 0.35
      ? "░▒▓█"[Math.floor(Math.random()*4)]
      : c
    ).join("");
  }
  return str;
}

/* ── Awareness rating derived from overall discovery ─────────── */
function indexAwarenessRating(revealedCategories) {
  const totalFound  = revealedCategories.reduce((s, c) => {
    const d = INDEX_DATA[c].get();
    return s + (d.found || 0);
  }, 0);
  const totalMax = revealedCategories.reduce((s, c) => {
    const d = INDEX_DATA[c].get();
    return s + (d.total || 0);
  }, 0);
  if (totalMax === 0) return "dormant";
  const pct = totalFound / totalMax;
  if (pct < 0.10) return "minimal";
  if (pct < 0.25) return "emerging";
  if (pct < 0.45) return "aware";
  if (pct < 0.65) return "attuned";
  if (pct < 0.85) return "resonant";
  return "fully coupled";
}

/* ── Session integrity (cosmetic) ───────────────────────────── */
function indexSessionIntegrity() {
  /* Degrades slightly with drift and increases with discoveries */
  const base = 97;
  const drift_penalty = Math.min(15, Math.floor(driftValue / 10));
  const disc_bonus    = Math.min(8, Object.keys(indexDiscovered).length);
  return Math.max(71, Math.min(100, base - drift_penalty + disc_bonus));
}

/* ── Main command ───────────────────────────────────────────── */
function cmd_index() {
  const DIVIDER = "══════════════════════════════════════";
  const integrity = indexSessionIntegrity();

  addLine(DIVIDER);
  addLine("  THAUMA DISCOVERY INDEX");
  addLine("  session integrity: " + integrity + "%");
  addLine("  thauma awareness : " + indexAwarenessRating(Object.keys(INDEX_DATA).filter(k => k !== "_unknown")));
  addLine("");

  const categoryKeys = Object.keys(INDEX_DATA).filter(k => k !== "_unknown");

  /* Build each category's display data once, so it can be laid out
     either as one wide column (with its atmospheric note) or as a
     compact two-column grid (label + progress only, no note — the
     note text is long enough that keeping it would make the grid
     columns wildly uneven). */
  const entries = [];
  for (const key of categoryKeys) {
    const cat = INDEX_DATA[key];
    if (!cat.reveal()) continue;

    const data           = cat.get();
    const isZeroProgress = data.found === 0 && !indexCategoryRevealed[key];
    const displayLabel   = isZeroProgress ? "[UNKNOWN]" : cat.label;
    const classTag       = cat.classify ? "  " + cat.classify : "";
    const headerLine     = displayLabel + classTag;

    let progressLine;
    if (data.total === null) {
      progressLine = data.found + " units logged";
    } else {
      const bar  = indexBar(data.found, data.total);
      const pct  = indexPct(data.found, data.total);
      const frac = data.found + "/" + data.total;
      progressLine = frac.padEnd(8) + bar + "  " + pct;
    }

    entries.push({
      header:   headerLine,
      progress: progressLine,
      note:     (cat.note && !isZeroProgress) ? cat.note : null,
    });
  }

  const LEFT_INDENT = "  ";
  const COL_GAP     = " │ ";

  /* compact-grid cell width: widest of every header/progress line,
     so the second column starts at the exact same offset on every
     row — no jagged edges regardless of how short/long a given
     entry's text happens to be */
  const cellContentWidth = Math.max(
    ...entries.map(e => e.header.length),
    ...entries.map(e => e.progress.length)
  );
  const colWidth    = LEFT_INDENT.length + cellContentWidth;
  const gridWidth   = colWidth + COL_GAP.length + colWidth;
  const termCols    = bannerGetMaxCols();
  const useTwoCols  = termCols >= gridWidth;

  if (!useTwoCols) {
    /* narrow terminal — fall back to the original single-column
       layout, notes included */
    for (const e of entries) {
      addLine(LEFT_INDENT + e.header);
      if (e.note) addLine(LEFT_INDENT + "· " + e.note);
      addLine(LEFT_INDENT + e.progress);
      addLine("");
    }
  } else {
    for (let i = 0; i < entries.length; i += 2) {
      const left  = entries[i];
      const right = entries[i + 1] || null;

      const leftHeader = LEFT_INDENT + left.header;
      if (right) {
        addLine(leftHeader.padEnd(colWidth) + COL_GAP + LEFT_INDENT + right.header);
      } else {
        addLine(leftHeader);
      }

      const leftProgress = LEFT_INDENT + left.progress;
      if (right) {
        addLine(leftProgress.padEnd(colWidth) + COL_GAP + LEFT_INDENT + right.progress);
      } else {
        addLine(leftProgress);
      }

      addLine("");
    }
  }

  addLine(DIVIDER);
}

/* keys — list all terminal localStorage keys with byte sizes */
function cmd_keys() {
  /* THAUMASAVE_KEYS is the single source of truth for "every key the
     terminal saves" — shared with export/import and hardreboot, so
     this list can't drift out of sync with what actually gets wiped
     or exported again. */
  addLine("<keys> terminal localStorage entries:");
  addLine("  " + "key".padEnd(36) + "size");
  addLine("  " + "─".repeat(48));
  let found = 0;
  for (const key of THAUMASAVE_KEYS) {
    try {
      const val = localStorage.getItem(key);
      if (val !== null) {
        const bytes = new Blob([val]).size;
        addLine("  " + key.padEnd(36) + bytes + "B");
        found++;
      }
    } catch(e) {}
  }
  if (!found) addLine("  (no entries found)");
  addLine("  " + "─".repeat(48));
  addLine("  to remove a key: keyclear {key}");
}

/* keyclear — remove a specific localStorage key by name */
let _pendingKeyclear = null;   /* key name awaiting a second confirming run */

function cmd_keyclear(args) {
  const key = args.join(" ").trim();
  if (!key) { addLine("<keyclear> usage: keyclear {key}"); return; }
  try {
    const existed = localStorage.getItem(key) !== null;
    if (!existed) { addLine("<keyclear> key not found: " + key); addLine("  type keys to see the stored keys."); _pendingKeyclear = null; return; }

    if (_pendingKeyclear === key) {
      localStorage.removeItem(key);
      addLine("<keyclear> removed: " + key);
      addLine("  changes take effect on next reload.");
      _pendingKeyclear = null;
      return;
    }

    _pendingKeyclear = key;
    addLine("<keyclear> this will permanently delete the key: " + key);
    addLine("  run keyclear " + key + " again to confirm.");
  } catch(e) {
    addLine("<keyclear> error: " + e.message);
  }
}

/* history — display the session command history */
function cmd_history() {
  if (!history.length) { addLine("<history> no commands in session history."); return; }
  addLine("<history> session commands (" + history.length + " total):");
  addLine("  " + "─".repeat(40));
  const start = Math.max(0, history.length - 50); /* show last 50 */
  for (let i = start; i < history.length; i++) {
    addLine("  " + String(i + 1).padStart(3) + ".  " + history[i]);
  }
  addLine("  " + "─".repeat(40));
  if (history.length > 50) addLine("  showing last 50 of " + history.length + " commands.");

  const uniqueCmds = new Set(history.map(line => (tokenize(line)[0] || "").toLowerCase()));
  if (uniqueCmds.size >= 50) unlockAchievement("history_50");
}

var _hardrebootToken = null;

function _genRebootToken() {
  const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
  const len   = 5 + Math.floor(Math.random() * 6);
  let token   = "";
  for (let i = 0; i < len; i++) token += CHARS[Math.floor(Math.random() * CHARS.length)];
  return token;
}

function cmd_hardreboot(args) {
  const supplied = args.join("").trim();

  /* Step 2 — correct token */
  if (_hardrebootToken && supplied === _hardrebootToken) {
    addLine("<hardreboot> token accepted. purging all persistent state...");
    const ALL_KEYS = [
      ACH_KEY, ACH_ORDER_KEY, PROFILE_KEY, CURSOR_KEY, SAVED_THEMES_KEY, CMD_USAGE_KEY,
      RETURN_KEY, INBOX_KEY, JOB_TOKENS_KEY, JOB_UNLOCKED_KEY, JOB_ACTIVE_KEY,
      JOB_ASKED_KEY, CHAIN_KEY, PET_KEY, INDEX_DISCOVERY_KEY, INDEX_CATEGORY_REVEALED_KEY, CHMOD_KEY, RECURSIVE_EVENTS_KEY,
      RECOVERED_FILES_KEY, PLAYBACK_KEY, GRAVEYARD_DISCOVERED_KEY, GRAVEYARD_RERUN_KEY, BESTIARY_KEY, WEATHER_STATE_KEY,
      CLICKER_STATE_KEY, NOTES_STATE_KEY, BINDINGS_KEY, CAST_COLLECTION_KEY, RAINBOW_THEME_KEY, LONG_SESSION_CLAIMED_KEY, DREAMS_SEEN_KEY, VIGNETTE_KEY,
      RPG_SEEN_KEY, TTHEME_KEY, TTHEME_USED_KEY, GAMBLE_KEY, BTHEME_ACTIVE_KEY, BTHEME_PATTERN_KEY, "terminal_active_color", "terminal_theme", "terminal_textsize",
    ];
    try {
      for (const key of ALL_KEYS) localStorage.removeItem(key);
      addLine("<hardreboot> all records erased.");
      addLine("<hardreboot> rebooting...");
    } catch(e) {
      addLine("<hardreboot> storage error: " + e.message);
    }
    _hardrebootToken = null;
    _pendingImport = null;
    setTimeout(() => location.reload(), 1200);
    return;
  }

  /* Step 2 — wrong token */
  if (_hardrebootToken && supplied) {
    addLine("<hardreboot> incorrect token. reboot aborted.");
    addLine("<hardreboot> run hardreboot again to generate a new token.");
    _hardrebootToken = null;
    return;
  }

  /* Step 1 — generate token */
  _hardrebootToken = _genRebootToken();
  addLine("<hardreboot> WARNING: this will erase all progress.");
  addLine("<hardreboot> achievements, tokens, lore, pet, themes — everything.");
  addLine("<hardreboot> to confirm, run:");
  addLine("  hardreboot " + _hardrebootToken);
  addLine("<hardreboot> any other input cancels.");
}

/* Conquering all 5 levels reveals arena_debrief.txt immediately, the
   same way recover {filename} would, and marks it recovered so it's
   listed and re-readable afterward without needing to find a hint. */
function arenaGrantVictoryFile() {
  const name = "arena_debrief.txt";
  const file = RECOVER_FILES[name];
  if (!file) return;   /* defensive — should always exist */

  const alreadyHad = !!(recoveredFiles[name] && recoveredFiles[name].recovered);

  addLine("");
  addLine(alreadyHad
    ? "<arena> the system logs one more session. no new file this time — you already have it:"
    : "<arena> something in the system logs this differently. a file surfaces:");
  addLine("════════════════════════════════════════");
  addLine("  RECOVERED FILE: " + file.title);
  addLine("════════════════════════════════════════");
  for (const line of file.body) addLine(line);
  addLine("════════════════════════════════════════");

  if (!alreadyHad) {
    recoveredFiles[name] = { recovered: true, timesRead: 1 };
  } else {
    recoveredFiles[name].timesRead += 1;
  }
  saveRecoveredFiles();
}

function arenaResolveTurn(playerMove) {
  const st = arenaState;
  if (!st || st.gameOver) return;
  
  st.playerLastMove = playerMove;
  st.playerDefending  = (playerMove === "defend");
  st.playerCountering = (playerMove === "counter");

  /* track consecutive player attacks/specials — Thauma Incarnate's
     adaptive AI reads this before picking its own move */
  st.playerAttackStreak = (playerMove === "attack" || playerMove === "special")
    ? st.playerAttackStreak + 1 : 0;

  /* opponent AI — style-dependent, see arenaAI() */
  const AIChoice = arenaAI();
  st.opponentLastMove = AIChoice;
  st.opponentDefending  = (AIChoice === "defend");
  st.opponentCountering = (AIChoice === "counter");

  /* cooldown check */
  if (playerMove === "special" && st.playerSpecialCD > 0) {
    addLine("<arena> special ability on cooldown for " + st.playerSpecialCD + " more turn(s).");
    arenaDisplay();
    return;
  }

  /* resolve each side's own attack/special damage first, before either
     side's defend/counter reaction is applied to it */
  let playerDamageDealt = 0;
  let opponentDamageDealt = 0;

  if (playerMove === "attack") {
    playerDamageDealt = 12 + Math.floor(Math.random() * 8);
  } else if (playerMove === "special") {
    playerDamageDealt = 28 + Math.floor(Math.random() * 12);
    st.playerSpecialCD = 3;
  }

  if (AIChoice === "attack") {
    opponentDamageDealt = st.opponentAttack + Math.floor(Math.random() * 6);
  } else if (AIChoice === "special") {
    opponentDamageDealt = st.opponentAttack + 15 + Math.floor(Math.random() * 10);
    st.opponentSpecialCD = 3;
  }

  /* counter: reduces incoming damage like defend, and — only if the
     other side actually attacked — deals a chunk of that raw damage
     straight back. countering into a defend or another counter whiffs. */
  let playerCounterDamage = 0;
  let opponentCounterDamage = 0;

  if (st.opponentDefending) {
    playerDamageDealt = Math.floor(playerDamageDealt * 0.5);
  } else if (st.opponentCountering) {
    if (playerDamageDealt > 0) {
      opponentCounterDamage = Math.floor(playerDamageDealt * 0.6) + Math.floor(Math.random() * 4);
    }
    playerDamageDealt = Math.floor(playerDamageDealt * 0.5);
  }

  if (st.playerDefending) {
    opponentDamageDealt = Math.floor(opponentDamageDealt * 0.5);
  } else if (st.playerCountering) {
    if (opponentDamageDealt > 0) {
      playerCounterDamage = Math.floor(opponentDamageDealt * 0.6) + Math.floor(Math.random() * 4);
    }
    opponentDamageDealt = Math.floor(opponentDamageDealt * 0.5);
  }

  playerDamageDealt   += playerCounterDamage;
  opponentDamageDealt += opponentCounterDamage;

  /* apply damage */
  st.opponentHP = Math.max(0, st.opponentHP - playerDamageDealt);
  st.playerHP = Math.max(0, st.playerHP - opponentDamageDealt);
  
  /* update cooldowns */
  if (st.playerSpecialCD > 0) st.playerSpecialCD--;
  if (st.opponentSpecialCD > 0) st.opponentSpecialCD--;
  
  /* display turn resolution */
  addLine("");
  if (playerMove === "defend") {
    addLine("<arena> you assume a defensive stance.");
  } else if (playerMove === "counter") {
    addLine(playerCounterDamage > 0
      ? "<arena> you counter! damage dealt: " + playerCounterDamage
      : "<arena> you ready a counter, but the opening never comes.");
  } else if (playerMove === "attack") {
    addLine("<arena> you strike! damage dealt: " + playerDamageDealt);
  } else if (playerMove === "special") {
    addLine("<arena> SURGE NOVA! damage dealt: " + playerDamageDealt);
  }
  
  if (AIChoice === "defend") {
    addLine("<arena> opponent braces for impact.");
  } else if (AIChoice === "counter") {
    addLine(opponentCounterDamage > 0
      ? "<arena> opponent counters! you take " + opponentCounterDamage + " extra damage."
      : "<arena> opponent readies a counter, but finds no opening.");
  } else if (AIChoice === "attack") {
    addLine("<arena> opponent strikes! you take " + opponentDamageDealt + " damage.");
  } else if (AIChoice === "special") {
    addLine("<arena> opponent unleashes CATACLYSM! you take " + opponentDamageDealt + " damage.");
  }
  
  if (!st.oppLowHPTaunted && st.opponentHP > 0 && st.opponentHP <= st.opponentMaxHP * 0.3) {
    st.oppLowHPTaunted = true;
    arenaSayDialogue(st.opponentName, "lowHP");
  }

  /* check win/loss */
  if (st.opponentHP <= 0) {
    st.gameOver = true;
    st.playerWon = true;
    addLine("");
    addLine("<arena> ⟪ VICTORY ⟫");
    addLine("<arena> opponent vanquished.");
    arenaSayDialogue(st.opponentName, "victory");
    const tokens = st.level * 25;
    const bonus = pleaseBonus(tokens);
    jobTokens += tokens + bonus;
    saveJobTokens();
    addLine("<arena> earned " + tokens + " tokens.");
    pleaseNote(bonus);
    unlockAchievement("arena_level_" + st.level);
    if (st.level === 5) unlockAchievement("arena_master");
    addLine("");
    if (st.level < 5) {
      addLine("type: continue — next fight   |   retry — refight this level   |   exit — return to terminal");
    } else {
      addLine("<arena> you have conquered the arena.");
      arenaGrantVictoryFile();
      addLine("");
      addLine("type: retry — refight this level   |   exit — return to terminal");
    }
  } else if (st.playerHP <= 0) {
    st.gameOver = true;
    st.playerWon = false;
    addLine("");
    addLine("<arena> ⟪ DEFEATED ⟫");
    addLine("<arena> your essence dissipates into the void.");
    arenaSayDialogue(st.opponentName, "defeat");
    addLine("");
    addLine("type: retry — try again   |   exit — return to terminal");
  } else {
    st.turn++;
  }
  
  arenaDisplay();
}

/* Each opponent has its own aiStyle (see ARENA_OPPONENTS). All five share
   the same weighted-random picker, but build the weights differently:
     aggressive — Cipher Wraith  (lvl1): mostly attacks, doesn't counter yet
     defensive  — Void Sentinel  (lvl2): leans defend/counter, baits specials
     mirror     — Resonance Echo (lvl3): biased toward copying your last move
     erratic    — Substrate Phantom (lvl4): flat odds, ignores HP entirely
     adaptive   — Thauma Incarnate  (lvl5): punishes repeated attacking hard */
function arenaAI() {
  const st = arenaState;
  const style = st.opponentAI || "aggressive";
  const specialAvailable = st.opponentSpecialCD === 0;
  const choices = [];

  if (style === "aggressive") {
    choices.push({ move: "attack", weight: 6 });
    choices.push({ move: "defend", weight: 2 });
    if (specialAvailable) choices.push({ move: "special", weight: 1 });
    if (st.opponentHP < st.opponentMaxHP * 0.3) choices[0].weight = 9;
  }

  else if (style === "defensive") {
    choices.push({ move: "attack",  weight: 3 });
    choices.push({ move: "defend",  weight: 4 });
    choices.push({ move: "counter", weight: 2 });
    if (specialAvailable) choices.push({ move: "special", weight: 1 });
    if (st.opponentHP < st.opponentMaxHP * 0.3) { choices[0].weight = 5; choices[1].weight = 2; }
  }

  else if (style === "mirror") {
    choices.push({ move: "attack",  weight: 4 });
    choices.push({ move: "defend",  weight: 2 });
    choices.push({ move: "counter", weight: 2 });
    if (specialAvailable) choices.push({ move: "special", weight: 1 });
    const echoed = choices.find(c => c.move === st.playerLastMove);
    if (echoed) echoed.weight += 5;
    else if (st.playerLastMove === "special" && !specialAvailable) {
      /* wants to echo a special it can't currently cast — attacks instead */
      choices[0].weight += 3;
    }
  }

  else if (style === "erratic") {
    /* no HP-based reasoning at all — that unpredictability is the point */
    choices.push({ move: "attack",  weight: 3 });
    choices.push({ move: "defend",  weight: 3 });
    choices.push({ move: "counter", weight: 3 });
    if (specialAvailable) choices.push({ move: "special", weight: 3 });
  }

  else { /* "adaptive" — Thauma Incarnate */
    choices.push({ move: "attack",  weight: 5 });
    choices.push({ move: "defend",  weight: 2 });
    choices.push({ move: "counter", weight: 2 });
    if (specialAvailable) choices.push({ move: "special", weight: 2 });

    if (st.opponentHP < st.opponentMaxHP * 0.3) choices[0].weight = 7;
    if (st.playerHP > st.playerMaxHP * 0.7) choices[0].weight = Math.max(choices[0].weight, 6);

    /* the longer you lean on attack/special, the harder it punishes it */
    if (st.playerAttackStreak >= 3) {
      const ctr = choices.find(c => c.move === "counter");
      if (ctr) ctr.weight = 5; else choices.push({ move: "counter", weight: 5 });
    }
  }

  const totalWeight = choices.reduce((sum, c) => sum + c.weight, 0);
  let roll = Math.random() * totalWeight;
  for (const c of choices) {
    roll -= c.weight;
    if (roll <= 0) return c.move;
  }
  return "attack";
}

function arenaHandle(input) {
  const cmd = input.trim().toLowerCase();
  
  if (arenaState.gameOver) {
    if (cmd === "exit") {
      arenaState = null;
      mode = "shell";
      addLine("");
      addLine("you return to the terminal.");
      newPrompt();
      return;
    }
    if (arenaState.playerWon && arenaState.level < 5 &&
        (cmd === "continue" || cmd === "c" || cmd === "n" || cmd === "next")) {
      const nextLevel = arenaState.level + 1;
      initArena(nextLevel);
      addLine("");
      addLine("<arena> entering the next fight...");
      addLine("");
      arenaShowIntro(nextLevel);
      setTimeout(() => { arenaDisplay(); }, 300);
      return;
    }
    if (cmd === "retry" || cmd === "r") {
      const lvl = arenaState.level;
      initArena(lvl);
      addLine("");
      addLine("<arena> retrying the fight...");
      addLine("");
      arenaShowIntro(lvl);
      setTimeout(() => { arenaDisplay(); }, 300);
      return;
    }
    if (arenaState.playerWon && arenaState.level < 5) {
      addLine("<arena> type: continue — next fight   |   retry — refight this level   |   exit — return to terminal");
    } else {
      addLine("<arena> type: retry — fight again   |   exit — return to terminal");
    }
    return;
  }
  
  if (cmd === "a" || cmd === "attack") {
    arenaResolveTurn("attack");
  } else if (cmd === "d" || cmd === "defend") {
    arenaResolveTurn("defend");
  } else if (cmd === "c" || cmd === "counter") {
    arenaResolveTurn("counter");
  } else if (cmd === "s" || cmd === "special") {
    arenaResolveTurn("special");
  } else if (cmd === "") {
    addLine("<arena> pick a move. get back in the fight.");
    arenaDisplay();
  } else {
    addLine("<arena> invalid move. [a]ttack [d]efend [c]ounter [s]pecial   (help lists everything)");
    arenaDisplay();
  }
}

function cmd_arena(args) {
  const levelArg = parseInt(args[0] || "1", 10);

  initArena(level);

    arenaDisplay();
  }, 300);
}

/* ── "did you mean" — fuzzy match unknown commands against the public
   command list only. Hidden/secret commands are never suggested. ── */
/* edit distance with adjacent swaps counted as ONE edit (optimal string
   alignment), so the most common typo — two neighboring letters swapped,
   like "bnid" for "bind" — is distance 1, not 2. Name kept for the one
   caller (suggestCommand). */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const d = [];
  for (let i = 0; i <= m; i++) {
    d.push(new Array(n + 1).fill(0));
    d[i][0] = i;
  }
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(
        d[i - 1][j] + 1,         /* deletion */
        d[i][j - 1] + 1,         /* insertion */
        d[i - 1][j - 1] + cost   /* substitution */
      );
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);   /* swap */
      }
    }
  }
  return d[m][n];
}

/* typo memory — how many times each unknown command word has been typed this
   session (not saved). the third time gets called out, with a bind suggestion
   when the typo has a close match. */
const typoSeen = new Map();

function suggestCommand(cmd) {
  if (!cmd || cmd.length < 2) return null;
  const maxDist = cmd.length <= 4 ? 1 : 2;
  let best = null, bestDist = Infinity;
  for (const c of ALL_SHELL_CMDS) {
    if (c.startsWith("thauma-")) continue;   /* hidden chain — never suggest */
    if (c === "ttheme" && !finalUnlocked) continue;
    const d = levenshtein(cmd, c);
    if (d < bestDist) { bestDist = d; best = c; }
  }
  return (best && bestDist <= maxDist && bestDist > 0) ? best : null;
}

function handleShellInner(input) {
  const raw=input.trim();
  if(!raw) { addLine(r(randomItem(NO_COMMAND_MESSAGES))); return; }
  const parts=tokenize(raw);

  let sudo=false;
  if(parts[0]==="sudo"){ sudo=true; rudeMode=true; sudoLine=true; parts.shift(); }

  const cmd=(parts[0]||"").toLowerCase();
  const args=parts.slice(1);
  if(!cmd) return;

  /* track the previous command for cmd_mood, before overwriting it with this one */
  indexTrackDiscovery(cmd);
  const prevCommand = lastCommand;
  lastCommand = cmd;
  if (cmd !== "poke") pokeStreak = 0;
  if (cmd !== "roll") { rollStreak = 0; rollMaxRun = 0; }
  trackHighlightUsage(cmd);

  /* ── terminal lock ── */
  if (termLocked) {
    if (cmd === "unlock") return cmd_unlock(args);
    if (cmd === "help")   return cmd_help();
    addLine(r("<locked> terminal is locked. type: unlock {password}"));
    return;
  }

  /* ttheme does not exist until the final unlock */
  if (cmd === "ttheme" && !finalUnlocked) { addLine(r("<error> unknown command — type help")); return; }

  /* shutdown bypasses walls entirely */
  if(cmd==="shutdown") return cmd_shutdown(sudo);

  /* track metadata for lantern and drift */
  logOutput(raw);
  driftAccumulate(cmd);

  /* ── chmod permission check ── */
  if (!hasExecutePermission(cmd)) {
    addLine(r("<error> permission denied: " + cmd));
    return;
  }

  /* consecutive snack/nap streaks, for hungry_user / tired_user achievements */
  if (cmd === "snack")      { snackStreak++; napStreak = 0; }
  else if (cmd === "nap")   { napStreak++; snackStreak = 0; }
  else                      { snackStreak = 0; napStreak = 0; }

  switch(cmd){
    case "about":        return cmd_about(args);
    case "banner":       return cmd_banner(args);
    case "bind":         return cmd_bind(args);
    case "export":       return cmd_export();
    case "import":       return cmd_import(args);
    case "achievements": return cmd_achievements();
    case "ascii":        return cmd_ascii(args);
    case "calc":         return cmd_calc(args);
    case "cast":         return cmd_cast(args);
    case "chatbot":      return cmd_open(["chatbot"]);
    case "chmod":        return cmd_chmod(args);
    case "clear":        return cmd_clear();
    case "colorize":     return cmd_colorize(args);
    case "cpu":          return cmd_cpu();
    case "creature":     return cmd_creature(args);
    case "date":         return cmd_date(args);
    case "holiday":      return cmd_holiday(args);
    case "echo":         return cmd_echo(args);
    case "exit":         return addLine(r("<exit> not in an app"));
    case "flip":         return cmd_flip(args);
    case "fortune":      return cmd_fortune();
    case "poke":         return cmd_poke();
    case "passgen":      return cmd_passgen(args);
    case "choose":       return cmd_choose(args);
    case "hangman":      return cmd_open(["hangman"]);
    case "help":         return cmd_help(args);
    case "inventory":    return cmd_inventory();
    case "joke":         return cmd_joke();
    case "list":         return cmd_list();
    case "map":          return cmd_map();
    case "mimic":        return cmd_mimic(args);
    case "mood":         return cmd_mood(prevCommand);
    case "namegen":      return cmd_namegen();
    case "notes":        return cmd_open(["notes"]);
    case "open":         return cmd_open(args);
    case "pet":          return cmd_open(["pet"]);
    case "job":          return cmd_open(["job"]);

    case "roll":         return cmd_roll(args);

    /* ── hidden thauma chain — not in help ── */
    case "thauma-scan":    return cmd_thauma_scan();
    case "thauma-echo":    return cmd_thauma_echo();
    case "thauma-null":    return cmd_thauma_null();
    case "thauma-seal":    return cmd_thauma_seal();
    case "thauma-reflect": return cmd_thauma_reflect();
    case "thauma-awaken":  return cmd_thauma_awaken();
    default: {
      const guess = suggestCommand(cmd);
      const seen = (typoSeen.get(cmd) || 0) + 1;
      typoSeen.set(cmd, seen);
      if (seen === 3) {
        if (guess) {
          addLine(r("<error> unknown command \"" + cmd + "\" — did you mean \"" + guess + "\"? that's the third time you've typed that."));
          if (/^[a-z0-9_-]{1,16}$/.test(cmd) && !bindIsReserved(cmd)) {
            addLine("  if it keeps happening: bind " + cmd + " " + guess);
          }
        } else {
          addLine(r("<error> unknown command — type help. that's the third time you've typed \"" + cmd + "\". it still isn't a command."));
        }
        return;
      }
      if (guess) {
        return addLine(r("<error> unknown command \"" + cmd + "\" — did you mean \"" + guess + "\"? type help for the full list."));
      }
      return addLine(r("<error> unknown command — type help"));
    }
  }
}

/* returns true when "help" was handled here */
function appHelpIntercept(input) {
  if (input.trim().toLowerCase() !== "help") return false;
  if (mode === "recursive") return false;   /* has its own help */
  /* while a job question is pending every line is an answer — unless the answer really is "help" */
  if (mode === "job" && jobSubmode === "question" && jobPendingQ &&
      String(jobPendingQ.answer).toLowerCase() === "help") return false;
  if (!["arena","maze","sokoban","rpg","gamble","pet","job","hangman","chatbot","notes","weather","clicker","tutorial"].includes(mode)) return false;
  appHelp();
  return true;
}

function handleApp(input) {
  if (appHelpIntercept(input)) return;
  switch(mode){
    case "notes":     return notesHandle(input);
    case "hangman":   return hangmanHandle(input);
    case "chatbot":   return chatbotHandle(input);
    case "recursive": return recursiveHandle(input);
    case "pet":       return petHandle(input);
    case "job":       return jobHandle(input);
    case "maze":      return mazeHandle(input);
    case "sokoban":   return sokobanHandle(input);
    case "rpg":       return rpgHandle(input);
    case "gamble":    return gambleHandle(input);
    case "arena":     return arenaHandle(input);
    case "weather":   return weatherHandle(input);
    case "clicker":   return clickerHandle(input);
    case "tutorial":  return tutorialHandle(input);
    default: mode="shell"; return handleShell(input);
  }
}

/* ================================================================
   PREFIX LAYER — "dry {cmd}" and "whisper {cmd}"
   Sits in front of both handleShell and handleApp so both prefixes
   work identically in the shell and inside every app. Any number of
   these prefixes can stack (e.g. "dry whisper attack").
   "dry"     — previews what the command would do; the real command
               function is never called, so nothing is ever saved.
   "whisper" — runs the command for real, but with corrupt() disabled
               for the duration, so output has no glitch corruption.
   ================================================================ */
/* commands with real, timed animations (setTimeout sequences) — approximate
   ms needed to let them finish before the next chained command begins, so
   their output doesn't interleave with whatever runs after them. every
   other command gets just one animation frame (see nextFrame) between runs,
   so each command in a && chain or a *N repeat is visible in action. */
const CHAIN_ANIMATION_DELAY = { lottery: 1150, clean: 1700, "thauma-awaken": 900, arena: 450, open: 450 };
const CHAIN_SIMULATE_DELAY  = { rain: 1200, sunrise: 2600, glitch: 1200, snow: 1300, storm: 1700, fire: 1400, compile: 2000, orbit: 2000 };

function chainDelayFor(seg) {
  const parts = tokenize(seg);
  let i = 0;
  while (i < parts.length && ["dry", "whisper", "please", "inv"].includes((parts[i] || "").toLowerCase())) i++;
  const cmdWord = (parts[i] || "").toLowerCase();
  if (cmdWord === "simulate") {
    const sub = (parts[i + 1] || "").toLowerCase();
    return CHAIN_SIMULATE_DELAY[sub] || 0;
  }
  return CHAIN_ANIMATION_DELAY[cmdWord] || 0;
}

/* resolves after one animation frame. the 50ms timeout is a fallback because
   browsers pause requestAnimationFrame in background tabs. */
function nextFrame() {
  return new Promise(res => {
    let done = false;
    const go = () => { if (!done) { done = true; res(); } };
    requestAnimationFrame(go);
    setTimeout(go, 50);
  });
}

/* ── stop-all (Escape) and wait ──────────────────────────────────────
   every long-running thing — a && / ;; chain, a *N repeat, a wait, a bound
   loop — remembers the stopEpoch it started in and quits as soon as it sees
   the number has moved on. Escape bumps stopEpoch, so it stops all of them
   at once, plus every bgrun watch. activeRuns is only used to decide
   whether there was anything to announce. */
let stopEpoch  = 0;
let activeRuns = 0;
const WAIT_MAX = 3600;

function runStarted()        { activeRuns++; return stopEpoch; }
function runEnded(myEpoch)   { if (stopEpoch === myEpoch && activeRuns > 0) activeRuns--; }

async function waitFrames(n) {
  const my = runStarted();
  try {
    for (let i = 0; i < n; i++) {
      await nextFrame();
      if (stopEpoch !== my) return;
    }
  } finally { runEnded(my); }
}

/* wait {frames} — pauses a chain or repeat; resolves when the wait is over */
function cmdWait(args) {
  let n = 1;
  if (args && args.length) {
    if (args.length > 1 || !/^\d{1,5}$/.test(args[0])) {
      addLine(r("<wait> usage: wait {frames}   — pause for that many animation frames (about 60 per second)"));
      return;
    }
    n = parseInt(args[0], 10);
    if (n > WAIT_MAX) {
      addLine(r("<wait> capped at " + WAIT_MAX + " frames (about a minute)."));
      n = WAIT_MAX;
    }
  }
  return waitFrames(n);
}

function stopAll() {
  const running = activeRuns;
  const watches = (typeof bgrunTasks !== "undefined") ? bgrunTasks.length : 0;
  stopEpoch++;
  activeRuns = 0;
  if (watches) { bgrunTasks = []; bgrunStopTimer(); }
  if (!running && !watches) return;
  const parts = [];
  if (running) parts.push("running commands");
  if (watches) parts.push(watches + " watch" + (watches === 1 ? "" : "es"));
  addLine(r("<stop> stopped " + parts.join(" and ") + "."));
}

/* if seg is a bound key that expands into a chain, return that chain as
   runChain items; false if the expansion reported a loop error; else null */
function bindTailItems(seg) {
  const t = seg.trim();
  if (!t || t === "{}") return null;
  const first = t.split(/\s+/)[0].toLowerCase();
  if (!bindHas(first) || bindIsReserved(first)) return null;
  const ex = expandBinding(t);
  if (ex === null) return false;
  if (!(ex.includes("&&") || ex.includes(";;"))) return null;
  const out = [];
  for (const sg of splitChain(ex)) {
    const x = sg.t.trim();
    if (!x) continue;
    out.push({ seg: (x === "{}") ? "" : x, feed: sg.feed });
  }
  if (out.length) out[out.length - 1].feed = false;
  return out.length ? out : null;
}

/* ── output feeding: "cmd1 ;; cmd2 ;.;" ─────────────────────────────
   a segment followed by ;; runs normally, but its terminal output is
   captured instead of printed. the captured text is remembered for the
   rest of the chain, and every ;.; in a later segment is replaced by it —
   "time ;; banner large ;.;" prints only the banner. addLine/addLineHTML
   are wrapped once so that, while a capture is open, output is diverted
   into the newest open sink. */
const feedSinks = [];
const _addLineReal     = addLine;
const _addLineHTMLReal = addLineHTML;
addLine = function (text, cls) {
  if (feedSinks.length) { feedSinks[feedSinks.length - 1].push(String(text)); return; }
  return _addLineReal.apply(this, arguments);
};
addLineHTML = function (html, cls) {
  if (feedSinks.length) { feedSinks[feedSinks.length - 1].push(String(html).replace(/<[^>]*>/g, "")); return; }
  return _addLineHTMLReal.apply(this, arguments);
};

/* captured lines -> one string: drop each line's leading <tag>, trim,
   skip blanks, join with spaces ("<time> 2:34:10 PM" feeds as "2:34:10 PM") */
function feedFlatten(lines) {
  return lines
    .map(l => l.replace(/^\s*<[^<>]{1,40}>\s*/, "").trim())
    .filter(Boolean)
    .join(" ");
}

async function runChain(segments) {
  const startMode = mode;
  const my = runStarted();

  /* normalise to [{ seg, feed }], dropping empty gaps (leading, trailing
     or doubled separators). {} stands for a bare Enter — empty input. */
  let items = [];
  for (const it of segments) {
    const raw  = (typeof it === "string") ? it : it.t;
    const feed = (typeof it === "string") ? false : !!it.feed;
    const t = raw.trim();
    if (!t) continue;
    items.push({ seg: (t === "{}") ? "" : t, feed: feed });
  }
  /* a trailing ;; has nothing after it to feed, so its output just prints */
  if (items.length) items[items.length - 1].feed = false;

  let fed = null;          /* most recent captured result, for ;.; */
  let ranOne = false;
  let idx = 0;
  let skipFrame = false;   /* a tail-call jump already spent its frame */
  try {
    while (idx < items.length) {
      const item = items[idx++];
      let seg = item.seg;
      if (ranOne && !skipFrame) await nextFrame();      /* one frame between chained commands */
      skipFrame = false;
      if (stopEpoch !== my) return;       /* Escape was pressed */
      ranOne = true;

      /* a bind line keeps its ;.; as literal text — it is stored, not run */
      if (seg.includes(";.;") && !BIND_LINE_RE.test(seg)) {
        if (fed === null) {
          addLine(r("<feed> ;.; has nothing to feed it yet — put a command and ;; before it. skipped: " + seg));
          continue;
        }
        seg = seg.split(";.;").join(fed);
      }

      /* a bound chain whose LAST step is another bound chain (or itself) just
         continues in this same loop instead of nesting — so a looping binding
         can run forever without growing the call chain or memory */
      if (idx === items.length && !item.feed && mode === "shell" && startMode === "shell" &&
          !/\s\*\d{1,4}\s*$/.test(seg)) {
        const tail = bindTailItems(seg);
        if (tail === false) return;       /* a binding loop was reported */
        if (tail) { items = tail; idx = 0; fed = null; skipFrame = true; continue; }
      }

      const wait = chainDelayFor(seg);
      if (item.feed) {
        const sink = [];
        feedSinks.push(sink);
        const savedPolite = politeOverride;
        politeOverride = true;            /* keep rude-mode barbs out of the fed text */
        try {
          await processInput(seg);        /* waits out a *N repeat or a wait in this segment */
          /* keep capturing through the command's own animation, if it has one */
          if (wait > 0) await new Promise(res => setTimeout(res, wait));
        } finally {
          politeOverride = savedPolite;
          const at = feedSinks.indexOf(sink);
          if (at >= 0) feedSinks.splice(at, 1);
        }
        if (stopEpoch !== my) return;
        /* an app opened/closed: nothing downstream is meaningful, so show what
           the command printed (it would otherwise be swallowed) and stop */
        if (mode !== startMode) { for (const l of sink) addLine(l); break; }
        fed = feedFlatten(sink);
      } else {
        await processInput(seg);          /* waits out a *N repeat or a wait in this segment */
        if (wait > 0) await new Promise(res => setTimeout(res, wait));
        if (stopEpoch !== my) return;
        /* a genuine mode change (an app opened or closed mid-chain) ends the
           chain here — the remaining segments were written for the mode the
           chain started in, and would otherwise be misread by the new one */
        if (mode !== startMode) break;
      }
    }
  } finally { runEnded(my); }
}

/* ================================================================
   BIND — user-defined shortcuts. "bind e theme mint" makes a bare
   "e" run "theme mint". "bind e unbind" removes it. Real commands
   always win over bindings.
   Bindings also work inside apps: "bind mx slots 100" makes mx run
   "slots 100" in the gamble app. In an app a binding only expands when
   its command belongs to that app, and an app's own commands and inputs
   (maze moves, hangman letters, rpg numbers, a pending job question)
   always win over a binding that happens to share their name.
   ================================================================ */
const BINDINGS_KEY = "terminal_bindings_v1";
const BIND_MAX = 32;
const BIND_PREFIXES = ["dry", "whisper", "please", "inv", "sudo"];
let bindings = {};   /* { key: "command string" } */

function loadBindings() {
  try {
    const s = localStorage.getItem(BINDINGS_KEY);
    if (!s) return;
    const o = JSON.parse(s);
    if (o && typeof o === "object" && !Array.isArray(o)) bindings = o;
  } catch(e) {}
}
function saveBindings() {
  try { localStorage.setItem(BINDINGS_KEY, JSON.stringify(bindings)); } catch(e) {}
}
function bindHas(key) {
  return Object.prototype.hasOwnProperty.call(bindings, key);
}
function bindIsReserved(key) {
  return ALL_SHELL_CMDS.includes(key) || BIND_PREFIXES.includes(key) ||
         key === "unbind" || key.startsWith("thauma") || key.startsWith("hellocanipleaseunlockeverything");
}

/* what each app understands (exit and help work in all of them). a binding
   can point at any of these, and expands inside the app that owns the word */
const BIND_APP_COMMANDS = {
  arena:   ["a", "attack", "d", "defend", "c", "counter", "s", "special", "continue", "n", "next", "retry", "r"],
  maze:    ["w", "a", "s", "d", "r"],
  sokoban: ["w", "a", "s", "d", "r"],
  rpg:     ["take", "get", "grab", "use", "read", "items", "bag", "inventory", "i", "examine", "inspect", "x", "look", "restart"],
  gamble:  ["roulette", "slots", "slot", "craps", "dice", "coin", "flip", "wheel", "odds", "stats", "balance", "bal", "tokens"],
  pet:     ["feed", "play", "sleep", "wake", "stats", "pet"],
  job:     ["work", "lottery", "shop", "balance", "streak", "buy", "theme", "cursorequip", "cursorunequip"],
  hangman: ["hint"],
  notes:   ["add", "list", "clear"],
  weather: ["check", "forecast", "journal", "log", "radar"],
  clicker: ["status", "check", "shop", "buy", "convert"],
  chatbot: [],
};

/* which apps have this word as a command of their own */
function bindAppOwners(word) {
  return Object.keys(BIND_APP_COMMANDS).filter(a => BIND_APP_COMMANDS[a].includes(word));
}

/* the first real word of a bound line, skipping prefixes (sudo is shell-only,
   so it stops the search) */
function bindCommandWord(text) {
  const words = String(text).trim().split(/\s+/);
  let i = 0;
  while (i < words.length && BIND_PREFIXES.includes(words[i].toLowerCase()) && words[i].toLowerCase() !== "sudo") i++;
  return (words[i] || "").toLowerCase();
}

/* typed words an app always keeps for itself, binding or no binding */
function bindAppOwnInput(word) {
  if (word === "exit" || word === "help") return true;
  if ((BIND_APP_COMMANDS[mode] || []).includes(word)) return true;
  if (mode === "hangman" && /^[a-z]$/.test(word)) return true;   /* letter guesses */
  if (mode === "rpg" && /^\d+$/.test(word)) return true;         /* numbered choices */
  return false;
}

/* is this (already expanded) line a command of the app we are in? */
function bindAppApplies(text) {
  const w = bindCommandWord(text);
  return w === "exit" || w === "help" || (BIND_APP_COMMANDS[mode] || []).includes(w);
}

/* after a bind: say where an app command will work */
function bindAppNote(value) {
  const w = bindCommandWord(value);
  const owners = bindAppOwners(w);
  if (!owners.length) return;
  const alsoShell = ALL_SHELL_CMDS.includes(w);
  addLine("  " + (alsoShell ? "also " : "") + "works inside: " + owners.join(", ") + (alsoShell ? "" : "  (open the app first)"));
}

function cmd_bind(args) {
  if (!args.length) {
    const keys = Object.keys(bindings).sort();
    if (!keys.length) {
      addLine(r("<bind> usage: bind {key} {command...}   — bind e theme mint"));
      addLine(r("<bind>        bind {key} unbind        — remove a binding"));
      addLine(r("<bind>        bind mx slots 100        — bindings work inside apps too"));
      return;
    }
    addLine(r("<bind> current bindings:"));
    addLine("────────────────────────────────────────");
    for (const k of keys) addLine("  " + k.padEnd(10) + "→  " + bindings[k]);
    addLine("────────────────────────────────────────");
    addLine(r("<bind> bind {key} unbind — remove one"));
    return;
  }

  const key = args[0].toLowerCase();
  if (!/^[a-z0-9_-]{1,16}$/.test(key) || key === "__proto__") {
    addLine(r("<bind> a key must be 1-16 characters: letters, numbers, - or _"));
    return;
  }

  /* bind {key} — show what it does */
  if (args.length === 1) {
    addLine(r(bindHas(key)
      ? "<bind> " + key + " → " + bindings[key]
      : "<bind> " + key + " is not bound."));
    return;
  }

  const rest  = args.slice(1);
  const value = rest.join(" ");

  /* bind {key} unbind */
  if (rest.length === 1 && rest[0].toLowerCase() === "unbind") {
    if (bindHas(key)) {
      delete bindings[key];
      saveBindings();
      addLine(r("<bind> " + key + " unbound."));
    } else {
      addLine(r("<bind> " + key + " is not bound."));
    }
    return;
  }

  if (bindIsReserved(key)) {
    addLine(r("<bind> \"" + key + "\" is reserved and cannot be rebound."));
    return;
  }
  const keyOwners = bindAppOwners(key);
  if (keyOwners.length) {
    addLine(r("<bind> \"" + key + "\" is a command in " + keyOwners.join(", ") + " and cannot be rebound."));
    return;
  }

  const first = rest[0].toLowerCase();
  /* a binding may start with a command, a prefix, another binding, or itself */
  if (!ALL_SHELL_CMDS.includes(first) && !BIND_PREFIXES.includes(first) &&
      !bindHas(first) && first !== key && !bindAppOwners(first).length) {
    addLine(r("<bind> \"" + first + "\" is not a command or a binding."));
    return;
  }

  if (!bindHas(key) && Object.keys(bindings).length >= BIND_MAX) {
    addLine(r("<bind> binding limit reached (" + BIND_MAX + "). unbind one first."));
    return;
  }

  /* a binding that reaches itself through a chain never ends on its own, so
     ask before creating one — and remind how to stop it */
  const loop = bindLoopInfo(key, value);
  if (loop && loop.kind === "infinite") {
    bindPending = { key: key, value: value };
    addLine(r("<bind> \"" + key + "\" is an infinite loop: " + loop.path.join(" → ")));
    addLine("  once it runs, it keeps running until you stop it.");
    addLine("  to stop it: press the Esc key. Esc stops EVERYTHING running — loops,");
    addLine("  chains, repeats, waits and every bgrun watch.");
    addLine(r("<bind> bind it anyway? [Y/N]"));
    return;
  }
  bindCommit(key, value);
  /* a pure alias loop (a → b → a) has no chain in it, so it can't run — it
     just reports an error when used */
  if (loop && loop.kind === "alias") addLine("  note: that is an alias loop (" + loop.path.join(" → ") + ") — using it will report an error.");
}

/* store a binding and announce it */
function bindCommit(key, value) {
  const previous = bindHas(key) ? bindings[key] : null;
  bindings[key] = value;
  saveBindings();
  addLine(r("<bind> " + key + " → " + value + (previous ? "   (was: " + previous + ")" : "")));
  bindAppNote(value);
  if (Object.keys(bindings).length >= 5) unlockAchievement("bind_five");
  if (Math.random() < 0.12) {
    addLine("  a shortcut is a small thing to bind. someone kept notes on");
    addLine("  larger ones: binding_notes_k.txt");
  }
}

/* holds a loop binding while we wait for the Y/N answer */
let bindPending = null;

/* does binding key → value create a loop? follows the binding names that
   each bound line (and each && / ;; segment of it) starts with. returns
   null, or { kind: "alias" | "infinite", path: [...] }: "alias" is a loop
   made only of single-command bindings (nothing could ever run), "infinite"
   is any loop that passes through a chain and so runs forever. */
function bindLoopInfo(key, value) {
  const valueOf = k => (k === key) ? value : bindings[k];
  const exists  = k => (k === key) || bindHas(k);
  const edges = k => {
    const segs = splitChain(valueOf(k)).map(o => o.t.trim()).filter(Boolean);
    const out = [];
    for (const sg of segs) {
      const words = sg.split(/\s+/);
      let i = 0;
      while (i < words.length && BIND_PREFIXES.includes(words[i].toLowerCase())) i++;
      const w = (words[i] || "").toLowerCase();
      if (w && exists(w) && !bindIsReserved(w)) out.push(w);
    }
    return { out: out, chained: segs.length > 1 };
  };
  const state = {};            /* 1 = on the current path, 2 = finished */
  const stack = [];
  let found = null;
  const visit = k => {
    if (found) return;
    state[k] = 1; stack.push(k);
    const e = edges(k);
    for (const nx of e.out) {
      if (found) break;
      if (state[nx] === 1) {
        const cyc = stack.slice(stack.indexOf(nx)).concat(nx);
        const chained = cyc.slice(0, -1).some(n => edges(n).chained);
        found = { kind: chained ? "infinite" : "alias", path: cyc };
      } else if (!state[nx]) visit(nx);
    }
    stack.pop(); state[k] = 2;
  };
  visit(key);
  return found;
}

/* swap a bound key for its command, keeping any extra words the user typed */
/* bindings may point at other bindings (and at themselves inside a chain).
   a pure alias loop (a → b → a, or a → a) is caught here and reported;
   returns null in that case so the caller does nothing. */
const BIND_RESOLVE_MAX = 32;
let bindRunDepth = 0;
const BIND_RUN_DEPTH_MAX = 5000;   /* only non-tail recursion nests; tail loops are unlimited */
/* in the shell, a binding that points at an app command can't run — say so
   instead of reporting an unknown command */
function bindShellGuard(cur, key) {
  const w = bindCommandWord(cur);
  const owners = bindAppOwners(w);
  if (owners.length && !ALL_SHELL_CMDS.includes(w) && !BIND_PREFIXES.includes(w) && !bindHas(w)) {
    addLine(r("<bind> \"" + key + "\" runs \"" + cur.trim() + "\", a command inside " + owners.join(", ") + ". open the app first."));
    return null;
  }
  return cur;
}

/* inside an app: expand only when the bound command belongs to this app */
function bindExpandInApp(raw) {
  if (!BIND_APP_COMMANDS[mode]) return raw;                       /* tutorial, recursive */
  if (mode === "job" && jobSubmode !== "idle") return raw;        /* a question or confirm is waiting for its answer */
  let cur = raw;
  const seen = [];
  for (let n = 0; n < BIND_RESOLVE_MAX; n++) {
    const t = cur.trim();
    if (!t) break;
    const first = t.split(/\s+/)[0].toLowerCase();
    if (!bindHas(first)) break;
    if (n === 0 && bindAppOwnInput(first)) return raw;            /* the app's own words win */
    if (seen.includes(first)) {
      addLine(r("<bind> binding loop: " + seen.concat(first).join(" → ")));
      return null;
    }
    seen.push(first);
    const extra = t.slice(first.length).trim();
    cur = bindings[first] + (extra ? " " + extra : "");
  }
  if (!seen.length) return raw;
  return bindAppApplies(cur) ? cur : raw;
}

function expandBinding(raw) {
  if (mode !== "shell") return bindExpandInApp(raw);
  let cur = raw;
  const seen = [];
  for (let n = 0; n < BIND_RESOLVE_MAX; n++) {
    const t = cur.trim();
    if (!t) return cur;
    const first = t.split(/\s+/)[0].toLowerCase();
    if (!bindHas(first) || bindIsReserved(first)) return seen.length ? bindShellGuard(cur, seen[0]) : cur;
    if (seen.includes(first)) {
      addLine(r("<bind> binding loop: " + seen.concat(first).join(" → ")));
      return null;
    }
    seen.push(first);
    const extra = t.slice(first.length).trim();
    cur = bindings[first] + (extra ? " " + extra : "");
  }
  addLine(r("<bind> bindings nest too deeply (" + BIND_RESOLVE_MAX + ") — stopped."));
  return null;
}

/* ================================================================
   EXPORT / IMPORT — package everything the terminal normally keeps
   in localStorage (saved themes, current theme/crt/vignette, the
   index, recovered files, achievements, bindings, the pet, etc.)
   into a single downloadable .thaumasave file, and restore it.
   ================================================================ */
/* ttheme storage keys — declared here (not beside ttheme) because THAUMASAVE_KEYS below reads them at load time */
const TTHEME_KEY = "terminal_ttheme_v1";
const TTHEME_USED_KEY = "terminal_ttheme_used_v1";
const GAMBLE_KEY = "terminal_gamble_v1";   /* gamble app: first-visit flag + record */
const THAUMASAVE_KEYS = [
  ACH_KEY, ACH_ORDER_KEY, PROFILE_KEY, CURSOR_KEY, SAVED_THEMES_KEY, CMD_USAGE_KEY,
  RETURN_KEY, INBOX_KEY, JOB_TOKENS_KEY, JOB_UNLOCKED_KEY, JOB_ACTIVE_KEY, JOB_ASKED_KEY,
  CHAIN_KEY, PET_KEY, INDEX_DISCOVERY_KEY, INDEX_CATEGORY_REVEALED_KEY, CHMOD_KEY,
  RECURSIVE_EVENTS_KEY, RECOVERED_FILES_KEY, PLAYBACK_KEY, GRAVEYARD_DISCOVERED_KEY,
  GRAVEYARD_RERUN_KEY, BESTIARY_KEY, WEATHER_STATE_KEY, CLICKER_STATE_KEY, NOTES_STATE_KEY, BINDINGS_KEY,
  CAST_COLLECTION_KEY, RAINBOW_THEME_KEY, LONG_SESSION_CLAIMED_KEY, DREAMS_SEEN_KEY,
  VIGNETTE_KEY, RPG_SEEN_KEY, TTHEME_KEY, TTHEME_USED_KEY, GAMBLE_KEY, BTHEME_ACTIVE_KEY, BTHEME_PATTERN_KEY, "terminal_active_color", "terminal_theme", "terminal_textsize",
];
const THAUMASAVE_FORMAT = "thaumasave";

function cmd_export() {
  try {
    const data = {};
    let count = 0;
    for (const key of THAUMASAVE_KEYS) {
      const val = localStorage.getItem(key);
      if (val !== null) { data[key] = val; count++; }
    }
    if (!count) {
      addLine(r("<export> nothing to export — no saved state found yet."));
      return;
    }
    const payload = {
      format:     THAUMASAVE_FORMAT,
      version:    1,
      exportedAt: new Date().toISOString(),
      data,
    };
    const json = JSON.stringify(payload);
    const blob = new Blob([json], { type: "application/octet-stream" });
    const url  = URL.createObjectURL(blob);
    const ts   = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    const fileName = "thauma-" + ts + ".thaumasave";
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    addLine(r("<export> " + count + " saved keys packaged into " + fileName));
    addLine(r("<export> file downloaded. import will restore this exact state, on this device or another."));
  } catch(e) {
    addLine(r("<export> error: " + e.message));
  }
}

let _pendingImport = null;   /* { data, count, exportedAt, fileName } */

function cmd_import(args) {
  const arg = (args[0] || "").toLowerCase();

  if (arg === "confirm") {
    if (!_pendingImport) {
      addLine(r("<import> nothing staged. run import first to pick a .thaumasave file."));
      return;
    }
    try {
      let applied = 0;
      for (const key of THAUMASAVE_KEYS) {
        if (Object.prototype.hasOwnProperty.call(_pendingImport.data, key)) {
          localStorage.setItem(key, _pendingImport.data[key]);
          applied++;
        }
      }
      addLine(r("<import> " + applied + " keys restored from " + _pendingImport.fileName + "."));
      addLine(r("<import> reloading to apply..."));
      _pendingImport = null;
      setTimeout(() => location.reload(), 1200);
    } catch(e) {
      addLine(r("<import> error: " + e.message));
    }
    return;
  }

  if (arg === "cancel") {
    if (_pendingImport) {
      addLine(r("<import> cancelled. staged file discarded: " + _pendingImport.fileName));
      _pendingImport = null;
    } else {
      addLine(r("<import> nothing staged."));
    }
    return;
  }

  if (arg) {
    addLine(r("<import> usage: import             — pick a .thaumasave file"));
    addLine(r("                import confirm     — apply the staged file (overwrites current save)"));
    addLine(r("                import cancel      — discard the staged file"));
    return;
  }

  /* no args — open a file picker for a .thaumasave file */
  try {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".thaumasave";
    input.style.display = "none";
    document.body.appendChild(input);
    input.addEventListener("change", () => {
      const file = input.files && input.files[0];
      input.remove();
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let parsed;
        try { parsed = JSON.parse(String(reader.result)); }
        catch(e) {
          addLine(r("<import> that file isn't valid — could not parse it."));
          return;
        }
        if (!parsed || parsed.format !== THAUMASAVE_FORMAT || !parsed.data || typeof parsed.data !== "object") {
          addLine(r("<import> that file isn't a recognized .thaumasave save."));
          return;
        }
        const keys = Object.keys(parsed.data).filter(k => THAUMASAVE_KEYS.includes(k));
        if (!keys.length) {
          addLine(r("<import> file parsed, but contained no recognizable saved state."));
          return;
        }
        _pendingImport = {
          data: parsed.data,
          count: keys.length,
          exportedAt: parsed.exportedAt || "unknown",
          fileName: file.name,
        };
        addLine(r("<import> staged: " + file.name + "  (" + keys.length + " keys, exported " + _pendingImport.exportedAt + ")"));
        addLine(r("<import> this will overwrite your current save. run \"import confirm\" to apply, or \"import cancel\" to back out."));
      };
      reader.onerror = () => addLine(r("<import> could not read that file."));
      reader.readAsText(file);
    }, { once: true });
    input.click();
  } catch(e) {
    addLine(r("<import> error: " + e.message));
  }
}

/* split a line on && and ;; for chaining. returns [{ t: text, feed: bool }]
   where feed means the separator after this segment was ";;" (its output is
   captured and fed to a later ";.;" instead of being printed). the exception
   to splitting is "bind", which captures everything after it, so
   "bind e clean && clear && {} *2" binds the whole string instead of running
   it. Only applies in the shell (bind is shell-only). */
const BIND_LINE_RE = /^\s*(?:(?:dry|whisper|please|inv)\s+)*bind(?=\s|$)/i;
function splitChain(input) {
  const toks = input.split(/(&&|;;)/);        /* [seg, sep, seg, sep, seg …] */
  const out = [];
  for (let i = 0; i < toks.length; i += 2) {
    if (mode === "shell" && BIND_LINE_RE.test(toks[i])) {
      out.push({ t: toks.slice(i).join(""), feed: false });
      break;
    }
    out.push({ t: toks[i], feed: toks[i + 1] === ";;" });
  }
  return out;
}

/* true if "inv" appears anywhere in the leading prefix stack (e.g. "inv vibe", "whisper inv roll") */
function hasInvPrefix(input) {
  let raw = input;
  while (true) {
    const t = raw.replace(/^\s+/, "");
    const m = t.match(/^(dry|whisper|please|inv|sudo)(?=\s|$)/i);
    if (!m) return false;
    if (m[1].toLowerCase() === "inv") return true;
    raw = t.slice(m[0].length);
  }
}

function processInput(input) {
  /* an unreadable typeface is waiting for its Y/N confirmation */
  if (ttPending) {
    const pend = ttPending;
    ttPending = null;
    if (mode === "shell") {
      const ans = input.trim().toLowerCase();
      if (ans === "y" || ans === "yes") { ttApplyPreset(pend.preset, true); return; }
      addLine(r("<ttheme> kept the current typeface."));
      if (ans === "n" || ans === "no" || ans === "") return;
    }
  }

  /* a loop binding is waiting for its Y/N confirmation: y/yes binds it,
     n/no/blank cancels, and anything else cancels and then runs normally */
  if (bindPending) {
    const pend = bindPending;
    bindPending = null;
    if (mode === "shell") {
      const ans = input.trim().toLowerCase();
      if (ans === "y" || ans === "yes") {
        bindCommit(pend.key, pend.value);
        addLine("  press Esc to stop it whenever it runs.");
        return;
      }
      addLine(r("<bind> cancelled — " + pend.key + " was not bound."));
      if (ans === "n" || ans === "no" || ans === "") return;
    }
  }

  /* the tutorial teaches prefixes (and chaining) itself — let it see raw
     input untouched, rather than having this layer intercept it first */
  if (mode === "tutorial") return handleApp(input);

  /* command chaining with && — works in the shell or inside any app, so
     e.g. "{} && {} && {}" can rapid-click inside the clicker app */
  if (input.includes("&&") || input.includes(";;")) {
    const segments = splitChain(input);
    if (segments.length > 1) return runChain(segments);
  }

  let raw = input;
  let dry = false;
  let doWhisper = false;
  let doPlease = false;
  let doSudo = false;

  /* all five prefixes stack in any order. sudo only counts at the shell: inside an
     app a line starting with "sudo" is ordinary app input (a chat message, say) */
  const prefixRe = (mode === "shell")
    ? /^(dry|whisper|please|inv|sudo)(?=\s|$)/i
    : /^(dry|whisper|please|inv)(?=\s|$)/i;
  while (true) {
    const trimmed = raw.replace(/^\s+/, "");
    const m = trimmed.match(prefixRe);
    if (!m) { raw = trimmed; break; }
    const word = m[1].toLowerCase();
    if (word === "dry") dry = true;
    else if (word === "whisper") doWhisper = true;
    else if (word === "inv") { /* handled at the Enter key — the typed line is already gone */ }
    else if (word === "sudo") doSudo = true;
    else doPlease = true;
    raw = trimmed.slice(m[0].length);
  }
  /* hand the elevation to the shell dispatcher (and the dry preview) exactly as if
     it had been typed directly in front of the command */
  if (doSudo) raw = "sudo " + raw;

  const beforeExpand = raw;
  raw = expandBinding(raw);
  if (raw === null) return;           /* a binding loop was reported */

  /* a binding whose value contains && runs as a chain; any dry/whisper/please
     prefix typed before the key is carried onto each segment ({} stays bare) */
  if (raw !== beforeExpand && (raw.includes("&&") || raw.includes(";;"))) {
    /* bindings may point at themselves or each other, so a bound chain can
       loop forever — this caps how deeply bound chains may nest. Escape
       stops them sooner. */
    if (bindRunDepth >= BIND_RUN_DEPTH_MAX) {
      addLine(r("<bind> nested " + BIND_RUN_DEPTH_MAX + " levels deep — stopped to protect the terminal. (a loop whose last step calls itself never hits this)"));
      return;
    }
    bindRunDepth++;
    const pre = (dry ? "dry " : "") + (doWhisper ? "whisper " : "") + (doPlease ? "please " : "");
    return runChain(splitChain(raw).map(sg => {
      const t = sg.t.trim();
      return { t: (t === "" || t === "{}") ? t : pre + t, feed: sg.feed };
    })).finally(() => { bindRunDepth--; });
  }

  /* in an app, a binding's own value may start with prefixes (bind x please
     slots 5). the shell hands those to its dispatcher; an app has none, so
     peel them off here, the same way the typed ones were */
  if (raw !== beforeExpand && mode !== "shell") {
    while (true) {
      const t = raw.replace(/^\s+/, "");
      const m = t.match(/^(dry|whisper|please|inv)(?=\s|$)/i);
      if (!m) { raw = t; break; }
      const word = m[1].toLowerCase();
      if (word === "dry") dry = true;
      else if (word === "whisper") doWhisper = true;
      else if (word === "please") doPlease = true;
      raw = t.slice(m[0].length);
    }
  }

  /* "*N" repeat suffix — "roll *3" runs roll three times. This sits above
     the shell/app split, so it works inside any app the same way it works
     in the shell. It also works with && for free: "&&" is split above,
     before this point, so each segment re-enters processInput on its own
     and is checked for a trailing "*N" independently — "roll *3 && flip"
     repeats only roll, "roll && flip *2" repeats only flip. */
  const REPEAT_MAX = 50;
  let repeatCount = 1;
  const repMatch = /^\s*bind(?=\s|$)/i.test(raw) ? null : raw.match(/^(.*\S)\s+\*(\d{1,4})\s*$/);
  if (repMatch) {
    raw = repMatch[1];
    repeatCount = Math.max(1, parseInt(repMatch[2], 10) || 1);
  }

  if (dry) return runDryPreview(raw, repeatCount);

  /* "wait" is the one command that hands back a promise: a chain or repeat
     has to be able to wait it out. (inside an app only "wait {number}" counts,
     so ordinary app input like a hangman guess or a chat message is safe.) */
  const isWait = (mode === "shell") ? /^wait(?:\s|$)/i.test(raw.trim()) : /^wait\s+\d+$/i.test(raw.trim());
  const dispatchOnce = () => {
    if (mode === "shell") {
      const glitch = glitchBeforeCommand(raw);
      let res;
      try { res = handleShell(raw); } finally { glitchAfterCommand(glitch); }
      return isWait ? res : undefined;
    }
    if (isWait) return cmdWait(raw.trim().split(/\s+/).slice(1));
    handleApp(raw);
  };

  const runRepeated = () => {
    if (repeatCount > REPEAT_MAX) {
      addLine(r("<repeat> capped at " + REPEAT_MAX + " — running " + REPEAT_MAX + " times instead of " + repeatCount + "."));
      repeatCount = REPEAT_MAX;
    }
    const startMode = mode;
    if (repeatCount === 1) return dispatchOnce();
    /* the first run happens immediately; each later run waits one animation
       frame (or the command's own animation time, as in && chains) so every
       run is visible in action */
    return (async () => {
      const my = runStarted();
      try {
        for (let i = 0; i < repeatCount; i++) {
          if (i > 0) {
            const w = chainDelayFor(raw);
            if (w > 0) await new Promise(res => setTimeout(res, w));
            else await nextFrame();
          }
          if (stopEpoch !== my) return;     /* Escape was pressed */
          const res = dispatchOnce();
          if (res && typeof res.then === "function") await res;   /* e.g. wait */
          /* a genuine mode change mid-repeat (an app opened or closed) stops
             it here, same rule && chaining already follows */
          if (mode !== startMode) break;
        }
      } finally { runEnded(my); }
    })();
  };

  if (doWhisper || doPlease) {
    whisperMode = whisperMode || doWhisper;
    politeOverride = politeOverride || doPlease;
    pleaseActive = pleaseActive || doPlease;
    const clearFlags = () => {
      if (doWhisper) whisperMode = false;
      if (doPlease)  { politeOverride = false; pleaseActive = false; }
    };
    let pending;
    try { pending = runRepeated(); } catch (e) { clearFlags(); throw e; }
    /* a *N repeat is async now — keep the prefix on until it finishes */
    if (pending) return pending.finally(clearFlags);
    clearFlags();
    return;
  }

  return runRepeated();
}

function runDryPreview(rawRest, repeatCount = 1) {
  const trimmed = rawRest.trim();
  if (!trimmed && mode === "shell") {
    addLine(r("<dry> usage: dry {command} — preview a command without saving anything"));
    return;
  }
  const parts = tokenize(trimmed);
  let cmd  = (parts[0] || "").toLowerCase();
  let args = parts.slice(1);
  let sudoGiven = false;
  if (cmd === "sudo") { sudoGiven = true; cmd = (args[0] || "").toLowerCase(); args = args.slice(1); }

  const preview = (mode === "shell")
    ? dryShellPreview(cmd, args, sudoGiven)
    : dryAppPreview(mode, cmd, args);

  addLine("<dry> " + (repeatCount > 1 ? "(x" + repeatCount + ") " : "") + preview);
}

/* ================================================================
   KEYBOARD HANDLING
   ================================================================ */

/* full list of shell command names — used for tab completion */
/* ================================================================
   BGRUN — "bgrun {command}" watches a command in the background. Once a
   second it runs the command silently and prints the result only if the
   output has changed since last time ("bgrun index" reprints the index
   whenever a bar moves). Session-only; a page reload stops every task.

   SANDBOXING. Only a short allowlist of read-only commands can be watched
   (below), and each one is called directly rather than through the shell
   dispatcher, so a watch never touches command history, usage counters,
   streaks, rude mode, achievements or saved state. Output is captured, not
   printed, with random choices pinned so the text only changes when the
   underlying state really changes. Because a watch is just a timer calling
   a pure function, it keeps running while you're inside an app, and the
   only thing it ever does to the screen is add a block of lines above your
   prompt — the same way dream logs and mail notices already arrive.
   ================================================================ */
const BGRUN_MAX = 5;
const _bgNone = a => a.length === 0;
const BGRUN_ALLOWED = {
  index:        { ok: _bgNone, fn: () => cmd_index() },
  inventory:    { ok: _bgNone, fn: () => cmd_inventory() },
  achievements: { ok: _bgNone, fn: () => cmd_achievements() },
  dreams:       { ok: _bgNone, fn: () => cmd_dreams() },
  themelist:    { ok: _bgNone, fn: () => cmd_themelist() },
  settings:     { ok: _bgNone, fn: () => cmd_settings() },
  keys:         { ok: _bgNone, fn: () => cmd_keys() },
  list:         { ok: _bgNone, fn: () => cmd_list() },
  cursor:       { ok: _bgNone, fn: () => cmd_cursor([]) },
  recover:      { ok: _bgNone, fn: () => cmd_recover([]) },
  playback:     { ok: _bgNone, fn: () => cmd_playback([]) },
  cast:         { ok: a => a.length === 1 && a[0].toLowerCase() === "collection", fn: () => cmd_castCollection() },
  date:         { ok: _bgNone, fn: () => cmd_date() },
  time:         { ok: _bgNone, fn: () => cmd_time() },
  uptime:       { ok: _bgNone, fn: () => cmd_uptime() },
  sessionstats: { ok: _bgNone, fn: () => cmd_sessionstats() },
};
let bgrunTasks  = [];      /* { id, cmd, label, spec, args, last } */
let bgrunTimer  = null;
let bgrunNextId = 1;

/* run fn() with all terminal output diverted into an array, restoring
   everything it touched afterwards (synchronous, so nothing can interleave) */
function bgrunCapture(fn) {
  const lines = [];
  const real = { addLine: addLine, addLineHTML: addLineHTML, random: Math.random,
                 whisper: whisperMode, polite: politeOverride };
  addLine     = function (t) { lines.push(String(t)); };
  addLineHTML = function (h) { lines.push(String(h).replace(/<[^>]*>/g, "")); };
  Math.random = function () { return 0; };   /* pin random flavor text */
  whisperMode = true; politeOverride = true; /* no glitch, no rude-mode barbs */
  try { fn(); }
  finally {
    addLine = real.addLine; addLineHTML = real.addLineHTML; Math.random = real.random;
    whisperMode = real.whisper; politeOverride = real.polite;
  }
  return lines;
}

function bgrunStopTimer() {
  if (bgrunTimer) { clearInterval(bgrunTimer); bgrunTimer = null; }
}

function bgrunTick() {
  if (!bgrunTasks.length) { bgrunStopTimer(); return; }
  if (termLocked || locked || mode === "tutorial" || feedSinks.length) return;   /* stay silent, keep watching */
  for (const t of bgrunTasks.slice()) {
    if (!hasExecutePermission(t.cmd)) continue;
    let lines;
    try { lines = bgrunCapture(() => t.spec.fn(t.args)); }
    catch (e) {
      bgrunTasks = bgrunTasks.filter(x => x !== t);
      addLine(r("<bgrun> #" + t.id + " (" + t.label + ") stopped — it errored."));
      continue;
    }
    const sig = lines.join("\n");
    if (sig === t.last) continue;
    t.last = sig;
    addLine(r("<bgrun #" + t.id + "> " + t.label + " changed:"));
    for (const l of lines) addLine(l);
  }
  if (!bgrunTasks.length) bgrunStopTimer();
}

function bgrunStatus() {
  addLine(r("<bgrun> usage: bgrun {command}   ·   bgrun stop {id|all}"));
  addLine("  watches a command once per second, in the background, and prints it only");
  addLine("  when its output changes. keeps running inside apps. max " + BGRUN_MAX + " at once.");
  if (bgrunTasks.length) {
    addLine("  running:");
    for (const t of bgrunTasks) addLine("    #" + t.id + "  " + t.label);
  } else {
    addLine("  nothing running.");
  }
  const names = Object.keys(BGRUN_ALLOWED).map(k => k === "cast" ? "cast collection" : k);
  addLine("  watchable (read-only only): " + names.join(", "));
}

function cmd_bgrun(args) {
  if (!args.length) return bgrunStatus();
  const sub = args[0].toLowerCase();

  if (sub === "stop") {
    const which = (args[1] || "").toLowerCase();
    if (!which) { addLine(r("<bgrun> usage: bgrun stop {id}  ·  bgrun stop all")); return; }
    if (which === "all") {
      const n = bgrunTasks.length;
      bgrunTasks = []; bgrunStopTimer();
      addLine(r("<bgrun> stopped " + n + " task" + (n === 1 ? "" : "s") + "."));
      return;
    }
    const id = parseInt(which.replace(/^#/, ""), 10);
    const t = bgrunTasks.find(x => x.id === id);
    if (!t) { addLine(r("<bgrun> no task " + which + " — bgrun lists what's running.")); return; }
    bgrunTasks = bgrunTasks.filter(x => x !== t);
    if (!bgrunTasks.length) bgrunStopTimer();
    addLine(r("<bgrun> stopped #" + t.id + " (" + t.label + ")."));
    return;
  }

  const cmdArgs = args.slice(1);
  const spec = hasOwn(BGRUN_ALLOWED, sub) ? BGRUN_ALLOWED[sub] : null;
  if (!spec || !spec.ok(cmdArgs)) {
    addLine(r("<bgrun> can't watch \"" + args.join(" ") + "\". bgrun only runs read-only commands, so a watch can never change anything behind your back."));
    addLine("  watchable: " + Object.keys(BGRUN_ALLOWED).map(k => k === "cast" ? "cast collection" : k).join(", "));
    return;
  }
  if (!hasExecutePermission(sub)) { addLine(r("<error> permission denied: " + sub)); return; }

  const label = [sub].concat(cmdArgs.map(a => a.toLowerCase())).join(" ");
  const dupe = bgrunTasks.find(t => t.label === label);
  if (dupe) { addLine(r("<bgrun> already watching \"" + label + "\" (#" + dupe.id + ").")); return; }
  if (bgrunTasks.length >= BGRUN_MAX) {
    addLine(r("<bgrun> " + BGRUN_MAX + " tasks already running. stop one first: bgrun stop {id}"));
    return;
  }

  /* silent first run: proves the command works and records the baseline */
  let first;
  try { first = bgrunCapture(() => spec.fn(cmdArgs)); }
  catch (e) { addLine(r("<bgrun> couldn't run \"" + label + "\".")); return; }

  const task = { id: bgrunNextId++, cmd: sub, label: label, spec: spec, args: cmdArgs, last: first.join("\n") };
  bgrunTasks.push(task);
  if (!bgrunTimer) bgrunTimer = setInterval(bgrunTick, 1000);
  addLine(r("<bgrun> #" + task.id + " watching \"" + label + "\" every second. it prints only when the output changes."));
  addLine("  stop it with: bgrun stop " + task.id);
}

/* ── sudo lifts some redactions ───────────────────────────────────
   run a mail or a recovered file under sudo (sudo lore-inbox 3, sudo recover
   last_resort) and a few of its redacted fragments are restored. Years and other
   details stay blocked out. keyed "mail:{id}" / "file:{name}", matched on the
   exact original line. */
const SUDO_REVEALS = {
  "mail:3": [
    ["█████ ran it last Tuesday. She has not spoken since.",
     "The research lead ran it last Tuesday. She has not spoken since."],
  ],
  "mail:10": [

let sudoRevealCount = 0;
function sudoReveal(key, line) {

  for (const pair of list) {

}

  }

/* ── please: a polite line gets better odds and better pay ────────
   the rarest outcome of a weighted roll becomes three times as likely (never more
   than 10 points likelier), and the extra comes out of the likeliest outcome.
   token awards on a please line pay 25% more (rounded up). */
function pleaseWeights(w, on) {
  if (on === undefined) on = pleaseActive;
  if (!on) return w;
  const total = w.reduce((a, b) => a + b, 0);
  let hi = 0, lo = -1;
  w.forEach((x, i) => { if (x > w[hi]) hi = i; if (x > 0 && (lo < 0 || x < w[lo])) lo = i; });
  if (lo < 0 || lo === hi) return w;
  const pLo = w[lo] / total;
  let shift = (Math.min(pLo * 3, pLo + 0.10) - pLo) * total;
  shift = Math.min(shift, w[hi] * 0.5);
  const out = w.slice();
  out[lo] += shift; out[hi] -= shift;
  return out;
}
/* a yes/no event whose "yes" is the rare outcome */
function pleaseLift(p, on) {
  if (on === undefined) on = pleaseActive;
  return on ? Math.min(p * 3, p + 0.10) : p;
}
function pleaseBonus(n, on) {
  if (on === undefined) on = pleaseActive;
  return (on && n > 0) ? Math.max(1, Math.ceil(n * 0.25)) : 0;
}
function pleaseNote(bonus) {
  if (bonus > 0) addLine("  please: +" + bonus + " token" + (bonus === 1 ? "" : "s") + " for asking nicely.");
}

/* kind "system"   — uses fonts the machine already has

  { key: "comic-sans",  kind: "licensed", mono: false, sys: "Comic Sans MS",  look: "Comic Neue",  stack: '"Comic Sans MS", "Comic Sans", "Thauma Comic Neue", cursive',                  desc: "a memo from someone who wanted to be liked." },
