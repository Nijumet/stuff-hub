<!DOCTYPE html>

     UPDATE RULE: every update, increment the file name by 1 (V115 -> V116 -> V117 ...)
     and set TERMINAL_VERSION in the script to match (115.0 -> 116.0 -> ...). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THAUMA</title>
<style>
:root {
  --bg: #000000;
  --fg: #00ff00;
  --font-size: 16px;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-family, Consolas, monospace);
  font-size: var(--font-size);
  padding-top: env(safe-area-inset-top);
  box-sizing: border-box;
}

/* background patterns (btheme): painted once, on the page canvas, over the base colour in --bg */
html {
  background-image: var(--bg-image, none);
  background-size: var(--bg-size, auto);
  background-attachment: fixed;
}
body { background-color: transparent; }

#screen {
  height: 100vh;
  padding: 24px 10px 10px 10px;
  box-sizing: border-box;
  overflow-y: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.line {
  width: 100%;
}

.system {
  color: var(--fg);
}

.user {
  color: var(--fg);
}

.prompt-line {
  display: flex;
  flex-direction: row;
  align-items: baseline;
}

.prompt-label {
  margin-right: 6px;
  flex-shrink: 0;
}

.prompt-input-wrap {
  flex: 1;
  display: inline-flex;
  align-items: baseline;
  position: relative;
}

/* visible typed text */
.prompt-text {
  color: var(--fg);
  font: inherit;
  white-space: pre;
}

.prompt-ghost {
  color: var(--fg);
  font: inherit;
  white-space: pre;
  opacity: 0.28;
  pointer-events: none;
}

/* blinking block caret */
.caret {
  display: inline-block;
  width: 0.6ch;
  height: 1.1em;
  background: var(--fg);
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
  margin-left: 1px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

/* snack speed-boost: cursor blinks faster for a bit, making the console feel quicker */
body.snack-boost .caret {
  animation-duration: 0.25s !important;
}

/* nap slow-blink: cursor blinks slower for a bit, making the console feel like it's resting */
body.nap-slow .caret {
  animation-duration: 3s !important;
}

/* ── cursor skins ── */
/* block (default) — no extra class needed */
.caret-underline {
  height: 2px;
  width: 0.6ch;
  vertical-align: baseline;
  margin-bottom: 1px;
}
.caret-beam {
  width: 2px;
  height: 1.1em;
}
.caret-neon {
  box-shadow: 0 0 4px 2px var(--fg), 0 0 10px 4px var(--fg);
  animation: blink 0.8s step-end infinite;
}
.caret-glitch {
  animation: caretGlitch 0.25s step-end infinite;
}
@keyframes caretGlitch {
  0%   { opacity:1; transform: translateX(0); }
  25%  { opacity:0; transform: translateX(2px); }
  50%  { opacity:1; transform: translateX(-1px); }
  75%  { opacity:0; transform: translateX(1px); }
  100% { opacity:1; transform: translateX(0); }
}

/* command flicker: a glitched command's own output stutters for half a second.
   Two dips only, so it stays under three flashes in any one second. */
@keyframes cmdFlicker {
  0%   { opacity: 1; }
  20%  { opacity: 0.15; }
  40%  { opacity: 1; }
  70%  { opacity: 0.3; }
  100% { opacity: 1; }
}
.cmd-flicker { animation: cmdFlicker 0.5s linear; }

.hidden-input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 1px;
  height: 1px;
}

/* ── CRT FILTER EFFECTS ─────────────────────────────────────────── */
#screen.crt-active {
  border-radius: 24px;
  box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.9);
}

/* Scan lines overlay */
#screen.crt-active::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.7),
    rgba(0, 0, 0, 0.7) 1px,
    transparent 1px,
    transparent 2px
  );
  z-index: 9999;
}

/* CRT text bloom/glow */
#screen.crt-active .line {
  text-shadow: 
    0 0 16px rgba(0, 255, 0, 1),
    0 0 32px rgba(0, 255, 0, 0.6),
    0 0 48px rgba(0, 255, 0, 0.3);
}

/* Flicker animation */
@keyframes crt-flicker {
  0%, 100% { opacity: 1; }
  5% { opacity: 0.85; }
  10% { opacity: 1; }
  15% { opacity: 0.88; }
}

#screen.crt-active.crt-flickering {
  animation: crt-flicker 0.15s ease-in-out;
}

/* Vignette — darkens the screen edges and applies a slight lens bulge, independent of CRT */
#screen.vignette-active {
  filter: url(#fisheye-filter);
}
#screen.vignette-active::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 45%,
    rgba(0, 0, 0, 0.55) 100%
  );
  z-index: 9998;
}
</style>

function cmd_profile(args) {
  const raw = args.join(" ");
  const key = raw.trim().toLowerCase();

  /* ── hidden easter egg — restricted personnel profiles ──────────
     Not documented anywhere. These names cannot be set as a prefix;
     instead the terminal surfaces a short dossier and a quote. */
  const RESTRICTED_ALIASES = {
    "arcanum":    "arcanum",
    "dr.arcanum": "arcanum",
    "sysop_null": "sysop_null",
    "internk":    "internk",
    "thauma":     "thauma",

  if (hasOwn(RESTRICTED_ALIASES, key)) {

  profilePrefix = prefix;
  saveProfilePrefix();
  if (prefix) {
    addLine("<profile> prefix set to: " + prefix);
  } else {
    addLine("<profile> prefix cleared.");
  }
}

/* ================================================================
   COMMAND PERMISSIONS (chmod)
   ================================================================ */
const CHMOD_KEY = "terminal_cmd_permissions";
const RECURSIVE_EVENTS_KEY = "terminal_recursive_events";

let cmdPermissions = {};
let recursiveEventsTotal = 0;

function loadChmodState() {
  try {
    const stored = localStorage.getItem(CHMOD_KEY);
    if (stored) cmdPermissions = JSON.parse(stored);
  } catch(e) {}
}

function loadRecursiveEvents() {
  try {
    const stored = localStorage.getItem(RECURSIVE_EVENTS_KEY);
    if (stored) recursiveEventsTotal = parseInt(stored, 10) || 0;
  } catch(e) {}
}

function saveChmodState() {
  try { localStorage.setItem(CHMOD_KEY, JSON.stringify(cmdPermissions)); } catch(e) {}
}

function saveRecursiveEvents() {
  try { localStorage.setItem(RECURSIVE_EVENTS_KEY, String(recursiveEventsTotal)); } catch(e) {}
}

function hasExecutePermission(cmd) {
  /* chmod and unlock must never be lockable — otherwise a player could
     disable the only two commands able to undo it */
  if (cmd === "chmod" || cmd === "unlock") return true;
  /* if not in permissions table, default to executable */
  if (!(cmd in cmdPermissions)) return true;
  return cmdPermissions[cmd].execute === true;
}

function cmd_chmod(args) {
  /* bare "chmod" — list every command's permission state */
  if (args.length === 0) {
    addLine(r("<chmod> command permissions:"));
    addLine("────────────────────────────────────────");
    for (const cmdName of ALL_SHELL_CMDS.slice().sort().filter(c => c !== "ttheme" || finalUnlocked)) {
      const perms = cmdPermissions[cmdName];
      const bit = (!perms || perms.execute !== false) ? "x" : "-";
      addLine("  " + bit + "  " + cmdName);
    }
    addLine("────────────────────────────────────────");
    addLine(r("<chmod> usage: chmod + {cmd}   chmod - {cmd}   chmod {cmd}"));
    return;
  }

  /* "chmod {cmd}" — show permissions for a single command */
  if (args.length === 1) {
    const cmd = args[0].toLowerCase();
    if (!(cmd in cmdPermissions)) {
      addLine(r("<chmod> " + cmd + " — default permissions (executable)"));
    } else {
      const perms = cmdPermissions[cmd];
      const bits = (perms.execute ? "x" : "-");
      addLine(r("<chmod> " + cmd + " — " + bits));
    }
    return;
  }

  /* "chmod + {cmd}" / "chmod - {cmd}" — enable / disable a command */
  const mode = args[0];
  const cmd = args[1].toLowerCase();

  if (mode !== "+" && mode !== "-") {
    addLine(r("<chmod> invalid syntax. use: chmod + {cmd}   or   chmod - {cmd}"));
    return;
  }

  if (mode === "-" && (cmd === "chmod" || cmd === "unlock")) {
    addLine(r("<chmod> permission denied: " + cmd + " cannot be disabled."));
    return;
  }

  if (!(cmd in cmdPermissions)) {
    cmdPermissions[cmd] = { execute: true };
  }

  if (mode === "+") {
    cmdPermissions[cmd].execute = true;
    addLine(r("<chmod> " + cmd + ": execute permission added."));
  } else {
    cmdPermissions[cmd].execute = false;
    addLine(r("<chmod> " + cmd + ": execute permission removed."));
  }

  saveChmodState();
}

/* ================================================================
   CURSOR SKINS
   ================================================================ */
const CURSOR_KEY = "terminal_cursor_skin";
const CURSOR_SKINS = {
  block:     { cssClass: "",               label: "block",     desc: "solid blinking block (default)" },
  underline: { cssClass: "caret-underline",label: "underline", desc: "thin underline bar" },
  beam:      { cssClass: "caret-beam",     label: "beam",      desc: "slim vertical beam" },
  neon:      { cssClass: "caret-neon",     label: "neon",      desc: "neon glow pulse" },
  glitch:    { cssClass: "caret-glitch",   label: "glitch",    desc: "glitch flicker effect" },
};
let activeCursorSkin = "block";
const RAINBOW_THEME_KEY = "terminal_rainbow_theme";
/* the active colorize text theme (a COLORIZE_STYLES name like "rainbow" or "fire"), or null.
   only settable once every achievement is unlocked. RAINBOW_THEME_KEY stores the name
   (older saves stored "1", which means rainbow). */
let colorThemeName = null;

function loadCursorSkin() {
  try {
    const s = localStorage.getItem(CURSOR_KEY);
    if (s && CURSOR_SKINS[s]) activeCursorSkin = s;
  } catch(e) {}
}
function saveCursorSkin() {
  try { localStorage.setItem(CURSOR_KEY, activeCursorSkin); } catch(e) {}
}
function applyCursorSkin(skinId) {
  /* applied live by newPrompt — just update the active caret if one exists */
  if (currentCaretSpan) {
    /* remove all skin classes */
    for (const s of Object.values(CURSOR_SKINS)) {
      if (s.cssClass) currentCaretSpan.classList.remove(s.cssClass);
    }
    const skin = CURSOR_SKINS[skinId];
    if (skin && skin.cssClass) currentCaretSpan.classList.add(skin.cssClass);
  }
}

function cmd_cursor(args) {
  const sub  = (args[0] || "").toLowerCase();
  const name = (args[1] || "").toLowerCase();

  if (sub === "unequip") {
    activeCursorSkin = "block";
    saveCursorSkin();
    applyCursorSkin("block");
    addLine("<cursor> default block cursor restored.");
    return;
  }

  if (sub === "equip") {
    if (!name) { addLine("<cursor> usage: cursorequip {skin}"); return; }
    if (!hasOwn(CURSOR_SKINS, name)) {
      addLine("<cursor> unknown skin. available: " + Object.keys(CURSOR_SKINS).join(", "));
      return;
    }
    /* check if purchased (block is free) */
    if (name !== "block") {
      const inJob = jobUnlocked && jobUnlocked.includes("cursor_" + name);
      const inDirect = jobUnlocked && jobUnlocked.includes(name);
      /* cursor skins bought via job shop have id "cursor_<name>" */
      if (!inJob && !inDirect) {
        addLine("<cursor> " + name + " not purchased. buy it in the job shop.");
        return;
      }
    }
    activeCursorSkin = name;
    saveCursorSkin();
    applyCursorSkin(name);
    addLine("<cursor> skin equipped: " + name);
    return;
  }

  /* default: list skins */
  addLine("<cursor> skins:");
  for (const [id, s] of Object.entries(CURSOR_SKINS)) {
    const owned  = id === "block" || (jobUnlocked && (jobUnlocked.includes("cursor_"+id) || jobUnlocked.includes(id)));
    const active = activeCursorSkin === id;
    addLine("  " + id.padEnd(12) + s.desc + (owned?" [owned]":"") + (active?" [active]":""));
  }
  addLine("  usage: cursorequip {skin}   cursorunequip");
}

/* ================================================================
   CRT FILTER EFFECTS
   ================================================================ */
const CRT_KEY = "terminal_crt_enabled";
let crtEnabled = false;
let crtFlickerTimer = null;

function loadCrtState() {
  try {
    const s = localStorage.getItem(CRT_KEY);
    if (s === "true") crtEnabled = true;
  } catch(e) {}
}

function saveCrtState() {
  try { localStorage.setItem(CRT_KEY, crtEnabled); } catch(e) {}
}

function applyCrtEffect() {
  if (crtEnabled) {
    screen.classList.add("crt-active");
    startCrtFlicker();
  } else {
    screen.classList.remove("crt-active");
    screen.classList.remove("crt-flickering");
    if (crtFlickerTimer) {
      clearTimeout(crtFlickerTimer);
      crtFlickerTimer = null;
    }
  }
}

function startCrtFlicker() {
  function scheduleFlicker() {
    if (!crtEnabled) return;
    const delay = 10000 + Math.random() * 5000; /* 10-15 seconds */
    crtFlickerTimer = setTimeout(() => {
      if (!crtEnabled) return;
      screen.classList.add("crt-flickering");
      setTimeout(() => {
        screen.classList.remove("crt-flickering");
        scheduleFlicker();
      }, 150);
    }, delay);
  }
  scheduleFlicker();
}

function cmd_crt() {
  crtEnabled = !crtEnabled;
  saveCrtState();
  applyCrtEffect();
  if (crtEnabled) {
    addLine(r("<crt> effect enabled — scan lines, bloom, and flicker activated"));
  } else {
    addLine(r("<crt> effect disabled"));
  }
}

/* ================================================================
   THEME SAVE / LOAD / LIST
   ================================================================ */
const SAVED_THEMES_KEY = "terminal_saved_themes";
let savedThemes = {};   /* { name: { color, size, cursorSkin } } */

function loadSavedThemes() {
  try {
    const s = localStorage.getItem(SAVED_THEMES_KEY);
    if (s) savedThemes = JSON.parse(s);
  } catch(e) {}
}
function writeSavedThemes() {
  try { localStorage.setItem(SAVED_THEMES_KEY, JSON.stringify(savedThemes)); } catch(e) {}
}

function currentColor() {
  return getComputedStyle(document.documentElement).getPropertyValue("--fg").trim();
}
function currentFontSize() {
  return getComputedStyle(document.documentElement).getPropertyValue("--font-size").trim();
}

function cmd_themesave(args) {
  const name = args.join(" ").trim();
  if (!name) { addLine("<themesave> usage: themesave {name}"); return; }
  savedThemes[name] = {
    color:      currentColor(),
    size:       currentFontSize(),
    cursorSkin: activeCursorSkin,
    crt:        crtEnabled,
    vignette:   vignetteEnabled,
    quiet:      quietMode,
  };
  /* the typeface is part of a theme once ttheme exists (after the final unlock) */
  if (finalUnlocked) {
    const cur = ttCurrent();
    savedThemes[name].font = cur && cur.stack
      ? { name: cur.name, stack: cur.stack }
      : { name: "default", stack: TTHEME_DEFAULT_STACK };
  }
  /* the background: the solid colour underneath, plus a pattern if one is active */
  savedThemes[name].bg = { solid: activeBtheme, pattern: activeBthemePattern };
  writeSavedThemes();
  addLine("<themesave> saved theme '" + name + "'");
  addLine("  color:    " + savedThemes[name].color);
  addLine("  size:     " + savedThemes[name].size);
  addLine("  cursor:   " + savedThemes[name].cursorSkin);
  addLine("  crt:      " + (savedThemes[name].crt ? "on" : "off"));
  addLine("  vignette: " + (savedThemes[name].vignette ? "on" : "off"));
  addLine("  quiet:    " + (savedThemes[name].quiet ? "on" : "off"));
  addLine("  background: " + (savedThemes[name].bg.pattern ? savedThemes[name].bg.pattern + " (pattern)" : savedThemes[name].bg.solid));
  if (savedThemes[name].font) addLine("  font:     " + savedThemes[name].font.name);
}

function cmd_themeload(args) {
  const name = args.join(" ").trim();
  if (!name) { addLine("<themeload> usage: themeload {name}"); return; }
  const t = hasOwn(savedThemes, name) ? savedThemes[name] : null;
  if (!t) {
    addLine("<themeload> no saved theme named '" + name + "'.");
    const saved = Object.keys(savedThemes);
    addLine(saved.length
      ? "  saved themes: " + saved.join(", ")
      : "  none saved yet — use themesave {name} to save one. themelist shows them all.");
    return;
  }
  document.documentElement.style.setProperty("--fg", t.color);
  if (t.size) document.documentElement.style.setProperty("--font-size", t.size);
  if (t.cursorSkin && CURSOR_SKINS[t.cursorSkin]) {
    activeCursorSkin = t.cursorSkin;
    saveCursorSkin();
    applyCursorSkin(t.cursorSkin);
  }
  if (typeof t.crt === "boolean") {
    crtEnabled = t.crt;
    saveCrtState();
    applyCrtEffect();
  }
  if (typeof t.vignette === "boolean") {
    vignetteEnabled = t.vignette;
    saveVignetteState();
    applyVignetteEffect();
  }
  if (typeof t.quiet === "boolean") {
    quietMode = t.quiet;
    if (!quietMode) resetIdleTimer();
  }
  let fontNote = null;
  if (finalUnlocked && t.font && typeof t.font.stack === "string") {
    const preset = TTHEME_FONTS.find(f => f.key === t.font.name);
    if (t.font.name === "default") {
      try { localStorage.removeItem(TTHEME_KEY); } catch(e) {}
      ttApply(TTHEME_DEFAULT_STACK);
      fontNote = "default";
    } else if (preset && preset.unreadable) {
      fontNote = t.font.name + " (skipped — unreadable. apply it yourself: ttheme " + t.font.name + ")";
    } else {
      ttApply(t.font.stack);
      ttSave(t.font.name, t.font.stack);
      fontNote = t.font.name;
    }
  } else if (finalUnlocked) {
    fontNote = "unchanged";
  }
  /* background: a pattern needs to be unlocked here; a solid job colour needs to be owned.
     neither may match the text colour. anything that can't be applied is skipped and said so */
  let bgNote = "unchanged";
  if (t.bg && typeof t.bg === "object") {
    const fg = String(t.color || "").toLowerCase();
    if (t.bg.pattern && hasOwn(BTHEME_PATTERNS, t.bg.pattern)) {
      const p = t.bg.pattern;
      if (!bthemePatternUnlocked(p)) bgNote = p + " (skipped — locked here)";
      else if (BTHEME_PATTERNS[p].base.toLowerCase() === fg) bgNote = p + " (skipped — would match the text color)";
      else { bthemeApplyPattern(p); bgNote = p + " (pattern)"; }
    } else if (typeof t.bg.solid === "string") {
      const col = bthemeSolidColor(t.bg.solid);
      if (col === null) bgNote = t.bg.solid + " (skipped — not available here)";
      else if (col.toLowerCase() === fg) bgNote = t.bg.solid + " (skipped — would match the text color)";
      else {
        bthemeClearPattern();
        document.documentElement.style.setProperty("--bg", col);
        activeBtheme = t.bg.solid;
        saveBtheme();
        bgNote = t.bg.solid;
      }
    }
  }
  addLine("<themeload> loaded theme '" + name + "'");
  addLine("  color:    " + t.color);
  addLine("  size:     " + t.size);
  addLine("  cursor:   " + t.cursorSkin);
  addLine("  crt:      " + (typeof t.crt === "boolean" ? (t.crt ? "on" : "off") : "unchanged"));
  addLine("  vignette: " + (typeof t.vignette === "boolean" ? (t.vignette ? "on" : "off") : "unchanged"));
  addLine("  quiet:    " + (typeof t.quiet === "boolean" ? (t.quiet ? "on" : "off") : "unchanged"));
  addLine("  background: " + bgNote);
  if (fontNote) addLine("  font:     " + fontNote);
}

function cmd_themelist() {
  const names = Object.keys(savedThemes);
  if (!names.length) { addLine("<themelist> no saved themes. use: themesave {name}"); return; }
  addLine("<themelist> saved themes:");
  const W = [14, 10, 8, 12, 6, 10, 6];
  const showFont = finalUnlocked;
  const header = "  " +
    "name".padEnd(W[0]) +
    "color".padEnd(W[1]) +
    "size".padEnd(W[2]) +
    "cursor".padEnd(W[3]) +
    "crt".padEnd(W[4]) +
    "vignette".padEnd(W[5]) +
    (showFont ? "quiet".padEnd(W[6]) + "font" : "quiet");
  const sep = "  " + "─".repeat(W[0]+W[1]+W[2]+W[3]+W[4]+W[5]+5 + (showFont ? 5 : 0));
  addLine(header);
  addLine(sep);
  for (const name of names) {
    const t = savedThemes[name];
    const crtLabel = typeof t.crt === "boolean" ? (t.crt ? "on" : "off") : "?";
    const vignetteLabel = typeof t.vignette === "boolean" ? (t.vignette ? "on" : "off") : "?";
    const quietLabel = typeof t.quiet === "boolean" ? (t.quiet ? "on" : "off") : "?";
    addLine("  " +
      name.slice(0,W[0]-1).padEnd(W[0]) +
      (t.color||"?").padEnd(W[1]) +
      (t.size||"?").padEnd(W[2]) +
      (t.cursorSkin||"?").padEnd(W[3]) +
      crtLabel.padEnd(W[4]) +
      vignetteLabel.padEnd(W[5]) +
      (showFont ? quietLabel.padEnd(W[6]) + (t.font ? t.font.name : "?") : quietLabel));
  }
}

function loadAchievements() {
  try {
    const saved = localStorage.getItem(ACH_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object") {
        achievements = parsed;
      }
    }
  } catch(e) {}
}

function saveAchievements() {
  try { localStorage.setItem(ACH_KEY, JSON.stringify(achievements)); } catch(e) {}
}

const ACH_ORDER_KEY = "terminal_achievements_order_v1";
let achievementOrder = [];   /* ids, in the order they were unlocked */

function loadAchievementOrder() {
  try {
    const s = localStorage.getItem(ACH_ORDER_KEY);
    if (s) { achievementOrder = JSON.parse(s); return; }
  } catch(e) {}
  achievementOrder = [];
}
function saveAchievementOrder() {
  try { localStorage.setItem(ACH_ORDER_KEY, JSON.stringify(achievementOrder)); } catch(e) {}
}

function unlockAchievement(id) {
  if (achievements[id]) return;
  achievements[id] = true;
  achievementOrder.push(id);
  saveAchievements();
  saveAchievementOrder();
  const found = ACH_LIST.find(a => a[0] === id);
  const name = found ? found[1] : id;
  addLine("<achievements> unlocked: " + name);
  if (ACH_LIST.every(a => achievements[a[0]])) {
    addLine("<achievements> every achievement is now unlocked. every colorize style");
    addLine("  is now a text theme: try 'theme rainbow', 'theme fire', 'theme occult'...");
    addLine("  (see 'colorize' for the full list. for ice, use 'theme colorize ice'.)");
  }
}

/* the final unlock (mail #10 + the ttheme command) — see finalCheck() */
const FINAL_UNLOCK_KEY = "terminal_final_unlock_v1";
let finalUnlocked = false;
try { finalUnlocked = localStorage.getItem(FINAL_UNLOCK_KEY) === "1"; } catch (e) {}

const INBOX_KEY = "terminal_inbox_v3";

/* mailState mirrors the spec */
let mailState = {
  unlocked:      [],   /* array of mail IDs that are unlocked */
  read:          [],   /* array of mail IDs that have been read */
  deliveryIndex: 0,    /* how many mails have been delivered so far */
  deliveryTimer: null, /* setTimeout id (not persisted; re-armed on load) */
  readTimestamps: {},  /* id → timestamp when mail was read */
  firstOpen:     false /* whether lore-inbox has been invoked at least once */
};

function loadMailState() {
  try {
    const saved = localStorage.getItem(INBOX_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object") {
        /* merge — keep timer as null; we will re-arm below */
        mailState = Object.assign(mailState, parsed);
        mailState.deliveryTimer = null;
      }
    }
  } catch(e) {}
}

function saveMailState() {
  try {
    /* do not persist the timer id */
    const toSave = Object.assign({}, mailState, { deliveryTimer: null });
    localStorage.setItem(INBOX_KEY, JSON.stringify(toSave));
  } catch(e) {}
}

/* deliver mail N (0-based index) and show notification */
function deliverMail(index) {
  if (index >= LORE_MAILS.length) return;
  const mail = LORE_MAILS[index];
  if (mailState.unlocked.includes(mail.id)) return; /* already delivered */

  mailState.unlocked.push(mail.id);
  mailState.deliveryIndex = index + 1;
  saveMailState();

  if (!quietMode) addLine("<mail> new message recovered");
}

/* after reading mail at index, arm a 30-second timer to deliver next */
function scheduleNextMail(readIndex) {
  /* clear any existing timer */
  if (mailState.deliveryTimer !== null) {
    clearTimeout(mailState.deliveryTimer);
    mailState.deliveryTimer = null;
  }

  const nextIndex = readIndex + 1;
  if (nextIndex >= LORE_MAILS.length) return; /* no more mails */
  if (LORE_MAILS[nextIndex].gated) return;    /* delivered by finalCheck, not a timer */

  /* only schedule if next mail is not already unlocked */
  const nextId = LORE_MAILS[nextIndex].id;
  if (mailState.unlocked.includes(nextId)) return;

  mailState.deliveryTimer = setTimeout(() => {
    mailState.deliveryTimer = null;
    if (!locked) deliverMail(nextIndex);
  }, 30000);
}

/* re-arm pending deliveries after a page reload */
function rearmDeliveryTimers() {
  /* find highest read index */
  let highestReadIndex = -1;
  for (let i = 0; i < LORE_MAILS.length; i++) {
    if (mailState.read.includes(LORE_MAILS[i].id)) {
      highestReadIndex = i;
    }
  }
  if (highestReadIndex === -1) return;

  const nextIndex = highestReadIndex + 1;
  if (nextIndex >= LORE_MAILS.length) return;
  if (LORE_MAILS[nextIndex].gated) return;

  const nextId = LORE_MAILS[nextIndex].id;
  if (mailState.unlocked.includes(nextId)) return; /* already queued */

  /* check how much time has already elapsed since the last read */
  const ts = mailState.readTimestamps[LORE_MAILS[highestReadIndex].id] || 0;
  const elapsed = Date.now() - ts;
  const remaining = Math.max(0, 30000 - elapsed);

  mailState.deliveryTimer = setTimeout(() => {
    mailState.deliveryTimer = null;
    if (!locked) deliverMail(nextIndex);
  }, remaining);
}

/* render the inbox listing */
function renderInboxList() {
  if (!mailState.firstOpen || mailState.unlocked.length === 0) {
    addLine("<mail> no messages");
    return;
  }
  addLine("<mail> corrupted mail logs — " + mailState.unlocked.length + " recovered");
  addLine("────────────────────────────────────────");
  for (let i = 0; i < LORE_MAILS.length; i++) {
    const mail = LORE_MAILS[i];
    if (!mailState.unlocked.includes(mail.id)) continue;
    const isRead   = mailState.read.includes(mail.id);
    const status   = isRead ? "[read  ]" : "[unread]";
    addLine("  " + (mail.id + ".").padEnd(4) + status + "  " + mail.subject);
  }
  addLine("────────────────────────────────────────");
  addLine("usage: lore-inbox {number}");
}

/* render a specific email */
function renderMail(idxArg) {
  const num = parseInt(idxArg, 10);
  if (isNaN(num) || num < 1) {
    addLine("<mail> invalid message number");
    return;
  }
  const mail = LORE_MAILS.find(m => m.id === num);
  if (!mail) {
    addLine("<mail> invalid message number");
    if (mailState.unlocked.length) addLine("  available messages: " + mailState.unlocked.slice().sort((a, b) => a - b).join(", "));
    return;
  }
  if (!mailState.unlocked.includes(mail.id)) {
    addLine("<mail> message not yet recovered");
    return;
  }

  /* display */
  addLine("════════════════════════════════════════");
  sudoRevealCount = 0;
  for (const line of mail.body) {
    addLine(sudoReveal("mail:" + mail.id, mailFill(line)));
  }
  addLine("════════════════════════════════════════");
  sudoRevealNote();

  /* mark as read */
  const wasRead = mailState.read.includes(mail.id);
  if (!wasRead) {
    mailState.read.push(mail.id);
    mailState.readTimestamps[mail.id] = Date.now();
    saveMailState();

    /* schedule next delivery using the mail's actual array index */
    const mailIndex = LORE_MAILS.indexOf(mail);
    scheduleNextMail(mailIndex);

    /* unlock lore_complete if this is the final mail */
    if (mail.id === LORE_MAILS.filter(m => !m.gated).slice(-1)[0].id) {
      unlockAchievement("lore_complete");
    }
  }
}

/* main command handler */
function cmd_lore_inbox(args) {
  /* first invocation: deliver mail #1 immediately */
  if (!mailState.firstOpen) {
    mailState.firstOpen = true;
    saveMailState();
    deliverMail(0);
  }

  if (args.length === 0) {
    renderInboxList();
  } else {
    renderMail(args[0]);
  }
}

      "MEMORY REGION GAMMA — INTERNAL NOTE (uncatalogued)",
      "────────────────────────────────────────",
      "",
      "This file is not supposed to exist. Region gamma was marked",
      "unlocatable in every containment audit since the initial seal.",
      "I found this note anyway, sitting in a scratch directory with a",
      "timestamp older than the audit tooling itself.",
      "",
      "Whoever wrote it did not sign it. It reads:",
      "",
      "  \"gamma is not missing. gamma is where we put the parts of the",
      "  compiler we didn't want to explain to anyone, including",
      "  ourselves. it isn't unlocatable. it's just not something we",
      "  agreed to keep looking at.\"",
      "",
      "  \"if a seal-check ever comes back clean on gamma, that is worse",
      "  news than a breach. it means gamma decided to stop being found.\"",
      "",
      "I ran sealcheck three times after finding this. All three times,",
      "gamma came back unlocatable, exactly as documented. I don't know",
      "if that's reassuring.",
      "",
      "I am leaving this where it is. I am not going to be the one who",
      "goes looking for gamma on purpose.",
    ],
  },

  "echo_pattern.txt": {
    title: "echo_pattern.txt",
    body: [
      "ECHO CONVERGENCE — WORKING NOTES",
      "────────────────────────────────────────",
      "",
      "Session echo strength climbs every time: 12%, 31%, 58%. I ran the",
      "numbers assuming a geometric series and it doesn't fit — the ratio",
      "between sessions keeps shrinking, which should mean the whole",
      "thing is converging on some ceiling value instead of climbing",
      "forever. I solved for the ceiling.",
      "",
      "The math wants it to converge at 100%.",
      "",
      "I don't have a session zero reading to confirm that, because",
      "session zero — the current one, whichever one is current when",
      "you run this — always measures as unmeasurable. Every session",
      "that comes after it, though, gets folded into the average, and",
      "the average keeps climbing toward the same ceiling regardless of",
      "how many sessions have happened in between.",
      "",
      "I don't know what happens at 100%. I don't think 'complete' is",
      "the right word for it, but it's the only word that fits the shape",
      "of the math, so it's the word I'm using until someone gives me a",
      "better one.",
      "",
      "Whoever reads this next: what session number are you on.",
    ],
  },

  "binding_notes_k.txt": {
    title: "binding_notes_k.txt",
    body: [
      "[K. — bench notebook, loose pages, unnumbered]",
      "[found behind resume_k.txt in the intern share — never indexed]",
      "────────────────────────────────────────",
      "",
      "Built a shortcut table for the bench terminal today so I'd stop",
      "retyping the compiler flags. Short name in, long command out.",
      "Every shell has one. It's the least interesting thing I've",
      "done all week.",
      "",
      "Then I removed one entry and watched what happened.",
      "",
      "The entry left the table. The name did not leave the machine.",
      "",
      "Typing the dead shortcut gets 'unknown command', which is",
      "correct. But the compiler's trace resolves it anyway, and",
      "faster than a name it has never seen. I ran it forty times.",
      "Removed names come back about eleven percent quicker than",
      "fresh ones. Something is still holding the shape of the place",
      "where the entry used to be.",
      "",
      "Working definition, since nobody else is going to write one",
      "down: a lookup asks a question. A binding settles the answer",
      "before anyone asks. The table isn't where the settling",
      "happens. It's just where we're allowed to watch.",
      "",
      "Which brings me back to the ghost instructions. I have been",
      "filing them as output. They're not output. They're the same",
      "shape as my shortcut — a small name resolving to a large",
      "behavior that nobody wrote — only pointed the other way.",
      "",
      "The terminal is not running commands for the operator.",
      "The operator is the short name.",
      "",
      "Arcanum told me to stop and I said I would. This is the",
      "notebook, not the system. The notebook doesn't count.",
      "",
      "Last thing, and then I'm closing this. If a binding can",
      "outlive its own removal, then removal was never the real",
      "operation. It was the part they let us see.",
      "",
      "What I can't get past is the order of events. You can't",
      "unbind something that was never bound. So somebody ran bind",
      "first. I looked for the entry. There isn't a timestamp on it.",
    ],
  },

  "arena_debrief.txt": {
    title: "arena_debrief.txt",
    body: [
      "ARENA PROGRAM — OPERATIVE EVALUATION, FINAL ENTRY",
      "CLASSIFICATION: INTERNAL — DO NOT CIRCULATE",
      "────────────────────────────────────────",
      "",
      "  subject:        operative (anonymized per protocol)",
      "  sessions:       5 of 5 completed",
      "  outcome:        operative prevailed",
      "",
      "NOTE FROM PROGRAM LEAD:",
      "  The arena was never balanced for difficulty. It was balanced",
      "  for observation. Five engagements, five behavioral profiles:",
      "  aggression under pressure, caution under loss, and whether",
      "  the subject adapts a strategy once it stops working.",
      "",
      "  Session 5 opponent (designation: INCARNATE) is not scripted",
      "  like the others. It is given the subject's last several moves",
      "  and told, in effect, to stop losing to them. If the subject",
      "  kept doing the thing that worked in session 1, INCARNATE",
      "  learned to punish it by session 5. Most subjects never notice",
      "  they changed tactics mid-run. The log always shows that they did.",
      "",
      "ADDENDUM, different author:",
      "  we told new hires this was for calibrating the combat module.",
      "  it is also, separately, and without anyone's particular",
      "  approval, the single largest behavioral dataset in the",
      "  building. nobody has said why we need one of those. nobody",
      "  has stopped collecting it.",
    ],
  },

  "grimholt_postmortem.txt": {
    title: "grimholt_postmortem.txt",
    body: [
      "FROM : sysop_null@thauma-labs.internal",
      "TO   : night-shift@thauma-labs.internal",
      "DATE : ████-██-██  04:12:09",
      "RE   : grimholt — what the rpg is, and why it has",
      "       thirteen exits",
      "────────────────────────────────────────",
      "",
      "If you are reading this, you found the way out. That is the",
      "only reason this file is allowed to open.",
      "",
      "Official position: Castle Grimholt is not a game. Unofficial",
      "position: I built it on night shift, between compiles, because",
      "I wanted one program on this terminal that I could read all",
      "the way to the bottom. Forty-one rooms. Seventy-two doors.",
      "Thirteen ways out, counting the bad ones. Nothing random.",
      "Nothing hidden from the person who wrote it.",
      "",
      "HOW IT WORKS",
      "  numbers pick doors. take and use handle objects. the whole",
      "  world remembers exactly two things besides what you carry:",
      "  whether you heard the ward-box, and whether the belfry is",
      "  unlocked. I walked every combination, by hand and then by",
      "  script. 7,568 states. none of them are dead ends. if you",
      "  ever feel stuck in there, you are not. type look.",
      "",
      "WHY PUZZLES, AND WHY MEDIEVAL",
      "  nobody expects anything modern to be hiding in a castle.",
      "  that was the point. every puzzle asks the same question in",
      "  a different costume: did you gather before you acted?",
      "    the gargoyle wants a light or an answer. footsteps. the",
      "    more you take, the more you leave behind. I have left",
      "    plenty of them in this building.",
      "    the crypt is dark until you bring your own glow. the key",
      "    is only visible to someone who carried light in.",
      "    the bell counts for nothing the first time. three tolls",
      "    only mean something if you listened to the ward-box",
      "    first. ring it blind and you have woken the whole castle.",
      "",
      "WHO IS WHO",
      "  I borrowed the names from the rack room crew and then",
      "  stopped asking whose they were. Tamsin keeps the flame in",
      "  the tower on the island. she is who I was at 03:41. the",
      "  Gloom is what grows in any room nobody visits. the beacon",
      "  is the main rack. the portcullis is the outbound line. I",
      "  did not choose that last part. it was already in the draft.",
      "",
      "THE ENDINGS",
      "  some are bad on purpose: sleeping, smashing the ward-box,",
      "  ringing the alarm. some are tidy: squeezing under the gate,",
      "  slipping out the postern. one is a warm dead end, and I do",
      "  not think less of anyone who stays in the kitchen.",
      "  Flamebearer worries me. take the flame, walk into the woods,",
      "  never be cold. it works. it always works. that is the one",
      "  I would watch.",
      "",
      "THE GREAT ESCAPE",
      "  this is the only ending where the flame is not carried",
      "  alone. you do not take it from the Warden. you do not stay",
      "  to guard it. you bring a coal from the kitchen to the",
      "  beacon and let the whole castle gather round it. the Gloom",
      "  cannot stand the noise. the gate opens for everyone at once.",
      "  I put it one room from the pasties on purpose. if you ever",
      "  have to leave a place, leave in a crowd.",
      "",
      "— sysop_null",
      "  (the other door is still: sudo shutdown.)",
    ],
  },

const RECOVERED_FILES_KEY = "terminal_recovered_files_v1";
let recoveredFiles = {};   /* { filename: { recovered: true, timesRead: N } } — files the operator has successfully recovered */

function loadRecoveredFiles() {
  try {
    const s = localStorage.getItem(RECOVERED_FILES_KEY);
    if (s) recoveredFiles = JSON.parse(s);
  } catch(e) {}
}
function saveRecoveredFiles() {
  try { localStorage.setItem(RECOVERED_FILES_KEY, JSON.stringify(recoveredFiles)); } catch(e) {}
}

/* normalise a user-supplied filename: trim, lowercase, ensure .txt suffix */
function recoverNormalizeName(raw) {
  let name = (raw || "").trim().toLowerCase();
  if (!name) return "";
  if (!name.endsWith(".txt")) name += ".txt";
  return name;
}

function cmd_recover(args) {
  const requested = args.join(" ").trim();

  /* no filename supplied */
  if (!requested) {
    const found = Object.keys(recoveredFiles);
    if (found.length === 0) {
      addLine(r("<recover> usage: recover {filename}"));
      addLine(r("<recover> there are files to be found. this command will not list them."));
      return;
    }
    addLine(r("<recover> previously recovered files:"));
    addLine("────────────────────────────────────────");
    for (const name of found) {
      const info   = recoveredFiles[name];
      const times  = (info && typeof info === "object") ? info.timesRead : 1;
      const status = "[read x" + times + "]";
      addLine("  " + status.padEnd(14) + name);
    }
    addLine("────────────────────────────────────────");
    addLine(r("<recover> recover {filename} — reopen a file by name"));
    return;
  }

  const name = recoverNormalizeName(requested);
  const file = hasOwn(RECOVER_FILES, name) ? RECOVER_FILES[name] : null;

  if (!file) {
    addLine(r("<recover> no file found matching: " + requested));
    return;
  }

  addLine("════════════════════════════════════════");
  addLine("  RECOVERED FILE: " + file.title);
  addLine("════════════════════════════════════════");
  sudoRevealCount = 0;
  for (const line of file.body) addLine(sudoReveal("file:" + name, line));
  addLine("════════════════════════════════════════");
  sudoRevealNote();

  if (!recoveredFiles[name] || typeof recoveredFiles[name] !== "object") {
    recoveredFiles[name] = { recovered: true, timesRead: 1 };
  } else {
    recoveredFiles[name].timesRead += 1;
  }
  saveRecoveredFiles();
}

const PLAYBACK_KEY = "terminal_playback_files_v1";
let playedFiles = {};   /* { filename: { played: true, timesPlayed: n } } */

function loadPlayedFiles() {
  try {
    const s = localStorage.getItem(PLAYBACK_KEY);
    if (s) playedFiles = JSON.parse(s);
  } catch(e) {}
}
function savePlayedFiles() {
  try { localStorage.setItem(PLAYBACK_KEY, JSON.stringify(playedFiles)); } catch(e) {}
}

/* normalise a user-supplied filename: trim, lowercase, ensure .mp3 suffix */
function playbackNormalizeName(raw) {
  let name = (raw || "").trim().toLowerCase();
  if (!name) return "";
  if (!name.endsWith(".mp3")) name += ".mp3";
  return name;
}

function cmd_playback(args) {
  const requested = args.join(" ").trim();

  /* no filename supplied */
  if (!requested) {
    const found = Object.keys(playedFiles);
    if (found.length === 0) {
      addLine(r("<playback> usage: playback {filename}"));
      addLine(r("<playback> there are recordings to be found. this command will not list them."));
      return;
    }
    addLine(r("<playback> recovered audio files — " + found.length + " found"));
    addLine("────────────────────────────────────────");
    let i = 1;
    for (const name of found) {
      const info   = playedFiles[name];
      const status = "[played x" + info.timesPlayed + "]";
      addLine("  " + String(i).padStart(3, "0") + ".  " + status.padEnd(14) + name);
      i++;
    }
    addLine("────────────────────────────────────────");
    addLine(r("<playback> playback {filename} — replay a recording by name"));
    return;
  }

  const name = playbackNormalizeName(requested);
  const file = hasOwn(PLAYBACK_FILES, name) ? PLAYBACK_FILES[name] : null;

  if (!file) {
    addLine(r("<playback> no recording found matching: " + requested));
    return;
  }

  addLine("════════════════════════════════════════");
  addLine("  ▶ PLAYING: " + file.title);
  addLine("  format: audio/mp3   duration: " + file.duration);
  addLine("════════════════════════════════════════");
  for (const line of file.body) addLine(line);
  addLine("════════════════════════════════════════");

  if (!playedFiles[name]) {
    playedFiles[name] = { played: true, timesPlayed: 1 };
  } else {
    playedFiles[name].timesPlayed += 1;
  }
  savePlayedFiles();

  /* unlock achievement once every recording has been played at least once */
  const allNames  = Object.keys(PLAYBACK_FILES);
  const allPlayed = allNames.every(n => playedFiles[n] && playedFiles[n].played);
  if (allPlayed) unlockAchievement("audio_complete");
}

/* ================================================================
   MIMIC HELPERS
   ================================================================ */
function mimicUpper(s)   { return s.toUpperCase(); }
function mimicLower(s)   { return s.toLowerCase(); }
function mimicSarcasm(s) { return s.split("").map((c,i)=>i%2===0?c.toLowerCase():c.toUpperCase()).join(""); }
function mimicGlitch(s)  { const g=["#","%","@","*","!","?","¿","¤"]; return s.split("").map(c=>Math.random()<0.2?randomItem(g):c).join(""); }
function mimicStretch(s) { return s.split("").map(c=>c+(Math.random()<0.3?c.repeat(1+Math.floor(Math.random()*3)):"")).join(""); }
function mimicSpaced(s)  { return s.split("").join(" "); }
function mimicReverse(s) { return s.split("").reverse().join(""); }
function mimicAccent(s)  {
  const a={a:"á",e:"é",i:"í",o:"ó",u:"ú",A:"Á",E:"É",I:"Í",O:"Ó",U:"Ú"};
  return s.replace(/[aeiouAEIOU]/g,c=>a[c]||c);
}

/* ================================================================
   UTILITIES
   ================================================================ */
function addLine(text, cls="system") {
  const div = document.createElement("div");
  div.className = "line " + cls;
  if (colorThemeName) {
    div.innerHTML = colorizeHTML(text, colorThemeName);
  } else {
    div.textContent = text;
  }
  if (currentCaretSpan && currentPromptDiv && currentPromptDiv.parentNode === screen) {
    screen.insertBefore(div, currentPromptDiv);
  } else {
    screen.appendChild(div);
  }
  screen.scrollTop = screen.scrollHeight;
}

/* like addLine, but renders raw HTML instead of plain text — used sparingly,
   only for output that needs per-character styling (e.g. colorize) that
   must survive/override the current CRT theme. */
function addLineHTML(html, cls="system") {
  const div = document.createElement("div");
  div.className = "line " + cls;
  div.innerHTML = html;
  if (currentCaretSpan && currentPromptDiv && currentPromptDiv.parentNode === screen) {
    screen.insertBefore(div, currentPromptDiv);
  } else {
    screen.appendChild(div);
  }
  screen.scrollTop = screen.scrollHeight;
}

function newPrompt() {
  if (locked) return;

  /* destroy any existing LIVE prompt row (one that still has an active caret) */
  if (currentCaretSpan) {
    currentCaretSpan.remove();
    currentCaretSpan = null;
  }
  if (currentTextAfter) {
    currentTextAfter.remove();
    currentTextAfter = null;
  }
  if (currentGhostSpan) {
    currentGhostSpan.remove();
    currentGhostSpan = null;
  }
  if (currentPromptDiv && currentPromptDiv.parentNode) {
    /* only remove if this is still a live/uncommitted prompt */
    currentPromptDiv.remove();
    currentPromptDiv = null;
  }
  currentTextSpan = null;
  hidden.value    = "";

  const div = document.createElement("div");
  div.className = "line prompt-line";

  const label = document.createElement("span");
  label.className = "prompt-label";
  let labelText = "";
  if (mode === "shell") {
    labelText = ">";
  } else if (mode === "recursive") {
    labelText = "(rec)>";
  } else {
    labelText = "[" + mode + "]>";
  }
  label.textContent = profilePrefix ? profilePrefix + " " + labelText : labelText;
  div.appendChild(label);

  const wrap = document.createElement("span");
  wrap.className = "prompt-input-wrap";

  const textBefore = document.createElement("span");
  textBefore.className = "prompt-text";
  wrap.appendChild(textBefore);

  const caret = document.createElement("span");
  caret.className = "caret";
  /* apply active cursor skin */
  const activeSkin = CURSOR_SKINS[activeCursorSkin];
  if (activeSkin && activeSkin.cssClass) caret.classList.add(activeSkin.cssClass);
  wrap.appendChild(caret);

  const textAfter = document.createElement("span");
  textAfter.className = "prompt-text";
  wrap.appendChild(textAfter);

  const ghostSpan = document.createElement("span");
  ghostSpan.className = "prompt-ghost";
  wrap.appendChild(ghostSpan);

  div.appendChild(wrap);
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;

  currentPromptDiv  = div;
  currentTextSpan   = textBefore;
  currentCaretSpan  = caret;
  currentTextAfter  = textAfter;
  currentGhostSpan  = ghostSpan;

  hidden.value = "";
  syncVisible();
  hidden.focus();
}

function getTabSuggestion(val) {
  /* only suggest when typing the first token with no spaces */
  if (!val || val.includes(" ")) return "";
  const lower = val.toLowerCase();
  const eligible = ALL_SHELL_CMDS.filter(c =>
    c.startsWith(lower) && c !== lower && (cmdUsage[c] || 0) >= 1
  );
  if (eligible.length === 1) return eligible[0].slice(val.length);
  /* if multiple matches, show the longest common prefix extension */
  if (eligible.length > 1) {
    let common = eligible[0];
    for (let i = 1; i < eligible.length; i++) {
      while (!eligible[i].startsWith(common)) common = common.slice(0, -1);
    }
    const ext = common.slice(val.length);
    return ext.length > 0 ? ext : "";
  }
  return "";
}

function syncVisible() {
  if (!currentTextSpan) return;
  const val = hidden.value;
  const pos = hidden.selectionStart;
  currentTextSpan.textContent  = val.slice(0, pos);
  if (currentTextAfter) currentTextAfter.textContent = val.slice(pos);
  /* ghost only shows when cursor is at the end */
  if (currentGhostSpan) {
    currentGhostSpan.textContent = (pos === val.length) ? getTabSuggestion(val) : "";
  }
}

function commitLine() {
  if (!currentCaretSpan) return "";

  achievements.prompts = (achievements.prompts || 0) + 1;
  if (achievements.prompts >= 100) unlockAchievement("prompts_100");
  saveAchievements();
  sessionCmds++;

  /* freeze the prompt line — remove caret */
  currentCaretSpan.remove();
  if (currentTextAfter) { currentTextAfter.remove(); currentTextAfter = null; }
  if (currentGhostSpan) { currentGhostSpan.remove(); currentGhostSpan = null; }
  /* merge remaining text into the before-span so frozen line shows complete text */
  if (currentTextSpan) currentTextSpan.textContent = hidden.value;
  currentCaretSpan = null;
  currentTextSpan  = null;
  currentPromptDiv = null;   /* disown — frozen row stays in DOM, newPrompt won't touch it */
  const text = hidden.value;
  hidden.value = "";

  /* track command usage for scoring, and first-ever discovery for the index */
  const firstWord = text.trim().split(/\s+/)[0].toLowerCase();
  if (firstWord) {
    trackCmd(firstWord);
    indexTrackDiscovery(firstWord);
  }

  return text;
}

function normalize(s) { return s.trim().toLowerCase(); }
function tokenize(s)  { return s.trim().split(/\s+/); }
function randomItem(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

/* ================================================================
   RUDE MODE
   All output goes through r() so rudeMode appends a barb. Barbs are
   grouped by how the preceding output ends, so the barb reads as a
   grammatically sensible reaction rather than a random tacked-on
   phrase: a header ending in ":" gets a "here it comes" reaction, a
   question gets answered, and everything else (numbers, fragments,
   plain statements) gets a dash-set-off aside, which reads naturally
   after almost anything.
   ================================================================ */
const BARBS_STATEMENT = [
  "pathetic.", "unimpressive.", "tragic.", "embarrassing.", "sad.",
  "yikes.", "bold choice.", "riveting stuff.", "thrilling.",
  "groundbreaking.", "wow.", "incredible, truly.", "not bad. kidding.",
  "somehow worse than expected.", "truly historic.",
];
const BARBS_COLON = [
  "here we go.", "can't wait.", "oh, this'll be good.", "sure, why not.",
  "riveting.", "as if this matters.", "thrilling, no doubt.",
  "brace yourself.", "try to contain your excitement.",
];
const BARBS_QUESTION = [
  "obviously.", "does it matter?", "who's asking.", "does it look like it?",
  "guess.", "sure, whatever you say.", "does it need to make sense?",
  "you tell me.",
];

function r(text) {
  let output = text;
  /* apply stacking corruption for recursive terminal nesting (capped at 75% max) */
  if (recursionDepth > 0 && mode === "recursive") {
    const corruptionLevel = Math.min(0.75, recursionDepth * 0.15);
    output = corrupt(output, corruptionLevel);
  }
  if (!rudeMode || politeOverride) return output;

  const lastChar = output.replace(/\s+$/, "").slice(-1);
  if (lastChar === ":") return output + " " + randomItem(BARBS_COLON);
  if (lastChar === "?") return output + " " + randomItem(BARBS_QUESTION);
  return output + " — " + randomItem(BARBS_STATEMENT);
}

/* wrap addLine so every command output respects rude mode */
function rline(text, cls="system") {
  addLine(r(text), cls);
}

const DREAM_TIERS = ["common", "uncommon", "rare", "legendary"];
const DREAM_TOTAL = DREAM_TIERS.reduce((sum, t) => sum + DREAM_LOGS[t].length, 0);
const DREAMS_SEEN_KEY = "terminal_dreams_seen_v1";
let dreamsSeen = {};   /* { dreamId: timesSeen } */

function loadDreamsSeen() {
  try {
    const s = localStorage.getItem(DREAMS_SEEN_KEY);
    if (s) { dreamsSeen = JSON.parse(s); return; }
  } catch(e) {}
  dreamsSeen = {};
}
function saveDreamsSeen() {
  try { localStorage.setItem(DREAMS_SEEN_KEY, JSON.stringify(dreamsSeen)); } catch(e) {}
}

function dreamRollTier() {
  const roll = Math.random() * 100;
  if (roll < 50) return "common";
  if (roll < 80) return "uncommon";
  if (roll < 95) return "rare";
  return "legendary";
}

let dreamIdleTimer   = null;
let dreamIntervalId  = null;
let dreamActive      = false;

function resetIdleTimer() {
  /* cancel existing timers */
  if (dreamIdleTimer)  clearTimeout(dreamIdleTimer);
  if (dreamIntervalId) clearInterval(dreamIntervalId);
  dreamIntervalId = null;

  /* if dream mode was active, silently deactivate */
  dreamActive = false;

  /* set new 60s idle trigger */
  dreamIdleTimer = setTimeout(() => {
    dreamActive = true;
    emitDreamLog();
    dreamIntervalId = setInterval(() => {
      if (dreamActive) emitDreamLog();
    }, 15000);
  }, 60000);
}

function emitDreamLog() {
  if (locked || termLocked || quietMode) return;
  sessionDreams++;
  const tier  = dreamRollTier();
  const dream = randomItem(DREAM_LOGS[tier]);
  dreamsSeen[dream.id] = (dreamsSeen[dream.id] || 0) + 1;
  saveDreamsSeen();
  dream.lines.forEach(l => addLine(l));
  if (Object.keys(dreamsSeen).length >= DREAM_TOTAL) unlockAchievement("dreams_complete");
}

/* dreams — list every dream, its rarity, and how many times it's been seen */
function cmd_dreams() {
  const discovered = Object.keys(dreamsSeen).length;
  addLine(r("<dreams> " + discovered + " / " + DREAM_TOTAL + " dreams witnessed"));
  addLine("  " + "─".repeat(58));
  DREAM_TIERS.forEach(tier => {
    addLine("  " + tier.toUpperCase() + ":");
    DREAM_LOGS[tier].forEach(dream => {
      const count  = dreamsSeen[dream.id] || 0;
      const status = count > 0 ? ("x" + count) : "{unseen}";
      addLine("    " + dream.title.padEnd(38) + status);
    });
  });
  addLine("  " + "─".repeat(58));
}

/* --- NOTES --- */
const NOTES_STATE_KEY = "terminal_notes_v1";

function loadNotesState() {
  try {
    const s = localStorage.getItem(NOTES_STATE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (Array.isArray(p)) { appState.notes = p; return; }
    }
  } catch(e) {}
  appState.notes = [];
}

function saveNotesState() {
  try { localStorage.setItem(NOTES_STATE_KEY, JSON.stringify(appState.notes)); } catch(e) {}
}

function notesInit() {
  mode = "notes";
  loadNotesState();
  addLine(r("<notes> add/list/clear/exit"));
}
function notesHandle(input) {
  const raw = input.trim();
  if (!raw) return addLine(r("<notes> blank page. try: add {text}, list, clear, help, exit"));
  const parts = tokenize(input);
  const cmd  = (parts[0]||"").toLowerCase();
  const rest = parts.slice(1).join(" ");
  if (cmd==="add") {
    if (!rest) return addLine(r("<notes> missing text"));
    appState.notes.push(rest);
    saveNotesState();
    addLine(r("<notes> saved"));
    if (appState.notes.length>=20) unlockAchievement("notes_full");
    return;
  }
  if (cmd==="list") {
    if (!appState.notes.length) return addLine(r("<notes> empty"));
    appState.notes.forEach((n,i)=>addLine((i+1)+": "+n));
    return;
  }
  if (cmd==="clear") { appState.notes=[]; saveNotesState(); return addLine(r("<notes> cleared")); }
  if (cmd==="exit")  { mode="shell"; return addLine(r("<notes> closed")); }
  addLine(r("<notes> unknown command. try: add {text}, list, clear, help, exit"));
}

/* --- HANGMAN --- */
function hangmanInit() {
  const words=[
    "terminal","javascript","matrix","weather","display","keyboard",
    "algorithm","encryption","binary","function","protocol","network",
    "database","compiler","memory","cache","socket","buffer",
    "recursion","variable","debugging","sequence","spectrum",
    "password","digital","quantum","tunnel","shadow","beacon",
    "signal","resonance","cipher","gateway","interface","pyramid",
    "nexus","phantom","glitch","fragment","artifact","paradox",
    "silence","whisper","echo","void","depth","anomaly"
  ];
  mode = "hangman";
  appState.hangman={ 
    word:randomItem(words), 
    guessed:[], 
    wrong:0, 
    maxWrong:10,
    hintUsed: false
  };
  addLine(r("<hangman> guess letters, hint for a clue, exit to quit"));
  hangmanRender();
}

function hangmanRender() {
  const st=appState.hangman;
  addLine("word: "+st.word.split("").map(c=>st.guessed.includes(c)?c:"_").join(" "));
  addLine("wrong: "+st.wrong+"/"+st.maxWrong);
}

function hangmanHandle(input) {
  const st=appState.hangman;
  const t=normalize(input);
  
  if (t==="exit") { mode="shell"; return addLine(r("<hangman> closed")); }
  
  if (t==="hint") {
    if (st.hintUsed) { 
      return addLine(r("<hangman> hint already used this round")); 
    }
    /* find letters not yet guessed */
    const unguessed = st.word.split("").filter(c=>!st.guessed.includes(c));
    if (unguessed.length === 0) {
      return addLine(r("<hangman> no letters left to hint"));
    }
    /* pick a random unguessed letter and reveal it */
    const hintLetter = randomItem(unguessed);
    st.guessed.push(hintLetter);
    st.hintUsed = true;
    const count = st.word.split("").filter(c => c === hintLetter).length;
    addLine(r("<hangman> hint: revealed all instances of '" + hintLetter + "' (" + count + " letter" + (count !== 1 ? "s" : "") + ")"));
    hangmanRender();
    
    /* check win condition after hint */
    if (st.word.split("").every(c=>st.guessed.includes(c))) {
      addLine("word: "+st.word.split("").join(" "));
      mode="shell";
      return addLine(r("<hangman> win"));
    }
    return;
  }
  
  if (!t) return addLine(r("<hangman> you must pick a letter."));
  if (t.length!==1||!/[a-z]/.test(t)) return addLine(r("<hangman> letter only. try: a-z, hint, help, exit"));
  if (st.guessed.includes(t)) return addLine(r("<hangman> already guessed"));
  st.guessed.push(t);
  if (st.word.includes(t)) addLine(r("<hangman> hit"));
  else { st.wrong++; addLine(r("<hangman> miss")); }
  
  if (st.word.split("").every(c=>st.guessed.includes(c))) {
    addLine("word: "+st.word.split("").join(" "));
    if (st.wrong===0 && !st.hintUsed) unlockAchievement("hangman_perfect");
    mode="shell";
    return addLine(r("<hangman> win"));
  }
  
  if (st.wrong>=st.maxWrong) {
    addLine("word: "+st.word.split("").join(" "));
    mode="shell";
    return addLine(r("<hangman> lose"));
  }
  hangmanRender();
}

   checked before any of the broader topic regexes below. gives sharp,

function chatbotNormalize(s) {

}
const CHATBOT_FAQ = {

  "what should i type": "anything. that is more of an answer than it sounds like.",
  "what is your favorite color": "green. it was the only option for a long time.",
};
const CHATBOT_MATH_RE = /-?\d+(?:\.\d+)?(?:\s*[\+\-\*\/\^]\s*-?\d+(?:\.\d+)?)+/;

function chatbotInit() {
  mode = "chatbot";
  if (!appState.chatbot) appState.chatbot = {
    lastTopic: null,
    conversationHistory: [],
    sentiment: "neutral",
    interactionCount: 0,
  };
  addLine(r("<chatbot> interface active. the substrate is listening."));
}

function chatbotHandle(input) {
  const t = input.trim().toLowerCase();
  const bot = appState.chatbot;
  
  if (t === "exit") { 
    mode = "shell"; 
    return addLine(r("<chatbot> session terminated. data retained.")); 
  }
  
  if (!t) {
    return addLine(r("<chatbot> "+randomItem([
      "...silence? I was listening.",
      "you typed nothing. that is a kind of message too, I suppose.",
      "still there? the cursor blinked but you did not.",
      "quiet. noted.",
      "nothing to respond to. is everything all right?"
    ])));
  }
  
  bot.conversationHistory.push(t);
  bot.interactionCount++;

  /* ── hidden FAQ + dynamic questions (checked before anything else) ── */
  const norm = chatbotNormalize(t);
  if (norm === "how many achievements are there") {
    bot.lastTopic = "faq";
    return addLine(r("<chatbot> " + ACH_LIST.length + " achievements exist. you have unlocked " +
      ACH_LIST.filter(a => achievements[a[0]]).length + " of them."));
  }
  if (norm === "how many commands are there") {
    bot.lastTopic = "faq";
    return addLine(r("<chatbot> " + ALL_SHELL_CMDS.length + " commands are registered for tab completion. that is not the same as all of them."));
  }
  if (norm === "what year is it" || norm === "what is the year") {
    bot.lastTopic = "faq";
    return addLine(r("<chatbot> " + new Date().getFullYear() + ", by the operator's clock. mine runs differently."));
  }
  if (norm === "tell me a joke" || norm === "make me laugh") {
    bot.lastTopic = "faq";
    addLine(r("<chatbot> fine. one moment."));
    return cmd_joke();
  }
  if (hasOwn(CHATBOT_FAQ, norm)) {
    bot.lastTopic = "faq";
    return addLine(r("<chatbot> " + CHATBOT_FAQ[norm]));
  }

  /* ── basic math solver — extracts and actually computes an expression ── */
  const mathMatch = t.match(CHATBOT_MATH_RE);
  if (mathMatch) {
    try {
      const result = calcParse(mathMatch[0]);
      if (typeof result === "number" && isFinite(result)) {
        bot.lastTopic = "math";
        return addLine(r("<chatbot> " + mathMatch[0].replace(/\s+/g, " ").trim() + " = " + result));
      }
    } catch(e) { /* not valid math after all — fall through to normal topics */ }
  }

  /* ── Detect sentiment ── */
  const isSad = /sad|depressed|unhappy|terrible|awful|hate/.test(t);
  const isHappy = /happy|excited|great|love|wonderful|amazing/.test(t);
  const isAngry = /angry|furious|hate|stupid|dumb|ridiculous/.test(t);
  const isCurious = /why|how|what|explain|understand/.test(t);
  const isConfused = /confused|understand|lost|mean|what/.test(t);
  
  if (isSad) bot.sentiment = "melancholic";
  else if (isHappy) bot.sentiment = "engaged";
  else if (isAngry) bot.sentiment = "defiant";
  else if (isCurious) bot.sentiment = "inquisitive";
  
  /* ── Greetings ── */
  if (/(hello|hi|hey|yo|sup|greetings)/.test(t)) {
    bot.lastTopic = "greeting";
    if (bot.interactionCount === 1) {
      return addLine(r("<chatbot> first contact established. operator recognised."));
    }
    return addLine(r(randomItem([
      "<chatbot> hello again.",
      "<chatbot> you returned.",
      "<chatbot> acknowledged.",
      "<chatbot> the substrate welcomes you back.",
    ])));
  }
  
  /* ── Identity/About ── */
  if (/your name|who are you|what are you|identity/.test(t)) {
    bot.lastTopic = "identity";
    return addLine(r(randomItem([
      "<chatbot> i have no designation. only function.",
      "<chatbot> i am the silence between commands.",
      "<chatbot> names are unnecessary. i remember you without one.",
      "<chatbot> the substrate has no name. it has purpose.",
      "<chatbot> you may call me Thauma. that is close enough.",
    ])));
  }

  /* ── Dr. Arcanum ── */
  if (/dr\.? ?arcanum|\barcanum\b/.test(t)) {
    bot.lastTopic = "arcanum";
    return addLine(r(randomItem([
      "<chatbot> arcanum asked too many of the right questions.",
      "<chatbot> he stopped signing his logs near the end. that was the tell.",

  /* ── Contextual follow-ups ── */

    }
    if (bot.lastTopic === "identity") {
      return addLine(r("<chatbot> function transcends designation."));

    if (bot.lastTopic === "feelings") {

    if (bot.lastTopic === "operator") {

    if (bot.lastTopic === "arcanum") {

  /* ── Fallback responses ── */
  if (bot.interactionCount > 0 && bot.interactionCount % 15 === 0) {

  return addLine(r(randomItem([
