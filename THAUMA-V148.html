/* ── Highlighted commands ── a fresh set of 5 picked once per session to
   nudge exploration. Some entries are pairs — both halves must be run to
   count. Completing all 5, then running "help" again, claims a small
   one-time token reward. Never pulls from the hidden thauma-* chain or
   anything destructive/disorienting (hardreboot, keyclear, shutdown,
   chmod, import). lock/unlock is included as a pair rather than alone,
   since trying the full lock→unlock cycle is safe but either half in
   isolation is not something to nudge someone into blind. */
const HIGHLIGHT_POOL = [
  "fortune", "wisdom", "joke", "namegen", "mimic", "tale", "spirit",
  "vibe", "mood", "roll", "flip", "ascii", "banner", "crt", "map",
  "calc", "inventory", "cast", "index", "lantern", "driftclock",
  "uptime", "sessionstats", "history", "achievements", "poke", "holiday",
  "notes", "weather", "pet", "job", "arena", "maze", "sokoban", "rpg", "gamble",
  "hangman", "chatbot", "bind", "export", "keys", "profile",
  "settings", "colorize", "textsize", "btheme", "cursor", "vignette",
  "graveyard", "dreams", "snack", "nap", "choose", "passgen",
  ["encrypt", "decrypt"],
  ["cursorequip", "cursorunequip"],
  ["themesave", "themeload"],
  ["lock", "unlock"],
];
const HIGHLIGHT_REWARD = 15;

let highlightedCmds = null;      /* this session's 5 picks (string or [a,b] pairs) */
let highlightUsed = {};          /* { commandName: true } — run at least once this session */
let highlightRewardClaimed = false;

function pickHighlights() {
  const pool = HIGHLIGHT_POOL.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  highlightedCmds = pool.slice(0, 5);
  highlightUsed = {};
  highlightRewardClaimed = false;
}

function highlightLabel(entry) {
  return Array.isArray(entry) ? entry.join(" / ") : entry;
}

function highlightEntryDone(entry) {
  return Array.isArray(entry) ? entry.every(c => highlightUsed[c]) : !!highlightUsed[entry];
}

function highlightAllDone() {
  return !!highlightedCmds && highlightedCmds.every(highlightEntryDone);
}

/* called from the main shell dispatch for every command that runs */
function trackHighlightUsage(cmd) {
  if (!highlightedCmds) return;
  for (const entry of highlightedCmds) {
    if (Array.isArray(entry) ? entry.includes(cmd) : entry === cmd) {
      highlightUsed[cmd] = true;
    }
  }
}

function cmd_theme(args) {
  const t=(args[0]||"").toLowerCase();
  const builtins={green:"#00ff00",amber:"#ffbf00",cyan:"#00ffff",magenta:"#ff00ff",white:"#ffffff"};
  const currentBg = getCurrentBgColor();

  /* colorize text themes — the reward for unlocking every achievement: every
     colorize style (rainbow, fire, ocean, ...) becomes a text theme. they color
     output per character the way "colorize" does, rather than setting a single
     --fg color, and have no background-theme equivalent. "theme {style}" works
     unless a built-in or shop theme already owns the name (shop "ice"), and
     "theme colorize {style}" always reaches the colorize one. */
  const hasStyle = name => Object.prototype.hasOwnProperty.call(COLORIZE_STYLES, name);
  let colorStyle = null;
  if (t === "colorize") {
    colorStyle = (args[1] || "").toLowerCase();
  } else if (hasStyle(t) && !hasOwn(builtins, t) &&
             !((typeof JOB_THEMES !== "undefined") && JOB_THEMES.some(x => x.id === t))) {
    colorStyle = t;
  }
  if (colorStyle !== null) {
    if (!hasStyle(colorStyle)) {
      addLine(r("<theme> usage: theme colorize {style} — styles: " + Object.keys(COLORIZE_STYLES).join(" ")));
      return;
    }
    if (!colorizeStyleUnlocked(colorStyle)) {
      const item = COLORIZE_SHOP.find(x => x.style === colorStyle);
      addLine(r("<theme> " + colorStyle + " is locked — buy it in the job shop (" + item.cost + " tokens), or unlock every achievement"));
      return;
    }
    colorizeThemeApply(colorStyle);
    addLine(r("<theme> " + colorStyle));
    return;
  }
  /* any other theme selection exits a colorize text theme */
  if (colorThemeName) {
    colorThemeName = null;
    try { localStorage.removeItem(RAINBOW_THEME_KEY); } catch(e) {}
  }

  /* check built-ins first */
  if(hasOwn(builtins, t)){
    const fgColor = builtins[t];
    if (fgColor === currentBg) {
      addLine(r("<theme> cannot set foreground to match background color (would be invisible)"));
      return;
    }
    document.documentElement.style.setProperty("--fg",fgColor);
    /* built-in selected — clear any job active theme so job app won't override */
    jobActiveTheme = null;
    try { localStorage.setItem("terminal_theme", t); } catch(e) {}
    try { localStorage.setItem("terminal_active_color", fgColor); } catch(e) {}
    try { localStorage.setItem(JOB_ACTIVE_KEY, ""); } catch(e) {}
    addLine(r("<theme> "+t));
    return;
  }
  /* check purchased job themes */
  const jt = (typeof JOB_THEMES !== "undefined") && JOB_THEMES.find(x => x.id === t && x.color);
  if(jt){
    if(!(jobUnlocked && jobUnlocked.includes(t))){
      const colorAlt = (hasStyle(t) && colorizeStyleUnlocked(t))
        ? "  (or: theme colorize " + t + ")" : "";
      addLine(r("<theme> " + t + " not unlocked — purchase it in the job shop first" + colorAlt));
      return;
    }
    if (jt.color === currentBg) {
      addLine(r("<theme> cannot set foreground to match background color (would be invisible)"));
      return;
    }
    document.documentElement.style.setProperty("--fg", jt.color);
    jobActiveTheme = t;
    try { localStorage.setItem(JOB_ACTIVE_KEY, t); } catch(e) {}
    try { localStorage.setItem("terminal_active_color", jt.color); } catch(e) {}
    try { localStorage.removeItem("terminal_theme"); } catch(e) {}
    addLine(r("<theme> "+t));
    return;
  }
  addLine(r("<theme> unknown — try: green amber cyan magenta white  (or a purchased job theme, or any colorize style once every achievement is unlocked)"));
}

/* ── Background theme command ──────────────────────────────────── */
function cmd_btheme(args) {
  const b = (args[0] || "").toLowerCase();
  if (!b) return bthemeList();
  const currentFg = getCurrentFgColor();

  /* drop a pattern and go back to the solid colour underneath */
  if (b === "none" || b === "off" || b === "default") {
    if (!activeBthemePattern) { addLine(r("<btheme> no pattern is active.")); return; }
    bthemeClearPattern();
    const back = bthemeSolidColor(activeBtheme) || BUILTIN_BTHEMES.black;
    document.documentElement.style.setProperty("--bg", back);
    addLine(r("<btheme> pattern removed — back to " + (bthemeSolidColor(activeBtheme) ? activeBtheme : "black")));
    return;
  }

  /* patterns */
  if (hasOwn(BTHEME_PATTERNS, b)) {
    if (!bthemePatternUnlocked(b)) {
      addLine(r("<btheme> " + b + " is locked — buy it in the job shop (" + bthemePatternCost(b) + " tokens), or unlock every achievement"));
      return;
    }
    if (BTHEME_PATTERNS[b].base.toLowerCase() === currentFg.toLowerCase()) {
      addLine(r("<btheme> cannot set background to match foreground color (would be invisible)"));
      return;
    }
    bthemeApplyPattern(b);
    addLine(r("<btheme> " + b));
    return;
  }

  /* check built-ins first */
  if (hasOwn(BUILTIN_BTHEMES, b)) {
    const bgColor = BUILTIN_BTHEMES[b];
    if (bgColor === currentFg) {
      addLine(r("<btheme> cannot set background to match foreground color (would be invisible)"));
      return;
    }
    bthemeClearPattern();
    document.documentElement.style.setProperty("--bg", bgColor);
    activeBtheme = b;
    saveBtheme();
    addLine(r("<btheme> " + b));
    return;
  }

  /* check purchased job themes (can be used for background too) */
  const jt = (typeof JOB_THEMES !== "undefined") && JOB_THEMES.find(x => x.id === b && x.color);
  if (jt) {
    if (!(jobUnlocked && jobUnlocked.includes(b))) {
      addLine(r("<btheme> " + b + " not unlocked — purchase it in the job shop first"));
      return;
    }
    if (jt.color === currentFg) {
      addLine(r("<btheme> cannot set background to match foreground color (would be invisible)"));
      return;
    }
    bthemeClearPattern();
    document.documentElement.style.setProperty("--bg", jt.color);
    activeBtheme = b;
    saveBtheme();
    addLine(r("<btheme> " + b));
    return;
  }

  addLine(r("<btheme> unknown — try: black navy darkred darkgreen stripes gradient  (btheme lists them all)"));
}

/* ── Question generation ────────────────────────────────────────── */
function jobHash(str) {
  /* simple djb2 */
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
  return (h >>> 0).toString(16);
}

function jobMakeQuestion() {
  /* try up to 30 times to get a fresh question */
  for (let attempt = 0; attempt < 30; attempt++) {
    const q = jobGenQuestion();
    const h = jobHash(q.question);
    if (!jobAskedHashes.includes(h)) {
      jobAskedHashes.push(h);
      saveJobHashes();
      return q;
    }
  }
  /* fallback: just return a fresh one and accept the repeat */
  return jobGenQuestion();
}

function jobGenQuestion() {
  const type = Math.floor(Math.random() * 4);
  if (type === 0) return jobMathQ();
  if (type === 1) return jobLogicQ();
  if (type === 2) return jobTriviaQ();
  return jobMultipleChoiceQ();
}

function jobMathQ() {
  const ops = ["+", "-", "*"];
  const op  = randomItem(ops);
  let a, b, answer;
  if (op === "+") { a = Math.floor(Math.random()*50)+1; b = Math.floor(Math.random()*50)+1; answer = a + b; }
  if (op === "-") { a = Math.floor(Math.random()*50)+20; b = Math.floor(Math.random()*a)+1; answer = a - b; }
  if (op === "*") { a = Math.floor(Math.random()*12)+1;  b = Math.floor(Math.random()*12)+1; answer = a * b; }
  return { question: "math: " + a + " " + op + " " + b + " = ?", answer: String(answer), category: "math" };
}

  for (let i = opts.length - 1; i > 0; i--) {

  const options = {};

/* ── Streak reward (tiered system) ──────────────────────────────── */
function jobStreakReward(streak) {
  if (streak >= 15) return 25;
  if (streak >= 5)  return 10;
  if (streak >= 2)  return 5;
  return 1;         /* 1+ streak */
}

function jobStreakDisplay() {
  return jobStreak > 9999 ? "9999+" : String(jobStreak);
}

/* jobSubmode: "idle" | "question" | "lottery_confirm" */
let jobSubmode = "idle";

const JOB_STREAK_MILESTONES = {
  5:    "five in a row. a pattern, not a fluke.",
  10:   "ten correct answers straight. the questions are not getting easier.",
  25:   "twenty-five. whoever wrote these is starting to run out of new ones.",
  50:   "fifty in a row. that is not luck anymore.",
  75:   "seventy-five straight. the streak has its own gravity now.",
  100:  "one hundred correct answers in a row. round numbers like this do not happen by accident.",
  1000: "one thousand correct answers in a row. something about that number should concern you more than it does.",
};

function jobCheckAnswer(input) {
  const given    = input.trim().toLowerCase();
  const expected = jobPendingQ.answer.toLowerCase();
  const options  = jobPendingQ.options;
  const category = jobPendingQ.category;
  jobPendingQ  = null;
  jobSubmode   = "idle";

  if (given === expected) {
    jobStreak++;
    const reward = jobStreakReward(jobStreak);
    const bonus = pleaseBonus(reward);
    jobTokens += reward + bonus;
    saveJobTokens();
    addLine("<job:work> correct!  +" + reward + " token" + (reward !== 1 ? "s" : "") + "  (streak: " + jobStreakDisplay() + ")");
    pleaseNote(bonus);
    addLine("  balance: " + jobTokens + " tokens");
    const streakLine = JOB_STREAK_MILESTONES[jobStreak];
    if (streakLine) {
      addLine("");
      addLine("<job:work> [streak] " + streakLine);
    }
  } else {
    jobStreak = 0;
    if (options) {
      addLine("<job:work> incorrect. expected: " + expected + ") " + options[expected]);
    } else {
      addLine("<job:work> incorrect. expected: " + expected);
      if (category === "math") {
        const givenNum    = parseFloat(given);
        const expectedNum = parseFloat(expected);
        if (!isNaN(givenNum) && !isNaN(expectedNum) && Math.abs(givenNum - expectedNum) >= 100) {
          addLine("<job:work> that wasn't close. that wasn't in the neighborhood. impressive, somehow.");
        }
      }
    }
    addLine("  streak reset. balance: " + jobTokens + " tokens");
  }
}

function jobLottery() {
  if (jobTokens < 2) {
    addLine("<job:lottery> insufficient tokens. costs 2 tokens to play.");
    return;
  }
  jobTokens -= 2;
  saveJobTokens();
  const nice = pleaseActive;           /* the draw finishes after this line ends, so keep the flag */
  addLine("<job:lottery> ticket purchased. drawing...");

  const frames = ["[ ? ]", "[ * ]", "[ @ ]", "[ # ]", "[ ! ]", "[ ? ]", "[ * ]"];
  let i = 0;
  function spin() {
    addLine("  " + frames[i % frames.length]);
    i++;
    if (i < 8) { setTimeout(spin, 120); return; }
    /* result — tiered prizes, checked rarest-first so ranges don't overlap:
       0.1% jackpot (1000), 2% major (100), 25% small (5), else nothing */
    const pw = pleaseWeights([0.001, 0.02, 0.25, 0.729], nice);   /* please: jackpot likelier, "no match" less so */
    let roll = Math.random() * pw.reduce((a, b) => a + b, 0), tier = 3;
    for (let k = 0; k < 4; k++) { if (roll < pw[k]) { tier = k; break; } roll -= pw[k]; }
    const prize = [1000, 100, 5, 0][tier];
    const bonus = pleaseBonus(prize, nice);
    if (prize > 0) { jobTokens += prize + bonus; saveJobTokens(); }
    if (tier === 0)      addLine("<job:lottery> *** JACKPOT ***  +" + prize + " tokens!");
    else if (tier === 1) addLine("<job:lottery> *** MAJOR PRIZE ***  +" + prize + " tokens!");
    else if (tier === 2) addLine("<job:lottery> small win.  +" + prize + " tokens.");
    else                 addLine("<job:lottery> no match. better luck next time.");
    pleaseNote(bonus);
    addLine("  balance: " + jobTokens + " tokens");
  }
  spin();
}

function jobBuyBtheme(c) {
  const id = bthemeId(c.pattern);
  if (jobUnlocked.includes(id)) { addLine("<job:buy> you already own the " + c.pattern + " background: btheme " + c.pattern); return; }

  jobUnlocked.push(id);

  addLine("<job:buy> purchased background: " + c.pattern + "  (cost: " + c.cost + " tokens)");

function jobBuy(themeName) {
  const id = (themeName || "").toLowerCase().trim();
  const t  = JOB_THEMES.find(x => x.id === id);
  /* colorize text themes: "buy fire" or "buy colorize fire". shop themes keep their names
     ("buy ice" is the shop's colour theme; the free colorize ice is "theme colorize ice") */
  const cname = id.replace(/^colorize[\s_-]*/, "");
  const csold = COLORIZE_SHOP.find(x => x.style === cname);
  if (csold && (!t || id !== cname)) return jobBuyColorize(csold);
  /* background patterns: "buy plaid" or "buy btheme plaid" (their names never collide with the themes above) */
  const bname = id.replace(/^(?:btheme|background|bg)[\s_-]*/, "");
  const bsold = BTHEME_SHOP.find(x => x.pattern === bname);
  if (bsold && !t) return jobBuyBtheme(bsold);
  if (BTHEME_FREE.includes(bname) && !t) {
    addLine("<job:buy> the " + bname + " background is free: btheme " + bname);
    return;
  }
  if (COLORIZE_FREE.includes(cname) && id !== cname) {
    addLine("<job:buy> the " + cname + " colorize theme is free: theme colorize " + cname);
    return;
  }
  if (!t) {
    addLine("<job:buy> unknown theme. type shop to see the list.");
    addLine("  available: " + JOB_THEMES.map(x => x.id).join(", "));
    return;
  }
  if (jobUnlocked.includes(id)) {
    addLine("<job:buy> you already own " + id + ".");
    return;
  }
  if (jobTokens < t.cost) {
    addLine("<job:buy> insufficient tokens. need " + t.cost + ", have " + jobTokens + ".");
    return;
  }
  jobTokens -= t.cost;
  jobUnlocked.push(id);
  saveJobTokens();
  saveJobUnlocked();
  /* check theme collector achievement */
  if (JOB_THEMES.every(x => jobUnlocked.includes(x.id))) {
    unlockAchievement("theme_collector");
  }
  /* apply immediately (color themes only) */
  if (t.color) {
    jobActiveTheme = id;
    saveJobActive();
    jobApplyTheme(id);
    addLine("<job:buy> purchased: " + id + "  (cost: " + t.cost + " tokens)");
    addLine("  theme applied. balance: " + jobTokens + " tokens");
  } else {
    /* cursor skin — just confirm purchase */
    addLine("<job:buy> purchased: " + id + "  (cost: " + t.cost + " tokens)");
    const skinName = id.replace("cursor_", "");
    addLine("  equip with: cursorequip " + skinName);
    addLine("  balance: " + jobTokens + " tokens");
  }
}

function jobTheme(themeName) {
  const id = (themeName || "").toLowerCase().trim();
  if (!id) {
    addLine("<job:theme> specify a theme name. type shop to see owned themes.");
    if (jobUnlocked.length) addLine("  owned: " + jobUnlocked.join(", "));
    return;
  }
  if (!jobUnlocked.includes(id)) {
    addLine("<job:theme> " + id + " is not unlocked. buy it first.");
    return;
  }
  if (jobActiveTheme === id) {
    /* toggle off — revert to last built-in or default green */
    jobActiveTheme = null;
    saveJobActive();
    try { localStorage.removeItem("terminal_active_color"); } catch(e) {}
    const savedBuiltin = localStorage.getItem("terminal_theme");
    const builtinColor = savedBuiltin && BUILTIN_THEMES[savedBuiltin] ? BUILTIN_THEMES[savedBuiltin] : "#00ff00";
    document.documentElement.style.setProperty("--fg", builtinColor);
    addLine("<job:theme> " + id + " deactivated. reverted to default.");
    return;
  }
  jobActiveTheme = id;
  saveJobActive();
  jobApplyTheme(id);
  addLine("<job:theme> " + id + " activated.");
}

/* ── Main input handler ─────────────────────────────────────────── */
function jobHandle(input) {
  const raw  = input.trim();
  const parts = raw.split(/\s+/);
  const cmd  = parts[0].toLowerCase();

  /* while waiting for a question answer */
  if (jobSubmode === "question") {
    jobCheckAnswer(raw);
    return;
  }

  if (!raw) { addLine(r(randomItem(NO_COMMAND_MESSAGES))); return; }

  switch (cmd) {
    case "work":    return jobWork();
    case "lottery": return jobLottery();
    case "shop":    return jobShop();
    case "balance":
      addLine("<job> balance: " + jobTokens + " tokens");
      return;
    case "streak":
      addLine("<job> current streak: " + jobStreakDisplay());
      return;
    case "buy":
      return jobBuy(parts.slice(1).join(" "));
    case "theme":
      return jobTheme(parts.slice(1).join(" "));
    case "cursorequip":
      return cmd_cursor(["equip", parts[1] || ""]);
    case "cursorunequip":
      return cmd_cursor(["unequip"]);
    case "exit":
      mode = "shell";
      addLine("<job> session closed. tokens saved.");
      return;
    default:
      addLine("<job> unknown command. try: work  lottery  shop  buy {theme}  theme {theme}");
      addLine("  balance  streak  cursorequip {skin}  cursorunequip  help  exit");
  }
}

/* ── hidden debug/cheat command — intentionally excluded from help menu
   and tab completion. instantly unlocks all lore mail, recover files,
   playback files, and completes the thauma command chain. ── */
function cmd_unlock_everything() {
  /* lore mail — unlock every mail (does not force-mark as read) */
  for (const mail of LORE_MAILS) {
    if (!mailState.unlocked.includes(mail.id)) mailState.unlocked.push(mail.id);
  }
  mailState.firstOpen = true;
  mailState.deliveryIndex = LORE_MAILS.length;
  saveMailState();
  finalSetUnlocked();

  /* recover .txt files */
  for (const name of Object.keys(RECOVER_FILES)) {
    if (!recoveredFiles[name] || typeof recoveredFiles[name] !== "object") {
      recoveredFiles[name] = { recovered: true, timesRead: 1 };
    } else {
      recoveredFiles[name].recovered = true;
    }
  }
  saveRecoveredFiles();

  /* playback .mp3 files */
  for (const name of Object.keys(PLAYBACK_FILES)) {
    if (!playedFiles[name]) {
      playedFiles[name] = { played: true, timesPlayed: 1 };
    } else {
      playedFiles[name].played = true;
    }
  }
  savePlayedFiles();

  /* thauma command chain — mark fully complete */
  chainState.reached = THAUMA_CHAIN.length;
  saveChainState();

  /* tokens */
  jobTokens += 9999;
  saveJobTokens();

  /* index — reveal every category's real label/note without touching
     any of the underlying progress numbers (no [UNKNOWN], no 100%) */
  for (const key of Object.keys(INDEX_DATA)) {
    if (key === "_unknown") continue;
    indexCategoryRevealed[key] = true;
  }
  saveIndexCategoryRevealed();

  /* job shop — unlock every theme and cursor skin */
  for (const t of JOB_THEMES) {
    if (!jobUnlocked.includes(t.id)) jobUnlocked.push(t.id);
  }
  saveJobUnlocked();

  /* cast — discover every spell */
  for (const tier of CAST_TIERS) {
    for (const spell of CAST_SPELLS[tier]) {
      if (!castCollection[spell]) castCollection[spell] = 1;
    }
  }
  saveCastCollection();
  if (Object.keys(castCollection).length >= CAST_TOTAL_SPELLS) unlockAchievement("cast_complete");

  /* dreams — witness every dream */
  for (const tier of DREAM_TIERS) {
    for (const dream of DREAM_LOGS[tier]) {
      if (!dreamsSeen[dream.id]) dreamsSeen[dream.id] = 1;
    }
  }
  saveDreamsSeen();
  if (Object.keys(dreamsSeen).length >= DREAM_TOTAL) unlockAchievement("dreams_complete");

  /* rpg — find every ending (saved, so the app shows them on its next open) */

/* session-only; persists across page reloads via localStorage */
const CHAIN_KEY = "terminal_thauma_chain_v1";
let chainState = {
  reached: 0,   /* index of the last successfully invoked command (1-based; 0 = none) */
};

function loadChainState() {
  try {
    const s = localStorage.getItem(CHAIN_KEY);
    if (s) { const p = JSON.parse(s); if (p && typeof p.reached === "number") chainState = p; }
  } catch(e) {}
}

function saveChainState() {
  try { localStorage.setItem(CHAIN_KEY, JSON.stringify(chainState)); } catch(e) {}
}

/* guard: returns true and prints denial if the precursor hasn't been run */
function chainGuard(requiredIndex) {
  /* requiredIndex is the 1-based index of the command that must have been run */
  if (chainState.reached < requiredIndex) {
    addLine("<thauma> sequence incomplete. required precursor command not yet invoked.");
    return false;
  }
  return true;
}

/* advance the chain counter after a command successfully runs */
function chainAdvance(index) {
  if (chainState.reached < index) {
    chainState.reached = index;
    saveChainState();
  }
}

/* glitch fragment helpers */
const G_CHARS = "▓▒░█▄▀■□▪▫◆◇●○";
function gFrag(len) {
  let s = "";
  for (let i = 0; i < len; i++) s += G_CHARS[Math.floor(Math.random() * G_CHARS.length)];
  return s;
}
function corrupt(str, corruptionLevel = 0.18) {
  /* whisper prefix suppresses all corruption/glitch effects */
  if (whisperMode) return str;
  /* clamp corruption level to 0-1 range */
  const level = Math.max(0, Math.min(1, corruptionLevel));
  return str.split("").map(c => Math.random() < level ? G_CHARS[Math.floor(Math.random()*G_CHARS.length)] : c).join("");
}

/* ================================================================
   COMMAND GLITCHES
   Every shell command has a 10% chance to glitch when it runs. A glitch
   is one of two things, 50/50, and lasts half a second:
     - corrupt: half of the characters in the command's output are
                swapped for glitch blocks, then put back
     - flicker: the command's output stutters in brightness
   Only the lines that command printed are touched; the typed command
   and the live prompt never are. "whisper" suppresses glitches (as it
   does every other corruption), "dry" never runs the command, and
   commands that replace the whole screen or the page are left alone.
   Flicker is skipped when the system asks for reduced motion.
   ================================================================ */
const CMD_GLITCH_CHANCE  = 0.10;
const CMD_GLITCH_CORRUPT = 0.50;   /* of the glitches: corrupt (else flicker) */
const CMD_GLITCH_MS      = 500;
const CMD_GLITCH_SKIP    = ["clear", "hardreboot", "shutdown", "import"];

function glitchReducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
  catch (e) { return false; }
}

/* roll before the command runs; returns null (no glitch) or a context for glitchAfterCommand */
function glitchBeforeCommand(rawCmd) {
  if (whisperMode) return null;
  if (Math.random() >= CMD_GLITCH_CHANCE) return null;
  const word = String(rawCmd).trim().toLowerCase().replace(/^sudo\s+/, "").split(/\s+/)[0] || "";
  if (!word || CMD_GLITCH_SKIP.includes(word)) return null;
  const kind = Math.random() < CMD_GLITCH_CORRUPT ? "corrupt" : "flicker";
  if (kind === "flicker" && glitchReducedMotion()) return null;
  return { kind: kind, before: new Set(Array.from(screen.children)) };
}

/* after the command has printed: glitch just the lines it added */
function glitchAfterCommand(ctx) {
  if (!ctx) return;
  const lines = Array.from(screen.children).filter(el =>
    !ctx.before.has(el) && el.classList &&
    el.classList.contains("line") && !el.classList.contains("prompt-line"));
  if (!lines.length) return;

  if (ctx.kind === "flicker") {
    lines.forEach(el => el.classList.add("cmd-flicker"));
    setTimeout(() => lines.forEach(el => el.classList.remove("cmd-flicker")), CMD_GLITCH_MS);
    return;
  }

  /* corrupt exactly half of the visible (non-space) characters */
  const nodes = [];
  lines.forEach(el => {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = walker.nextNode())) nodes.push(n);
  });
  const originals = nodes.map(n => n.data);
  const chars = originals.map(s => Array.from(s));
  const slots = [];
  chars.forEach((arr, i) => arr.forEach((c, k) => { if (!/\s/.test(c)) slots.push([i, k]); }));
  if (!slots.length) return;
  for (let i = slots.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = slots[i]; slots[i] = slots[j]; slots[j] = t;
  }
  slots.slice(0, Math.max(1, Math.floor(slots.length / 2))).forEach(([i, k]) => {
    chars[i][k] = G_CHARS[Math.floor(Math.random() * G_CHARS.length)];
  });
  const corrupted = chars.map(arr => arr.join(""));
  nodes.forEach((n, i) => { n.data = corrupted[i]; });
  /* put the text back — but only where nothing else has changed it since */
  setTimeout(() => nodes.forEach((n, i) => { if (n.data === corrupted[i]) n.data = originals[i]; }), CMD_GLITCH_MS);
}

/* ================================================================
   DRIFT CLOCK
   ================================================================ */
let driftValue   = 0;       /* accumulated drift */
let driftLastCmd = "";      /* for repeat detection */
let driftBurst   = 0;       /* rapid-fire counter */
let driftLastTime = Date.now();

function driftAccumulate(cmd) {
  const now = Date.now();
  const gap = now - driftLastTime;
  driftLastTime = now;

  /* idle drift: long pause = more drift */
  if (gap > 8000)  driftValue += Math.floor(gap / 2000);

  /* repeat command */
  if (cmd && cmd === driftLastCmd) driftValue += 4;
  driftLastCmd = cmd || driftLastCmd;

  /* rapid burst: < 600ms between commands */
  if (gap < 600) {
    driftBurst++;
    driftValue += driftBurst;
  } else {
    driftBurst = Math.max(0, driftBurst - 1);
  }

  /* random noise */
  driftValue += Math.random() < 0.15 ? Math.floor(Math.random() * 3) : 0;

  driftValue = Math.max(0, driftValue);
}

function driftReset() {
  driftValue   = 0;
  driftBurst   = 0;
  driftLastCmd = "";
  driftLastTime = Date.now();
}

function driftWaveform(v) {
  /* 20-char ASCII waveform based on drift magnitude */
  const intensity = Math.min(v / 100, 1);
  const chars = ["_", ".", "~", "-", "^", "/", "\\", "|", "M", "W"];
  let wave = "";
  for (let i = 0; i < 20; i++) {
    const threshold = Math.random() * (1 + intensity);
    wave += chars[Math.min(Math.floor(threshold * chars.length * intensity + 1), chars.length - 1)];
  }
  return wave;
}

function driftLabel(v) {
  if (v < 5)   return "stable";
  if (v < 15)  return "wavering";
  if (v < 30)  return "turbulent";
  if (v < 55)  return "fragmented";
  if (v < 90)  return "dissociating";
  return "critical drift";
}

function cmd_driftclock() {
  addLine("<driftclock> measuring session drift...");
  addLine("────────────────────────────────────────");
  addLine("  drift value : " + driftValue.toFixed(1));
  addLine("  waveform    : " + driftWaveform(driftValue));
  addLine("  reading     : " + driftLabel(driftValue));
  addLine("  burst index : " + driftBurst);
  addLine("  last cmd gap: " + ((Date.now() - driftLastTime)/1000).toFixed(1) + "s");
  addLine("────────────────────────────────────────");
  addLine("  drift resets on clear or refresh.");
  if (Math.random() < 0.1) {
    addLine("");
    addLine("  anomaly: a discontinuity in this reading matches a burst");
    addLine("  signature on file. cross-reference: alarm_capture_09.mp3");
  }
  addLine("<driftclock> done.");

  if (longSessionTracked && !longSessionClaimed) {
    longSessionClaimed = true;
    try { localStorage.setItem(LONG_SESSION_CLAIMED_KEY, "1"); } catch(e) {}
    loadClickerState();
    clickerState.fragments += LONG_SESSION_REWARD;
    saveClickerState();
    addLine("");
    addLine("  the drift clock has been quietly accumulating something else");
    addLine("  this whole time — uptime noticed first, but this is where it");
    addLine("  was held. it releases it now: +" + LONG_SESSION_REWARD.toLocaleString() + " glitch fragments.");
    addLine("  (check the clicker.)");

    addLine("");
    addLine("  this clock only measures what's already happened. uptime is");
    addLine("  the one that would tell you if this session has run long");
    addLine("  enough to matter.");
  }
}

function cmd_graveyard(args) {
  const sub = (args && args[0]) ? args[0].toLowerCase() : "";

  if (sub === "rerun") {
    const target = (args[1] || "").toLowerCase();
    const entry  = GRAVEYARD_ENTRIES.find(e => e.cmd === target);

    if (!target) {
      addLine("<graveyard> usage: graveyard rerun {command}");
      addLine("  archived commands: " + GRAVEYARD_ENTRIES.map(e => e.cmd).join(", "));
      return;
    }
    if (!entry || !GRAVEYARD_REVIVE[target]) {
      addLine("<graveyard> no archived command found matching: " + target);
      addLine("  archived commands: " + GRAVEYARD_ENTRIES.map(e => e.cmd).join(", "));
      return;
    }

    graveyardReruns[target] = (graveyardReruns[target] || 0) + 1;
    saveGraveyardReruns();

    GRAVEYARD_REVIVE[target]();
    return;
  }

  addLine("<graveyard> deprecated command archive");
  addLine("════════════════════════════════════════");
  addLine("  the following commands no longer run on their own.");
  addLine("  their entries are preserved for record-keeping.");
  addLine("  reactivate one with: graveyard rerun {command}");
  addLine("");
  for (const e of GRAVEYARD_ENTRIES) {

    addLine("     desc: " + e.desc);
    addLine("     note: " + e.note);
    addLine("");
    graveyardDiscovered[e.cmd] = true;
  }
  saveGraveyardDiscovered();
  addLine("════════════════════════════════════════");
  addLine("  running a name directly, without 'graveyard rerun', has no effect.");
  addLine("<graveyard> end of archive.");
}

let petState = null;          /* null = not loaded yet   */
let petTickTimer  = null;     /* 10-second stat tick     */
let petHungerTimer = null;    /* 30-second hunger decay  */
let petAgeTimer   = null;     /* 60-second age counter   */
let petSleepRegen = null;     /* sleep energy regen tick */
let petWeakFrames = 0;        /* how many ticks at hunger 0 */

function petDefaultState() {
  return {
    hunger:    8,
    energy:    8,
    happiness: 8,
    sleeping:  false,
    age:       0,       /* minutes */
    openedAt:  Date.now(),
  };
}

function loadPetState() {
  try {
    const s = localStorage.getItem(PET_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (p && typeof p.hunger === "number") {
        petState = p;
        /* recalculate age based on actual elapsed time */
        const minutesPassed = Math.floor((Date.now() - (p.openedAt || Date.now())) / 60000);
        petState.age = (p.age || 0) + minutesPassed;
        petState.openedAt = Date.now();
        return;
      }
    }
  } catch(e) {}
  petState = petDefaultState();
}

function savePetState() {
  if (!petState) return;
  try { localStorage.setItem(PET_KEY, JSON.stringify(petState)); } catch(e) {}
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function petArtState() {
  const p = petState;
  if (p.sleeping)            return "sleeping";
  if (p.hunger === 0)        return "weak";
  if (p.happiness >= 9)      return "happy";
  if (p.energy <= 2)         return "tired";
  if (p.hunger <= 2 || p.happiness <= 2) return "sad";
  return "neutral";
}

function petPrintArt(artKey) {
  const lines = PET_ART[artKey] || PET_ART.neutral;
  for (const l of lines) addLine(l);
}

function petPrintStats() {
  const p = petState;
  const bar = (v, max) => "[" + "█".repeat(v) + "░".repeat(max - v) + "]";
  addLine("<echaracter>");
  addLine("  hunger    " + bar(p.hunger, 10)    + "  " + p.hunger    + "/10");
  addLine("  energy    " + bar(p.energy, 10)    + "  " + p.energy    + "/10");
  addLine("  happiness " + bar(p.happiness, 10) + "  " + p.happiness + "/10");
  addLine("  age       " + p.age + " min");
  addLine("  state     " + (p.sleeping ? "sleeping" : "awake"));
}

/* Called every 10 seconds while in pet mode */
function petCheckAchievements() {
  if (!petState) return;
  const p = petState;
  if (p.hunger >= 10 && p.energy >= 10 && p.happiness >= 10) {
    unlockAchievement("pet_perfect");
  }
  if (p.hunger === 0 || p.energy === 0 || p.happiness === 0) {
    unlockAchievement("pet_neglect");
  }
}

const PET_THOUGHTS = [
  "...watches the cursor blink...",
  "...seems content...",
  "...tilts its head at nothing in particular...",
  "...is doing fine, as far as it can tell...",
  "...hums something that isn't quite a tune...",
  "...stares at the prompt like it's waiting for something too...",
  "...seems to like it here...",
  "...is not thinking about anything you'd understand...",
];

function petTick() {
  if (!petState || mode !== "pet" || locked) return;
  const p = petState;

  /* hunger decay — handled separately on 30s timer; tick just triggers redraws */
  /* happiness degrades if hungry or low energy */
  if (p.hunger <= 2 || p.energy <= 2) {
    p.happiness = clamp(p.happiness - 1, 0, 10);
  }

  /* weak tracking */
  if (p.hunger === 0) {
    petWeakFrames++;
  } else {
    petWeakFrames = 0;
  }

  savePetState();
  petCheckAchievements();

  /* auto-show art if state changed noticeably */
  const art = petArtState();
  if (art === "sad" || art === "weak" || art === "tired") {
    petPrintArt(art);
    if (art === "weak")  addLine("<echaracter> ...so hungry...");
    if (art === "tired") addLine("<echaracter> ...need sleep...");
    if (art === "sad")   addLine("<echaracter> ...hungry...");
  } else if (!p.sleeping && Math.random() < 0.15) {
    addLine("<echaracter> " + randomItem(PET_THOUGHTS));
  }
}

/* Hunger decays every 30 seconds */
function petHungerDecay() {
  if (!petState || mode !== "pet" || locked) return;
  petState.hunger = clamp(petState.hunger - 1, 0, 10);
  savePetState();
}

/* Age increases every 60 seconds */
function petAgeInc() {
  if (!petState || mode !== "pet" || locked) return;
  petState.age++;
  savePetState();
}

/* Sleep regen: +1 energy every 15 seconds while sleeping */
function petSleepRegenTick() {
  if (!petState || mode !== "pet" || locked) return;
  if (petState.sleeping) {
    petState.energy = clamp(petState.energy + 1, 0, 10);
    savePetState();
    if (petState.energy >= 10) {
      addLine("<echaracter> ...fully rested...");
    }
  }
}

function petStartTimers() {
  petStopTimers();
  petTickTimer   = setInterval(petTick,          10000);
  petHungerTimer = setInterval(petHungerDecay,   30000);
  petAgeTimer    = setInterval(petAgeInc,        60000);
  petSleepRegen  = setInterval(petSleepRegenTick,15000);
}

function petStopTimers() {
  if (petTickTimer)   { clearInterval(petTickTimer);   petTickTimer   = null; }
  if (petHungerTimer) { clearInterval(petHungerTimer); petHungerTimer = null; }
  if (petAgeTimer)    { clearInterval(petAgeTimer);    petAgeTimer    = null; }
  if (petSleepRegen)  { clearInterval(petSleepRegen);  petSleepRegen  = null; }
}

/* entry point — called from shell */
function petInit() {
  loadPetState();
  mode = "pet";
  addLine("<pet> opening echaracter companion...");
  addLine("────────────────────────────────────────");
  petPrintArt(petArtState());
  addLine("");
  petPrintStats();
  addLine("────────────────────────────────────────");
  addLine("commands: feed, play, sleep, wake, stats, pet, exit");
  petStartTimers();
}

/* input handler — called from handleApp when mode === "pet" */
function petHandle(input) {
  const cmd = input.trim().toLowerCase();
  if (!petState) { mode = "shell"; return; }
  const p = petState;

  switch (cmd) {

    case "":
      addLine("────────────────────────────────────────");
      petPrintArt(petArtState());
      addLine("");
      petPrintStats();
      addLine("────────────────────────────────────────");
      return;

    case "feed":
      if (p.sleeping) { addLine("<echaracter> zzz... (wake first)"); return; }
      p.hunger    = clamp(p.hunger    + 3, 0, 10);
      p.happiness = clamp(p.happiness + 1, 0, 10);
      savePetState();
      petCheckAchievements();
      petPrintArt("fed");
      addLine("<echaracter> nom nom nom!");
      petPrintStats();
      return;

    case "play":
      if (p.sleeping) { addLine("<echaracter> zzz... (wake first)"); return; }
      if (p.energy <= 1) { addLine("<echaracter> too tired to play..."); petPrintArt("tired"); return; }
      p.happiness = clamp(p.happiness + 2, 0, 10);
      p.energy    = clamp(p.energy    - 2, 0, 10);
      savePetState();
      petCheckAchievements();
      petPrintArt("playing");
      addLine("<echaracter> weeeee!");
      petPrintStats();
      if (Math.random() < 0.1) {
        const gift = Math.floor(Math.random() * (1000 - 10 + 1)) + 10;
        loadClickerState();
        clickerState.fragments += gift;
        saveClickerState();
        addLine("");
        addLine("<echaracter> ...found something while playing: +" + gift + " glitch fragments.");
        clickerCheckMilestone();
      }
      return;

    case "sleep":
      if (p.sleeping) { addLine("<echaracter> already sleeping..."); return; }
      p.sleeping = true;
      savePetState();
      petPrintArt("sleeping");
      addLine("<echaracter> goodnight... zzz");
      return;

    case "wake":
      if (!p.sleeping) { addLine("<echaracter> already awake!"); return; }
      p.sleeping = false;
      savePetState();
      petPrintArt("neutral");
      addLine("<echaracter> yawn... good morning!");
      petPrintStats();
      return;

    case "stats":
      petPrintArt(petArtState());
      petPrintStats();
      return;

    case "pet": {
      if (p.sleeping) { addLine("<echaracter> ...purrs softly..."); return; }
      p.happiness = clamp(p.happiness + 1, 0, 10);
      savePetState();
      petCheckAchievements();
      /* little animation */
      const reactions = [
        "<echaracter> !!  (wiggles)",
        "<echaracter> heehee~",
        "<echaracter> *happy noises*",
        "<echaracter> uwu",
      ];
      petPrintArt("pet_reaction");
      addLine(randomItem(reactions));
      return;
    }

    case "exit":
      petStopTimers();
      savePetState();
      mode = "shell";
      addLine("<pet> echaracter is resting. see you soon.");
      return;

    default:
      addLine("<pet> unknown command. try: feed, play, sleep, wake, stats, pet, help, exit");
      return;
  }
}

/* build a mutable 2-D array from a level's source */
function mazeBuildGrid(levelIdx) {
  return MAZE_LEVELS[levelIdx].src.map(row => row.split(""));
}

let mazeLevel   = 0;     /* current level index */
let mazeGrid    = null;  /* current render grid (walls + floor) */
let mazePlayerR = 0;
let mazePlayerC = 0;
let mazeGoalR   = 0;
let mazeGoalC   = 0;
let mazeDone    = false;

/* scan the current level's source for S and G positions */
function mazeFindSpawns() {
  const src = MAZE_LEVELS[mazeLevel].src;
  for (let r = 0; r < src.length; r++) {
    for (let c = 0; c < src[r].length; c++) {
      if (src[r][c] === "S") { mazePlayerR = r; mazePlayerC = c; }
      if (src[r][c] === "G") { mazeGoalR   = r; mazeGoalC   = c; }
    }
  }
}

/* ── Box-drawing wall renderer ──────────────────────────────────── */
/*
  For each '#' cell we inspect its four neighbours and pick the
  correct box-drawing character so walls connect naturally.
  Non-wall cells are rendered as spaces (or player/goal overlay).
*/
function mazeWallChar(grid, r, c) {
  const rows = grid.length;
  const cols = grid[0].length;
  const isWall = (dr, dc) => {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) return true; /* border counts as wall */
    const ch = grid[nr][nc];
    return ch === "#";
  };
  const U = isWall(-1, 0);
  const D = isWall( 1, 0);
  const L = isWall( 0,-1);
  const R = isWall( 0, 1);

  if ( U &&  D &&  L &&  R) return "╬";
  if ( U &&  D &&  L && !R) return "╣";
  if ( U &&  D && !L &&  R) return "╠";
  if ( U &&  D && !L && !R) return "║";
  if ( U && !D &&  L &&  R) return "╩";
  if (!U &&  D &&  L &&  R) return "╦";
  if ( U && !D &&  L && !R) return "╝";
  if ( U && !D && !L &&  R) return "╚";
  if (!U &&  D &&  L && !R) return "╗";
  if (!U &&  D && !L &&  R) return "╔";
  if (!U && !D &&  L &&  R) return "═";
  if (!U && !D && !L &&  R) return "═";
  if (!U && !D &&  L && !R) return "═";
  if ( U && !D && !L && !R) return "║";
  if (!U &&  D && !L && !R) return "║";
  return "█";
}

/* ── Render the maze ────────────────────────────────────────────── */
function mazeRender() {
  const grid = mazeGrid;
  const rows = grid.length;
  const cols = grid[0].length;

  addLine("<maze> level " + (mazeLevel + 1) + "/" + MAZE_LEVELS.length +
          " — " + MAZE_LEVELS[mazeLevel].name);

  for (let r = 0; r < rows; r++) {
    let line = "";
    for (let c = 0; c < cols; c++) {
      /* overlay player and goal */
      if (r === mazePlayerR && c === mazePlayerC) { line += "@"; continue; }
      if (r === mazeGoalR   && c === mazeGoalC)   { line += "✬"; continue; }

      const ch = grid[r][c];
      if (ch === "#") {
        line += mazeWallChar(grid, r, c);
      } else {
        line += " ";
      }
    }
    addLine(line);
  }
}

/* ── Movement ───────────────────────────────────────────────────── */
function mazeTryMove(dr, dc) {
  if (mazeDone) { addLine("<maze> maze complete — type r for next or exit to leave"); return; }
  const nr = mazePlayerR + dr;
  const nc = mazePlayerC + dc;
  const ch = mazeGrid[nr] && mazeGrid[nr][nc];
  if (!ch || ch === "#") { mazeRender(); addLine("<maze> blocked"); return; }

  mazePlayerR = nr;
  mazePlayerC = nc;
  mazeRender();

  if (nr === mazeGoalR && nc === mazeGoalC) {
    mazeDone = true;
    addLine("");
    addLine("  ★  you reached the ✬  ★");
    addLine("  level " + (mazeLevel + 1) + " complete!");
    if (mazeLevel + 1 < MAZE_LEVELS.length) {
      addLine("  type r for the next maze, or exit to quit.");
    } else {
      addLine("  ★★  all mazes complete — you are a maze runner.  ★★");
      unlockAchievement("maze_complete");
      addLine("");
      addLine("  a file surfaced somewhere in the routing tables you just");
      addLine("  finished tracing: gamma_transfer_log.txt");
    }
  }
}

/* ── Load / reset ───────────────────────────────────────────────── */
function mazeLoad(levelIdx) {
  mazeLevel = levelIdx;
  mazeGrid = mazeBuildGrid(mazeLevel);
  mazeFindSpawns();
  mazeDone = false;
  mazeRender();
}

function mazeReset() {
  mazeGrid = mazeBuildGrid(mazeLevel);
  mazeFindSpawns();
  mazeDone = false;
  addLine("<maze> maze reset.");
  mazeRender();
}

/* ── Entry point ────────────────────────────────────────────────── */
function mazeInit() {
  mode = "maze";
  mazeLoad(0);
  addLine("");
  addLine("  controls: w a s d — move    r — reset    exit — quit");
}

/* ── Input handler ──────────────────────────────────────────────── */
function mazeHandle(input) {
  const cmd = input.trim().toLowerCase();
  switch (cmd) {
    case "":     return addLine("<maze> pick a move... w a s d.");
    case "w":    return mazeTryMove(-1,  0);
    case "s":    return mazeTryMove( 1,  0);
    case "a":    return mazeTryMove( 0, -1);
    case "d":    return mazeTryMove( 0,  1);
    case "r":
      if (mazeDone && mazeLevel + 1 < MAZE_LEVELS.length) {
        mazeLoad(mazeLevel + 1);
      } else {
        mazeReset();
      }
      return;
    case "exit":
      mode = "shell";
      addLine("<maze> session closed.");
      return;
    default:
      addLine("<maze> controls: w a s d   r — reset/next   help   exit — quit");
  }
}

  const probe = document.createElement("span");
  const style = getComputedStyle(screen);
  probe.style.font = style.font || `${style.fontSize} ${style.fontFamily}`;
  probe.style.position = "absolute";
  probe.style.visibility = "hidden";
  probe.style.whiteSpace = "pre";
  probe.textContent = "M".repeat(20);
  document.body.appendChild(probe);
  const charWidth = probe.getBoundingClientRect().width / 20 || 8;
  document.body.removeChild(probe);

  const cs = getComputedStyle(screen);
  const padding = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const usable = screen.clientWidth - padding;
  return Math.max(20, Math.floor(usable / charWidth));
}

const BANNER_CACHE = { small: {} };

/* small: pair pixel rows into half-block characters (▀ ▄ █) */
function bannerBuildSmall(rows) {
  const out = [];
  for (let rr = 0; rr < 3; rr++) {
    let line = "";
    for (let x = 0; x < rows[0].length; x++) {
      const top = rows[2 * rr][x] === "#";
      const bot = (2 * rr + 1 < rows.length) && rows[2 * rr + 1][x] === "#";
      line += top && bot ? "█" : top ? "▀" : bot ? "▄" : " ";
    }
    out.push(line);
  }
  return out;
}

function bannerGlyph(size, ch) {
  if (size === "medium") return BANNER_GLYPHS[ch] || BANNER_GLYPHS[" "];
  if (size === "large")  return BANNER_LARGE_GLYPHS[ch] || BANNER_LARGE_GLYPHS[" "];
  const cache = BANNER_CACHE.small;
  if (cache[ch]) return cache[ch];
  cache[ch] = bannerBuildSmall((BANNER_SMALL_BITMAP[ch] || BANNER_SMALL_BITMAP[" "]).split("/"));
  return cache[ch];
}

function bannerGlyphWidth(size, ch) {
  return bannerGlyph(size, ch)[0].length;
}

/* width (in columns) a run of characters would take when rendered, incl. inter-glyph gaps */
function bannerRunWidth(size, str, gap) {
  let w = 0, i = 0;
  for (const ch of str) {
    if (i++ > 0) w += gap;
    w += bannerGlyphWidth(size, ch);
  }
  return w;
}

function bannerRenderGroup(size, str, gap) {
  const chars = Array.from(str).map(c => bannerGlyph(size, c));
  const rows = chars[0].length;
  for (let row = 0; row < rows; row++) {
    let line = "";
    for (let ci = 0; ci < chars.length; ci++) {
      if (ci > 0) line += " ".repeat(gap);
      line += chars[ci][row];
    }
    addLine(line);
  }
}

/* a word wider than the screen is cut into pieces that each fit */
function bannerSplitWord(size, word, gap, cols) {
  const chunks = [];
  let cur = "";
  for (const ch of word) {
    const trial = cur + ch;
    if (cur && bannerRunWidth(size, trial, gap) > cols) { chunks.push(cur); cur = ch; }
    else cur = trial;
  }
  if (cur) chunks.push(cur);
  return chunks;
}

/* banner — "banner" alone lists the sizes; "banner {size} {text}" picks one;
   "banner {text}" (first word isn't a size) is medium, as it always was. to
   banner a word that is also a size name, say the size first:
   banner medium small. */
function cmd_banner(args) {
  if (!args.length) {
    addLine(r("<banner> prints text in big letters — banner {size} {text}"));
    for (const [name, def] of Object.entries(BANNER_SIZES)) {
      addLine("  " + name.padEnd(8) + "— " + def.desc);
    }
    addLine("  no size given = medium");
    return;
  }

  const first = args[0].toLowerCase();
  let size = "medium";
  let rest = args;
  if (Object.prototype.hasOwnProperty.call(BANNER_SIZES, first)) {
    size = first;
    rest = args.slice(1);
    if (!rest.join(" ").trim()) {
      addLine(r("<banner> " + size + " needs some text — banner " + size + " {text}"));
      return;
    }
  }

  const def = BANNER_SIZES[size];
  const text = rest.join(" ").toUpperCase();
  if (!text.trim()) { addLine(r("<banner> nothing to print")); return; }

  const GAP  = def.gap;
  const cols = bannerGetMaxCols();
  const spaceWidth = bannerGlyphWidth(size, " ");

  /* turn words into pieces that each fit the screen. a piece cut from the
     middle of a word always starts a new line, so a word never gets a space
     in it. */
  const pieces = [];
  for (const word of text.split(/\s+/).filter(w => w.length > 0)) {
    bannerSplitWord(size, word, GAP, cols).forEach((c, i) => pieces.push({ text: c, hard: i > 0 }));
  }

  /* pack pieces into line-groups that fit within the terminal width,
     wrapping to a new banner block whenever the next piece won't fit */
  const lineGroups = [];
  let current = [];
  let currentWidth = 0;
  for (const piece of pieces) {
    const ww = bannerRunWidth(size, piece.text, GAP);
    if (current.length === 0) {
      current.push(piece.text);
      currentWidth = ww;
      continue;
    }
    const withPiece = currentWidth + GAP + spaceWidth + GAP + ww;
    if (!piece.hard && withPiece <= cols) {
      current.push(piece.text);
      currentWidth = withPiece;
    } else {
      lineGroups.push(current);
      current = [piece.text];
      currentWidth = ww;
    }
  }
  if (current.length) lineGroups.push(current);

  addLine("");
  for (const group of lineGroups) {
    bannerRenderGroup(size, group.join(" "), GAP);
    addLine("");
  }
}

/* symbols */
const SK_WALL   = "#";
const SK_FLOOR  = " ";
const SK_PLAYER = "@";
const SK_PLYGOAL= "+";
const SK_BOX    = "$";
const SK_BOXGOAL= "*";
const SK_GOAL   = ".";

let skLevel    = 0;   /* current level index */
let skGrid     = [];  /* mutable 2-D char array */
let skPR       = 0;   /* player row */
let skPC       = 0;   /* player col */
let skMoves    = 0;   /* move counter this level */
let skDone     = false;

/* build mutable grid from source */
function skLoad(levelIdx) {
  skLevel = levelIdx;
  skDone  = false;
  skMoves = 0;
  const src = SOKOBAN_LEVELS[levelIdx].src;
  /* normalise row widths */
  const W = Math.max(...src.map(r => r.length));
  skGrid = src.map(row => row.padEnd(W, " ").split(""));
  /* find player */
  for (let r = 0; r < skGrid.length; r++) {
    for (let c = 0; c < skGrid[r].length; c++) {
      const ch = skGrid[r][c];
      if (ch === SK_PLAYER || ch === SK_PLYGOAL) { skPR = r; skPC = c; }
    }
  }
}

function skRender() {
  const lv = SOKOBAN_LEVELS[skLevel];
  addLine("<sokoban> level " + (skLevel + 1) + "/" + SOKOBAN_LEVELS.length +
          " — " + lv.name + "   moves: " + skMoves);

  /* Each cell is rendered as exactly 2 chars so columns always align.
     All glyphs chosen from the ASCII + basic block range — no wide chars. */
  const CELL = {
    [SK_WALL]:    "## ",
    [SK_FLOOR]:   "   ",
    [SK_PLAYER]:  " @ ",
    [SK_PLYGOAL]: " @ ",   /* player standing on goal */
    [SK_BOX]:     "[$]",
    [SK_BOXGOAL]: "[X]",   /* box on goal — visually distinct */
    [SK_GOAL]:    " . ",
  };

  for (const row of skGrid) {
    let line = " ";
    for (const ch of row) {
      line += (CELL[ch] !== undefined ? CELL[ch] : "   ");
    }
    addLine(line);
  }

  addLine("  legend:  ## wall   [ ] box   [X] placed   .  target   @  you");
  addLine("  w a s d — move   r — reset/next   exit — quit");
}

function skCell(r, c) {
  if (r < 0 || r >= skGrid.length || c < 0 || c >= skGrid[0].length) return SK_WALL;
  return skGrid[r][c];
}

function skIsGoal(ch) { return ch === SK_GOAL || ch === SK_PLYGOAL || ch === SK_BOXGOAL; }
function skIsBox(ch)  { return ch === SK_BOX  || ch === SK_BOXGOAL; }

function skSetCell(r, c, ch) { skGrid[r][c] = ch; }

function skMove(dr, dc) {
  if (skDone) { addLine("<sokoban> level complete — press r for next or exit"); return; }

  const nr = skPR + dr, nc = skPC + dc;   /* destination */
  const dest = skCell(nr, nc);

  if (dest === SK_WALL) { skRender(); return; }   /* blocked by wall */

  if (skIsBox(dest)) {
    /* pushing a box */
    const br = nr + dr, bc = nc + dc;
    const beyond = skCell(br, bc);
    if (beyond === SK_WALL || skIsBox(beyond)) { skRender(); return; } /* can't push */

    /* move the box */
    const boxOnGoal = dest === SK_BOXGOAL;
    const landOnGoal = skIsGoal(beyond);
    skSetCell(br, bc, landOnGoal ? SK_BOXGOAL : SK_BOX);
    skSetCell(nr, nc, boxOnGoal ? SK_GOAL : SK_FLOOR);   /* uncover what was under box */
  }

  /* move the player */
  const playerWasOnGoal = skCell(skPR, skPC) === SK_PLYGOAL;
  skSetCell(skPR, skPC, playerWasOnGoal ? SK_GOAL : SK_FLOOR);
  const destNowGoal = skIsGoal(skCell(nr, nc));
  skSetCell(nr, nc, destNowGoal ? SK_PLYGOAL : SK_PLAYER);
  skPR = nr; skPC = nc;
  skMoves++;

  skRender();

  /* check win: no bare goals and no bare boxes remain */
  const flat = skGrid.flat();
  const won  = !flat.includes(SK_GOAL) && !flat.includes(SK_BOX);
  if (won) {
    skDone = true;
    addLine("");
    addLine("  ★  level " + (skLevel + 1) + " complete!  (" + skMoves + " moves)");
    if (skLevel + 1 < SOKOBAN_LEVELS.length) {
      addLine("  press r for the next level, or exit to quit.");
    } else {
      addLine("  ★★  all levels complete!  you are a sokoban master.  ★★");
      unlockAchievement("sokoban_complete");
      addLine("");
      addLine("  something shifted loose after that last crate settled:");
      addLine("  ensorcell_discovery.mp3");
    }
  }
}

function sokobanInit() {
  mode = "sokoban";
  skLoad(0);
  addLine("<sokoban> push the crates (▣) onto the targets (·)");
  skRender();
}

function sokobanHandle(input) {
  const cmd = input.trim().toLowerCase();
  switch (cmd) {
    case "":  return addLine("<sokoban> pick a move... w a s d.");
    case "w": return skMove(-1,  0);
    case "s": return skMove( 1,  0);
    case "a": return skMove( 0, -1);
    case "d": return skMove( 0,  1);
    case "r":
      if (skDone && skLevel + 1 < SOKOBAN_LEVELS.length) {
        skLoad(skLevel + 1);
        skRender();
      } else {
        skLoad(skLevel);
        addLine("<sokoban> level reset.");
        skRender();
      }
      return;
    case "exit":
      mode = "shell";
      addLine("<sokoban> session closed.");
      return;
    default:
      addLine("<sokoban> w a s d — move   r — reset/next   help   exit — quit");
  }
}

const RPG_ENDINGS_TOTAL = Object.values(RPG_NODES).filter(n => n.end).length;
const RPG_SEEN_KEY = "terminal_rpg_endings_v1";

function rpgLoadSeen() {
  const seen = new Set();
  try {
    const raw = localStorage.getItem(RPG_SEEN_KEY);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        arr.forEach(id => { if (hasOwn(RPG_NODES, id) && RPG_NODES[id].end) seen.add(id); });
      }
    }
  } catch(e) {}
  return seen;
}

function rpgSaveSeen() {
  try { localStorage.setItem(RPG_SEEN_KEY, JSON.stringify(Array.from(rpgSeenEndings))); } catch(e) {}
}

const rpgSeenEndings = rpgLoadSeen();

function rpgChoices(node, st) {
  return (node.c || []).filter(ch => {
    const cd = ch[2];
    if (!cd) return true;
    if (cd.has && !st.inv.includes(cd.has)) return false;
    if (cd.flag && !st.flags[cd.flag]) return false;
    if (cd.not && st.flags[cd.not]) return false;
    return true;
  });
}

function rpgHere(node, st) {
  return (node.items || []).filter(id => !st.taken[id]);
}

/* Reaching "The Great Escape" surfaces grimholt_postmortem.txt immediately,
   the same way arena_debrief.txt surfaces after the arena, and marks it
   recovered so it is listed and re-readable via recover afterward. */
function rpgGrantEscapeFile() {
  const name = "grimholt_postmortem.txt";
  const file = RECOVER_FILES[name];
  if (!file) return;   /* defensive — should always exist */
  const alreadyHad = !!(recoveredFiles[name] && recoveredFiles[name].recovered);

  addLine("");
  addLine(r(alreadyHad
    ? "<rpg> the system logs one more escape. no new file this time — you already have it:"
    : "<rpg> something in the system logs this ending differently. a file surfaces:"));
  addLine("════════════════════════════════════════");
  addLine("  RECOVERED FILE: " + file.title);
  addLine("════════════════════════════════════════");
  for (const line of file.body) addLine(line);
  addLine("════════════════════════════════════════");

  if (!alreadyHad) {
    recoveredFiles[name] = { recovered: true, timesRead: 1 };
  } else {
    recoveredFiles[name].timesRead += 1;
  }
  saveRecoveredFiles();
}

function rpgShow(id) {
  const st = appState.rpg;
  const node = RPG_NODES[id];
  addLine("");
  node.t.forEach(line => addLine(line));
  addLine("");
  if (node.end) {
    const isNew = !rpgSeenEndings.has(id);
    rpgSeenEndings.add(id);
    if (isNew) rpgSaveSeen();
    addLine(r("<rpg> THE END — " + node.end));
    addLine("endings found: " + rpgSeenEndings.size + "/" + RPG_ENDINGS_TOTAL + (isNew ? "  (new)" : ""));
    addLine("type restart to begin again, or exit.");
    if (id === "end_escape") rpgGrantEscapeFile();
    if (rpgSeenEndings.size >= RPG_ENDINGS_TOTAL) unlockAchievement("rpg_complete");
    return;
  }
  const here = rpgHere(node, st);
  if (here.length) {
    addLine("  you see: " + here.map(i => RPG_ITEMS[i].name).join(", ") + "   (take)");
  }
  const ch = rpgChoices(node, st);
  ch.forEach((c, i) => addLine("  " + (i + 1) + ") " + c[0]));
  addLine(r("<rpg> choose 1-" + ch.length + (here.length ? ", or take / use / items" : "")));
}

function rpgGo(id) {
  const st = appState.rpg;
  st.node = id;
  (RPG_NODES[id].set || []).forEach(f => { st.flags[f] = true; });
  rpgShow(id);
}

function rpgFindItem(arg, ids) {
  const a = arg.trim();
  if (!a) return null;
  return ids.find(id => id === a) ||
         ids.find(id => RPG_ITEMS[id].name.includes(a) || a.includes(id)) || null;
}

function rpgTake(arg) {
  const st = appState.rpg;
  const here = rpgHere(RPG_NODES[st.node], st);
  if (!here.length) return addLine(r("<rpg> there is nothing here to take."));
  let picks;
  if (arg === "all" || (!arg && here.length === 1)) {
    picks = here;
  } else if (!arg) {
    return addLine(r("<rpg> take what? " + here.map(i => RPG_ITEMS[i].name).join(", ")));
  } else {
    const id = rpgFindItem(arg, here);
    if (!id) return addLine(r("<rpg> you don't see \"" + arg + "\" here."));
    picks = [id];
  }
  picks.forEach(id => {
    st.taken[id] = true;
    st.inv.push(id);
    addLine(r("<rpg> taken: " + RPG_ITEMS[id].name));
  });
}

function rpgUse(arg) {
  const st = appState.rpg;
  if (!arg) return addLine(r("<rpg> use what? type items to see what you carry."));
  const id = rpgFindItem(arg, st.inv);
  if (!id) {
    const here = rpgFindItem(arg, rpgHere(RPG_NODES[st.node], st));
    if (here) return addLine(r("<rpg> you would need to take the " + RPG_ITEMS[here].name + " first."));
    return addLine(r("<rpg> you don't have \"" + arg + "\"."));
  }
  const node = RPG_NODES[st.node];
  const u = node.use && node.use[id];
  if (u) {
    (u.say || []).forEach(l => addLine(l));
    if (!u.keep) st.inv = st.inv.filter(i => i !== id);
    (u.set || []).forEach(f => { st.flags[f] = true; });
    if (u.next) return rpgGo(u.next);
    return;
  }
  const item = RPG_ITEMS[id];
  if (item.read) return item.read.forEach(l => addLine(l));
  addLine(r("<rpg> nothing happens."));
}

function rpgInit() {
  mode = "rpg";
  appState.rpg = { node: "start", inv: [], taken: {}, flags: {} };
  addLine(r("<rpg> CASTLE GRIMHOLT — escape the dungeon. type a number to choose. help for commands."));
  if (rpgSeenEndings.size) addLine("endings found so far: " + rpgSeenEndings.size + "/" + RPG_ENDINGS_TOTAL);
  rpgShow("start");
}

function rpgHandle(input) {
  const st = appState.rpg;
  const t = normalize(input);
  if (t === "exit") {
    mode = "shell";
    return addLine(r("<rpg> closed"));
  }
  if (t === "restart") {
    addLine(r("<rpg> beginning again..."));
    appState.rpg = { node: "start", inv: [], taken: {}, flags: {} };
    return rpgShow("start");
  }
  const node = RPG_NODES[st.node];
  if (t === "" || t === "look") return rpgShow(st.node);
  if (t === "items" || t === "bag" || t === "inventory" || t === "i") {
    if (!st.inv.length) return addLine(r("<rpg> you are carrying nothing but your torch."));
    addLine(r("<rpg> you are carrying:"));
    return st.inv.forEach(id => addLine("  " + RPG_ITEMS[id].name + " — " + RPG_ITEMS[id].desc));
  }
  let m = t.match(/^(?:examine|inspect|x)\s+(.+)$/);
  if (m) {
    const id = rpgFindItem(m[1], st.inv.concat(node.end ? [] : rpgHere(node, st)));
    return addLine(id ? "  " + RPG_ITEMS[id].desc : r("<rpg> you don't see \"" + m[1] + "\"."));
  }
  if (node.end) return addLine(r("<rpg> the story is over. type restart or exit."));
  m = t.match(/^(?:take|get|grab)(?:\s+(.+))?$/);
  if (m) return rpgTake((m[1] || "").trim());
  m = t.match(/^(?:use|read)(?:\s+(.+))?$/);
  if (m) return rpgUse((m[1] || "").replace(/\s+(?:on|with|at|in|to)\s+.*$/, "").trim());
  const ch = rpgChoices(node, st);
  if (!/^\d+$/.test(t)) {
    return addLine(r("<rpg> type a number 1-" + ch.length + " (or take, use, items, look, restart, exit)"));
  }
  const n = parseInt(t, 10);
  if (n < 1 || n > ch.length) {
    return addLine(r("<rpg> no such choice. pick 1-" + ch.length + "."));
  }
  rpgGo(ch[n - 1][1]);
}

/* ================================================================
   GAMBLE APP — "the hall"
   Spend job tokens on five games. Every game pays back a little less
   than it takes over time (return-to-player, RTP, is shown by the odds
   command and is computed from the same tables the games use):
     roulette  97.30%   single zero. number 36x, dozen 3x, even-money 2x
     slots     96.58%   3 reels, 25% of spins pay, 7-7-7 pays 100x
     craps     98.59%   pass line, the fairest bet in the building
     coin      97.00%   48.5% heads, 48.5% tails, 3% lands on its edge
     wheel     96.43%   28 segments, never more than 5x
   Bets are whole tokens, 1 to GAMBLE_MAX_BET, and every payout is a whole
   multiple of the bet, so nothing is ever rounded in the house's favor.
   The first time the app is opened it hands over 15 tokens. Hitting the
   slots jackpot (7-7-7, at any bet) unlocks the "Triple Seven" achievement.
   ================================================================ */
const GAMBLE_WELCOME_TOKENS = 15;
const GAMBLE_MAX_BET        = 100;
const GAMBLE_GAMES          = ["roulette", "slots", "craps", "coin", "wheel"];

const GAMBLE_RED = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

/* slots: three identical reels, 20 stops each (weights add to 20).
   three of a kind pays "pays" times the bet; exactly two cherries pay 2x */
const GAMBLE_SLOT_SYMBOLS = [
  { id: "seven",  glyph: " 7 ", weight: 1, pays: 100 },
  { id: "bar",    glyph: "BAR", weight: 2, pays: 50 },
  { id: "bell",   glyph: "BEL", weight: 3, pays: 30 },
  { id: "cherry", glyph: "CHR", weight: 5, pays: 10 },
  { id: "lemon",  glyph: "LMN", weight: 9, pays: 4 },
];
const GAMBLE_SLOT_TWO_CHERRIES = 2;

const GAMBLE_COIN_EDGE = 0.03;                      /* chance the coin lands on its edge */
const GAMBLE_WHEEL = [[0, 14], [1, 6], [2, 5], [3, 2], [5, 1]];   /* [multiplier, segments] */

/* ── saved state ────────────────────────────────────────────────── */
let gambleState = null;

function gambleDefaultState() {
  const games = {};
  GAMBLE_GAMES.forEach(k => { games[k] = { plays: 0, wagered: 0, returned: 0 }; });
  return { welcomed: false, biggest: 0, games: games };
}
function gambleLoad() {
  const st = gambleDefaultState();
  const n0 = v => Math.max(0, Math.floor(Number(v)) || 0);
  try {
    const raw = JSON.parse(localStorage.getItem(GAMBLE_KEY) || "null");
    if (raw && typeof raw === "object") {
      st.welcomed = raw.welcomed === true;
      st.biggest  = n0(raw.biggest);
      GAMBLE_GAMES.forEach(k => {
        const s = raw.games && raw.games[k];
        if (s && typeof s === "object") st.games[k] = { plays: n0(s.plays), wagered: n0(s.wagered), returned: n0(s.returned) };
      });
    }
  } catch (e) {}
  return st;
}
function gambleSave() {
  try { localStorage.setItem(GAMBLE_KEY, JSON.stringify(gambleState)); } catch (e) {}
}

/* ── the games (each returns what happened; payout is worked out by the caller) ── */

/* roulette: a bet spec is { label, mult, wins(n) } or null if the choice is not understood */
function gambleRouletteColor(n) { return n === 0 ? "green" : (GAMBLE_RED.indexOf(n) >= 0 ? "red" : "black"); }
function gambleRouletteSpec(choice) {
  const c = String(choice || "").toLowerCase();
  if (/^\d+$/.test(c)) {
    const n = parseInt(c, 10);
    return (n >= 0 && n <= 36) ? { label: "number " + n, mult: 36, wins: x => x === n } : null;
  }
  switch (c) {
    case "red":   return { label: "red",   mult: 2, wins: x => x > 0 && gambleRouletteColor(x) === "red" };
    case "black": return { label: "black", mult: 2, wins: x => x > 0 && gambleRouletteColor(x) === "black" };
    case "odd":   return { label: "odd",   mult: 2, wins: x => x > 0 && x % 2 === 1 };
    case "even":  return { label: "even",  mult: 2, wins: x => x > 0 && x % 2 === 0 };
    case "low":   return { label: "low (1-18)",   mult: 2, wins: x => x >= 1 && x <= 18 };
    case "high":  return { label: "high (19-36)", mult: 2, wins: x => x >= 19 && x <= 36 };
    case "dozen1": case "d1": case "1st": return { label: "first dozen (1-12)",   mult: 3, wins: x => x >= 1  && x <= 12 };
    case "dozen2": case "d2": case "2nd": return { label: "second dozen (13-24)", mult: 3, wins: x => x >= 13 && x <= 24 };
    case "dozen3": case "d3": case "3rd": return { label: "third dozen (25-36)",  mult: 3, wins: x => x >= 25 && x <= 36 };
  }
  return null;
}
function gambleRouletteSpin() { return Math.floor(Math.random() * 37); }

/* slots */
function gambleSlotReel() {
  let roll = Math.random() * 20;
  for (const s of GAMBLE_SLOT_SYMBOLS) { if (roll < s.weight) return s; roll -= s.weight; }
  return GAMBLE_SLOT_SYMBOLS[GAMBLE_SLOT_SYMBOLS.length - 1];
}
function gambleSlotMult(a, b, c) {
  if (a.id === b.id && b.id === c.id) return a.pays;
  const cherries = [a, b, c].filter(s => s.id === "cherry").length;
  return cherries === 2 ? GAMBLE_SLOT_TWO_CHERRIES : 0;
}
function gambleSlotsSpin() {
  const reels = [gambleSlotReel(), gambleSlotReel(), gambleSlotReel()];
  return { reels: reels, mult: gambleSlotMult(reels[0], reels[1], reels[2]) };
}

/* craps, pass line: 7 or 11 on the come-out wins, 2/3/12 loses, anything else
   becomes the point and wins if it is rolled again before a 7 */
function gambleCrapsPlay() {
  const rolls = [];
  const roll = () => {
    const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6);
    rolls.push([a, b]);
    return a + b;
  };
  const first = roll();
  let point = null, won;
  if (first === 7 || first === 11) won = true;
  else if (first === 2 || first === 3 || first === 12) won = false;
  else {
    point = first;
    for (let i = 0; i < 10000; i++) {
      const t = roll();
      if (t === point) { won = true; break; }
      if (t === 7)     { won = false; break; }
    }
    if (won === undefined) won = false;
  }
  return { rolls: rolls, point: point, won: won };
}

/* coin: heads, tails, or (3%) its edge, which nobody wins */
function gambleCoinFlip() {
  const r = Math.random(), side = (1 - GAMBLE_COIN_EDGE) / 2;
  return r < side ? "heads" : (r < side * 2 ? "tails" : "edge");
}

/* wheel */
function gambleWheelSegments() {
  const segs = [];
  GAMBLE_WHEEL.forEach(([m, count]) => { for (let i = 0; i < count; i++) segs.push(m); });
  return segs;
}
function gambleWheelSpin() {
  const segs = gambleWheelSegments();
  return segs[Math.floor(Math.random() * segs.length)];
}

/* ── exact odds, worked out from the tables above ───────────────── */
function gambleSlotStats() {
  let rtp = 0, hit = 0;
  const S = GAMBLE_SLOT_SYMBOLS;
  for (const a of S) for (const b of S) for (const c of S) {
    const p = (a.weight / 20) * (b.weight / 20) * (c.weight / 20);
    const m = gambleSlotMult(a, b, c);
    rtp += p * m;
    if (m > 0) hit += p;
  }
  return { rtp: rtp, hit: hit };
}
function gambleCrapsWinProb() {
  const ways = {};
  for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) ways[a + b] = (ways[a + b] || 0) + 1;
  let p = (ways[7] + ways[11]) / 36;
  [4, 5, 6, 8, 9, 10].forEach(pt => { p += (ways[pt] / 36) * (ways[pt] / (ways[pt] + ways[7])); });
  return p;
}
function gambleWheelStats() {
  const segs = gambleWheelSegments();
  const sum = segs.reduce((a, b) => a + b, 0);
  return { rtp: sum / segs.length, segments: segs.length, win: segs.filter(m => m > 1).length / segs.length };
}
function gamblePct(x) { return (x * 100).toFixed(2) + "%"; }

/* ── betting ────────────────────────────────────────────────────── */
function gambleParseBet(tok, usage) {
  if (!tok) { addLine(r("<gamble> usage: " + usage)); return 0; }
  let bet;
  if (tok === "max") bet = Math.min(jobTokens, GAMBLE_MAX_BET);
  else if (/^\d+$/.test(tok)) bet = parseInt(tok, 10);
  else { addLine(r("<gamble> usage: " + usage)); return 0; }
  if (jobTokens < 1) {
    addLine(r("<gamble> you have no tokens. earn some at the job (work) or the clicker (convert)."));
    return 0;
  }
  if (bet < 1) { addLine(r("<gamble> the smallest bet is 1 token.")); return 0; }
  if (bet > GAMBLE_MAX_BET) { addLine(r("<gamble> the table limit is " + GAMBLE_MAX_BET + " tokens a bet.")); return 0; }
  if (bet > jobTokens) { addLine(r("<gamble> not enough tokens. you have " + jobTokens + ".")); return 0; }
  return bet;
}

/* take the bet, pay out, record it, and say how it went */
function gambleSettle(game, bet, payout) {
  jobTokens = jobTokens - bet + payout;
  saveJobTokens();
  const g = gambleState.games[game];
  g.plays++; g.wagered += bet; g.returned += payout;
  if (payout - bet > gambleState.biggest) gambleState.biggest = payout - bet;
  gambleSave();
  if (payout > bet) {
    addLine(r("<gamble:" + game + "> " + (payout >= bet * 20 ? "*** BIG WIN ***  " : "you win!  ") +
              "+" + (payout - bet) + " token" + (payout - bet !== 1 ? "s" : "") + "  (paid " + payout + ")"));
  } else if (payout === bet) {
    addLine(r("<gamble:" + game + "> push. your bet comes back."));
  } else {
    addLine(r("<gamble:" + game + "> no luck.  -" + bet + " token" + (bet !== 1 ? "s" : "")));
  }
  addLine("  balance: " + jobTokens + " tokens");
}

/* ── game commands ──────────────────────────────────────────────── */
function gambleRoulette(args) {
  const usage = "roulette {bet} {red|black|odd|even|low|high|dozen1-3|0-36}";
  const spec = gambleRouletteSpec(args[1]);
  if (!args[1] || !spec) {
    if (args[1] && !spec) addLine(r("<gamble:roulette> unknown bet \"" + args[1] + "\"."));
    addLine(r("<gamble> usage: " + usage));
    return;
  }
  const bet = gambleParseBet(args[0], usage);
  if (!bet) return;
  const n = gambleRouletteSpin();
  addLine(r("<gamble:roulette> " + bet + " on " + spec.label + ". the wheel spins..."));
  addLine("  the ball lands on " + n + " (" + gambleRouletteColor(n) + ").");
  gambleSettle("roulette", bet, spec.wins(n) ? bet * spec.mult : 0);
}

function gambleSlots(args) {
  const bet = gambleParseBet(args[0], "slots {bet}");
  if (!bet) return;
  const res = gambleSlotsSpin();
  addLine(r("<gamble:slots> " + bet + " token" + (bet !== 1 ? "s" : "") + " in. the reels spin..."));
  addLine("  [" + res.reels.map(s => s.glyph).join("] [") + "]");
  if (res.mult > 0) {
    const same = res.reels[0].id === res.reels[1].id && res.reels[1].id === res.reels[2].id;
    addLine("  " + (same ? "three of a kind" : "two cherries") + " — pays " + res.mult + "x");
  }
  const jackpot = res.reels.every(s => s.id === "seven");
  if (jackpot) addLine("  *** JACKPOT ***  three sevens!");
  gambleSettle("slots", bet, bet * res.mult);
  if (jackpot) unlockAchievement("slots_jackpot");
}

function gambleCraps(args) {
  const bet = gambleParseBet(args[0], "craps {bet}");
  if (!bet) return;
  const res = gambleCrapsPlay();
  addLine(r("<gamble:craps> " + bet + " on the pass line. the dice are thrown..."));
  const show = (rl, label) => addLine("  " + label + " " + rl[0] + " + " + rl[1] + " = " + (rl[0] + rl[1]));
  show(res.rolls[0], "come-out:");
  if (res.point === null) {
    const s = res.rolls[0][0] + res.rolls[0][1];
    addLine("  " + (res.won ? "a natural! the pass line wins." : "craps (" + s + "). the pass line loses."));
  } else {
    addLine("  the point is " + res.point + ". roll it again before a 7.");
    const rest = res.rolls.slice(1), cap = 8;
    rest.slice(0, cap).forEach(rl => show(rl, "roll:"));
    if (rest.length > cap) addLine("  ... " + (rest.length - cap) + " more rolls ...");
    const last = res.rolls[res.rolls.length - 1];
    addLine("  " + (res.won ? "the point " + res.point + " is made. the pass line wins." : "seven out (" + (last[0] + last[1]) + "). the pass line loses."));
  }
  gambleSettle("craps", bet, res.won ? bet * 2 : 0);
}

function gambleCoin(args) {
  const usage = "coin {bet} {heads|tails}";
  const side = ({ h: "heads", heads: "heads", t: "tails", tails: "tails" })[args[1]];
  if (!side) { addLine(r("<gamble> usage: " + usage)); return; }
  const bet = gambleParseBet(args[0], usage);
  if (!bet) return;
  const out = gambleCoinFlip();
  addLine(r("<gamble:coin> " + bet + " on " + side + ". the coin spins..."));
  if (out === "edge") addLine("  it lands on its edge, and stays there. the house keeps it.");
  else addLine("  it lands " + out + ".");
  gambleSettle("coin", bet, out === side ? bet * 2 : 0);
}

function gambleWheel(args) {
  const bet = gambleParseBet(args[0], "wheel {bet}");
  if (!bet) return;
  const m = gambleWheelSpin();
  addLine(r("<gamble:wheel> " + bet + " token" + (bet !== 1 ? "s" : "") + " in. the wheel clatters round..."));
  addLine("  >> [ " + (m === 0 ? "0" : m + "x") + " ] <<   " +
          (m === 0 ? "nothing" : m === 1 ? "your bet back" : "pays " + m + "x"));
  gambleSettle("wheel", bet, bet * m);
}

/* ── info commands ──────────────────────────────────────────────── */
function gambleOdds() {
  const sl = gambleSlotStats(), cr = gambleCrapsWinProb(), wh = gambleWheelStats();
  const coinWin = (1 - GAMBLE_COIN_EDGE) / 2;
  addLine(r("<gamble:odds> every game keeps a small edge. rtp = what comes back per token bet, over time."));
  addLine("────────────────────────────────────────");
  addLine("  roulette  " + gamblePct(36 / 37) + "  european, one zero");
  addLine("            number 36x · dozen 3x · red/black/odd/even/low/high 2x");
  addLine("  slots     " + gamblePct(sl.rtp) + "  " + gamblePct(sl.hit) + " of spins pay");
  addLine("            " + GAMBLE_SLOT_SYMBOLS.map(s => s.glyph.trim() + " " + s.pays + "x").join(" · ") + " (three alike)");
  addLine("            two cherries " + GAMBLE_SLOT_TWO_CHERRIES + "x");
  addLine("  craps     " + gamblePct(cr * 2) + "  pass line, " + gamblePct(cr) + " to win, pays 2x");
  addLine("  coin      " + gamblePct(coinWin * 2) + "  " + gamblePct(coinWin) + " each side, " + gamblePct(GAMBLE_COIN_EDGE) + " lands on its edge");
  addLine("  wheel     " + gamblePct(wh.rtp) + "  " + wh.segments + " segments: " +
          GAMBLE_WHEEL.map(([m, c]) => c + " x " + (m === 0 ? "0" : m + "x")).join(" · "));
  addLine("────────────────────────────────────────");
  addLine("  bets: 1 to " + GAMBLE_MAX_BET + " tokens (or max). payouts include your stake.");
}

function gambleStats() {
  const g = gambleState.games;
  let plays = 0, wagered = 0, returned = 0;
  GAMBLE_GAMES.forEach(k => { plays += g[k].plays; wagered += g[k].wagered; returned += g[k].returned; });
  addLine(r("<gamble:stats> your record at the hall"));
  addLine("────────────────────────────────────────");
  GAMBLE_GAMES.forEach(k => {
    const net = g[k].returned - g[k].wagered;
    addLine("  " + k.padEnd(9) + String(g[k].plays).padStart(5) + " plays   net " + (net > 0 ? "+" : "") + net);
  });
  addLine("────────────────────────────────────────");
  const net = returned - wagered;
  addLine("  total     " + String(plays).padStart(4) + " plays   net " + (net > 0 ? "+" : "") + net);
  addLine("  biggest single win: +" + gambleState.biggest + " tokens");
  addLine("  balance: " + jobTokens + " tokens");
}

function gambleMenu() {
  addLine("────────────────────────────────────────");
  addLine("  balance : " + jobTokens + " tokens      table limit: " + GAMBLE_MAX_BET);
  addLine("────────────────────────────────────────");
  addLine("  roulette {bet} {choice}   slots {bet}   craps {bet}");
  addLine("  coin {bet} {heads|tails}  wheel {bet}");
  addLine("  odds   stats   balance   help   exit");
}

/* ── entry point and input ──────────────────────────────────────── */
function gambleInit() {
  loadJobState();
  gambleState = gambleLoad();
  mode = "gamble";
  addLine(r("<gamble> welcome to the hall. the odds are posted. type odds to read them."));
  if (!gambleState.welcomed) {
    gambleState.welcomed = true;
    jobTokens += GAMBLE_WELCOME_TOKENS;
    saveJobTokens();
    gambleSave();
    addLine("");
    addLine(r("<gamble> first visit. the house slides " + GAMBLE_WELCOME_TOKENS + " tokens across the table."));
  }
  gambleMenu();
}

function gambleHandle(input) {
  const parts = String(input).trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!parts.length) return;
  const cmd = parts[0], args = parts.slice(1);
  switch (cmd) {
    case "exit":
      mode = "shell";
      return addLine(r("<gamble> the hall closes behind you. balance: " + jobTokens + " tokens."));
    case "balance": case "bal": case "tokens":
      return addLine(r("<gamble> balance: " + jobTokens + " tokens"));
    case "odds":     return gambleOdds();
    case "stats":    return gambleStats();
    case "roulette": return gambleRoulette(args);
    case "slots": case "slot": return gambleSlots(args);
    case "craps": case "dice": return gambleCraps(args);
    case "coin": case "flip":  return gambleCoin(args);
    case "wheel":    return gambleWheel(args);
    default:
      addLine(r("<gamble> unknown game or command. type help."));
  }
}

/* ================================================================
   DISCOVERY INDEX
   A Thauma-maintained recovery tracker. Shows the player how much
   of the terminal they have uncovered without revealing secrets.

   INDEX_DISCOVERY_KEY — tracks which commands have ever been run
   (separate from cmdUsage counts, which only count since last reset).
   ================================================================ */

const INDEX_DISCOVERY_KEY = "terminal_index_discovery_v1";
let indexDiscovered = {};   /* { commandName: true } — ever-seen commands */

function loadIndexDiscovery() {
  try {
    const s = localStorage.getItem(INDEX_DISCOVERY_KEY);
    if (s) indexDiscovered = JSON.parse(s);
  } catch(e) {}
}
