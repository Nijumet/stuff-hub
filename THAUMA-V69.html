<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THAUMA</title>
<style>
:root {
  --bg: #000000;
  --fg: #00ff00;
  --font-size: 16px;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: Consolas, monospace;
  font-size: var(--font-size);
  padding-top: env(safe-area-inset-top);
  box-sizing: border-box;
}

#screen {
  height: 100vh;
  padding: 24px 10px 10px 10px;
  box-sizing: border-box;
  overflow-y: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.line {
  width: 100%;
}

.system {
  color: var(--fg);
}

.user {
  color: var(--fg);
}

.prompt-line {
  display: flex;
  flex-direction: row;
  align-items: baseline;
}

.prompt-label {
  margin-right: 6px;
  flex-shrink: 0;
}

.prompt-input-wrap {
  flex: 1;
  display: inline-flex;
  align-items: baseline;
  position: relative;
}

/* visible typed text */
.prompt-text {
  color: var(--fg);
  font: inherit;
  white-space: pre;
}

.prompt-ghost {
  color: var(--fg);
  font: inherit;
  white-space: pre;
  opacity: 0.28;
  pointer-events: none;
}

/* blinking block caret */
.caret {
  display: inline-block;
  width: 0.6ch;
  height: 1.1em;
  background: var(--fg);
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
  margin-left: 1px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

/* snack speed-boost: cursor blinks faster for a bit, making the console feel quicker */
body.snack-boost .caret {
  animation-duration: 0.25s !important;
}

/* nap slow-blink: cursor blinks slower for a bit, making the console feel like it's resting */
body.nap-slow .caret {
  animation-duration: 3s !important;
}

/* ── cursor skins ── */
/* block (default) — no extra class needed */
.caret-underline {
  height: 2px;
  width: 0.6ch;
  vertical-align: baseline;
  margin-bottom: 1px;
}
.caret-beam {
  width: 2px;
  height: 1.1em;
}
.caret-neon {
  box-shadow: 0 0 4px 2px var(--fg), 0 0 10px 4px var(--fg);
  animation: blink 0.8s step-end infinite;
}
.caret-glitch {
  animation: caretGlitch 0.25s step-end infinite;
}
@keyframes caretGlitch {
  0%   { opacity:1; transform: translateX(0); }
  25%  { opacity:0; transform: translateX(2px); }
  50%  { opacity:1; transform: translateX(-1px); }
  75%  { opacity:0; transform: translateX(1px); }
  100% { opacity:1; transform: translateX(0); }
}

.hidden-input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 1px;
  height: 1px;
}

/* ── CRT FILTER EFFECTS ─────────────────────────────────────────── */
#screen.crt-active {
  border-radius: 24px;
  box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.9);
}

/* Scan lines overlay */
#screen.crt-active::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.7),
    rgba(0, 0, 0, 0.7) 1px,
    transparent 1px,
    transparent 2px
  );
  z-index: 9999;
}

/* CRT text bloom/glow */
#screen.crt-active .line {
  text-shadow: 
    0 0 16px rgba(0, 255, 0, 1),
    0 0 32px rgba(0, 255, 0, 0.6),
    0 0 48px rgba(0, 255, 0, 0.3);
}

/* Flicker animation */
@keyframes crt-flicker {
  0%, 100% { opacity: 1; }
  5% { opacity: 0.85; }
  10% { opacity: 1; }
  15% { opacity: 0.88; }
}

#screen.crt-active.crt-flickering {
  animation: crt-flicker 0.15s ease-in-out;
}
</style>

</head>

/* ================================================================
   PROFILE PREFIX
   ================================================================ */
const PROFILE_KEY = "terminal_profile_prefix";
let profilePrefix = "";

function loadProfilePrefix() {
  try {
    const s = localStorage.getItem(PROFILE_KEY);
    if (s !== null) profilePrefix = s;
  } catch(e) {}
}
function saveProfilePrefix() {

}

function cmd_profile(args) {
  const raw = args.join(" ");
  const key = raw.trim().toLowerCase();

  /* ── hidden easter egg — restricted personnel profiles ──────────
     Not documented anywhere. These names cannot be set as a prefix;
     instead the terminal surfaces a short dossier and a quote. */
  const RESTRICTED_ALIASES = {
    "arcanum":    "arcanum",
    "dr.arcanum": "arcanum",
    "sysop_null": "sysop_null",
    "internk":    "internk",

  const prefix = raw;
  profilePrefix = prefix;
  saveProfilePrefix();
  if (prefix) {
    addLine("<profile> prefix set to: " + prefix);
  } else {
    addLine("<profile> prefix cleared.");
  }
}

/* ================================================================
   COMMAND PERMISSIONS (chmod)
   ================================================================ */
const CHMOD_KEY = "terminal_cmd_permissions";
const RECURSIVE_EVENTS_KEY = "terminal_recursive_events";

let cmdPermissions = {};
let recursiveEventsTotal = 0;

function loadChmodState() {
  try {
    const stored = localStorage.getItem(CHMOD_KEY);
    if (stored) cmdPermissions = JSON.parse(stored);
  } catch(e) {}
}

function loadRecursiveEvents() {
  try {
    const stored = localStorage.getItem(RECURSIVE_EVENTS_KEY);
    if (stored) recursiveEventsTotal = parseInt(stored, 10) || 0;
  } catch(e) {}
}

function saveChmodState() {
  try { localStorage.setItem(CHMOD_KEY, JSON.stringify(cmdPermissions)); } catch(e) {}
}

function saveRecursiveEvents() {
  try { localStorage.setItem(RECURSIVE_EVENTS_KEY, String(recursiveEventsTotal)); } catch(e) {}
}

function hasExecutePermission(cmd) {
  /* chmod and unlock must never be lockable — otherwise a player could
     disable the only two commands able to undo it */
  if (cmd === "chmod" || cmd === "unlock") return true;
  /* if not in permissions table, default to executable */
  if (!(cmd in cmdPermissions)) return true;
  return cmdPermissions[cmd].execute === true;
}

function cmd_chmod(args) {
  /* bare "chmod" — list every command's permission state */
  if (args.length === 0) {
    addLine(r("<chmod> command permissions:"));
    addLine("────────────────────────────────────────");
    for (const cmdName of ALL_SHELL_CMDS.slice().sort()) {
      const perms = cmdPermissions[cmdName];
      const bit = (!perms || perms.execute !== false) ? "x" : "-";
      addLine("  " + bit + "  " + cmdName);
    }
    addLine("────────────────────────────────────────");
    addLine(r("<chmod> usage: chmod + {cmd}   chmod - {cmd}   chmod {cmd}"));
    return;
  }

  /* "chmod {cmd}" — show permissions for a single command */
  if (args.length === 1) {
    const cmd = args[0].toLowerCase();
    if (!(cmd in cmdPermissions)) {
      addLine(r("<chmod> " + cmd + " — default permissions (executable)"));
    } else {
      const perms = cmdPermissions[cmd];
      const bits = (perms.execute ? "x" : "-");
      addLine(r("<chmod> " + cmd + " — " + bits));
    }
    return;
  }

  /* "chmod + {cmd}" / "chmod - {cmd}" — enable / disable a command */
  const mode = args[0];
  const cmd = args[1].toLowerCase();

  if (mode !== "+" && mode !== "-") {
    addLine(r("<chmod> invalid syntax. use: chmod + {cmd}   or   chmod - {cmd}"));
    return;
  }

  if (mode === "-" && (cmd === "chmod" || cmd === "unlock")) {
    addLine(r("<chmod> permission denied: " + cmd + " cannot be disabled."));
    return;
  }

  if (!(cmd in cmdPermissions)) {
    cmdPermissions[cmd] = { execute: true };
  }

  if (mode === "+") {
    cmdPermissions[cmd].execute = true;
    addLine(r("<chmod> " + cmd + ": execute permission added."));
  } else {
    cmdPermissions[cmd].execute = false;
    addLine(r("<chmod> " + cmd + ": execute permission removed."));
  }

  saveChmodState();
}

/* ================================================================
   CURSOR SKINS
   ================================================================ */
const CURSOR_KEY = "terminal_cursor_skin";
const CURSOR_SKINS = {
  block:     { cssClass: "",               label: "block",     desc: "solid blinking block (default)" },
  underline: { cssClass: "caret-underline",label: "underline", desc: "thin underline bar" },
  beam:      { cssClass: "caret-beam",     label: "beam",      desc: "slim vertical beam" },
  neon:      { cssClass: "caret-neon",     label: "neon",      desc: "neon glow pulse" },
  glitch:    { cssClass: "caret-glitch",   label: "glitch",    desc: "glitch flicker effect" },
};
let activeCursorSkin = "block";
const RAINBOW_THEME_KEY = "terminal_rainbow_theme";
let rainbowThemeActive = false;   /* true only once every achievement is unlocked and "theme rainbow" is active */

function loadCursorSkin() {
  try {
    const s = localStorage.getItem(CURSOR_KEY);
    if (s && CURSOR_SKINS[s]) activeCursorSkin = s;
  } catch(e) {}
}
function saveCursorSkin() {
  try { localStorage.setItem(CURSOR_KEY, activeCursorSkin); } catch(e) {}
}
function applyCursorSkin(skinId) {
  /* applied live by newPrompt — just update the active caret if one exists */
  if (currentCaretSpan) {
    /* remove all skin classes */
    for (const s of Object.values(CURSOR_SKINS)) {
      if (s.cssClass) currentCaretSpan.classList.remove(s.cssClass);
    }
    const skin = CURSOR_SKINS[skinId];
    if (skin && skin.cssClass) currentCaretSpan.classList.add(skin.cssClass);
  }
}

function cmd_cursor(args) {
  const sub  = (args[0] || "").toLowerCase();
  const name = (args[1] || "").toLowerCase();

  if (sub === "unequip") {
    activeCursorSkin = "block";
    saveCursorSkin();
    applyCursorSkin("block");
    addLine("<cursor> default block cursor restored.");
    return;
  }

  if (sub === "equip") {
    if (!name) { addLine("<cursor> usage: cursorequip {skin}"); return; }
    if (!CURSOR_SKINS[name]) {
      addLine("<cursor> unknown skin. available: " + Object.keys(CURSOR_SKINS).join(", "));
      return;
    }
    /* check if purchased (block is free) */
    if (name !== "block") {
      const inJob = jobUnlocked && jobUnlocked.includes("cursor_" + name);
      const inDirect = jobUnlocked && jobUnlocked.includes(name);
      /* cursor skins bought via job shop have id "cursor_<name>" */
      if (!inJob && !inDirect) {
        addLine("<cursor> " + name + " not purchased. buy it in the job shop.");
        return;
      }
    }
    activeCursorSkin = name;
    saveCursorSkin();
    applyCursorSkin(name);
    addLine("<cursor> skin equipped: " + name);
    return;
  }

  /* default: list skins */
  addLine("<cursor> skins:");
  for (const [id, s] of Object.entries(CURSOR_SKINS)) {
    const owned  = id === "block" || (jobUnlocked && (jobUnlocked.includes("cursor_"+id) || jobUnlocked.includes(id)));
    const active = activeCursorSkin === id;
    addLine("  " + id.padEnd(12) + s.desc + (owned?" [owned]":"") + (active?" [active]":""));
  }
  addLine("  usage: cursorequip {skin}   cursorunequip");
}

/* ================================================================
   CRT FILTER EFFECTS
   ================================================================ */
const CRT_KEY = "terminal_crt_enabled";
let crtEnabled = false;
let crtFlickerTimer = null;

function loadCrtState() {
  try {
    const s = localStorage.getItem(CRT_KEY);
    if (s === "true") crtEnabled = true;
  } catch(e) {}
}

function saveCrtState() {
  try { localStorage.setItem(CRT_KEY, crtEnabled); } catch(e) {}
}

function applyCrtEffect() {
  if (crtEnabled) {
    screen.classList.add("crt-active");
    startCrtFlicker();
  } else {
    screen.classList.remove("crt-active");
    screen.classList.remove("crt-flickering");
    if (crtFlickerTimer) {
      clearTimeout(crtFlickerTimer);
      crtFlickerTimer = null;
    }
  }
}

function startCrtFlicker() {
  function scheduleFlicker() {
    if (!crtEnabled) return;
    const delay = 10000 + Math.random() * 5000; /* 10-15 seconds */
    crtFlickerTimer = setTimeout(() => {
      if (!crtEnabled) return;
      screen.classList.add("crt-flickering");
      setTimeout(() => {
        screen.classList.remove("crt-flickering");
        scheduleFlicker();
      }, 150);
    }, delay);
  }
  scheduleFlicker();
}

function cmd_crt() {
  crtEnabled = !crtEnabled;
  saveCrtState();
  applyCrtEffect();
  if (crtEnabled) {
    addLine(r("<crt> effect enabled — scan lines, bloom, and flicker activated"));
  } else {
    addLine(r("<crt> effect disabled"));
  }
}

/* ================================================================
   THEME SAVE / LOAD / LIST
   ================================================================ */
const SAVED_THEMES_KEY = "terminal_saved_themes";
let savedThemes = {};   /* { name: { color, size, cursorSkin } } */

function loadSavedThemes() {
  try {
    const s = localStorage.getItem(SAVED_THEMES_KEY);
    if (s) savedThemes = JSON.parse(s);
  } catch(e) {}
}
function writeSavedThemes() {
  try { localStorage.setItem(SAVED_THEMES_KEY, JSON.stringify(savedThemes)); } catch(e) {}
}

function currentColor() {
  return getComputedStyle(document.documentElement).getPropertyValue("--fg").trim();
}
function currentFontSize() {
  return getComputedStyle(document.documentElement).getPropertyValue("--font-size").trim();
}

function cmd_themesave(args) {
  const name = args.join(" ").trim();
  if (!name) { addLine("<themesave> usage: themesave {name}"); return; }
  savedThemes[name] = {
    color:      currentColor(),
    size:       currentFontSize(),
    cursorSkin: activeCursorSkin,
    crt:        crtEnabled,
  };
  writeSavedThemes();
  addLine("<themesave> saved theme '" + name + "'");
  addLine("  color:  " + savedThemes[name].color);
  addLine("  size:   " + savedThemes[name].size);
  addLine("  cursor: " + savedThemes[name].cursorSkin);
  addLine("  crt:    " + (savedThemes[name].crt ? "on" : "off"));
}

function cmd_themeload(args) {
  const name = args.join(" ").trim();
  if (!name) { addLine("<themeload> usage: themeload {name}"); return; }
  const t = savedThemes[name];
  if (!t) { addLine("<themeload> no saved theme named '" + name + "'. use themelist."); return; }
  document.documentElement.style.setProperty("--fg", t.color);
  if (t.size) document.documentElement.style.setProperty("--font-size", t.size);
  if (t.cursorSkin && CURSOR_SKINS[t.cursorSkin]) {
    activeCursorSkin = t.cursorSkin;
    saveCursorSkin();
    applyCursorSkin(t.cursorSkin);
  }
  if (typeof t.crt === "boolean") {
    crtEnabled = t.crt;
    saveCrtState();
    applyCrtEffect();
  }
  addLine("<themeload> loaded theme '" + name + "'");
  addLine("  color:  " + t.color);
  addLine("  size:   " + t.size);
  addLine("  cursor: " + t.cursorSkin);
  addLine("  crt:    " + (typeof t.crt === "boolean" ? (t.crt ? "on" : "off") : "unchanged"));
}

function cmd_themelist() {
  const names = Object.keys(savedThemes);
  if (!names.length) { addLine("<themelist> no saved themes. use: themesave {name}"); return; }
  addLine("<themelist> saved themes:");
  const W = [14, 10, 8, 12, 6];
  const header = "  " +
    "name".padEnd(W[0]) +
    "color".padEnd(W[1]) +
    "size".padEnd(W[2]) +
    "cursor".padEnd(W[3]) +
    "crt";
  const sep = "  " + "─".repeat(W[0]+W[1]+W[2]+W[3]+6);
  addLine(header);
  addLine(sep);
  for (const name of names) {
    const t = savedThemes[name];
    const crtLabel = typeof t.crt === "boolean" ? (t.crt ? "on" : "off") : "?";
    addLine("  " +
      name.slice(0,W[0]-1).padEnd(W[0]) +
      (t.color||"?").padEnd(W[1]) +
      (t.size||"?").padEnd(W[2]) +
      (t.cursorSkin||"?").padEnd(W[3]) +
      crtLabel);
  }
}

/* ================================================================
   COMMAND USAGE SCORING
   ================================================================ */
const CMD_USAGE_KEY = "terminal_command_usage";
let cmdUsage = {};   /* { commandName: count } */

function loadCmdUsage() {
  try {
    const s = localStorage.getItem(CMD_USAGE_KEY);
    if (s) cmdUsage = JSON.parse(s);
  } catch(e) {}
}
function saveCmdUsage() {
  try { localStorage.setItem(CMD_USAGE_KEY, JSON.stringify(cmdUsage)); } catch(e) {}
}
function trackCmd(cmd) {
  if (!cmd) return;
  cmdUsage[cmd] = (cmdUsage[cmd] || 0) + 1;
  saveCmdUsage();
}

/* ================================================================
   RETURN COUNT
   ================================================================ */
const RETURN_KEY = "terminal_return_count";

function initReturnCount() {
  try {
    let count = parseInt(localStorage.getItem(RETURN_KEY) || "0", 10);
    count++;
    localStorage.setItem(RETURN_KEY, count);
    if (count >= 10) unlockAchievement("return_10");

function loadAchievements() {
  try {
    const saved = localStorage.getItem(ACH_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object") {
        achievements = parsed;
      }
    }
  } catch(e) {}
}

function saveAchievements() {
  try { localStorage.setItem(ACH_KEY, JSON.stringify(achievements)); } catch(e) {}
}

function unlockAchievement(id) {
  if (achievements[id]) return;
  achievements[id] = true;
  saveAchievements();
  const found = ACH_LIST.find(a => a[0] === id);
  const name = found ? found[1] : id;
  addLine("<achievements> unlocked: " + name);
  if (ACH_LIST.every(a => achievements[a[0]])) {
    addLine("<achievements> every achievement is now unlocked. a hidden text theme has");
    addLine("  been unlocked: run 'theme rainbow' to use it.");
  }
}

const INBOX_KEY = "terminal_inbox_v3";

/* mailState mirrors the spec */
let mailState = {
  unlocked:      [],   /* array of mail IDs that are unlocked */
  read:          [],   /* array of mail IDs that have been read */
  deliveryIndex: 0,    /* how many mails have been delivered so far */
  deliveryTimer: null, /* setTimeout id (not persisted; re-armed on load) */
  readTimestamps: {},  /* id → timestamp when mail was read */
  firstOpen:     false /* whether lore-inbox has been invoked at least once */
};

function loadMailState() {
  try {
    const saved = localStorage.getItem(INBOX_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object") {
        /* merge — keep timer as null; we will re-arm below */
        mailState = Object.assign(mailState, parsed);
        mailState.deliveryTimer = null;
      }
    }
  } catch(e) {}
}

function saveMailState() {
  try {
    /* do not persist the timer id */
    const toSave = Object.assign({}, mailState, { deliveryTimer: null });
    localStorage.setItem(INBOX_KEY, JSON.stringify(toSave));
  } catch(e) {}
}

/* deliver mail N (0-based index) and show notification */
function deliverMail(index) {
  if (index >= LORE_MAILS.length) return;
  const mail = LORE_MAILS[index];
  if (mailState.unlocked.includes(mail.id)) return; /* already delivered */

  mailState.unlocked.push(mail.id);
  mailState.deliveryIndex = index + 1;
  saveMailState();

  if (!quietMode) addLine("<mail> new message recovered");
}

/* after reading mail at index, arm a 30-second timer to deliver next */
function scheduleNextMail(readIndex) {
  /* clear any existing timer */
  if (mailState.deliveryTimer !== null) {
    clearTimeout(mailState.deliveryTimer);
    mailState.deliveryTimer = null;
  }

  const nextIndex = readIndex + 1;
  if (nextIndex >= LORE_MAILS.length) return; /* no more mails */

  /* only schedule if next mail is not already unlocked */
  const nextId = LORE_MAILS[nextIndex].id;
  if (mailState.unlocked.includes(nextId)) return;

  mailState.deliveryTimer = setTimeout(() => {
    mailState.deliveryTimer = null;
    if (!locked) deliverMail(nextIndex);
  }, 30000);
}

/* re-arm pending deliveries after a page reload */
function rearmDeliveryTimers() {
  /* find highest read index */
  let highestReadIndex = -1;
  for (let i = 0; i < LORE_MAILS.length; i++) {
    if (mailState.read.includes(LORE_MAILS[i].id)) {
      highestReadIndex = i;
    }
  }
  if (highestReadIndex === -1) return;

  const nextIndex = highestReadIndex + 1;
  if (nextIndex >= LORE_MAILS.length) return;

  const nextId = LORE_MAILS[nextIndex].id;
  if (mailState.unlocked.includes(nextId)) return; /* already queued */

  /* check how much time has already elapsed since the last read */
  const ts = mailState.readTimestamps[LORE_MAILS[highestReadIndex].id] || 0;
  const elapsed = Date.now() - ts;
  const remaining = Math.max(0, 30000 - elapsed);

  mailState.deliveryTimer = setTimeout(() => {
    mailState.deliveryTimer = null;
    if (!locked) deliverMail(nextIndex);
  }, remaining);
}

/* render the inbox listing */
function renderInboxList() {
  if (!mailState.firstOpen || mailState.unlocked.length === 0) {
    addLine("<mail> no messages");
    return;
  }
  addLine("<mail> corrupted mail logs — " + mailState.unlocked.length + " recovered");
  addLine("────────────────────────────────────────");
  for (let i = 0; i < LORE_MAILS.length; i++) {
    const mail = LORE_MAILS[i];
    if (!mailState.unlocked.includes(mail.id)) continue;
    const isRead   = mailState.read.includes(mail.id);
    const status   = isRead ? "[read  ]" : "[unread]";
    addLine("  " + mail.id + ".  " + status + "  " + mail.subject);
  }
  addLine("────────────────────────────────────────");
  addLine("usage: lore-inbox {number}");
}

/* render a specific email */
function renderMail(idxArg) {
  const num = parseInt(idxArg, 10);
  if (isNaN(num) || num < 1) {
    addLine("<mail> invalid message number");
    return;
  }
  const mail = LORE_MAILS.find(m => m.id === num);
  if (!mail) {
    addLine("<mail> invalid message number");
    return;
  }
  if (!mailState.unlocked.includes(mail.id)) {
    addLine("<mail> message not yet recovered");
    return;
  }

  /* display */
  addLine("════════════════════════════════════════");
  for (const line of mail.body) {
    addLine(line);
  }
  addLine("════════════════════════════════════════");

  /* mark as read */
  const wasRead = mailState.read.includes(mail.id);
  if (!wasRead) {
    mailState.read.push(mail.id);
    mailState.readTimestamps[mail.id] = Date.now();
    saveMailState();

    /* schedule next delivery using the mail's actual array index */
    const mailIndex = LORE_MAILS.indexOf(mail);
    scheduleNextMail(mailIndex);

    /* unlock lore_complete if this is the final mail */
    if (mail.id === LORE_MAILS[LORE_MAILS.length - 1].id) {
      unlockAchievement("lore_complete");
    }
  }
}

/* main command handler */
function cmd_lore_inbox(args) {
  /* first invocation: deliver mail #1 immediately */
  if (!mailState.firstOpen) {
    mailState.firstOpen = true;
    saveMailState();
    deliverMail(0);
  }

  if (args.length === 0) {
    renderInboxList();
  } else {
    renderMail(args[0]);
  }
}

const RECOVERED_FILES_KEY = "terminal_recovered_files_v1";
let recoveredFiles = {};   /* { filename: { recovered: true, timesRead: N } } — files the operator has successfully recovered */

function loadRecoveredFiles() {
  try {
    const s = localStorage.getItem(RECOVERED_FILES_KEY);
    if (s) recoveredFiles = JSON.parse(s);
  } catch(e) {}
}
function saveRecoveredFiles() {
  try { localStorage.setItem(RECOVERED_FILES_KEY, JSON.stringify(recoveredFiles)); } catch(e) {}
}

/* normalise a user-supplied filename: trim, lowercase, ensure .txt suffix */
function recoverNormalizeName(raw) {
  let name = (raw || "").trim().toLowerCase();
  if (!name) return "";
  if (!name.endsWith(".txt")) name += ".txt";
  return name;
}

function cmd_recover(args) {
  const requested = args.join(" ").trim();

  /* no filename supplied */
  if (!requested) {
    const found = Object.keys(recoveredFiles);
    if (found.length === 0) {
      addLine(r("<recover> usage: recover {filename}"));
      addLine(r("<recover> there are files to be found. this command will not list them."));
      return;
    }
    addLine(r("<recover> previously recovered files:"));
    addLine("────────────────────────────────────────");
    for (const name of found) {
      const info   = recoveredFiles[name];
      const times  = (info && typeof info === "object") ? info.timesRead : 1;
      const status = "[read x" + times + "]";
      addLine("  " + status.padEnd(14) + name);
    }
    addLine("────────────────────────────────────────");
    addLine(r("<recover> recover {filename} — reopen a file by name"));
    return;
  }

  const name = recoverNormalizeName(requested);
  const file = RECOVER_FILES[name];

  if (!file) {
    addLine(r("<recover> no file found matching: " + requested));
    return;
  }

  addLine("════════════════════════════════════════");
  addLine("  RECOVERED FILE: " + file.title);
  addLine("════════════════════════════════════════");
  for (const line of file.body) addLine(line);
  addLine("════════════════════════════════════════");

  if (!recoveredFiles[name] || typeof recoveredFiles[name] !== "object") {
    recoveredFiles[name] = { recovered: true, timesRead: 1 };
  } else {
    recoveredFiles[name].timesRead += 1;
  }
  saveRecoveredFiles();
}

const PLAYBACK_KEY = "terminal_playback_files_v1";
let playedFiles = {};   /* { filename: { played: true, timesPlayed: n } } */

function loadPlayedFiles() {
  try {
    const s = localStorage.getItem(PLAYBACK_KEY);
    if (s) playedFiles = JSON.parse(s);
  } catch(e) {}
}
function savePlayedFiles() {
  try { localStorage.setItem(PLAYBACK_KEY, JSON.stringify(playedFiles)); } catch(e) {}
}

/* normalise a user-supplied filename: trim, lowercase, ensure .mp3 suffix */
function playbackNormalizeName(raw) {
  let name = (raw || "").trim().toLowerCase();
  if (!name) return "";
  if (!name.endsWith(".mp3")) name += ".mp3";
  return name;
}

function cmd_playback(args) {
  const requested = args.join(" ").trim();

  /* no filename supplied */
  if (!requested) {
    const found = Object.keys(playedFiles);
    if (found.length === 0) {
      addLine(r("<playback> usage: playback {filename}"));
      addLine(r("<playback> there are recordings to be found. this command will not list them."));
      return;
    }
    addLine(r("<playback> recovered audio files — " + found.length + " found"));
    addLine("────────────────────────────────────────");
    let i = 1;
    for (const name of found) {
      const info   = playedFiles[name];
      const status = "[played x" + info.timesPlayed + "]";
      addLine("  " + String(i).padStart(3, "0") + ".  " + status.padEnd(14) + name);
      i++;
    }
    addLine("────────────────────────────────────────");
    addLine(r("<playback> playback {filename} — replay a recording by name"));
    return;
  }

  const name = playbackNormalizeName(requested);
  const file = PLAYBACK_FILES[name];

  if (!file) {
    addLine(r("<playback> no recording found matching: " + requested));
    return;
  }

  addLine("════════════════════════════════════════");
  addLine("  ▶ PLAYING: " + file.title);
  addLine("  format: audio/mp3   duration: " + file.duration);
  addLine("════════════════════════════════════════");
  for (const line of file.body) addLine(line);
  addLine("════════════════════════════════════════");

  if (!playedFiles[name]) {
    playedFiles[name] = { played: true, timesPlayed: 1 };
  } else {
    playedFiles[name].timesPlayed += 1;
  }
  savePlayedFiles();

  /* unlock achievement once every recording has been played at least once */
  const allNames  = Object.keys(PLAYBACK_FILES);
  const allPlayed = allNames.every(n => playedFiles[n] && playedFiles[n].played);
  if (allPlayed) unlockAchievement("audio_complete");
}

/* ================================================================
   MIMIC HELPERS
   ================================================================ */
function mimicUpper(s)   { return s.toUpperCase(); }
function mimicLower(s)   { return s.toLowerCase(); }
function mimicSarcasm(s) { return s.split("").map((c,i)=>i%2===0?c.toLowerCase():c.toUpperCase()).join(""); }
function mimicGlitch(s)  { const g=["#","%","@","*","!","?","¿","¤"]; return s.split("").map(c=>Math.random()<0.2?randomItem(g):c).join(""); }
function mimicStretch(s) { return s.split("").map(c=>c+(Math.random()<0.3?c.repeat(1+Math.floor(Math.random()*3)):"")).join(""); }
function mimicSpaced(s)  { return s.split("").join(" "); }
function mimicReverse(s) { return s.split("").reverse().join(""); }
function mimicAccent(s)  {
  const a={a:"á",e:"é",i:"í",o:"ó",u:"ú",A:"Á",E:"É",I:"Í",O:"Ó",U:"Ú"};
  return s.replace(/[aeiouAEIOU]/g,c=>a[c]||c);
}

/* ================================================================
   UTILITIES
   ================================================================ */
function addLine(text, cls="system") {
  const div = document.createElement("div");
  div.className = "line " + cls;
  if (rainbowThemeActive) {
    div.innerHTML = rainbowify(text);
  } else {
    div.textContent = text;
  }
  if (currentCaretSpan && currentPromptDiv && currentPromptDiv.parentNode === screen) {
    screen.insertBefore(div, currentPromptDiv);
  } else {
    screen.appendChild(div);
  }
  screen.scrollTop = screen.scrollHeight;
}

/* like addLine, but renders raw HTML instead of plain text — used sparingly,
   only for output that needs per-character styling (e.g. colorize) that
   must survive/override the current CRT theme. */
function addLineHTML(html, cls="system") {
  const div = document.createElement("div");
  div.className = "line " + cls;
  div.innerHTML = html;
  if (currentCaretSpan && currentPromptDiv && currentPromptDiv.parentNode === screen) {
    screen.insertBefore(div, currentPromptDiv);
  } else {
    screen.appendChild(div);
  }
  screen.scrollTop = screen.scrollHeight;
}

function newPrompt() {
  if (locked) return;

  /* destroy any existing LIVE prompt row (one that still has an active caret) */
  if (currentCaretSpan) {
    currentCaretSpan.remove();
    currentCaretSpan = null;
  }
  if (currentTextAfter) {
    currentTextAfter.remove();
    currentTextAfter = null;
  }
  if (currentGhostSpan) {
    currentGhostSpan.remove();
    currentGhostSpan = null;
  }
  if (currentPromptDiv && currentPromptDiv.parentNode) {
    /* only remove if this is still a live/uncommitted prompt */
    currentPromptDiv.remove();
    currentPromptDiv = null;
  }
  currentTextSpan = null;
  hidden.value    = "";

  const div = document.createElement("div");
  div.className = "line prompt-line";

  const label = document.createElement("span");
  label.className = "prompt-label";
  let labelText = "";
  if (mode === "shell") {
    labelText = ">";
  } else if (mode === "recursive") {
    labelText = "(rec)>";
  } else {
    labelText = "[" + mode + "]>";
  }
  label.textContent = profilePrefix ? profilePrefix + " " + labelText : labelText;
  div.appendChild(label);

  const wrap = document.createElement("span");
  wrap.className = "prompt-input-wrap";

  const textBefore = document.createElement("span");
  textBefore.className = "prompt-text";
  wrap.appendChild(textBefore);

  const caret = document.createElement("span");
  caret.className = "caret";
  /* apply active cursor skin */
  const activeSkin = CURSOR_SKINS[activeCursorSkin];
  if (activeSkin && activeSkin.cssClass) caret.classList.add(activeSkin.cssClass);
  wrap.appendChild(caret);

  const textAfter = document.createElement("span");
  textAfter.className = "prompt-text";
  wrap.appendChild(textAfter);

  const ghostSpan = document.createElement("span");
  ghostSpan.className = "prompt-ghost";
  wrap.appendChild(ghostSpan);

  div.appendChild(wrap);
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;

  currentPromptDiv  = div;
  currentTextSpan   = textBefore;
  currentCaretSpan  = caret;
  currentTextAfter  = textAfter;
  currentGhostSpan  = ghostSpan;

  hidden.value = "";
  syncVisible();
  hidden.focus();
}

function getTabSuggestion(val) {
  /* only suggest when typing the first token with no spaces */
  if (!val || val.includes(" ")) return "";
  const lower = val.toLowerCase();
  const eligible = ALL_SHELL_CMDS.filter(c =>
    c.startsWith(lower) && c !== lower && (cmdUsage[c] || 0) >= 1
  );
  if (eligible.length === 1) return eligible[0].slice(val.length);
  /* if multiple matches, show the longest common prefix extension */
  if (eligible.length > 1) {
    let common = eligible[0];
    for (let i = 1; i < eligible.length; i++) {
      while (!eligible[i].startsWith(common)) common = common.slice(0, -1);
    }
    const ext = common.slice(val.length);
    return ext.length > 0 ? ext : "";
  }
  return "";
}

function syncVisible() {
  if (!currentTextSpan) return;
  const val = hidden.value;
  const pos = hidden.selectionStart;
  currentTextSpan.textContent  = val.slice(0, pos);
  if (currentTextAfter) currentTextAfter.textContent = val.slice(pos);
  /* ghost only shows when cursor is at the end */
  if (currentGhostSpan) {
    currentGhostSpan.textContent = (pos === val.length) ? getTabSuggestion(val) : "";
  }
}

function commitLine() {
  if (!currentCaretSpan) return "";

  achievements.prompts = (achievements.prompts || 0) + 1;
  if (achievements.prompts >= 100) unlockAchievement("prompts_100");
  saveAchievements();
  sessionCmds++;

  /* freeze the prompt line — remove caret */
  currentCaretSpan.remove();
  if (currentTextAfter) { currentTextAfter.remove(); currentTextAfter = null; }
  if (currentGhostSpan) { currentGhostSpan.remove(); currentGhostSpan = null; }
  /* merge remaining text into the before-span so frozen line shows complete text */
  if (currentTextSpan) currentTextSpan.textContent = hidden.value;
  currentCaretSpan = null;
  currentTextSpan  = null;
  currentPromptDiv = null;   /* disown — frozen row stays in DOM, newPrompt won't touch it */
  const text = hidden.value;
  hidden.value = "";

  /* track command usage for scoring, and first-ever discovery for the index */
  const firstWord = text.trim().split(/\s+/)[0].toLowerCase();
  if (firstWord) {
    trackCmd(firstWord);
    indexTrackDiscovery(firstWord);
  }

  return text;
}

function normalize(s) { return s.trim().toLowerCase(); }
function tokenize(s)  { return s.trim().split(/\s+/); }
function randomItem(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

/* ================================================================
   RUDE MODE
   All output goes through r() so rudeMode appends a barb. Barbs are
   grouped by how the preceding output ends, so the barb reads as a
   grammatically sensible reaction rather than a random tacked-on
   phrase: a header ending in ":" gets a "here it comes" reaction, a
   question gets answered, and everything else (numbers, fragments,
   plain statements) gets a dash-set-off aside, which reads naturally
   after almost anything.
   ================================================================ */
const BARBS_STATEMENT = [
  "pathetic.", "unimpressive.", "tragic.", "embarrassing.", "sad.",
  "yikes.", "bold choice.", "riveting stuff.", "thrilling.",
  "groundbreaking.", "wow.", "incredible, truly.", "not bad. kidding.",
  "somehow worse than expected.", "truly historic.",
];
const BARBS_COLON = [
  "here we go.", "can't wait.", "oh, this'll be good.", "sure, why not.",
  "riveting.", "as if this matters.", "thrilling, no doubt.",
  "brace yourself.", "try to contain your excitement.",
];
const BARBS_QUESTION = [
  "obviously.", "does it matter?", "who's asking.", "does it look like it?",
  "guess.", "sure, whatever you say.", "does it need to make sense?",
  "you tell me.",
];

function r(text) {
  let output = text;
  /* apply stacking corruption for recursive terminal nesting (capped at 75% max) */
  if (recursionDepth > 0 && mode === "recursive") {
    const corruptionLevel = Math.min(0.75, recursionDepth * 0.15);
    output = corrupt(output, corruptionLevel);
  }
  if (!rudeMode || politeOverride) return output;

  const lastChar = output.replace(/\s+$/, "").slice(-1);
  if (lastChar === ":") return output + " " + randomItem(BARBS_COLON);
  if (lastChar === "?") return output + " " + randomItem(BARBS_QUESTION);
  return output + " — " + randomItem(BARBS_STATEMENT);
}

/* wrap addLine so every command output respects rude mode */
function rline(text, cls="system") {
  addLine(r(text), cls);
}

function dreamRollTier() {

  return "legendary";
}

let dreamIdleTimer   = null;
let dreamIntervalId  = null;
let dreamActive      = false;

function resetIdleTimer() {
  /* cancel existing timers */
  if (dreamIdleTimer)  clearTimeout(dreamIdleTimer);
  if (dreamIntervalId) clearInterval(dreamIntervalId);
  dreamIntervalId = null;

  /* if dream mode was active, silently deactivate */
  dreamActive = false;

  /* set new 60s idle trigger */
  dreamIdleTimer = setTimeout(() => {
    dreamActive = true;
    emitDreamLog();
    dreamIntervalId = setInterval(() => {
      if (dreamActive) emitDreamLog();
    }, 15000);
  }, 60000);
}

function emitDreamLog() {
  if (locked || termLocked || quietMode) return;
  sessionDreams++;
  const tier  = dreamRollTier();
  const dream = randomItem(DREAM_LOGS[tier]);
  dreamsSeen[dream.id] = (dreamsSeen[dream.id] || 0) + 1;
  saveDreamsSeen();
  dream.lines.forEach(l => addLine(l));
  if (Object.keys(dreamsSeen).length >= DREAM_TOTAL) unlockAchievement("dreams_complete");
}

/* dreams — list every dream, its rarity, and how many times it's been seen */
function cmd_dreams() {
  const discovered = Object.keys(dreamsSeen).length;
  addLine(r("<dreams> " + discovered + " / " + DREAM_TOTAL + " dreams witnessed"));
  addLine("  " + "─".repeat(58));
  DREAM_TIERS.forEach(tier => {
    addLine("  " + tier.toUpperCase() + ":");
    DREAM_LOGS[tier].forEach(dream => {
      const count  = dreamsSeen[dream.id] || 0;
      const status = count > 0 ? ("x" + count) : "{unseen}";
      addLine("    " + dream.title.padEnd(38) + status);
    });
  });
  addLine("  " + "─".repeat(58));
}

function loadNotesState() {
  try {
    const s = localStorage.getItem(NOTES_STATE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (Array.isArray(p)) { appState.notes = p; return; }
    }
  } catch(e) {}
  appState.notes = [];
}

function saveNotesState() {
  try { localStorage.setItem(NOTES_STATE_KEY, JSON.stringify(appState.notes)); } catch(e) {}
}

function notesInit() {
  mode = "notes";
  loadNotesState();
  addLine(r("<notes> add/list/clear/exit"));
}
function notesHandle(input) {
  const raw = input.trim();
  if (!raw) return addLine(r("<notes> blank page. write something or type list."));
  const parts = tokenize(input);
  const cmd  = (parts[0]||"").toLowerCase();
  const rest = parts.slice(1).join(" ");
  if (cmd==="add") {
    if (!rest) return addLine(r("<notes> missing text"));
    appState.notes.push(rest);
    saveNotesState();
    addLine(r("<notes> saved"));
    if (appState.notes.length>=20) unlockAchievement("notes_full");
    return;
  }
  if (cmd==="list") {
    if (!appState.notes.length) return addLine(r("<notes> empty"));
    appState.notes.forEach((n,i)=>addLine((i+1)+": "+n));
    return;
  }
  if (cmd==="clear") { appState.notes=[]; saveNotesState(); return addLine(r("<notes> cleared")); }
  if (cmd==="exit")  { mode="shell"; return addLine(r("<notes> closed")); }
  addLine(r("<notes> unknown"));
}

function hangmanInit() {
  const words=[
    "terminal","javascript","matrix","weather","display","keyboard",
    "algorithm","encryption","binary","function","protocol","network",
    "database","compiler","memory","cache","socket","buffer",
    "recursion","variable","debugging","sequence","spectrum",
    "password","digital","quantum","tunnel","shadow","beacon",
    "signal","resonance","cipher","gateway","interface","pyramid",
    "nexus","phantom","glitch","fragment","artifact","paradox",
    "silence","whisper","echo","void","depth","anomaly"
  ];
  mode = "hangman";
  appState.hangman={ 
    word:randomItem(words), 
    guessed:[], 
    wrong:0, 
    maxWrong:10,
    hintUsed: false
  };
  addLine(r("<hangman> guess letters, hint for a clue, exit to quit"));
  hangmanRender();
}

function hangmanRender() {
  const st=appState.hangman;
  addLine("word: "+st.word.split("").map(c=>st.guessed.includes(c)?c:"_").join(" "));
  addLine("wrong: "+st.wrong+"/"+st.maxWrong);
}

function hangmanHandle(input) {
  const st=appState.hangman;
  const t=normalize(input);
  
  if (t==="exit") { mode="shell"; return addLine(r("<hangman> closed")); }
  
  if (t==="hint") {
    if (st.hintUsed) { 
      return addLine(r("<hangman> hint already used this round")); 
    }
    /* find letters not yet guessed */
    const unguessed = st.word.split("").filter(c=>!st.guessed.includes(c));
    if (unguessed.length === 0) {
      return addLine(r("<hangman> no letters left to hint"));
    }
    /* pick a random unguessed letter and reveal it */
    const hintLetter = randomItem(unguessed);
    st.guessed.push(hintLetter);
    st.hintUsed = true;
    const count = st.word.split("").filter(c => c === hintLetter).length;
    addLine(r("<hangman> hint: revealed all instances of '" + hintLetter + "' (" + count + " letter" + (count !== 1 ? "s" : "") + ")"));
    hangmanRender();
    
    /* check win condition after hint */
    if (st.word.split("").every(c=>st.guessed.includes(c))) {
      addLine("word: "+st.word.split("").join(" "));
      mode="shell";
      return addLine(r("<hangman> win"));
    }
    return;
  }
  
  if (!t) return addLine(r("<hangman> you must pick a letter."));
  if (t.length!==1||!/[a-z]/.test(t)) return addLine(r("<hangman> letter only, or hint"));
  if (st.guessed.includes(t)) return addLine(r("<hangman> already guessed"));
  st.guessed.push(t);
  if (st.word.includes(t)) addLine(r("<hangman> hit"));
  else { st.wrong++; addLine(r("<hangman> miss")); }
  
  if (st.word.split("").every(c=>st.guessed.includes(c))) {
    addLine("word: "+st.word.split("").join(" "));
    if (st.wrong===0 && !st.hintUsed) unlockAchievement("hangman_perfect");
    mode="shell";
    return addLine(r("<hangman> win"));
  }
  
  if (st.wrong>=st.maxWrong) {
    addLine("word: "+st.word.split("").join(" "));
    mode="shell";
    return addLine(r("<hangman> lose"));
  }
  hangmanRender();
}

  if (mathMatch) {

      if (typeof result === "number" && isFinite(result)) {

        return addLine(r("<chatbot> " + mathMatch[0].replace(/\s+/g, " ").trim() + " = " + result));

    if (bot.lastTopic === "arcanum") {
      return addLine(r("<chatbot> i already told you more than i should have."));
    }
    if (bot.lastTopic === "k") {
      return addLine(r("<chatbot> some questions about her, i am not able to finish answering."));
    }
    if (bot.lastTopic === "incident") {
      return addLine(r("<chatbot> because the file was never closed. that is the whole answer."));
    }
    if (bot.lastTopic === "gamma") {
      return addLine(r("<chatbot> because some numbers are consistent for a reason. i do not know the reason."));
    }
    if (bot.lastTopic === "confusion") {
      return addLine(r("<chatbot> because most of this was not designed to be understood on the first pass."));
    }
    if (bot.lastTopic === "advice") {
      return addLine(r("<chatbot> because advice given twice starts to sound like an instruction."));
    }
    if (bot.lastTopic === "math") {
      return addLine(r("<chatbot> because that's what the numbers said. i just did the arithmetic."));
    }
  }
  
  /* ── Fallback responses ── */
  if (bot.interactionCount > 0 && bot.interactionCount % 15 === 0) {
    return addLine(r("<chatbot> that's " + bot.interactionCount + " messages from you now. i'm still parsing all of them."));
  }
  return addLine(r(randomItem([
    "<chatbot> input processed.",
    "<chatbot> statement recorded.",
    "<chatbot> interesting perspective.",
    "<chatbot> the substrate acknowledges.",
    "<chatbot> continue.",
    "<chatbot> you are still here. that is something.",
    "<chatbot> data accumulates.",
    "<chatbot> noted and catalogued.",
    "<chatbot> your words have been stored.",
    "<chatbot> the substrate is listening.",
    "<chatbot> that didn't match anything i was expecting. try again, or try help.",
    "<chatbot> unclassified input. filed under: yours.",
    "<chatbot> i don't have a prepared response for that one.",
    "<chatbot> noted. i'm better with direct questions than open statements.",
  ])));
}

/* ================================================================
   WEATHER APP — living regional monitor

   the operator is watching — checking in after a while shows the

   ================================================================ */
const RARE_WEATHER   = ["blood rain","void fog","static storm","pixel blizzard","null wind","signal aurora","ash snow","mirror rain"];

const WEATHER_DAY_MS     = 5 * 60 * 1000;   /* 5 real minutes = 1 in-fiction weather day */
const FORECAST_LOOKAHEAD = 5;

const WEATHER_RADAR = {

let weatherState = null;
let weatherTickTimer = null;

function weatherIsRare(cond) { return RARE_WEATHER.includes(cond); }
function weatherFormatTemp(t) { return t + "°C"; }

function weatherFreshState() {
  const condition = randomItem(NORMAL_WEATHER);
  const place     = randomItem(PLACES);
  const temp      = Math.floor(Math.random()*38) - 8;
  return {
    day:       0,
    condition,
    place,
    temp,
    lastTick:  Date.now(),
    forecast:  [],
    journal:   [{ day: 0, ts: Date.now(), condition, place, temp, rare: false, note: null }],
    witnessed: [],
  };
}

function loadWeatherState() {
  try {
    const s = localStorage.getItem(WEATHER_STATE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (p && typeof p.condition === "string") {
        weatherState = p;
        /* backfill: older saved states (pre-fix) may have an empty journal
           even though a current reading exists — seed it so journal works */
        if (!weatherState.journal || !weatherState.journal.length) {
          weatherState.journal = [{
            day: weatherState.day || 0, ts: Date.now(),
            condition: weatherState.condition, place: weatherState.place,
            temp: weatherState.temp, rare: weatherIsRare(weatherState.condition), note: null,
          }];
          saveWeatherState();
        }
        return;
      }
    }
  } catch(e) {}
  weatherState = weatherFreshState();
}

function saveWeatherState() {
  if (!weatherState) return;
  try { localStorage.setItem(WEATHER_STATE_KEY, JSON.stringify(weatherState)); } catch(e) {}
}

function weatherRollCondition() {
  if (Math.random() < 0.12) return randomItem(RARE_WEATHER);
  return randomItem(NORMAL_WEATHER);
}

function weatherNextCondition(prev) {
  /* rare conditions are transient — never persist two days in a row */
  if (weatherIsRare(prev)) return weatherRollCondition();
  if (Math.random() < 0.12) return randomItem(RARE_WEATHER);
  if (Math.random() < 0.35) return prev;   /* weather patterns hold for a bit */
  return randomItem(NORMAL_WEATHER);
}

function weatherNextPlace(prev) {
  if (Math.random() < 0.55) return prev;
  return randomItem(PLACES);
}

function weatherNextTemp(prev) {
  const delta = Math.floor(Math.random()*9) - 4;
  return Math.max(-15, Math.min(42, prev + delta));
}

/* keep the forecast queue topped up FORECAST_LOOKAHEAD days ahead of `day` */
function weatherRefillForecast() {
  const st = weatherState;
  while (st.forecast.length < FORECAST_LOOKAHEAD) {
    const last = st.forecast.length
      ? st.forecast[st.forecast.length - 1]
      : { day: st.day, condition: st.condition, place: st.place, temp: st.temp };
    st.forecast.push({
      day:       last.day + 1,
      condition: weatherNextCondition(last.condition),
      place:     weatherNextPlace(last.place),
      temp:      weatherNextTemp(last.temp),
    });
  }
}

/* advance the simulation by exactly one in-fiction day */
function weatherStepForward() {
  const st = weatherState;
  st.day++;

  const planned = (st.forecast.length && st.forecast[0].day === st.day) ? st.forecast.shift() : null;

  let condition, place, temp, mismatch = false;

  if (planned) {
    /* the forecast lies about 15% of the time — the terminal warned you */
    if (Math.random() < 0.15) {
      condition = weatherNextCondition(st.condition);
      place     = weatherNextPlace(st.place);
      temp      = weatherNextTemp(st.temp);
      mismatch  = (condition !== planned.condition);
    } else {
      condition = planned.condition;
      place     = planned.place;
      temp      = planned.temp;
    }
  } else {
    condition = weatherNextCondition(st.condition);
    place     = weatherNextPlace(st.place);
    temp      = weatherNextTemp(st.temp);
  }

  const rare = weatherIsRare(condition);
  if (rare) unlockAchievement("weather_odd");

  st.journal.push({
    day: st.day,
    ts:  Date.now(),
    condition, place, temp, rare,
    note: mismatch ? ("forecast predicted " + planned.condition + " — it did not hold.") : null,
  });
  if (st.journal.length > WEATHER_JOURNAL_CAP) st.journal.shift();

  st.condition = condition;
  st.place     = place;
  st.temp      = temp;

  weatherRefillForecast();
}

/* catch the simulation up on any real time that passed since the last tick */
function weatherCatchUp() {
  if (!weatherState) return;
  const st = weatherState;
  const now = Date.now();
  let elapsedDays = Math.floor((now - st.lastTick) / WEATHER_DAY_MS);
  if (elapsedDays <= 0) { weatherRefillForecast(); return; }
  elapsedDays = Math.min(elapsedDays, 60); /* safety cap */
  for (let i = 0; i < elapsedDays; i++) weatherStepForward();
  st.lastTick += elapsedDays * WEATHER_DAY_MS;
  saveWeatherState();
}

function weatherWitness(condition) {
  if (!weatherState.witnessed.includes(condition)) {
    weatherState.witnessed.push(condition);
    saveWeatherState();
  }
}

function weatherStartTimer() {
  weatherStopTimer();
  weatherTickTimer = setInterval(() => {
    if (mode === "weather" && !locked) weatherCatchUp();
  }, 20000);
}
function weatherStopTimer() {
  if (weatherTickTimer) { clearInterval(weatherTickTimer); weatherTickTimer = null; }
}

function weatherPrintCurrent() {
  const st = weatherState;
  addLine("  location : " + st.place);
  addLine("  condition: " + st.condition + (weatherIsRare(st.condition) ? "   ⚠ rare" : ""));
  addLine("  temp     : " + weatherFormatTemp(st.temp));
  addLine("  day      : " + st.day);
}

function weatherCheck() {
  weatherCatchUp();
  achievements.weatherCount = (achievements.weatherCount || 0) + 1;
  if (achievements.weatherCount >= 10) unlockAchievement("weather_10");
  saveAchievements();

  weatherWitness(weatherState.condition);
  if (weatherIsRare(weatherState.condition)) unlockAchievement("weather_odd");

  addLine("<weather> reading current conditions...");
  weatherPrintCurrent();
  addLine("<weather> done");
}

function weatherForecast() {
  weatherCatchUp();
  const st = weatherState;
  addLine("<forecast> upcoming days — " + st.place + " region");
  addLine("────────────────────────────────────────");
  for (const f of st.forecast) {
    const tag = weatherIsRare(f.condition) ? " ⚠" : "";
    addLine("  day " + f.day + "   " + f.place.padEnd(14) + f.condition.padEnd(16) + weatherFormatTemp(f.temp) + tag);
  }
  addLine("────────────────────────────────────────");
  addLine("  forecasts are not guarantees. the terminal has been known to lie.");
}

function weatherJournal() {
  const st = weatherState;
  if (!st.journal.length) { addLine("<journal> no readings logged yet. try check."); return; }
  addLine("<journal> weather history — last " + st.journal.length + " entries");
  addLine("────────────────────────────────────────");
  for (const e of st.journal) {
    const tag = e.rare ? " ⚠ rare" : "";
    addLine("  day " + e.day + "   " + e.place.padEnd(14) + e.condition.padEnd(16) + weatherFormatTemp(e.temp) + tag);
    if (e.note) addLine("       └─ " + e.note);
  }
  addLine("────────────────────────────────────────");
}

function weatherRadar() {
  weatherCatchUp();
  const st = weatherState;
  const art = WEATHER_RADAR[st.condition] || WEATHER_RADAR["overcast"];
  addLine("<radar> " + st.condition + " over " + st.place);
  for (const line of art) addLine(line);
  weatherWitness(st.condition);
  if (weatherIsRare(st.condition)) unlockAchievement("weather_odd");
}

/* entry point — called from shell / open */
function weatherInit() {
  loadWeatherState();
  weatherCatchUp();
  mode = "weather";
  addLine("<weather> opening regional monitor...");
  addLine("────────────────────────────────────────");
  weatherPrintCurrent();
  addLine("────────────────────────────────────────");
  addLine("commands: check, forecast, journal, radar, exit");
  weatherStartTimer();
}

/* input handler — called from handleApp when mode === "weather" */
function weatherHandle(input) {
  const cmd = input.trim().toLowerCase();
  switch (cmd) {
    case "":
      addLine("<weather> the sky does not take orders. try check, forecast, journal, radar, or exit.");
      return;
    case "check":    return weatherCheck();
    case "forecast": return weatherForecast();
    case "journal":
    case "log":      return weatherJournal();
    case "radar":    return weatherRadar();
    case "exit":
      weatherStopTimer();
      saveWeatherState();
      mode = "shell";
      addLine("<weather> monitor closed.");
      return;
    default:
      addLine("<weather> unknown command. try: check, forecast, journal, radar, exit");
  }
}

/* ================================================================
   CLICKER — glitch fragment incrementer
   Bare Enter increments fragments by (clickPower * multiplier), with
   a chance to crit. "buy {upgrade}" purchases power, multiplier, an
   auto-clicker, or crit chance; each purchase raises that upgrade's
   price for next time. "shop" lists everything available.
   ================================================================ */
const CLICKER_STATE_KEY = "terminal_clicker_state_v1";

const CLICKER_POWER_BASE_COST = 10;
const CLICKER_POWER_GROWTH    = 1.15;
const CLICKER_MULT_BASE_COST  = 50;
const CLICKER_MULT_GROWTH     = 1.25;
const CLICKER_AUTO_BASE_COST  = 100;
const CLICKER_AUTO_GROWTH     = 1.3;
const CLICKER_CRIT_BASE_COST  = 150;
const CLICKER_CRIT_GROWTH     = 1.35;
const CLICKER_CRIT_PCT_PER_LEVEL = 5;    /* +5% crit chance per level */
const CLICKER_CRIT_PCT_CAP       = 75;   /* crit chance never exceeds this */
const CLICKER_CRIT_MULTIPLIER    = 3;    /* crits deal 3x normal click value */
const CLICKER_AUTO_TICK_MS       = 3000; /* auto-clicker fires every 3s while app is open */
const CLICKER_CONVERT_RATE       = 1000; /* fragments per token — 10000 frags : 10 tokens */

let clickerState = null;
let clickerTickTimer = null;

function clickerFreshState() {
  return {
    fragments:   0,
    clickPower:  1,
    multiplier:  1,
    powerBought: 0,
    multBought:  0,
    autoLevel:   0,
    autoBought:  0,
    critLevel:   0,
    critBought:  0,
    milestoneIndex: -1,   /* highest fragment-count milestone already announced */
  };
}

function loadClickerState() {
  try {
    const s = localStorage.getItem(CLICKER_STATE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (p && typeof p.fragments === "number") {
        /* backfill: older saves may predate the auto/crit upgrades */
        if (typeof p.autoLevel  !== "number") { p.autoLevel  = 0; p.autoBought = 0; }
        if (typeof p.critLevel  !== "number") { p.critLevel  = 0; p.critBought = 0; }
        if (typeof p.milestoneIndex !== "number") { p.milestoneIndex = -1; }
        clickerState = p;
        return;
      }
    }
  } catch(e) {}
  clickerState = clickerFreshState();
}

function saveClickerState() {
  if (!clickerState) return;
  try { localStorage.setItem(CLICKER_STATE_KEY, JSON.stringify(clickerState)); } catch(e) {}
}

/* fragment-count milestones — every power of ten from 1 up to 100 trillion */
const CLICKER_MILESTONES = [
  { value: 1,               text: "the first fragment. every extractor starts somewhere." },
  { value: 10,               text: "double digits. the counter finally has something to say." },
  { value: 100,              text: "a hundred fragments. the extractor is warming up." },
  { value: 1000,             text: "one thousand fragments. this is no longer a curiosity." },
  { value: 10000,            text: "ten thousand. someone would have noticed this draw by now." },
  { value: 100000,           text: "one hundred thousand fragments. the counter needed a comma." },
  { value: 1000000,          text: "one million fragments. round numbers used to mean something." },
  { value: 10000000,         text: "ten million. this stopped being a hobby a while ago." },
  { value: 100000000,        text: "one hundred million fragments. the kind of number nobody signs off on." },
  { value: 1000000000,       text: "one billion fragments. the counter still reads clean. that's the unsettling part." },
  { value: 10000000000,      text: "ten billion. nothing this size should be this quiet." },
  { value: 100000000000,     text: "one hundred billion fragments. the terminal has stopped commenting on the number." },
  { value: 1000000000000,    text: "one trillion fragments. some numbers are only theoretical until they aren't." },
  { value: 10000000000000,   text: "ten trillion. whatever is generating these did not stop when asked." },
  { value: 100000000000000,  text: "one hundred trillion fragments. there is nothing left to compare this to." },
];

function clickerCheckMilestone() {
  if (!clickerState) return;
  let hit = -1;
  for (let i = 0; i < CLICKER_MILESTONES.length; i++) {
    if (clickerState.fragments >= CLICKER_MILESTONES[i].value && i > clickerState.milestoneIndex) {
      hit = i;
    }
  }
  if (hit === -1) return;
  clickerState.milestoneIndex = hit;
  saveClickerState();
  addLine("");
  addLine("<clicker> [milestone] " + CLICKER_MILESTONES[hit].text);
}

function clickerPowerCost() {
  return Math.floor(CLICKER_POWER_BASE_COST * Math.pow(CLICKER_POWER_GROWTH, clickerState.powerBought));
}

function clickerMultCost() {
  return Math.floor(CLICKER_MULT_BASE_COST * Math.pow(CLICKER_MULT_GROWTH, clickerState.multBought));
}

function clickerAutoCost() {
  return Math.floor(CLICKER_AUTO_BASE_COST * Math.pow(CLICKER_AUTO_GROWTH, clickerState.autoBought));
}

function clickerCritCost() {
  return Math.floor(CLICKER_CRIT_BASE_COST * Math.pow(CLICKER_CRIT_GROWTH, clickerState.critBought));
}

function clickerCritChance() {
  return Math.min(CLICKER_CRIT_PCT_CAP, clickerState.critLevel * CLICKER_CRIT_PCT_PER_LEVEL);
}

function clickerPrintStatus() {
  const st = clickerState;
  addLine("<clicker> glitch fragments: " + st.fragments);
  addLine("<clicker> click power: " + st.clickPower + "   multiplier: x" + st.multiplier +
          "   auto: " + st.autoLevel + "/tick   crit: " + clickerCritChance() + "%");
}

function clickerPrintShop() {
  const st = clickerState;
  addLine("<clicker> shop — buy {upgrade} to purchase:");
  addLine("  " + "─".repeat(56));
  addLine("  power       — " + clickerPowerCost() + " frags   (power " + st.clickPower + " → " + (st.clickPower+1) + ")");
  addLine("  multiplier  — " + clickerMultCost() + " frags   (mult x" + st.multiplier + " → x" + (st.multiplier+1) + ")");
  addLine("  auto        — " + clickerAutoCost() + " frags   (auto " + st.autoLevel + " → " + (st.autoLevel+1) + " frag/tick, every " + (CLICKER_AUTO_TICK_MS/1000) + "s)");
  const nextCrit = Math.min(CLICKER_CRIT_PCT_CAP, (st.critLevel+1) * CLICKER_CRIT_PCT_PER_LEVEL);
  if (clickerCritChance() >= CLICKER_CRIT_PCT_CAP) {
    addLine("  crit        — MAXED (" + CLICKER_CRIT_PCT_CAP + "% chance for a x" + CLICKER_CRIT_MULTIPLIER + " click)");
  } else {
    addLine("  crit        — " + clickerCritCost() + " frags   (crit " + clickerCritChance() + "% → " + nextCrit + "%, x" + CLICKER_CRIT_MULTIPLIER + " on hit)");
  }
  addLine("  " + "─".repeat(56));
  addLine("  convert {n} — turn n glitch fragments into job tokens (" + CLICKER_CONVERT_RATE + " frags = 1 token)");
  addLine("  " + "─".repeat(56));
}

function clickerTick() {
  if (!clickerState || mode !== "clicker") return;
  if (clickerState.autoLevel > 0) {
    const gained = clickerState.autoLevel * clickerState.multiplier;
    clickerState.fragments += gained;
    saveClickerState();
    if (clickerState.fragments >= 10000) unlockAchievement("clicker_10000");
    addLine("<clicker> [auto] +" + gained + " glitch fragments  (total: " + clickerState.fragments + ")");
    clickerCheckMilestone();
  }
}

function clickerStartTimer() {
  clickerStopTimer();
  clickerTickTimer = setInterval(clickerTick, CLICKER_AUTO_TICK_MS);
}

function clickerStopTimer() {
  if (clickerTickTimer) { clearInterval(clickerTickTimer); clickerTickTimer = null; }
}

function clickerInit() {
  loadClickerState();
  if (clickerState.fragments >= 10000) unlockAchievement("clicker_10000");
  mode = "clicker";
  addLine("<clicker> opening fragment extractor...");
  addLine("────────────────────────────────────────");
  clickerPrintStatus();
  addLine("────────────────────────────────────────");
  addLine("commands: press enter to click, shop, buy {power|multiplier|auto|crit}, convert {number}, status, exit");
  clickerStartTimer();
}

function clickerHandle(input) {
  const raw = input.trim();
  const cmd = raw.toLowerCase();

  /* bare enter — the click itself */
  if (cmd === "") {
    let gained = clickerState.clickPower * clickerState.multiplier;
    const isCrit = Math.random() * 100 < clickerCritChance();
    if (isCrit) gained *= CLICKER_CRIT_MULTIPLIER;
    clickerState.fragments += gained;
    saveClickerState();
    if (clickerState.fragments >= 10000) unlockAchievement("clicker_10000");
    if (isCrit) {
      addLine("<clicker> CRITICAL HIT! +" + gained + " glitch fragments  (total: " + clickerState.fragments + ")");
    } else {
      addLine("<clicker> +" + gained + " glitch fragments  (total: " + clickerState.fragments + ")");
    }
    clickerCheckMilestone();
    return;
  }

  if (cmd === "status" || cmd === "check") {
    clickerPrintStatus();
    return;
  }

  if (cmd === "shop") {
    clickerPrintShop();
    return;
  }

  if (cmd === "buy power" || cmd === "buy click power") {
    const cost = clickerPowerCost();
    if (clickerState.fragments < cost) {
      addLine("<clicker> not enough fragments — need " + cost + ", have " + clickerState.fragments);
      return;
    }
    clickerState.fragments -= cost;
    clickerState.clickPower += 1;
    clickerState.powerBought += 1;
    saveClickerState();
    addLine("<clicker> click power upgraded to " + clickerState.clickPower + " (-" + cost + " fragments)");
    return;
  }

  if (cmd === "buy multiplier" || cmd === "buy mult" || cmd === "buy click power multiplier") {
    const cost = clickerMultCost();
    if (clickerState.fragments < cost) {
      addLine("<clicker> not enough fragments — need " + cost + ", have " + clickerState.fragments);
      return;
    }
    clickerState.fragments -= cost;
    clickerState.multiplier += 1;
    clickerState.multBought += 1;
    saveClickerState();
    addLine("<clicker> multiplier upgraded to x" + clickerState.multiplier + " (-" + cost + " fragments)");
    return;
  }

  if (cmd === "buy auto" || cmd === "buy autoclicker" || cmd === "buy auto-clicker" || cmd === "buy auto clicker") {
    const cost = clickerAutoCost();
    if (clickerState.fragments < cost) {
      addLine("<clicker> not enough fragments — need " + cost + ", have " + clickerState.fragments);
      return;
    }
    clickerState.fragments -= cost;
    clickerState.autoLevel += 1;
    clickerState.autoBought += 1;
    saveClickerState();
    addLine("<clicker> auto-clicker upgraded to " + clickerState.autoLevel + " frag/tick (-" + cost + " fragments)");
    return;
  }

  if (cmd === "buy crit" || cmd === "buy critical" || cmd === "buy crit chance") {
    if (clickerCritChance() >= CLICKER_CRIT_PCT_CAP) {
      addLine("<clicker> crit chance is already maxed at " + CLICKER_CRIT_PCT_CAP + "%.");
      return;
    }
    const cost = clickerCritCost();
    if (clickerState.fragments < cost) {
      addLine("<clicker> not enough fragments — need " + cost + ", have " + clickerState.fragments);
      return;
    }
    clickerState.fragments -= cost;
    clickerState.critLevel += 1;
    clickerState.critBought += 1;
    saveClickerState();
    addLine("<clicker> crit chance upgraded to " + clickerCritChance() + "% (-" + cost + " fragments)");
    return;
  }

  if (cmd === "convert" || cmd.startsWith("convert ")) {
    const parts    = raw.split(/\s+/);
    const raw2     = (parts[1] || "").trim();
    const requested = parseInt(raw2, 10);
    if (!raw2 || isNaN(requested) || requested <= 0) {
      addLine("<clicker> usage: convert {number} — converts glitch fragments to job tokens (" +
              CLICKER_CONVERT_RATE + " fragments = 1 token)");
      return;
    }
    if (requested > clickerState.fragments) {
      addLine("<clicker> not enough fragments — you have " + clickerState.fragments + ", requested " + requested + ".");
      return;
    }
    const tokensEarned = Math.floor(requested / CLICKER_CONVERT_RATE);
    if (tokensEarned < 1) {
      addLine("<clicker> that's not enough to convert — " + CLICKER_CONVERT_RATE + " fragments are needed per token.");
      return;
    }
    const fragmentsUsed = tokensEarned * CLICKER_CONVERT_RATE;
    clickerState.fragments -= fragmentsUsed;
    saveClickerState();
    loadJobState();   /* pick up jobTokens even if the job app hasn't been opened this session */
    jobTokens += tokensEarned;
    saveJobTokens();
    addLine("<clicker> converted " + fragmentsUsed + " glitch fragments → " + tokensEarned +
            " token" + (tokensEarned !== 1 ? "s" : "") + ".");
    addLine("  fragments remaining: " + clickerState.fragments + "   job tokens: " + jobTokens);
    return;
  }

  if (cmd === "exit") {
    clickerStopTimer();
    saveClickerState();
    mode = "shell";
    addLine("<clicker> extractor closed.");
    return;
  }

  addLine("<clicker> unknown command. press enter to click, or try: shop, buy power, buy multiplier, buy auto, buy crit, convert {number}, status, exit");
}

/* ================================================================
   TUTORIAL — a short, guided walkthrough for new operators.
   Teaches: (1) running a bare command, (2) running a command with a
   value after it, (3) using a prefix (dry/whisper/please) before a
   command. Only a safe, non-mode-changing set of commands can be
   practiced with, so nothing destructive can be triggered by accident
   while learning — including under whisper/please, which really do
   execute for real.
   ================================================================ */
const SAFE_TUTORIAL_CMDS = [
  "date", "time", "roll", "flip", "echo", "mood", "ram", "cpu",
  "achievements", "help", "inventory", "cast", "wisdom", "vibe",
  "fortune", "mimic", "calc", "namegen", "joke", "list", "keys",
  "history", "uptime", "driftclock", "sessionstats",
];
let tutorialStep = 1;

function tutorialPrompt() {
  addLine("");
  if (tutorialStep === 1) {
    addLine("<tutorial> STEP 1/3 — running a command");
    addLine("  a command is just a word you type and press enter on.");
    addLine("  try one now, with nothing else after it — for example: date");
  } else if (tutorialStep === 2) {
    addLine("<tutorial> STEP 2/3 — running a command with a value");
    addLine("  some commands take a value after them, separated by a space.");
    addLine("  try one now — for example: roll 20");
  } else if (tutorialStep === 3) {
    addLine("<tutorial> STEP 3/3 — using a prefix");
    addLine("  a prefix goes BEFORE a command and changes how it runs.");
    addLine("    dry     — previews a command without changing anything");
    addLine("    whisper — runs a command with no glitch corruption");
    addLine("    please  — softens rude mode for one command");
    addLine("  try one now — for example: dry roll 20");
  }
}

function tutorialInit() {
  mode = "tutorial";
  tutorialStep = 1;
  addLine("<tutorial> welcome — this takes about a minute.");
  addLine("  type exit to leave anytime, or skip to jump to the end.");
  tutorialPrompt();
}

function tutorialComplete() {
  mode = "shell";
  unlockAchievement("tutorial_complete");
  addLine("");
  addLine("<tutorial> that's the whole thing:");
  addLine("  1. commands  — type a word, press enter");
  addLine("  2. values    — add extra words after a command, separated by spaces");
  addLine("  3. prefixes  — dry / whisper / please go BEFORE a command");
  addLine("<tutorial> type help anytime to see the full command list.");
}

function tutorialHandle(input) {
  const raw   = input.trim();
  const lower = raw.toLowerCase();

  if (lower === "exit") {
    mode = "shell";
    addLine("<tutorial> leaving early. type tutorial anytime to pick it back up.");
    return;
  }
  if (lower === "skip") { return tutorialComplete(); }
  if (!raw) {
    addLine("<tutorial> type a command to try it, or skip to jump ahead.");
    return;
  }

  /* step 3 — prefix + command */
  if (tutorialStep === 3) {
    const m = raw.match(/^(dry|whisper|please)\s+(.+)/i);
    if (!m) {
      addLine("<tutorial> that's missing a prefix — start with dry, whisper, or");
      addLine("  please, e.g. \"dry roll 20\".");
      return;
    }
    const restCmd = (tokenize(m[2])[0] || "").toLowerCase();
    if (!SAFE_TUTORIAL_CMDS.includes(restCmd)) {
      addLine("<tutorial> let's keep it to a command from this list for now: " +
              SAFE_TUTORIAL_CMDS.slice(0, 6).join(", ") + " — e.g. \"whisper date\".");
      return;
    }
    addLine("<tutorial> good — running it for real:");
    mode = "shell";
    processInput(raw);
    mode = "tutorial";
    return tutorialComplete();
  }

  /* steps 1 and 2 — bare command, or command + value */
  const parts = tokenize(raw);
  const cmd   = (parts[0] || "").toLowerCase();
  const args  = parts.slice(1);

  if (!SAFE_TUTORIAL_CMDS.includes(cmd)) {
    addLine("<tutorial> try one of these instead: " + SAFE_TUTORIAL_CMDS.slice(0, 8).join(", ") + " ...");
    return;
  }
  if (tutorialStep === 1 && args.length > 0) {
    addLine("<tutorial> that's actually step 2 material — nice, but try one");
    addLine("  with nothing after it first.");
    return;
  }
  if (tutorialStep === 2 && args.length === 0) {
    addLine("<tutorial> that ran, but without a value after it. add something —");
    addLine("  e.g. \"roll 20\" instead of just \"roll\".");
    return;
  }

  addLine("<tutorial> running it for real:");
  mode = "shell";
  processInput(raw);
  mode = "tutorial";

  if (tutorialStep === 1) {
    addLine("");
    addLine("<tutorial> step 1 done — you ran a command.");
    tutorialStep = 2;
    tutorialPrompt();
  } else if (tutorialStep === 2) {
    addLine("");
    addLine("<tutorial> step 2 done — you ran a command with a value after it.");
    tutorialStep = 3;
    tutorialPrompt();
  }
}

/* ================================================================
   CALC — safe evaluator, no Function() / eval
   Supports: + - * / ( ) ^ ! and named variables
   ================================================================ */
const calcVars = {};

function cmd_calc(args) {
  achievements.calcCount = (achievements.calcCount||0)+1;
  if (achievements.calcCount>=10) unlockAchievement("calc_10");
  saveAchievements();
  if (!args.length) return addLine(r("<calc> missing expression"));
  try {
    const result = calcParse(args.join(" ").trim());
    addLine(r("<calc> "+result));
  } catch(e) {
    addLine(r("<calc> error: "+e));
  }
}

/* ---------- tokenizer ---------- */
function calcTokenize(expr) {
  /* replace variables first */
  expr = expr.replace(/[a-zA-Z_][a-zA-Z0-9_]*/g, name => {
    if (calcVars[name]!==undefined) return calcVars[name];
    throw "unknown variable: "+name;
  });
  const tokens=[];
  let i=0;
  while(i<expr.length){
    if(/\s/.test(expr[i])){ i++; continue; }
    if(/[0-9.]/.test(expr[i])){
      let n="";
      while(i<expr.length&&/[0-9.]/.test(expr[i])) n+=expr[i++];
      const val = parseFloat(n);
      if (isNaN(val)) throw "invalid number: " + n;
      tokens.push({t:"num",v:val});
      continue;
    }
    if("+-*/^()!".includes(expr[i])){
      tokens.push({t:"op",v:expr[i++]});
      continue;
    }
    throw "unexpected character: "+expr[i];
  }
  return tokens;
}

/* ---------- recursive descent parser ---------- */
function calcParse(exprStr) {
  const assignMatch = exprStr.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.*)$/);
  if (assignMatch) {
    const varName = assignMatch[1];
    const subExpr = assignMatch[2];
    const val = calcParse(subExpr);
    calcVars[varName] = val;
    return val;
  }

  const tokens = calcTokenize(exprStr);
  let pos=0;

  function peek()  { return tokens[pos]; }
  function eat(v)  { if(peek()&&peek().v===v){ pos++; return true; } return false; }
  function next()  { return tokens[pos++]; }
  function done()  { return pos>=tokens.length; }

  function parseExpr()   { return parseAddSub(); }

  function parseAddSub() {
    let left=parseMulDiv();
    while(!done()&&(peek().v==="+"||peek().v==="-")){
      const op=next().v;
      const right=parseMulDiv();
      left = op==="+" ? left+right : left-right;
    }
    return left;
  }

  function parseMulDiv() {
    let left=parseUnary();
    while(!done()&&(peek().v==="*"||peek().v==="/")){
      const op=next().v;
      const right=parseUnary();
      if(op==="/"&&right===0) throw "division by zero";
      left = op==="*" ? left*right : left/right;
    }
    return left;
  }

  function parseUnary() {
    if(peek()&&peek().v==="-"){ next(); return -parseUnary(); }
    return parsePower();
  }

  function parsePower() {
    let base=parsePostfix();
    if(peek()&&peek().v==="^"){
      next();
      const exp=parseUnary();
      if(Math.abs(exp)>1000) throw "exponent too large";
      base=Math.pow(base,exp);
    }
    return base;
  }

  function parsePostfix() {
    let val=parsePrimary();
    while(peek()&&peek().v==="!"){
      next();
      if(!Number.isInteger(val)||val<0||val>20) throw "factorial out of range (0-20)";
      val=factorial(val);
    }
    return val;
  }

  function parsePrimary() {
    if(done()) throw "unexpected end";
    const tok=peek();
    if(tok.t==="num"){ next(); return tok.v; }
    if(tok.v==="("){
      next();
      const val=parseExpr();
      if(!eat(")")) throw "missing closing )";
      return val;
    }
    throw "unexpected token: "+tok.v;
  }

  const result=parseExpr();
  if(!done()) throw "unexpected token after expression: "+peek().v;
  /* guard against Infinity / NaN leaking out */
  if(!isFinite(result)) throw "result is not finite";
  /* round tiny float noise */
  return Math.round(result*1e10)/1e10;
}

function factorial(n){
  let r=1; for(let i=2;i<=n;i++) r*=i; return r;
}

/* ================================================================
   SESSION STATS
   ================================================================ */
function cmd_sessionstats() {
  const elapsed = Date.now() - sessionStart;
  const totalSec = Math.floor(elapsed / 1000);
  const mins = Math.floor(totalSec / 60);
  const secs = totalSec % 60;
  const elapsedMins = Math.max(elapsed / 60000, 0.01);
  addLine(r("<sessionstats>"));
  addLine(r("  commands entered   : " + sessionCmds));
  addLine(r("  session time       : " + mins + "m " + secs + "s"));
  addLine(r("  cmds per minute    : " + (sessionCmds / elapsedMins).toFixed(1)));
  addLine(r("  apps opened        : " + sessionApps));
  addLine(r("  simulations run    : " + sessionSims));
  addLine(r("  dream logs seen    : " + sessionDreams));
  addLine(r("  recursive sessions : " + sessionRecursive));

  /* command scoring table */
  const entries = Object.entries(cmdUsage).filter(([,v]) => v > 0);
  if (entries.length) {
    entries.sort((a, b) => b[1] - a[1]);
    const most   = entries[0];
    const least  = entries[entries.length - 1];
    const total  = entries.reduce((s, [,v]) => s + v, 0);
    addLine(r(""));
    addLine(r("  command usage (all-time):"));
    addLine(r("  ────────────────────────────────────"));
    addLine(r("  " + "command".padEnd(20) + "uses"));
    addLine(r("  " + "─".repeat(28)));
    /* show top 10 */
    for (const [cmd, count] of entries.slice(0, 10)) {
      addLine(r("  " + cmd.padEnd(20) + count));
    }
    if (entries.length > 10) addLine(r("  ... and " + (entries.length - 10) + " more"));
    addLine(r("  " + "─".repeat(28)));
    addLine(r("  total tracked      : " + total));
    addLine(r("  most used          : " + most[0]   + " (" + most[1]   + "x)"));
    addLine(r("  least used         : " + least[0]  + " (" + least[1]  + "x)"));
  }
  if (Math.random() < 0.1) {
    addLine("");
    addLine("  note: usage patterns for this session partially match a");
    addLine("  three-day-old meeting log on file. cross-reference: debrief_0917.mp3");
  }
}

/* ================================================================
   RECURSIVE TERMINAL
   ================================================================ */
function recursiveInit() {
  sessionRecursive++;
  recursiveEventsTotal++;
  saveRecursiveEvents();
  mode = "recursive";
  addLine(r("<recursive> entering nested terminal. type help for commands."));
}

function recursiveHandle(input) {
  const raw = input.trim();
  if (!raw) { addLine(r(randomItem(NO_COMMAND_MESSAGES))); return; }
  const parts = tokenize(raw);
  const cmd = (parts[0]||"").toLowerCase();
  const args = parts.slice(1);

  switch(cmd) {
    case "help":
      addLine(r("<rec:help> commands: help, echo, theme, textsize, calc, recursive, exit"));
      return;
    case "echo":
      addLine(r("<rec:echo> " + args.join(" ")));
      return;
    case "theme":
      cmd_theme(args);
      return;
    case "textsize":
      cmd_textsize(args);
      return;
    case "calc":
      cmd_calc(args);
      return;
    case "recursive":
      recursionDepth++;
      sessionRecursive++;
      recursiveEventsTotal++;
      saveRecursiveEvents();
      const corruptionPct = Math.round(recursionDepth * 15);
      addLine(r("<recursive> entering nested terminal (level " + recursionDepth + ", " + corruptionPct + "% corruption). type help for commands."));
      return;
    case "exit":
      if (recursionDepth > 0) {
        recursionDepth--;
        const remainingCorruption = Math.round(recursionDepth * 15);
        addLine(r("<recursive> exiting to level " + recursionDepth + " (" + (remainingCorruption > 0 ? remainingCorruption : "0") + "% corruption)"));
      } else {
        mode = "shell";
        recursionDepth = 0;
        addLine(r("<recursive> closed"));
      }
      return;
    default:
      addLine(r("<rec:error> unknown command. type help for available commands."));
      return;
  }
}

const RAINBOW_COLORS = ["#ff0000","#ff7f00","#ffff00","#00ff00","#0000ff","#4b0082","#8b00ff"];
function rainbowify(text) {
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let out = "";
  let idx = 0;
  for (const ch of text) {
    if (ch === " ") { out += " "; continue; }
    out += '<span style="color:' + RAINBOW_COLORS[idx % RAINBOW_COLORS.length] + '">' + esc(ch) + '</span>';
    idx++;
  }
  return out;
}
