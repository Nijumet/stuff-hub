function cmd_encrypt(args) {
  const text=args.join(" ");
  if(!text) return addLine(r("<encrypt> missing"));
  let b64=btoa(encodeURIComponent(text).replace(/%([0-9A-F]{2})/g,(_,p)=>String.fromCharCode(parseInt(p,16))));
  let rot=b64.replace(/[A-Za-z]/g,c=>"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz".charAt("NOPQRSTUVWXYZABCDEFGHIJKLMnopqrstuvwxyzabcdefghijklm".indexOf(c)));
  let xor=""; for(let i=0;i<rot.length;i++) xor+=String.fromCharCode(rot.charCodeAt(i)^42);
  const out=btoa(xor);
  lastCryptoOp="encrypt";
  addLine(r("<encrypt> "+out));
}

function cmd_decrypt(args) {
  const text=args.join(" ");
  if(!text) return addLine(r("<decrypt> missing"));
  try {
    let xor=atob(text);
    let rot=""; for(let i=0;i<xor.length;i++) rot+=String.fromCharCode(xor.charCodeAt(i)^42);
    let b64=rot.replace(/[A-Za-z]/g,c=>"NOPQRSTUVWXYZABCDEFGHIJKLMnopqrstuvwxyzabcdefghijklm".charAt("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz".indexOf(c)));
    let out=decodeURIComponent(Array.from(atob(b64)).map(c=>"%"+c.charCodeAt(0).toString(16).padStart(2,"0")).join(""));
    /* award achievement if previous op was encrypt (2-step chain complete) */
    if(lastCryptoOp==="encrypt"){
      unlockAchievement("encrypt_loop");
    }
    lastCryptoOp="decrypt";
    addLine(r("<decrypt> "+out));
  } catch {
    addLine(r("<decrypt> error — invalid ciphertext"));
  }
}

function cmd_ascii(args = []) {
  const name = (args[0] || "").toLowerCase();

  if (!name) {
    addLine(r("<ascii> usage: ascii {image}"));
    addLine(r("  displays an ascii image."));
    addLine(r("  available images:"));
    const names = Object.keys(ASCII_IMAGES);
    const mid = Math.ceil(names.length / 2);
    const col1 = names.slice(0, mid), col2 = names.slice(mid);
    for (let i = 0; i < col1.length; i++) {
      const left = "    " + col1[i].padEnd(14);
      const right = col2[i] ? col2[i] : "";
      addLine(left + right);
    }
    return;
  }

  const art = ASCII_IMAGES[name];
  if (!art) {
    addLine(r("<ascii> unknown image: " + name));
    addLine(r("  type 'ascii' with no arguments to see available images."));
    return;
  }

  addLine(r("<ascii> " + name));
  for (const line of art) addLine(line);
}

function cmd_lock(args) {
  const pass = args.join(" ").trim();
  if (!pass) { addLine(r("<lock> usage: lock {password}")); return; }
  termLocked   = true;
  termLockPass = pass;

  /* stop dream timer while locked */
  if (dreamIdleTimer)  clearTimeout(dreamIdleTimer);
  if (dreamIntervalId) clearInterval(dreamIntervalId);
  dreamIdleTimer   = null;
  dreamIntervalId  = null;
  dreamActive      = false;

  /* wrap ALL existing screen children (including the frozen lock line) in a hidden veil */
  const veil = document.createElement("div");
  veil.id = "lock-veil";
  veil.style.display = "none";
  while (screen.firstChild) veil.appendChild(screen.firstChild);
  screen.appendChild(veil);

  addLine(r("<lock> terminal locked. type: unlock {password}"));
}

function cmd_unlock(args) {
  const pass = args.join(" ").trim();
  if (pass === termLockPass) {
    termLocked   = false;
    termLockPass = "";

    /* restore hidden history */
    const veil = document.getElementById("lock-veil");
    if (veil) {
      while (veil.firstChild) screen.insertBefore(veil.firstChild, veil);
      veil.remove();
    }

    addLine(r("<unlock> terminal unlocked."));
    resetIdleTimer();
  } else {
    addLine(r("<unlock> incorrect password."));
  }
}

      ["settings",       "view all current settings and how to change each one"],
      ["dreams",         "list every idle dream you've witnessed, by rarity"],
      ["inventory",      "show fake inventory"],
    ],
  };

  for (const [categoryName, commands] of Object.entries(categories)) {
    addLine(r("  ─ " + categoryName));
    const mid = Math.ceil(commands.length / 2);
    const col1 = commands.slice(0, mid);
    const col2 = commands.slice(mid);
    let maxLeft = 0;
    for (const [c, d] of col1) {
      const t = c + " - " + d;
      if (t.length > maxLeft) maxLeft = t.length;
    }
    for (let i = 0; i < col1.length; i++) {
      const left = (col1[i][0] + " - " + col1[i][1]).padEnd(maxLeft + 4);
      const right = col2[i] ? (col2[i][0] + " - " + col2[i][1]) : "";
      addLine("    " + left + right);
    }
    addLine("");
  }
}

function cmd_theme(args) {
  const t=(args[0]||"").toLowerCase();
  const builtins={green:"#00ff00",amber:"#ffbf00",cyan:"#00ffff",magenta:"#ff00ff",white:"#ffffff"};
  const currentBg = getCurrentBgColor();

  /* rainbow — a hidden text-only theme, unlocked once every achievement is unlocked.
     it colors output the same way "colorize" does, per character, rather than
     setting a single --fg color. it has no background-theme equivalent. */
  if (t === "rainbow") {
    const allUnlocked = ACH_LIST.every(a => achievements[a[0]]);
    if (!allUnlocked) {
      addLine(r("<theme> rainbow is locked — unlock every achievement first"));
      return;
    }
    rainbowThemeActive = true;
    jobActiveTheme = null;
    try { localStorage.setItem("terminal_theme", "rainbow"); } catch(e) {}
    try { localStorage.setItem(RAINBOW_THEME_KEY, "1"); } catch(e) {}
    try { localStorage.setItem(JOB_ACTIVE_KEY, ""); } catch(e) {}
    addLine(r("<theme> rainbow"));
    return;
  }
  /* any other theme selection exits rainbow mode */
  if (rainbowThemeActive) {
    rainbowThemeActive = false;
    try { localStorage.removeItem(RAINBOW_THEME_KEY); } catch(e) {}
  }

  /* check built-ins first */
  if(builtins[t]){
    const fgColor = builtins[t];
    if (fgColor === currentBg) {
      addLine(r("<theme> cannot set foreground to match background color (would be invisible)"));
      return;
    }
    document.documentElement.style.setProperty("--fg",fgColor);
    /* built-in selected — clear any job active theme so job app won't override */
    jobActiveTheme = null;
    try { localStorage.setItem("terminal_theme", t); } catch(e) {}
    try { localStorage.setItem("terminal_active_color", fgColor); } catch(e) {}
    try { localStorage.setItem(JOB_ACTIVE_KEY, ""); } catch(e) {}
    addLine(r("<theme> "+t));
    return;
  }
  /* check purchased job themes */
  const jt = (typeof JOB_THEMES !== "undefined") && JOB_THEMES.find(x => x.id === t && x.color);
  if(jt){
    if(!(jobUnlocked && jobUnlocked.includes(t))){
      addLine(r("<theme> " + t + " not unlocked — purchase it in the job shop first"));
      return;
    }
    if (jt.color === currentBg) {
      addLine(r("<theme> cannot set foreground to match background color (would be invisible)"));
      return;
    }
    document.documentElement.style.setProperty("--fg", jt.color);
    jobActiveTheme = t;
    try { localStorage.setItem(JOB_ACTIVE_KEY, t); } catch(e) {}
    try { localStorage.setItem("terminal_active_color", jt.color); } catch(e) {}
    try { localStorage.removeItem("terminal_theme"); } catch(e) {}
    addLine(r("<theme> "+t));
    return;
  }
  addLine(r("<theme> unknown — try: green amber cyan magenta white  (or a purchased job theme, or rainbow once every achievement is unlocked)"));
}

/* ── Question generation ────────────────────────────────────────── */
function jobHash(str) {
  /* simple djb2 */
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
  return (h >>> 0).toString(16);
}

function jobMakeQuestion() {
  /* try up to 30 times to get a fresh question */
  for (let attempt = 0; attempt < 30; attempt++) {
    const q = jobGenQuestion();
    const h = jobHash(q.question);
    if (!jobAskedHashes.includes(h)) {
      jobAskedHashes.push(h);
      saveJobHashes();
      return q;
    }
  }
  /* fallback: just return a fresh one and accept the repeat */
  return jobGenQuestion();
}

function jobGenQuestion() {
  const type = Math.floor(Math.random() * 4);
  if (type === 0) return jobMathQ();
  if (type === 1) return jobLogicQ();
  if (type === 2) return jobTriviaQ();
  return jobMultipleChoiceQ();
}

function jobMathQ() {
  const ops = ["+", "-", "*"];
  const op  = randomItem(ops);
  let a, b, answer;
  if (op === "+") { a = Math.floor(Math.random()*50)+1; b = Math.floor(Math.random()*50)+1; answer = a + b; }
  if (op === "-") { a = Math.floor(Math.random()*50)+20; b = Math.floor(Math.random()*a)+1; answer = a - b; }
  if (op === "*") { a = Math.floor(Math.random()*12)+1;  b = Math.floor(Math.random()*12)+1; answer = a * b; }
  return { question: "math: " + a + " " + op + " " + b + " = ?", answer: String(answer), category: "math" };
}

  /* shuffle so the correct answer isn't predictably in the same slot */
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

  opts.forEach((opt, idx) => {

    if (opt === item.correct) answerLetter = letters[idx];
  });

  return { question: item.q, options, answer: answerLetter, category: "trivia" };

/* ── Streak reward (tiered system) ──────────────────────────────── */
function jobStreakReward(streak) {
  if (streak >= 15) return 25;
  if (streak >= 5)  return 10;
  if (streak >= 2)  return 5;
  return 1;         /* 1+ streak */
}

function jobStreakDisplay() {
  return jobStreak > 9999 ? "9999+" : String(jobStreak);
}

let jobSubmode = "idle";

function jobInit() {
  loadJobState();

  addLine("<job> welcome to the job terminal, operator.");

/* ── Subcommand handlers ─────────────────────────────────────────── */
function jobWork() {
  const q = jobMakeQuestion();
  jobPendingQ = q;
  jobSubmode  = "question";
  addLine("<job:work> [" + q.category + "] " + q.question);
  if (q.options) {

const JOB_STREAK_MILESTONES = {
  5:    "five in a row. a pattern, not a fluke.",
  10:   "ten correct answers straight. the questions are not getting easier.",
  25:   "twenty-five. whoever wrote these is starting to run out of new ones.",
  50:   "fifty in a row. that is not luck anymore.",
  75:   "seventy-five straight. the streak has its own gravity now.",
  100:  "one hundred correct answers in a row. round numbers like this do not happen by accident.",
  1000: "one thousand correct answers in a row. something about that number should concern you more than it does.",
};

function jobCheckAnswer(input) {
  const given    = input.trim().toLowerCase();
  const expected = jobPendingQ.answer.toLowerCase();
  const options  = jobPendingQ.options;
  const category = jobPendingQ.category;
  jobPendingQ  = null;
  jobSubmode   = "idle";

  if (given === expected) {
    jobStreak++;
    const reward = jobStreakReward(jobStreak);
    jobTokens += reward;
    saveJobTokens();
    addLine("<job:work> correct!  +" + reward + " token" + (reward !== 1 ? "s" : "") + "  (streak: " + jobStreakDisplay() + ")");
    addLine("  balance: " + jobTokens + " tokens");
    const streakLine = JOB_STREAK_MILESTONES[jobStreak];
    if (streakLine) {
      addLine("");
      addLine("<job:work> [streak] " + streakLine);
    }
  } else {
    jobStreak = 0;
    if (options) {
      addLine("<job:work> incorrect. expected: " + expected + ") " + options[expected]);
    } else {
      addLine("<job:work> incorrect. expected: " + expected);
      if (category === "math") {
        const givenNum    = parseFloat(given);
        const expectedNum = parseFloat(expected);
        if (!isNaN(givenNum) && !isNaN(expectedNum) && Math.abs(givenNum - expectedNum) >= 100) {
          addLine("<job:work> that wasn't close. that wasn't in the neighborhood. impressive, somehow.");
        }
      }
    }
    addLine("  streak reset. balance: " + jobTokens + " tokens");
  }
}

function jobLottery() {
  if (jobTokens < 2) {
    addLine("<job:lottery> insufficient tokens. costs 2 tokens to play.");
    return;
  }
  jobTokens -= 2;
  saveJobTokens();
  addLine("<job:lottery> ticket purchased. drawing...");

  const frames = ["[ ? ]", "[ * ]", "[ @ ]", "[ # ]", "[ ! ]", "[ ? ]", "[ * ]"];
  let i = 0;
  function spin() {
    addLine("  " + frames[i % frames.length]);
    i++;
    if (i < 8) { setTimeout(spin, 120); return; }
    /* result — tiered prizes, checked rarest-first so ranges don't overlap:
       0.1% jackpot (1000), 2% major (100), 25% small (5), else nothing */
    const roll = Math.random();
    if (roll < 0.001) {
      jobTokens += 1000;
      saveJobTokens();
      addLine("<job:lottery> *** JACKPOT ***  +1000 tokens!");
      addLine("  balance: " + jobTokens + " tokens");
    } else if (roll < 0.021) {
      jobTokens += 100;
      saveJobTokens();
      addLine("<job:lottery> *** MAJOR PRIZE ***  +100 tokens!");
      addLine("  balance: " + jobTokens + " tokens");
    } else if (roll < 0.271) {
      jobTokens += 5;
      saveJobTokens();
      addLine("<job:lottery> small win.  +5 tokens.");
      addLine("  balance: " + jobTokens + " tokens");
    } else {
      addLine("<job:lottery> no match. better luck next time.");
      addLine("  balance: " + jobTokens + " tokens");
    }
  }
  spin();
}

function jobShop() {
  addLine("<job:shop> available themes");
  addLine("────────────────────────────────────────");
  for (const t of JOB_THEMES) {
    const owned   = jobUnlocked.includes(t.id) ? " [owned]" : "";
    const active  = jobActiveTheme === t.id    ? " [active]" : "";
    addLine("  " + t.id.padEnd(10) + t.cost.toString().padStart(4) + " tokens   " + t.desc + owned + active);
  }
  addLine("────────────────────────────────────────");
  addLine("  your balance: " + jobTokens + " tokens");
  addLine("  to buy: buy {themeName}");
}

function jobBuy(themeName) {
  const id = (themeName || "").toLowerCase().trim();
  const t  = JOB_THEMES.find(x => x.id === id);
  if (!t) {
    addLine("<job:buy> unknown theme. type shop to see the list.");
    return;
  }
  if (jobUnlocked.includes(id)) {
    addLine("<job:buy> you already own " + id + ".");
    return;
  }
  if (jobTokens < t.cost) {
    addLine("<job:buy> insufficient tokens. need " + t.cost + ", have " + jobTokens + ".");
    return;
  }
  jobTokens -= t.cost;
  jobUnlocked.push(id);
  saveJobTokens();
  saveJobUnlocked();
  /* check theme collector achievement */
  if (JOB_THEMES.every(x => jobUnlocked.includes(x.id))) {
    unlockAchievement("theme_collector");
  }
  /* apply immediately (color themes only) */
  if (t.color) {
    jobActiveTheme = id;
    saveJobActive();
    jobApplyTheme(id);
    addLine("<job:buy> purchased: " + id + "  (cost: " + t.cost + " tokens)");
    addLine("  theme applied. balance: " + jobTokens + " tokens");
  } else {
    /* cursor skin — just confirm purchase */
    addLine("<job:buy> purchased: " + id + "  (cost: " + t.cost + " tokens)");
    const skinName = id.replace("cursor_", "");
    addLine("  equip with: cursorequip " + skinName);
    addLine("  balance: " + jobTokens + " tokens");
  }
}

function jobTheme(themeName) {
  const id = (themeName || "").toLowerCase().trim();
  if (!id) {
    addLine("<job:theme> specify a theme name. type shop to see owned themes.");
    return;
  }
  if (!jobUnlocked.includes(id)) {
    addLine("<job:theme> " + id + " is not unlocked. buy it first.");
    return;
  }
  if (jobActiveTheme === id) {
    /* toggle off — revert to last built-in or default green */
    jobActiveTheme = null;
    saveJobActive();
    try { localStorage.removeItem("terminal_active_color"); } catch(e) {}
    const savedBuiltin = localStorage.getItem("terminal_theme");
    const builtinColor = savedBuiltin && BUILTIN_THEMES[savedBuiltin] ? BUILTIN_THEMES[savedBuiltin] : "#00ff00";
    document.documentElement.style.setProperty("--fg", builtinColor);
    addLine("<job:theme> " + id + " deactivated. reverted to default.");
    return;
  }
  jobActiveTheme = id;
  saveJobActive();
  jobApplyTheme(id);
  addLine("<job:theme> " + id + " activated.");
}

/* ── Main input handler ─────────────────────────────────────────── */
function jobHandle(input) {
  const raw  = input.trim();
  const parts = raw.split(/\s+/);
  const cmd  = parts[0].toLowerCase();

  /* while waiting for a question answer */
  if (jobSubmode === "question") {
    jobCheckAnswer(raw);
    return;
  }

  if (!raw) { addLine(r(randomItem(NO_COMMAND_MESSAGES))); return; }

  switch (cmd) {
    case "work":    return jobWork();
    case "lottery": return jobLottery();
    case "shop":    return jobShop();
    case "balance":
      addLine("<job> balance: " + jobTokens + " tokens");
      return;
    case "streak":
      addLine("<job> current streak: " + jobStreakDisplay());
      return;
    case "buy":
      return jobBuy(parts.slice(1).join(" "));
    case "theme":
      return jobTheme(parts.slice(1).join(" "));
    case "cursorequip":
      return cmd_cursor(["equip", parts[1] || ""]);
    case "cursorunequip":
      return cmd_cursor(["unequip"]);
    case "exit":
      mode = "shell";
      addLine("<job> session closed. tokens saved.");
      return;
    default:
      addLine("<job> unknown command. try: work  lottery  shop  buy {theme}  theme {theme}");
      addLine("  balance  streak  cursorequip {skin}  cursorunequip  exit");
  }
}

/* The chain steps in order. Each must be invoked before the next unlocks. */
const THAUMA_CHAIN = [
  "thauma-scan",
  "thauma-echo",
  "thauma-null",
  "thauma-seal",
  "thauma-reflect",
  "thauma-awaken",
];

/* session-only; persists across page reloads via localStorage */
const CHAIN_KEY = "terminal_thauma_chain_v1";
let chainState = {
  reached: 0,   /* index of the last successfully invoked command (1-based; 0 = none) */
};

function loadChainState() {
  try {
    const s = localStorage.getItem(CHAIN_KEY);
    if (s) { const p = JSON.parse(s); if (p && typeof p.reached === "number") chainState = p; }
  } catch(e) {}
}

function saveChainState() {
  try { localStorage.setItem(CHAIN_KEY, JSON.stringify(chainState)); } catch(e) {}
}

/* guard: returns true and prints denial if the precursor hasn't been run */
function chainGuard(requiredIndex) {
  /* requiredIndex is the 1-based index of the command that must have been run */
  if (chainState.reached < requiredIndex) {
    addLine("<thauma> sequence incomplete. required precursor command not yet invoked.");
    return false;
  }
  return true;
}

/* advance the chain counter after a command successfully runs */
function chainAdvance(index) {
  if (chainState.reached < index) {
    chainState.reached = index;
    saveChainState();
  }
}

/* glitch fragment helpers */
const G_CHARS = "▓▒░█▄▀■□▪▫◆◇●○";
function gFrag(len) {
  let s = "";
  for (let i = 0; i < len; i++) s += G_CHARS[Math.floor(Math.random() * G_CHARS.length)];
  return s;
}
function corrupt(str, corruptionLevel = 0.18) {
  /* whisper prefix suppresses all corruption/glitch effects */
  if (whisperMode) return str;
  /* clamp corruption level to 0-1 range */
  const level = Math.max(0, Math.min(1, corruptionLevel));
  return str.split("").map(c => Math.random() < level ? G_CHARS[Math.floor(Math.random()*G_CHARS.length)] : c).join("");
}

/* ================================================================
   DRIFT CLOCK
   ================================================================ */
let driftValue   = 0;       /* accumulated drift */
let driftLastCmd = "";      /* for repeat detection */
let driftBurst   = 0;       /* rapid-fire counter */
let driftLastTime = Date.now();

function driftAccumulate(cmd) {
  const now = Date.now();
  const gap = now - driftLastTime;
  driftLastTime = now;

  /* idle drift: long pause = more drift */
  if (gap > 8000)  driftValue += Math.floor(gap / 2000);

  /* repeat command */
  if (cmd && cmd === driftLastCmd) driftValue += 4;
  driftLastCmd = cmd || driftLastCmd;

  /* rapid burst: < 600ms between commands */
  if (gap < 600) {
    driftBurst++;
    driftValue += driftBurst;
  } else {
    driftBurst = Math.max(0, driftBurst - 1);
  }

  /* random noise */
  driftValue += Math.random() < 0.15 ? Math.floor(Math.random() * 3) : 0;

  driftValue = Math.max(0, driftValue);
}

function driftReset() {
  driftValue   = 0;
  driftBurst   = 0;
  driftLastCmd = "";
  driftLastTime = Date.now();
}

function driftWaveform(v) {
  /* 20-char ASCII waveform based on drift magnitude */
  const intensity = Math.min(v / 100, 1);
  const chars = ["_", ".", "~", "-", "^", "/", "\\", "|", "M", "W"];
  let wave = "";
  for (let i = 0; i < 20; i++) {
    const threshold = Math.random() * (1 + intensity);
    wave += chars[Math.min(Math.floor(threshold * chars.length * intensity + 1), chars.length - 1)];
  }
  return wave;
}

function driftLabel(v) {
  if (v < 5)   return "stable";
  if (v < 15)  return "wavering";
  if (v < 30)  return "turbulent";
  if (v < 55)  return "fragmented";
  if (v < 90)  return "dissociating";
  return "critical drift";
}

function cmd_driftclock() {
  addLine("<driftclock> measuring session drift...");
  addLine("────────────────────────────────────────");
  addLine("  drift value : " + driftValue.toFixed(1));
  addLine("  waveform    : " + driftWaveform(driftValue));
  addLine("  reading     : " + driftLabel(driftValue));
  addLine("  burst index : " + driftBurst);
  addLine("  last cmd gap: " + ((Date.now() - driftLastTime)/1000).toFixed(1) + "s");
  addLine("────────────────────────────────────────");
  addLine("  drift resets on clear or refresh.");
  if (Math.random() < 0.1) {
    addLine("");
    addLine("  anomaly: a discontinuity in this reading matches a burst");
    addLine("  signature on file. cross-reference: alarm_capture_09.mp3");
  }
  addLine("<driftclock> done.");

  if (longSessionTracked && !longSessionClaimed) {
    longSessionClaimed = true;
    try { localStorage.setItem(LONG_SESSION_CLAIMED_KEY, "1"); } catch(e) {}
    loadClickerState();
    clickerState.fragments += LONG_SESSION_REWARD;

    addLine("  was held. it releases it now: +" + LONG_SESSION_REWARD.toLocaleString() + " glitch fragments.");
    addLine("  (check the clicker.)");
    clickerCheckMilestone();
  } else if (!longSessionTracked && !longSessionClaimed && Math.random() < 0.08) {
    addLine("");
    addLine("  this clock only measures what's already happened. uptime is");
    addLine("  the one that would tell you if this session has run long");
    addLine("  enough to matter.");
  }
}

let petState = null;          /* null = not loaded yet   */
let petTickTimer  = null;     /* 10-second stat tick     */
let petHungerTimer = null;    /* 30-second hunger decay  */
let petAgeTimer   = null;     /* 60-second age counter   */
let petSleepRegen = null;     /* sleep energy regen tick */
let petWeakFrames = 0;        /* how many ticks at hunger 0 */

function petDefaultState() {
  return {
    hunger:    8,
    energy:    8,
    happiness: 8,
    sleeping:  false,
    age:       0,       /* minutes */
    openedAt:  Date.now(),
  };
}

function loadPetState() {
  try {
    const s = localStorage.getItem(PET_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (p && typeof p.hunger === "number") {
        petState = p;
        /* recalculate age based on actual elapsed time */
        const minutesPassed = Math.floor((Date.now() - (p.openedAt || Date.now())) / 60000);
        petState.age = (p.age || 0) + minutesPassed;
        petState.openedAt = Date.now();
        return;
      }
    }
  } catch(e) {}
  petState = petDefaultState();
}

function savePetState() {
  if (!petState) return;
  try { localStorage.setItem(PET_KEY, JSON.stringify(petState)); } catch(e) {}
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function petArtState() {
  const p = petState;
  if (p.sleeping)            return "sleeping";
  if (p.hunger === 0)        return "weak";
  if (p.happiness >= 9)      return "happy";
  if (p.energy <= 2)         return "tired";
  if (p.hunger <= 2 || p.happiness <= 2) return "sad";
  return "neutral";
}

function petPrintArt(artKey) {
  const lines = PET_ART[artKey] || PET_ART.neutral;
  for (const l of lines) addLine(l);
}

function petPrintStats() {
  const p = petState;
  const bar = (v, max) => "[" + "█".repeat(v) + "░".repeat(max - v) + "]";
  addLine("<echaracter>");
  addLine("  hunger    " + bar(p.hunger, 10)    + "  " + p.hunger    + "/10");
  addLine("  energy    " + bar(p.energy, 10)    + "  " + p.energy    + "/10");
  addLine("  happiness " + bar(p.happiness, 10) + "  " + p.happiness + "/10");
  addLine("  age       " + p.age + " min");
  addLine("  state     " + (p.sleeping ? "sleeping" : "awake"));
}

/* Called every 10 seconds while in pet mode */
function petCheckAchievements() {
  if (!petState) return;
  const p = petState;
  if (p.hunger >= 10 && p.energy >= 10 && p.happiness >= 10) {
    unlockAchievement("pet_perfect");
  }
  if (p.hunger === 0 || p.energy === 0 || p.happiness === 0) {
    unlockAchievement("pet_neglect");
  }
}

const PET_THOUGHTS = [
  "...watches the cursor blink...",
  "...seems content...",
  "...tilts its head at nothing in particular...",
  "...is doing fine, as far as it can tell...",
  "...hums something that isn't quite a tune...",
  "...stares at the prompt like it's waiting for something too...",
  "...seems to like it here...",
  "...is not thinking about anything you'd understand...",
];

function petTick() {
  if (!petState || mode !== "pet" || locked) return;
  const p = petState;

  /* hunger decay — handled separately on 30s timer; tick just triggers redraws */
  /* happiness degrades if hungry or low energy */
  if (p.hunger <= 2 || p.energy <= 2) {
    p.happiness = clamp(p.happiness - 1, 0, 10);
  }

  /* weak tracking */
  if (p.hunger === 0) {
    petWeakFrames++;
  } else {
    petWeakFrames = 0;
  }

  savePetState();
  petCheckAchievements();

  /* auto-show art if state changed noticeably */
  const art = petArtState();
  if (art === "sad" || art === "weak" || art === "tired") {
    petPrintArt(art);
    if (art === "weak")  addLine("<echaracter> ...so hungry...");
    if (art === "tired") addLine("<echaracter> ...need sleep...");
    if (art === "sad")   addLine("<echaracter> ...hungry...");
  } else if (!p.sleeping && Math.random() < 0.15) {
    addLine("<echaracter> " + randomItem(PET_THOUGHTS));
  }
}

/* Hunger decays every 30 seconds */
function petHungerDecay() {
  if (!petState || mode !== "pet" || locked) return;
  petState.hunger = clamp(petState.hunger - 1, 0, 10);
  savePetState();
}

/* Age increases every 60 seconds */
function petAgeInc() {
  if (!petState || mode !== "pet" || locked) return;
  petState.age++;
  savePetState();
}

/* Sleep regen: +1 energy every 15 seconds while sleeping */
function petSleepRegenTick() {
  if (!petState || mode !== "pet" || locked) return;
  if (petState.sleeping) {
    petState.energy = clamp(petState.energy + 1, 0, 10);
    savePetState();
    if (petState.energy >= 10) {
      addLine("<echaracter> ...fully rested...");
    }
  }
}

function petStartTimers() {
  petStopTimers();
  petTickTimer   = setInterval(petTick,          10000);
  petHungerTimer = setInterval(petHungerDecay,   30000);
  petAgeTimer    = setInterval(petAgeInc,        60000);
  petSleepRegen  = setInterval(petSleepRegenTick,15000);
}

function petStopTimers() {
  if (petTickTimer)   { clearInterval(petTickTimer);   petTickTimer   = null; }
  if (petHungerTimer) { clearInterval(petHungerTimer); petHungerTimer = null; }
  if (petAgeTimer)    { clearInterval(petAgeTimer);    petAgeTimer    = null; }
  if (petSleepRegen)  { clearInterval(petSleepRegen);  petSleepRegen  = null; }
}

/* entry point — called from shell */
function petInit() {
  loadPetState();
  mode = "pet";
  addLine("<pet> opening echaracter companion...");
  addLine("────────────────────────────────────────");
  petPrintArt(petArtState());
  addLine("");
  petPrintStats();
  addLine("────────────────────────────────────────");
  addLine("commands: feed, play, sleep, wake, stats, pet, exit");
  petStartTimers();
}

/* input handler — called from handleApp when mode === "pet" */
function petHandle(input) {
  const cmd = input.trim().toLowerCase();
  if (!petState) { mode = "shell"; return; }
  const p = petState;

  switch (cmd) {

    case "":
      addLine("────────────────────────────────────────");
      petPrintArt(petArtState());
      addLine("");
      petPrintStats();
      addLine("────────────────────────────────────────");
      return;

    case "feed":
      if (p.sleeping) { addLine("<echaracter> zzz... (wake first)"); return; }
      p.hunger    = clamp(p.hunger    + 3, 0, 10);
      p.happiness = clamp(p.happiness + 1, 0, 10);
      savePetState();
      petCheckAchievements();
      petPrintArt("fed");
      addLine("<echaracter> nom nom nom!");
      petPrintStats();
      return;

    case "play":
      if (p.sleeping) { addLine("<echaracter> zzz... (wake first)"); return; }
      if (p.energy <= 1) { addLine("<echaracter> too tired to play..."); petPrintArt("tired"); return; }
      p.happiness = clamp(p.happiness + 2, 0, 10);
      p.energy    = clamp(p.energy    - 2, 0, 10);
      savePetState();
      petCheckAchievements();
      petPrintArt("playing");
      addLine("<echaracter> weeeee!");
      petPrintStats();
      if (Math.random() < 0.1) {
        const gift = Math.floor(Math.random() * (1000 - 10 + 1)) + 10;
        loadClickerState();
        clickerState.fragments += gift;
        saveClickerState();
        addLine("");
        addLine("<echaracter> ...found something while playing: +" + gift + " glitch fragments.");
        clickerCheckMilestone();
      }
      return;

    case "sleep":
      if (p.sleeping) { addLine("<echaracter> already sleeping..."); return; }
      p.sleeping = true;
      savePetState();
      petPrintArt("sleeping");
      addLine("<echaracter> goodnight... zzz");
      return;

    case "wake":
      if (!p.sleeping) { addLine("<echaracter> already awake!"); return; }
      p.sleeping = false;
      savePetState();
      petPrintArt("neutral");
      addLine("<echaracter> yawn... good morning!");
      petPrintStats();
      return;

    case "stats":
      petPrintArt(petArtState());
      petPrintStats();
      return;

    case "pet": {
      if (p.sleeping) { addLine("<echaracter> ...purrs softly..."); return; }
      p.happiness = clamp(p.happiness + 1, 0, 10);
      savePetState();
      petCheckAchievements();
      /* little animation */
      const reactions = [
        "<echaracter> !!  (wiggles)",
        "<echaracter> heehee~",
        "<echaracter> *happy noises*",
        "<echaracter> uwu",
      ];
      petPrintArt("pet_reaction");
      addLine(randomItem(reactions));
      return;
    }

    case "exit":
      petStopTimers();
      savePetState();
      mode = "shell";
      addLine("<pet> echaracter is resting. see you soon.");
      return;

    default:
      addLine("<pet> unknown command. try: feed, play, sleep, wake, stats, pet, exit");
      return;
  }
}

/* build a mutable 2-D array from a level's source */
function mazeBuildGrid(levelIdx) {
  return MAZE_LEVELS[levelIdx].src.map(row => row.split(""));
}

let mazeLevel   = 0;     /* current level index */
let mazeGrid    = null;  /* current render grid (walls + floor) */
let mazePlayerR = 0;
let mazePlayerC = 0;
let mazeGoalR   = 0;
let mazeGoalC   = 0;
let mazeDone    = false;

/* scan the current level's source for S and G positions */
function mazeFindSpawns() {
  const src = MAZE_LEVELS[mazeLevel].src;
  for (let r = 0; r < src.length; r++) {
    for (let c = 0; c < src[r].length; c++) {
      if (src[r][c] === "S") { mazePlayerR = r; mazePlayerC = c; }
      if (src[r][c] === "G") { mazeGoalR   = r; mazeGoalC   = c; }
    }
  }
}

/* ── Box-drawing wall renderer ──────────────────────────────────── */
/*
  For each '#' cell we inspect its four neighbours and pick the
  correct box-drawing character so walls connect naturally.
  Non-wall cells are rendered as spaces (or player/goal overlay).
*/
function mazeWallChar(grid, r, c) {
  const rows = grid.length;
  const cols = grid[0].length;
  const isWall = (dr, dc) => {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) return true; /* border counts as wall */
    const ch = grid[nr][nc];
    return ch === "#";
  };
  const U = isWall(-1, 0);
  const D = isWall( 1, 0);
  const L = isWall( 0,-1);
  const R = isWall( 0, 1);

  if ( U &&  D &&  L &&  R) return "╬";
  if ( U &&  D &&  L && !R) return "╣";
  if ( U &&  D && !L &&  R) return "╠";
  if ( U &&  D && !L && !R) return "║";
  if ( U && !D &&  L &&  R) return "╩";
  if (!U &&  D &&  L &&  R) return "╦";
  if ( U && !D &&  L && !R) return "╝";
  if ( U && !D && !L &&  R) return "╚";
  if (!U &&  D &&  L && !R) return "╗";
  if (!U &&  D && !L &&  R) return "╔";
  if (!U && !D &&  L &&  R) return "═";
  if (!U && !D && !L &&  R) return "═";
  if (!U && !D &&  L && !R) return "═";
  if ( U && !D && !L && !R) return "║";
  if (!U &&  D && !L && !R) return "║";
  return "█";
}

/* ── Render the maze ────────────────────────────────────────────── */
function mazeRender() {
  const grid = mazeGrid;
  const rows = grid.length;
  const cols = grid[0].length;

  addLine("<maze> level " + (mazeLevel + 1) + "/" + MAZE_LEVELS.length +
          " — " + MAZE_LEVELS[mazeLevel].name);

  for (let r = 0; r < rows; r++) {
    let line = "";
    for (let c = 0; c < cols; c++) {
      /* overlay player and goal */
      if (r === mazePlayerR && c === mazePlayerC) { line += "@"; continue; }
      if (r === mazeGoalR   && c === mazeGoalC)   { line += "✬"; continue; }

      const ch = grid[r][c];
      if (ch === "#") {
        line += mazeWallChar(grid, r, c);
      } else {
        line += " ";
      }
    }
    addLine(line);
  }
}

/* ── Movement ───────────────────────────────────────────────────── */
function mazeTryMove(dr, dc) {
  if (mazeDone) { addLine("<maze> maze complete — type r for next or exit to leave"); return; }
  const nr = mazePlayerR + dr;
  const nc = mazePlayerC + dc;
  const ch = mazeGrid[nr] && mazeGrid[nr][nc];
  if (!ch || ch === "#") { mazeRender(); addLine("<maze> blocked"); return; }

  mazePlayerR = nr;
  mazePlayerC = nc;
  mazeRender();

  if (nr === mazeGoalR && nc === mazeGoalC) {
    mazeDone = true;
    addLine("");
    addLine("  ★  you reached the ✬  ★");
    addLine("  level " + (mazeLevel + 1) + " complete!");
    if (mazeLevel + 1 < MAZE_LEVELS.length) {
      addLine("  type r for the next maze, or exit to quit.");
    } else {
      addLine("  ★★  all mazes complete — you are a maze runner.  ★★");
      unlockAchievement("maze_complete");
      addLine("");
      addLine("  a file surfaced somewhere in the routing tables you just");
      addLine("  finished tracing: gamma_transfer_log.txt");
    }
  }
}

/* ── Load / reset ───────────────────────────────────────────────── */
function mazeLoad(levelIdx) {
  mazeLevel = levelIdx;
  mazeGrid = mazeBuildGrid(mazeLevel);
  mazeFindSpawns();
  mazeDone = false;
  mazeRender();
}

function mazeReset() {
  mazeGrid = mazeBuildGrid(mazeLevel);
  mazeFindSpawns();
  mazeDone = false;
  addLine("<maze> maze reset.");
  mazeRender();
}

/* ── Entry point ────────────────────────────────────────────────── */
function mazeInit() {
  mode = "maze";
  mazeLoad(0);
  addLine("");
  addLine("  controls: w a s d — move    r — reset    exit — quit");
}

/* ── Input handler ──────────────────────────────────────────────── */
function mazeHandle(input) {
  const cmd = input.trim().toLowerCase();
  switch (cmd) {
    case "":     return addLine("<maze> pick a move... w a s d.");
    case "w":    return mazeTryMove(-1,  0);
    case "s":    return mazeTryMove( 1,  0);
    case "a":    return mazeTryMove( 0, -1);
    case "d":    return mazeTryMove( 0,  1);
    case "r":
      if (mazeDone && mazeLevel + 1 < MAZE_LEVELS.length) {
        mazeLoad(mazeLevel + 1);
      } else {
        mazeReset();
      }
      return;
    case "exit":
      mode = "shell";
      addLine("<maze> session closed.");
      return;
    default:
      addLine("<maze> controls: w a s d   r — reset/next   exit — quit");
  }
}

/* measure the terminal's usable width in monospace character columns */
function bannerGetMaxCols() {
  const probe = document.createElement("span");
  const style = getComputedStyle(screen);
  probe.style.font = style.font || `${style.fontSize} ${style.fontFamily}`;
  probe.style.position = "absolute";
  probe.style.visibility = "hidden";
  probe.style.whiteSpace = "pre";
  probe.textContent = "M".repeat(20);
  document.body.appendChild(probe);
  const charWidth = probe.getBoundingClientRect().width / 20 || 8;
  document.body.removeChild(probe);

  const cs = getComputedStyle(screen);
  const padding = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const usable = screen.clientWidth - padding;
  return Math.max(20, Math.floor(usable / charWidth));
}

function bannerGlyphWidth(ch) {
  const g = BANNER_GLYPHS[ch] || BANNER_GLYPHS[" "];
  return g[0].length;
}

/* width (in columns) a run of characters would take when rendered, incl. inter-glyph gaps */
function bannerRunWidth(str, gap) {
  let w = 0;
  for (let i = 0; i < str.length; i++) {
    if (i > 0) w += gap;
    w += bannerGlyphWidth(str[i]);
  }
  return w;
}

function bannerRenderGroup(str, gap, rows) {
  const chars = str.split("").map(c => BANNER_GLYPHS[c] || BANNER_GLYPHS[" "]);
  for (let row = 0; row < rows; row++) {
    let line = "";
    for (let ci = 0; ci < chars.length; ci++) {
      if (ci > 0) line += " ".repeat(gap);
      line += chars[ci][row];
    }
    addLine(line);
  }
}

function cmd_banner(args) {
  const text = args.join(" ").toUpperCase();
  if (!text.trim()) { addLine("<banner> usage: banner {text}"); return; }

  const ROWS = 6;
  const GAP  = 1;
  const cols = bannerGetMaxCols();

  const words = text.split(/\s+/).filter(w => w.length > 0);
  const spaceWidth = bannerGlyphWidth(" ");

  /* pack words into line-groups that fit within the terminal width,
     wrapping to a new banner block whenever the next word won't fit */
  const lineGroups = [];
  let current = [];
  let currentWidth = 0;

  for (const word of words) {
    const ww = bannerRunWidth(word, GAP);
    if (current.length === 0) {
      current.push(word);
      currentWidth = ww;
      continue;
    }
    const withWord = currentWidth + GAP + spaceWidth + GAP + ww;
    if (withWord <= cols) {
      current.push(word);
      currentWidth = withWord;
    } else {
      lineGroups.push(current);
      current = [word];
      currentWidth = ww;
    }
  }
  if (current.length) lineGroups.push(current);

  addLine("");
  for (const group of lineGroups) {
    bannerRenderGroup(group.join(" "), GAP, ROWS);
    addLine("");
  }
}

/* symbols */
const SK_WALL   = "#";
const SK_FLOOR  = " ";
const SK_PLAYER = "@";
const SK_PLYGOAL= "+";
const SK_BOX    = "$";
const SK_BOXGOAL= "*";
const SK_GOAL   = ".";

let skLevel    = 0;   /* current level index */
let skGrid     = [];  /* mutable 2-D char array */
let skPR       = 0;   /* player row */
let skPC       = 0;   /* player col */
let skMoves    = 0;   /* move counter this level */
let skDone     = false;

/* build mutable grid from source */
function skLoad(levelIdx) {
  skLevel = levelIdx;
  skDone  = false;
  skMoves = 0;
  const src = SOKOBAN_LEVELS[levelIdx].src;
  /* normalise row widths */
  const W = Math.max(...src.map(r => r.length));
  skGrid = src.map(row => row.padEnd(W, " ").split(""));
  /* find player */
  for (let r = 0; r < skGrid.length; r++) {
    for (let c = 0; c < skGrid[r].length; c++) {
      const ch = skGrid[r][c];
      if (ch === SK_PLAYER || ch === SK_PLYGOAL) { skPR = r; skPC = c; }
    }
  }
}

function skRender() {
  const lv = SOKOBAN_LEVELS[skLevel];
  addLine("<sokoban> level " + (skLevel + 1) + "/" + SOKOBAN_LEVELS.length +
          " — " + lv.name + "   moves: " + skMoves);

  /* Each cell is rendered as exactly 2 chars so columns always align.
     All glyphs chosen from the ASCII + basic block range — no wide chars. */
  const CELL = {
    [SK_WALL]:    "## ",
    [SK_FLOOR]:   "   ",
    [SK_PLAYER]:  " @ ",
    [SK_PLYGOAL]: " @ ",   /* player standing on goal */
    [SK_BOX]:     "[$]",
    [SK_BOXGOAL]: "[X]",   /* box on goal — visually distinct */
    [SK_GOAL]:    " . ",
  };

  for (const row of skGrid) {
    let line = " ";
    for (const ch of row) {
      line += (CELL[ch] !== undefined ? CELL[ch] : "   ");
    }
    addLine(line);
  }

  addLine("  legend:  ## wall   [ ] box   [X] placed   .  target   @  you");
  addLine("  w a s d — move   r — reset/next   exit — quit");
}

function skCell(r, c) {
  if (r < 0 || r >= skGrid.length || c < 0 || c >= skGrid[0].length) return SK_WALL;
  return skGrid[r][c];
}

function skIsGoal(ch) { return ch === SK_GOAL || ch === SK_PLYGOAL || ch === SK_BOXGOAL; }
function skIsBox(ch)  { return ch === SK_BOX  || ch === SK_BOXGOAL; }

function skSetCell(r, c, ch) { skGrid[r][c] = ch; }

function skMove(dr, dc) {
  if (skDone) { addLine("<sokoban> level complete — press r for next or exit"); return; }

  const nr = skPR + dr, nc = skPC + dc;   /* destination */
  const dest = skCell(nr, nc);

  if (dest === SK_WALL) { skRender(); return; }   /* blocked by wall */

  if (skIsBox(dest)) {
    /* pushing a box */
    const br = nr + dr, bc = nc + dc;
    const beyond = skCell(br, bc);
    if (beyond === SK_WALL || skIsBox(beyond)) { skRender(); return; } /* can't push */

    /* move the box */
    const boxOnGoal = dest === SK_BOXGOAL;
    const landOnGoal = skIsGoal(beyond);
    skSetCell(br, bc, landOnGoal ? SK_BOXGOAL : SK_BOX);
    skSetCell(nr, nc, boxOnGoal ? SK_GOAL : SK_FLOOR);   /* uncover what was under box */
  }

  /* move the player */
  const playerWasOnGoal = skCell(skPR, skPC) === SK_PLYGOAL;
  skSetCell(skPR, skPC, playerWasOnGoal ? SK_GOAL : SK_FLOOR);
  const destNowGoal = skIsGoal(skCell(nr, nc));
  skSetCell(nr, nc, destNowGoal ? SK_PLYGOAL : SK_PLAYER);
  skPR = nr; skPC = nc;
  skMoves++;

  skRender();

  /* check win: no bare goals and no bare boxes remain */
  const flat = skGrid.flat();
  const won  = !flat.includes(SK_GOAL) && !flat.includes(SK_BOX);
  if (won) {
    skDone = true;
    addLine("");
    addLine("  ★  level " + (skLevel + 1) + " complete!  (" + skMoves + " moves)");
    if (skLevel + 1 < SOKOBAN_LEVELS.length) {
      addLine("  press r for the next level, or exit to quit.");
    } else {
      addLine("  ★★  all levels complete!  you are a sokoban master.  ★★");
      unlockAchievement("sokoban_complete");
      addLine("");
      addLine("  something shifted loose after that last crate settled:");
      addLine("  ensorcell_discovery.mp3");
    }
  }
}

function sokobanInit() {
  mode = "sokoban";
  skLoad(0);
  addLine("<sokoban> push the crates (▣) onto the targets (·)");
  skRender();
}

function sokobanHandle(input) {
  const cmd = input.trim().toLowerCase();
  switch (cmd) {
    case "":  return addLine("<sokoban> pick a move... w a s d.");
    case "w": return skMove(-1,  0);
    case "s": return skMove( 1,  0);
    case "a": return skMove( 0, -1);
    case "d": return skMove( 0,  1);
    case "r":
      if (skDone && skLevel + 1 < SOKOBAN_LEVELS.length) {
        skLoad(skLevel + 1);
        skRender();
      } else {
        skLoad(skLevel);
        addLine("<sokoban> level reset.");
        skRender();
      }
      return;
    case "exit":
      mode = "shell";
      addLine("<sokoban> session closed.");
      return;
    default:
      addLine("<sokoban> w a s d — move   r — reset/next   exit — quit");
  }
}

/* ================================================================
   DISCOVERY INDEX
   A Thauma-maintained recovery tracker. Shows the player how much
   of the terminal they have uncovered without revealing secrets.

   INDEX_DISCOVERY_KEY — tracks which commands have ever been run
   (separate from cmdUsage counts, which only count since last reset).
   ================================================================ */

const INDEX_DISCOVERY_KEY = "terminal_index_discovery_v1";
let indexDiscovered = {};   /* { commandName: true } — ever-seen commands */

function loadIndexDiscovery() {
  try {
    const s = localStorage.getItem(INDEX_DISCOVERY_KEY);
    if (s) indexDiscovered = JSON.parse(s);
  } catch(e) {}
}

function saveIndexDiscovery() {
  try { localStorage.setItem(INDEX_DISCOVERY_KEY, JSON.stringify(indexDiscovered)); } catch(e) {}
}

/* Call on every committed command to record first-ever discovery */
function indexTrackDiscovery(cmd) {
  if (!cmd) return;
  if (!indexDiscovered[cmd]) {
    indexDiscovered[cmd] = true;
    saveIndexDiscovery();
  }
}

/* ── Render helpers ─────────────────────────────────────────── */

function indexBar(found, total) {
  if (total === null || total === 0) return "";
  const filled = Math.min(10, Math.max(0, Math.round((found / total) * 10)));
  return "[" + "█".repeat(filled) + "░".repeat(10 - filled) + "]";
}

function indexPct(found, total) {
  if (total === null || total === 0) return "";
  return Math.round((found / total) * 100) + "%";
}

/* Rare corruption: 8% chance a line is scrambled */
function indexMaybeCorrupt(str) {
  if (Math.random() < 0.08) {
    return str.split("").map(c => Math.random() < 0.35
      ? "░▒▓█"[Math.floor(Math.random()*4)]
      : c
    ).join("");
  }
  return str;
}

/* ── Awareness rating derived from overall discovery ─────────── */
function indexAwarenessRating(revealedCategories) {
  const totalFound  = revealedCategories.reduce((s, c) => {
    const d = INDEX_DATA[c].get();
    return s + (d.found || 0);
  }, 0);
  const totalMax = revealedCategories.reduce((s, c) => {
    const d = INDEX_DATA[c].get();
    return s + (d.total || 0);
  }, 0);
  if (totalMax === 0) return "dormant";
  const pct = totalFound / totalMax;
  if (pct < 0.10) return "minimal";
  if (pct < 0.25) return "emerging";
  if (pct < 0.45) return "aware";
  if (pct < 0.65) return "attuned";
  if (pct < 0.85) return "resonant";
  return "fully coupled";
}

/* ── Session integrity (cosmetic) ───────────────────────────── */
function indexSessionIntegrity() {
  /* Degrades slightly with drift and increases with discoveries */
  const base = 97;
  const drift_penalty = Math.min(15, Math.floor(driftValue / 10));
  const disc_bonus    = Math.min(8, Object.keys(indexDiscovered).length);
  return Math.max(71, Math.min(100, base - drift_penalty + disc_bonus));
}

/* ── Main command ───────────────────────────────────────────── */
function cmd_index() {
  const DIVIDER = "══════════════════════════════════════";
  const integrity = indexSessionIntegrity();

  addLine(DIVIDER);
  addLine("  THAUMA DISCOVERY INDEX");
  addLine("  session integrity: " + integrity + "%");
  addLine("  thauma awareness : " + indexAwarenessRating(Object.keys(INDEX_DATA).filter(k => k !== "_unknown")));
  addLine("");

  const categoryKeys = Object.keys(INDEX_DATA).filter(k => k !== "_unknown");

  /* Build each category's display data once, so it can be laid out
     either as one wide column (with its atmospheric note) or as a
     compact two-column grid (label + progress only, no note — the
     note text is long enough that keeping it would make the grid
     columns wildly uneven). */
  const entries = [];
  for (const key of categoryKeys) {
    const cat = INDEX_DATA[key];
    if (!cat.reveal()) continue;

    const data           = cat.get();
    const isZeroProgress = data.found === 0 && !indexCategoryRevealed[key];
    const displayLabel   = isZeroProgress ? "[UNKNOWN]" : cat.label;
    const classTag       = cat.classify ? "  " + cat.classify : "";
    const headerLine     = displayLabel + classTag;

    let progressLine;
    if (data.total === null) {
      progressLine = data.found + " units logged";
    } else {
      const bar  = indexBar(data.found, data.total);
      const pct  = indexPct(data.found, data.total);
      const frac = data.found + "/" + data.total;
      progressLine = frac.padEnd(8) + bar + "  " + pct;
    }

    entries.push({
      header:   headerLine,
      progress: progressLine,
      note:     (cat.note && !isZeroProgress) ? cat.note : null,
    });
  }

  const LEFT_INDENT = "  ";
  const COL_GAP     = " │ ";

  /* compact-grid cell width: widest of every header/progress line,
     so the second column starts at the exact same offset on every
     row — no jagged edges regardless of how short/long a given
     entry's text happens to be */
  const cellContentWidth = Math.max(
    ...entries.map(e => e.header.length),
    ...entries.map(e => e.progress.length)
  );
  const colWidth    = LEFT_INDENT.length + cellContentWidth;
  const gridWidth   = colWidth + COL_GAP.length + colWidth;
  const termCols    = bannerGetMaxCols();
  const useTwoCols  = termCols >= gridWidth;

  if (!useTwoCols) {
    /* narrow terminal — fall back to the original single-column
       layout, notes included */
    for (const e of entries) {
      addLine(LEFT_INDENT + e.header);
      if (e.note) addLine(LEFT_INDENT + "· " + e.note);
      addLine(LEFT_INDENT + e.progress);
      addLine("");
    }
  } else {
    for (let i = 0; i < entries.length; i += 2) {
      const left  = entries[i];
      const right = entries[i + 1] || null;

      const leftHeader = LEFT_INDENT + left.header;
      if (right) {
        addLine(leftHeader.padEnd(colWidth) + COL_GAP + LEFT_INDENT + right.header);
      } else {
        addLine(leftHeader);
      }

      const leftProgress = LEFT_INDENT + left.progress;
      if (right) {
        addLine(leftProgress.padEnd(colWidth) + COL_GAP + LEFT_INDENT + right.progress);
      } else {
        addLine(leftProgress);
      }

      addLine("");
    }
  }

  addLine(DIVIDER);
}

/* keyclear — remove a specific localStorage key by name */
function cmd_keyclear(args) {
  const key = args.join(" ").trim();
  if (!key) { addLine("<keyclear> usage: keyclear {key}"); return; }
  try {
    const existed = localStorage.getItem(key) !== null;
    if (!existed) { addLine("<keyclear> key not found: " + key); return; }
    localStorage.removeItem(key);
    addLine("<keyclear> removed: " + key);
    addLine("  changes take effect on next reload.");
  } catch(e) {
    addLine("<keyclear> error: " + e.message);
  }
}

/* history — display the session command history */
function cmd_history() {
  if (!history.length) { addLine("<history> no commands in session history."); return; }
  addLine("<history> session commands (" + history.length + " total):");
  addLine("  " + "─".repeat(40));
  const start = Math.max(0, history.length - 50); /* show last 50 */
  for (let i = start; i < history.length; i++) {
    addLine("  " + String(i + 1).padStart(3) + ".  " + history[i]);
  }
  addLine("  " + "─".repeat(40));
  if (history.length > 50) addLine("  showing last 50 of " + history.length + " commands.");
}

var _hardrebootToken = null;

function _genRebootToken() {
  const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
  const len   = 5 + Math.floor(Math.random() * 6);
  let token   = "";
  for (let i = 0; i < len; i++) token += CHARS[Math.floor(Math.random() * CHARS.length)];
  return token;
}

function cmd_hardreboot(args) {
  const supplied = args.join("").trim();

  /* Step 2 — correct token */
  if (_hardrebootToken && supplied === _hardrebootToken) {
    addLine("<hardreboot> token accepted. purging all persistent state...");
    const ALL_KEYS = [
      ACH_KEY, PROFILE_KEY, CURSOR_KEY, SAVED_THEMES_KEY, CMD_USAGE_KEY,
      RETURN_KEY, INBOX_KEY, JOB_TOKENS_KEY, JOB_UNLOCKED_KEY, JOB_ACTIVE_KEY,
      JOB_ASKED_KEY, CHAIN_KEY, PET_KEY, INDEX_DISCOVERY_KEY, INDEX_CATEGORY_REVEALED_KEY, CHMOD_KEY, RECURSIVE_EVENTS_KEY,
      RECOVERED_FILES_KEY, PLAYBACK_KEY, GRAVEYARD_DISCOVERED_KEY, GRAVEYARD_RERUN_KEY, WEATHER_STATE_KEY,
      CLICKER_STATE_KEY, NOTES_STATE_KEY, CAST_COLLECTION_KEY, RAINBOW_THEME_KEY, LONG_SESSION_CLAIMED_KEY, DREAMS_SEEN_KEY,
      "terminal_active_color", "terminal_theme", "terminal_textsize",
    ];
    try {
      for (const key of ALL_KEYS) localStorage.removeItem(key);
      addLine("<hardreboot> all records erased.");
      addLine("<hardreboot> rebooting...");
    } catch(e) {
      addLine("<hardreboot> storage error: " + e.message);
    }
    _hardrebootToken = null;
    setTimeout(() => location.reload(), 1200);
    return;
  }

  /* Step 2 — wrong token */
  if (_hardrebootToken && supplied) {
    addLine("<hardreboot> incorrect token. reboot aborted.");
    addLine("<hardreboot> run hardreboot again to generate a new token.");
    _hardrebootToken = null;
    return;
  }

  /* Step 1 — generate token */
  _hardrebootToken = _genRebootToken();
  addLine("<hardreboot> WARNING: this will erase all progress.");
  addLine("<hardreboot> achievements, tokens, lore, pet, themes — everything.");
  addLine("<hardreboot> to confirm, run:");
  addLine("  hardreboot " + _hardrebootToken);
  addLine("<hardreboot> any other input cancels.");
}

function arenaResolveTurn(playerMove) {
  const st = arenaState;
  if (!st || st.gameOver) return;
  
  st.playerLastMove = playerMove;
  st.playerDefending = (playerMove === "defend");
  
  /* opponent AI */
  const AIChoice = arenaAI();
  st.opponentLastMove = AIChoice;
  st.opponentDefending = (AIChoice === "defend");
  
  /* cooldown check */
  if (playerMove === "special" && st.playerSpecialCD > 0) {
    addLine("<arena> special ability on cooldown for " + st.playerSpecialCD + " more turn(s).");
    arenaDisplay();
    return;
  }
  
  /* resolve damage */
  let playerDamageDealt = 0;
  let opponentDamageDealt = 0;
  
  /* player attack */
  if (playerMove === "attack") {
    playerDamageDealt = 12 + Math.floor(Math.random() * 8);
    if (st.opponentDefending) playerDamageDealt = Math.floor(playerDamageDealt * 0.5);
  }
  /* player special */
  if (playerMove === "special") {
    playerDamageDealt = 28 + Math.floor(Math.random() * 12);
    if (st.opponentDefending) playerDamageDealt = Math.floor(playerDamageDealt * 0.5);
    st.playerSpecialCD = 3;
  }
  
  /* opponent attack */
  if (AIChoice === "attack") {
    opponentDamageDealt = st.opponentAttack + Math.floor(Math.random() * 6);
    if (st.playerDefending) opponentDamageDealt = Math.floor(opponentDamageDealt * 0.5);
  }
  /* opponent special */
  if (AIChoice === "special") {
    opponentDamageDealt = st.opponentAttack + 15 + Math.floor(Math.random() * 10);
    if (st.playerDefending) opponentDamageDealt = Math.floor(opponentDamageDealt * 0.5);
    st.opponentSpecialCD = 3;
  }
  
  /* apply damage */
  st.opponentHP = Math.max(0, st.opponentHP - playerDamageDealt);
  st.playerHP = Math.max(0, st.playerHP - opponentDamageDealt);
  
  /* update cooldowns */
  if (st.playerSpecialCD > 0) st.playerSpecialCD--;
  if (st.opponentSpecialCD > 0) st.opponentSpecialCD--;
  
  /* display turn resolution */
  addLine("");
  if (playerMove === "defend") {
    addLine("<arena> you assume a defensive stance.");
  } else if (playerMove === "attack") {
    addLine("<arena> you strike! damage dealt: " + playerDamageDealt);
  } else if (playerMove === "special") {
    addLine("<arena> SURGE NOVA! damage dealt: " + playerDamageDealt);
  }
  
  if (AIChoice === "defend") {
    addLine("<arena> opponent braces for impact.");
  } else if (AIChoice === "attack") {
    addLine("<arena> opponent strikes! you take " + opponentDamageDealt + " damage.");
  } else if (AIChoice === "special") {
    addLine("<arena> opponent unleashes CATACLYSM! you take " + opponentDamageDealt + " damage.");
  }
  
  /* check win/loss */
  if (st.opponentHP <= 0) {
    st.gameOver = true;
    st.playerWon = true;
    addLine("");
    addLine("<arena> ⟪ VICTORY ⟫");
    addLine("<arena> opponent vanquished.");
    const tokens = st.level * 25;
    jobTokens += tokens;
    saveJobTokens();
    addLine("<arena> earned " + tokens + " tokens.");
    unlockAchievement("arena_level_" + st.level);
    if (st.level === 5) unlockAchievement("arena_master");
    addLine("");
    if (st.level < 5) {
      addLine("type: continue — next fight   |   exit — return to terminal");
    } else {
      addLine("<arena> you have conquered the arena.");
      addLine("type: exit — return to terminal");
    }
  } else if (st.playerHP <= 0) {
    st.gameOver = true;
    st.playerWon = false;
    addLine("");
    addLine("<arena> ⟪ DEFEATED ⟫");
    addLine("<arena> your essence dissipates into the void.");
    addLine("");
    addLine("type: exit");
  } else {
    st.turn++;
  }
  
  arenaDisplay();
}

function arenaAI() {
  const st = arenaState;
  const choices = [];
  
  /* base weights */
  choices.push({ move: "attack", weight: 5 });
  choices.push({ move: "defend", weight: 2 });
  
  if (st.opponentSpecialCD === 0) {
    choices.push({ move: "special", weight: 1 });
  }
  
  /* adaptive: if opponent HP low, be more aggressive */
  if (st.opponentHP < st.opponentMaxHP * 0.3) {
    choices[0].weight = 8;
  }
  
  /* adaptive: if player HP high, be more aggressive */
  if (st.playerHP > st.playerMaxHP * 0.7) {
    choices[0].weight = 7;
  }
  
  /* pick weighted random */
  const totalWeight = choices.reduce((sum, c) => sum + c.weight, 0);
  let roll = Math.random() * totalWeight;
  for (const c of choices) {
    roll -= c.weight;
    if (roll <= 0) return c.move;
  }
  return "attack";
}

function arenaHandle(input) {
  const cmd = input.trim().toLowerCase();
  
  if (arenaState.gameOver) {
    if (cmd === "exit") {
      arenaState = null;
      mode = "shell";
      addLine("");
      addLine("you return to the terminal.");
      newPrompt();
      return;
    }
    if (arenaState.playerWon && arenaState.level < 5 &&
        (cmd === "continue" || cmd === "c" || cmd === "n" || cmd === "next")) {
      const nextLevel = arenaState.level + 1;
      initArena(nextLevel);
      addLine("");
      addLine("<arena> entering the next fight...");
      addLine("");
      setTimeout(() => { arenaDisplay(); }, 300);
      return;
    }
    if (arenaState.playerWon && arenaState.level < 5) {
      addLine("<arena> type: continue — next fight   |   exit — return to terminal");
    } else {
      addLine("<arena> type: exit — return to terminal");
    }
    return;
  }
  
  if (cmd === "a" || cmd === "attack") {
    arenaResolveTurn("attack");
  } else if (cmd === "d" || cmd === "defend") {
    arenaResolveTurn("defend");
  } else if (cmd === "s" || cmd === "special") {
    arenaResolveTurn("special");
  } else if (cmd === "") {
    addLine("<arena> pick a move. get back in the fight.");
    arenaDisplay();
  } else {
    addLine("<arena> invalid move. [a]ttack [d]efend [s]pecial");
    arenaDisplay();
  }
}

function cmd_arena(args) {
  const levelArg = parseInt(args[0] || "1", 10);

  mode = "arena";
  addLine("<arena> entering combat arena...");
  addLine("");
  setTimeout(() => {
    arenaDisplay();
  }, 300);
}

/* ================================================================
   PREFIX LAYER — "dry {cmd}" and "whisper {cmd}"
   Sits in front of both handleShell and handleApp so both prefixes
   work identically in the shell and inside every app. Any number of
   these prefixes can stack (e.g. "dry whisper attack").
   "dry"     — previews what the command would do; the real command
               function is never called, so nothing is ever saved.
   "whisper" — runs the command for real, but with corrupt() disabled
               for the duration, so output has no glitch corruption.
   ================================================================ */
function processInput(input) {
  /* the tutorial teaches prefixes itself — let it see raw input untouched,
     rather than having this layer strip dry/whisper/please before it can */
  if (mode === "tutorial") return handleApp(input);

  let raw = input;
  let dry = false;
  let doWhisper = false;
  let doPlease = false;

  while (true) {
    const trimmed = raw.replace(/^\s+/, "");
    const m = trimmed.match(/^(dry|whisper|please)(?=\s|$)/i);
    if (!m) { raw = trimmed; break; }
    const word = m[1].toLowerCase();
    if (word === "dry") dry = true;
    else if (word === "whisper") doWhisper = true;
    else doPlease = true;
    raw = trimmed.slice(m[0].length);
  }

  if (dry) return runDryPreview(raw);

  if (doWhisper || doPlease) {
    whisperMode = whisperMode || doWhisper;
    politeOverride = politeOverride || doPlease;
    try {
      if (mode === "shell") handleShell(raw); else handleApp(raw);
    } finally {
      if (doWhisper) whisperMode = false;
      if (doPlease)  politeOverride = false;
    }
    return;
  }

  if (mode === "shell") handleShell(raw); else handleApp(raw);
}

function runDryPreview(rawRest) {
  const trimmed = rawRest.trim();
  if (!trimmed && mode === "shell") {
    addLine(r("<dry> usage: dry {command} — preview a command without saving anything"));
    return;
  }
  const parts = tokenize(trimmed);
  let cmd  = (parts[0] || "").toLowerCase();
  let args = parts.slice(1);
  let sudoGiven = false;
  if (cmd === "sudo") { sudoGiven = true; cmd = (args[0] || "").toLowerCase(); args = args.slice(1); }

  const preview = (mode === "shell")
    ? dryShellPreview(cmd, args, sudoGiven)
    : dryAppPreview(mode, cmd, args);

  addLine("<dry> " + preview);
}

function dryAppPreview(appMode, cmd, args) {
  const a = args.join(" ");

  if (appMode === "clicker" && clickerState) {
    if (cmd === "") {
      const gained = clickerState.clickPower * clickerState.multiplier;
      return "this command would add " + gained + " glitch fragments (crit chance: " + clickerCritChance() + "%).";
    }
    if (cmd === "buy") {
      const which = (args[0] || "").toLowerCase();
      if (which === "power")
        return "this command would spend " + clickerPowerCost() + " fragments to raise click power to " + (clickerState.clickPower + 1) + ".";
      if (which === "multiplier" || which === "mult")
        return "this command would spend " + clickerMultCost() + " fragments to raise the multiplier to x" + (clickerState.multiplier + 1) + ".";
      if (which === "auto")
        return "this command would spend " + clickerAutoCost() + " fragments to raise auto-clicker to " + (clickerState.autoLevel + 1) + " frag/tick.";
      if (which === "crit")
        return clickerCritChance() >= CLICKER_CRIT_PCT_CAP
          ? "crit chance is already maxed — this command would do nothing."
          : "this command would spend " + clickerCritCost() + " fragments to raise crit chance.";
      return "this command would attempt to buy an upgrade, if it exists.";
    }
    if (cmd === "shop" || cmd === "status" || cmd === "check")
      return "this command would display your clicker stats — nothing would change.";
    if (cmd === "convert") {
      const n = parseInt(args[0], 10);
      if (!args[0] || isNaN(n) || n <= 0) return "this command needs a positive number of fragments to convert.";
      const tokens = Math.floor(n / CLICKER_CONVERT_RATE);
      return tokens < 1
        ? "that's below the minimum — " + CLICKER_CONVERT_RATE + " fragments are needed per token."
        : "this command would convert " + (tokens * CLICKER_CONVERT_RATE) + " fragments into " + tokens + " job token" + (tokens !== 1 ? "s" : "") + ".";
    }
    if (cmd === "exit")
      return "this command would close the extractor. progress is already saved after each action.";
  }

  if (appMode === "job") {
    if (cmd === "work")    return "this command would earn tokens for a work shift (amount varies).";
    if (cmd === "lottery") return "this command would spend tokens on a lottery ticket, win or lose.";
    if (cmd === "buy")     return "this command would attempt to buy \"" + (a || "(none given)") + "\" from the shop, if affordable.";
    if (cmd === "theme")   return "this command would switch to the owned theme \"" + (a || "(none given)") + "\".";
    if (cmd === "shop" || cmd === "balance" || cmd === "streak")
      return "this command would display information — nothing would change.";
  }

  if (appMode === "notes") {
    if (cmd === "add")   return "this command would save a new note: \"" + a + "\".";
    if (cmd === "clear") return "this command would delete all saved notes.";
    if (cmd === "list")  return "this command would list your saved notes — nothing would change.";
  }

  if (appMode === "pet" && petState) {
    if (cmd === "feed")  return "this command would raise hunger and happiness.";
    if (cmd === "play")  return "this command would raise happiness and lower energy.";
    if (cmd === "sleep") return "this command would put your creature to sleep.";
    if (cmd === "wake")  return "this command would wake your creature.";
  }

  if (appMode === "arena") {
    if (cmd === "attack"  || cmd === "a") return "this command would attack the current enemy.";
    if (cmd === "defend"  || cmd === "d") return "this command would brace for the enemy's next attack.";
    if (cmd === "special" || cmd === "s") return "this command would use a special move against the enemy.";
  }

  if (cmd === "exit")
    return "this command would close this app and return to the shell.";

  return "this command would run normally — nothing would be saved.";
}

/* ================================================================
   KEYBOARD HANDLING
   ================================================================ */

/* full list of shell command names — used for tab completion */
const ALL_SHELL_CMDS = [
  "about","achievements","arena","ascii","banner","btheme","calc","cast","chatbot","chmod","clean","clear",
  "clicker","colorize","cpu","creature","crt","cursor","cursorequip","cursorunequip","date","decrypt",
  "driftclock","dreams","dry","echo","encrypt","exit","flip","fortune","graveyard","hangman",
  "help","history","index","inventory","job","joke","keyclear","keys","lantern","list","lock","lore-inbox","map","maze","mimic",
  "mood","namegen","nap","notes","open","passgen","choose","pet","playback","please","profile","quiet","ram","recover","recursive","roll",
  "sessionstats","settings","shutdown","simulate","snack","sokoban","spirit","sudo","tale","textsize","theme",
  "themelist","themeload","themesave","time","thauma-awaken","thauma-echo","thauma-null",
  "thauma-reflect","thauma-scan","thauma-seal","tutorial","unlock","uptime","vibe","weather","whisper","wisdom",
  "hardreboot","banner","driftclock","graveyard","sokoban","cursorequip","cursorunequip",
];

document.addEventListener("click", ()=>{ if(!locked) hidden.focus(); });

hidden.addEventListener("keydown", e=>{
  if(locked) return;

  /* any keypress resets idle / dream timer */
  resetIdleTimer();

  /* ── Tab completion ────────────────────────────────────────────── */
  if (e.key === "Tab") {
    e.preventDefault();
    const val   = hidden.value;
    /* only complete first token, no spaces yet */
    if (!val || val.includes(" ")) return;
    const lower = val.toLowerCase();
    const eligible = ALL_SHELL_CMDS.filter(c =>
      c.startsWith(lower) && (cmdUsage[c] || 0) >= 1
    );
    if (eligible.length === 0) return;        /* no match */
    if (eligible.length === 1) {
      /* single match — complete it */
      hidden.value = eligible[0];
      syncVisible();
    } else {
      /* multiple matches — show options without altering input */
      addLine("  " + eligible.join("   "));
    }
    return;
  }

  if(e.key==="Enter"){
    e.preventDefault();
    const input=commitLine();
    if(input.trim()){ history.push(input); historyIndex=history.length; }
    processInput(input);
    if(!locked) newPrompt();
    return;
  }

  if(e.key==="ArrowUp"){
    e.preventDefault();
    if(history.length){ historyIndex=Math.max(0,historyIndex-1); hidden.value=history[historyIndex]||""; syncVisible(); }
    return;
  }

  if(e.key==="ArrowDown"){
    e.preventDefault();
    if(history.length){
      historyIndex=Math.min(history.length,historyIndex+1);
      hidden.value=historyIndex>=history.length?"":history[historyIndex]||"";
      syncVisible();
    }
    return;
  }

  if(e.key==="ArrowLeft" || e.key==="ArrowRight"){
    /* let the browser move selectionStart/End, then sync the visual split */
    requestAnimationFrame(syncVisible);
    return;
  }

  requestAnimationFrame(syncVisible);
});

/* also sync on input event to catch mobile soft-keyboard and paste */
hidden.addEventListener("input", ()=>{
  resetIdleTimer();
  syncVisible();
});

/* sync on selectionchange so Home/End/click-repositioning moves the visual caret */
document.addEventListener("selectionchange", ()=>{
  if (document.activeElement === hidden) syncVisible();
});

/* ================================================================
   INIT
   ================================================================ */
function init(){
  loadAchievements();
  loadMailState();
  loadChainState();
  loadJobState();
  loadProfilePrefix();
  loadCursorSkin();
  loadCrtState();
  loadSavedThemes();
  loadCmdUsage();
  loadIndexDiscovery();
  loadIndexCategoryRevealed();
  loadChmodState();
  loadRecoveredFiles();
  loadPlayedFiles();
  loadGraveyardDiscovered();
  loadGraveyardReruns();
  loadRecursiveEvents();
  loadWeatherState();
  loadCastCollection();
  loadDreamsSeen();
  try { longSessionClaimed = localStorage.getItem(LONG_SESSION_CLAIMED_KEY) === "1"; } catch(e) {}
  initReturnCount();
  rearmDeliveryTimers();

  /* load saved theme — terminal_active_color is the canonical key, applied below */
  try {
    const savedTheme = localStorage.getItem("terminal_theme");
    const themes={green:"#00ff00",amber:"#ffbf00",cyan:"#00ffff",magenta:"#ff00ff",white:"#ffffff"};
    if (savedTheme && themes[savedTheme] && !localStorage.getItem("terminal_active_color")) {
      document.documentElement.style.setProperty("--fg", themes[savedTheme]);
    }
  } catch(e) {}

  /* restore active job theme (overrides built-in if set) */
  if (jobActiveTheme) jobApplyTheme(jobActiveTheme);

  /* restore rainbow theme — only takes effect if every achievement is still unlocked */
  try {
    if (localStorage.getItem(RAINBOW_THEME_KEY) === "1" && ACH_LIST.every(a => achievements[a[0]])) {
      rainbowThemeActive = true;
    }
  } catch(e) {}

  /* cursor skin is applied per-caret in newPrompt — nothing to do here */

  /* terminal_active_color is the single source of truth for color — always applied last */
  try {
    const saved = localStorage.getItem("terminal_active_color");
    if (saved) document.documentElement.style.setProperty("--fg", saved);
  } catch(e) {}

  /* apply background theme */
  if (activeBtheme && BUILTIN_BTHEMES[activeBtheme]) {
    document.documentElement.style.setProperty("--bg", BUILTIN_BTHEMES[activeBtheme]);
  } else if (activeBtheme && JOB_THEMES.find(t => t.id === activeBtheme && t.color)) {
    const bthemeColor = JOB_THEMES.find(t => t.id === activeBtheme && t.color).color;
    document.documentElement.style.setProperty("--bg", bthemeColor);
  } else {
    /* default to black if btheme is not set or invalid */
    document.documentElement.style.setProperty("--bg", BUILTIN_BTHEMES.black);
  }

  try {
    const savedSize = localStorage.getItem("terminal_textsize");
    if (savedSize) {
      const parsedSize = parseInt(savedSize, 10);
      if (parsedSize >= 10 && parsedSize <= 40) {
        document.documentElement.style.setProperty("--font-size", parsedSize + "px");
      }
    }
  } catch(e) {}

  addLine(""); addLine(""); addLine("");

  /* dynamic boot message based on return count and clock hour */
  (function() {
    const hour = new Date().getHours();
    const returnCount = (() => {
      try { return parseInt(localStorage.getItem("terminal_return_count") || "1", 10); } catch(e) { return 1; }
    })();

    let timeLine = "";
    if      (hour >= 0  && hour < 5)  timeLine = "it is very late. or very early. the terminal does not distinguish.";
    else if (hour >= 5  && hour < 8)  timeLine = "you are up before most. the terminal approves.";
    else if (hour >= 8  && hour < 12) timeLine = "morning. a reasonable time to begin.";
    else if (hour >= 12 && hour < 14) timeLine = "midday. the terminal has been awake longer.";
    else if (hour >= 14 && hour < 17) timeLine = "afternoon. the session count continues to climb.";
    else if (hour >= 17 && hour < 20) timeLine = "evening. the terminal waited.";
    else if (hour >= 20 && hour < 22) timeLine = "getting late. the terminal is more alert at night.";
    else if (hour >= 22)              timeLine = "you should be sleeping. the terminal kept you awake.";

    let returnLine = "";
    if      (returnCount === 1)  returnLine = "first session initialised.";
    else if (returnCount === 2)  returnLine = "welcome back. the terminal remembered.";
    else if (returnCount < 5)    returnLine = "session " + returnCount + ". the pattern is forming.";
    else if (returnCount < 10)   returnLine = "session " + returnCount + ". you keep returning. the terminal has noted this.";
    else if (returnCount < 25)   returnLine = "session " + returnCount + ". the substrate recognises the operator.";
    else                         returnLine = "session " + returnCount + ". " + corrupt("you were expected.");

    addLine("<boot> {terminal ready}");
    addLine("  " + timeLine);
    addLine("  " + returnLine);
    if (returnCount <= 10) {
      addLine("  new here? type tutorial for a guided walkthrough.");
    }
  })();

  addLine("");
  addLine("type <help> for commands.");
  addLine("");
  cmd_index();
  newPrompt();
  applyCrtEffect();
  hidden.focus();

  /* track session time for time_30min achievement */
  const startTime=Date.now();
  const timerId=setInterval(()=>{
    if((Date.now()-startTime)/60000>=30){
      unlockAchievement("time_30min");
      clearInterval(timerId);
    }
  },60000);


  /* start idle timer for dream logs */
  resetIdleTimer();
}

init();
</script>
