<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stuff Hub</title>

<style>
  /* ---- Page background: black, like a terminal ---- */
  body {
    background-color: #000000;
    color: #00ff66;
    font-family: "Courier New", monospace;
    text-align: center;
    padding-top: 60px;
  }

  /* ---- Big glowing title ---- */
  h1 {
    font-size: 48px;
    color: #00ff66;
    text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
    letter-spacing: 4px;
    margin-bottom: 50px;
  }

  /* ---- Container that stacks the buttons ---- */
  .button-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* ---- The neon green buttons ---- */
  .neon-button {
    display: inline-block;
    width: 240px;
    padding: 16px 0;
    background-color: #000000;
    color: #00ff66;
    border: 2px solid #00ff66;
    border-radius: 8px;
    font-family: "Courier New", monospace;
    font-size: 18px;
    text-decoration: none;
    text-shadow: 0 0 5px #00ff66;
    box-shadow: 0 0 10px #00ff66;
    transition: all 0.2s ease-in-out;
  }

  /* ---- Glow gets brighter when you hover over a button ---- */
  .neon-button:hover {
    background-color: #00ff66;
    color: #000000;
    text-shadow: none;
    box-shadow: 0 0 25px #00ff66;
  }

  /* ---- The top button is bigger than the rest ---- */
  .neon-button.big {
    width: 320px;
    padding: 26px 0;
    font-size: 26px;
  }

  /* ---- Fullscreen canvas that floats behind everything ---- */
  #particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* keeps it behind the title and buttons */
  }
</style>
</head>

<body>

  <!-- Canvas where the floating green particles are drawn -->
  <canvas id="particles"></canvas>

  <!-- Page title -->
  <h1>STUFF HUB</h1>

  <!-- List of 5 buttons linking to their respective pages -->
  <div class="button-list">
    <a class="neon-button big" href="THAUMA-V54.html">THAUMA</a>
    <a class="neon-button" href="cipher-desk.html">Cipher Desk</a>
    <a class="neon-button" href="DriftArrow.html">Drift Arrow</a>
    <a class="neon-button" href="JargonMaker.html">Jargon Maker</a>
    <a class="neon-button" href="THAUMA-V1.html">Old THAUMA (Original)</a>
  </div>

  <script>
    // ---- Grab the canvas and its 2D drawing tool ----
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    // ---- Make the canvas fill the whole browser window ----
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // ---- How many particles to create ----
    const PARTICLE_COUNT = 100;
    const particles = [];

    // ---- Give each particle a random starting position, size, and speed ----
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,       // size of the dot
        speedY: Math.random() * 0.5 + 0.1,   // how fast it drifts upward
        drift: Math.random() * 0.4 - 0.2,    // slight left/right wobble
        alpha: Math.random() * 0.5 + 0.3     // how bright/glowy it looks
      });
    }

    // ---- Draw one frame: clear screen, move + draw every particle ----
    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        // Move the particle upward and slightly sideways
        p.y -= p.speedY;
        p.x += p.drift;

        // If it drifts off the top, send it back to the bottom
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }

        // Draw a glowing green dot
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 255, 102, ${p.alpha})`;
        ctx.shadowColor = "#00ff66";
        ctx.shadowBlur = 8;
        ctx.fill();
      });

      // ---- Loop this function forever, in sync with the browser's refresh rate ----
      requestAnimationFrame(drawParticles);
    }

    drawParticles();
  </script>

</body>
</html>
